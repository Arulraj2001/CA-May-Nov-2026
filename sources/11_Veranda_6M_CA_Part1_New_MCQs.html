<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>6-Month CA Rapid Revision (Part 1) — New & Unique Questions — Learn & Practice (White Theme)</title>
<style>
  :root {
    --bg-page: #ffffff;
    --bg-panel: #f9fafb;
    --bg-card: #ffffff;
    --border-light: #e5e7eb;
    --border-strong: #d1d5db;
    --text-main: #111827;
    --text-sub: #4b5563;
    --text-muted: #6b7280;
    --primary: #1d4ed8;
    --primary-soft: #eff6ff;
    --primary-border: #bfdbfe;
    --green-bg: #f0fdf4;
    --green-border: #22c55e;
    --green-text: #15803d;
    --red-bg: #fef2f2;
    --red-border: #ef4444;
    --red-text: #b91c1c;
    --amber-bg: #fffbeb;
    --amber-border: #f59e0b;
    --amber-text: #92400e;
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  body {
    background-color: var(--bg-page);
    color: var(--text-main);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, Arial, sans-serif;
    line-height: 1.6;
  }

  header {
    background-color: #ffffff;
    border-bottom: 1px solid var(--border-light);
    position: sticky;
    top: 0;
    z-index: 100;
    padding: 14px 20px;
  }

  .header-wrap {
    max-width: 1060px;
    margin: 0 auto;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
  }

  .title-block h1 {
    font-size: 1.15rem;
    font-weight: 700;
    color: var(--text-main);
  }

  .title-block p {
    font-size: 0.8rem;
    color: var(--text-muted);
  }

  .tabs {
    display: inline-flex;
    background-color: var(--bg-panel);
    border: 1px solid var(--border-light);
    border-radius: 8px;
    padding: 4px;
    gap: 4px;
  }

  .tab-btn {
    border: none;
    background: transparent;
    color: var(--text-sub);
    font-size: 0.88rem;
    font-weight: 600;
    padding: 7px 16px;
    border-radius: 6px;
    cursor: pointer;
    transition: 0.15s ease;
  }

  .tab-btn.active {
    background-color: #ffffff;
    color: var(--primary);
    border: 1px solid var(--border-light);
    box-shadow: 0 1px 2px rgba(0, 0, 0, 0.06);
  }

  .main-container {
    max-width: 1060px;
    margin: 0 auto;
    padding: 20px;
  }

  .controls-bar {
    background-color: var(--bg-panel);
    border: 1px solid var(--border-light);
    border-radius: 10px;
    padding: 12px 16px;
    margin-bottom: 18px;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
  }

  .filter-group {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    flex: 1;
  }

  select, input[type="text"] {
    background-color: #ffffff;
    color: var(--text-main);
    border: 1px solid var(--border-strong);
    border-radius: 6px;
    padding: 8px 12px;
    font-size: 0.875rem;
    outline: none;
  }

  select:focus, input[type="text"]:focus {
    border-color: var(--primary);
  }

  input[type="text"] {
    min-width: 230px;
  }

  .score-group {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 8px;
    font-size: 0.84rem;
    font-weight: 600;
  }

  .pill {
    background-color: #ffffff;
    border: 1px solid var(--border-light);
    border-radius: 999px;
    padding: 4px 11px;
    color: var(--text-sub);
  }

  .pill.green {
    background-color: var(--green-bg);
    border-color: var(--green-border);
    color: var(--green-text);
  }

  .pill.red {
    background-color: var(--red-bg);
    border-color: var(--red-border);
    color: var(--red-text);
  }

  .action-btn {
    background-color: #ffffff;
    color: var(--text-main);
    border: 1px solid var(--border-strong);
    border-radius: 6px;
    padding: 6px 12px;
    font-size: 0.82rem;
    font-weight: 600;
    cursor: pointer;
  }

  .action-btn:hover {
    background-color: #f3f4f6;
  }

  .learn-subbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 14px;
    font-size: 0.85rem;
    color: var(--text-muted);
  }

  .card {
    background-color: #ffffff;
    border: 1px solid var(--border-light);
    border-radius: 10px;
    padding: 18px 20px;
    margin-bottom: 14px;
  }

  .card-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 8px;
    gap: 8px;
  }

  .badge-group {
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .badge-num {
    background-color: var(--primary-soft);
    color: var(--primary);
    border: 1px solid var(--primary-border);
    font-size: 0.78rem;
    font-weight: 700;
    padding: 2px 8px;
    border-radius: 5px;
  }

  .badge-seq {
    background-color: var(--bg-panel);
    color: var(--text-sub);
    border: 1px solid var(--border-light);
    font-size: 0.74rem;
    font-weight: 600;
    padding: 2px 7px;
    border-radius: 5px;
  }

  .badge-cat {
    font-size: 0.75rem;
    font-weight: 600;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 0.03em;
  }

  .question-text {
    font-size: 1.02rem;
    font-weight: 600;
    color: var(--text-main);
    margin-bottom: 12px;
  }

  .learn-answer-box {
    display: inline-block;
    background-color: var(--green-bg);
    border: 1px solid #bbf7d0;
    color: var(--green-text);
    font-weight: 700;
    font-size: 0.94rem;
    padding: 6px 12px;
    border-radius: 6px;
    margin-bottom: 12px;
  }

  .learn-answer-box.blurred {
    filter: blur(5px);
    cursor: pointer;
    user-select: none;
  }

  .exam-points {
    background-color: var(--amber-bg);
    border: 1px solid #fde68a;
    border-left: 4px solid var(--amber-border);
    border-radius: 6px;
    padding: 10px 14px;
  }

  .exam-points-heading {
    font-size: 0.78rem;
    font-weight: 700;
    color: var(--amber-text);
    text-transform: uppercase;
    letter-spacing: 0.03em;
    margin-bottom: 4px;
  }

  .exam-points ul {
    margin-left: 18px;
    font-size: 0.88rem;
    color: #374151;
  }

  .exam-points li {
    margin-bottom: 3px;
  }

  .options-list {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
    gap: 10px;
  }

  .option-btn {
    display: flex;
    align-items: center;
    gap: 10px;
    width: 100%;
    text-align: left;
    background-color: #ffffff;
    border: 1.5px solid var(--border-light);
    border-radius: 8px;
    padding: 11px 14px;
    font-size: 0.92rem;
    font-weight: 500;
    color: var(--text-main);
    cursor: pointer;
    transition: all 0.15s ease;
  }

  .option-btn:hover:not(:disabled) {
    border-color: var(--primary);
    background-color: var(--primary-soft);
  }

  .option-btn:disabled {
    cursor: default;
  }

  .opt-circle {
    width: 24px;
    height: 24px;
    border-radius: 50%;
    background-color: var(--bg-panel);
    border: 1px solid var(--border-strong);
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-size: 0.78rem;
    font-weight: 700;
    color: var(--text-sub);
    flex-shrink: 0;
  }

  .option-btn.correct {
    background-color: var(--green-bg);
    border-color: var(--green-border);
    color: var(--green-text);
    font-weight: 700;
  }

  .option-btn.correct .opt-circle {
    background-color: var(--green-border);
    border-color: var(--green-border);
    color: #ffffff;
  }

  .option-btn.wrong {
    background-color: var(--red-bg);
    border-color: var(--red-border);
    color: var(--red-text);
    font-weight: 600;
  }

  .option-btn.wrong .opt-circle {
    background-color: var(--red-border);
    border-color: var(--red-border);
    color: #ffffff;
  }

  .answer-panel {
    display: none;
    margin-top: 14px;
    padding-top: 14px;
    border-top: 1px solid var(--border-light);
    animation: slideDown 0.18s ease-out;
  }

  .answer-panel.visible {
    display: block;
  }

  .result-banner {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    margin-bottom: 10px;
  }

  .result-pill {
    font-size: 0.84rem;
    font-weight: 700;
    padding: 4px 10px;
    border-radius: 6px;
  }

  .result-pill.right {
    background-color: var(--green-bg);
    color: var(--green-text);
    border: 1px solid var(--green-border);
  }

  .result-pill.wrong {
    background-color: var(--red-bg);
    color: var(--red-text);
    border: 1px solid var(--red-border);
  }

  .correct-label {
    font-size: 0.92rem;
    font-weight: 700;
    color: var(--text-main);
  }

  .correct-label span {
    color: var(--green-text);
  }

  .hidden {
    display: none !important;
  }

  .no-results {
    text-align: center;
    padding: 40px 20px;
    border: 1px dashed var(--border-strong);
    border-radius: 10px;
    color: var(--text-muted);
  }

  @keyframes slideDown {
    from { opacity: 0; transform: translateY(-4px); }
    to { opacity: 1; transform: translateY(0); }
  }

  @media (max-width: 640px) {
    .header-wrap { flex-direction: column; align-items: flex-start; }
    .options-list { grid-template-columns: 1fr; }
    input[type="text"] { width: 100%; }
  }
</style>
</head>
<body>

<header>
  <div class="header-wrap">
    <div class="title-block">
      <h1>6-Month CA Rapid Revision (Part 1) — New & Unique Questions (64 Questions)</h1>
      <p>Pradeep Sir Session (English) | Exclusive Questions Not Covered in All 8 Previous Files</p>
    </div>
    <div class="tabs">
      <button class="tab-btn active" id="btn-learn" onclick="setMode('learn')">📖 Learn Mode</button>
      <button class="tab-btn" id="btn-practice" onclick="setMode('practice')">✍️ Practice MCQs</button>
    </div>
  </div>
</header>

<div class="main-container">
  <div class="controls-bar">
    <div class="filter-group">
      <select id="catSelect" onchange="render()">
        <option value="ALL">All Categories (64)</option>
      </select>
      <input type="text" id="searchBox" placeholder="Search question, answer, or extra points..." oninput="render()">
    </div>
    <div class="score-group">
      <span class="pill">Attempted: <span id="cnt-attempted">0</span>/64</span>
      <span class="pill green">Correct: <span id="cnt-correct">0</span></span>
      <span class="pill red">Wrong: <span id="cnt-wrong">0</span></span>
      <button class="action-btn" onclick="resetAll()">Reset Practice</button>
    </div>
  </div>

  <div class="learn-subbar" id="learnSubbar">
    <span id="showingCount">Showing 64 questions</span>
    <button class="action-btn" id="blurBtn" onclick="toggleBlur()">👁️ Hide Answers (Self-Test)</button>
  </div>

  <div id="cardsContainer"></div>
</div>

<script>
const QUESTIONS = [{"id": 1, "video_q": 1, "cat": "Government Schemes & Initiatives", "q": "Jal Jeevan Mission completed 7 years. What is the new deadline set for completing the Jal Jeevan Mission?", "opts": ["March 2027", "December 2028", "December 2027", "March 2030"], "ans": 1, "p1": "Launch & Progress: Originally launched on 15 August 2019; rural tap water coverage rose from ~16.7% to ~82% (deadline extended to December 2028).", "p2": "Exam Fact: Implemented by the Department of Drinking Water and Sanitation under the Ministry of Jal Shakti (Har Ghar Jal)."}, {"id": 2, "video_q": 3, "cat": "Infrastructure, Ports & Energy", "q": "At what altitude (height) is India planning to build the world's highest railway station at Taglang La (Tanglang La) in Ladakh?", "opts": ["5,540 meters", "5,068 meters", "4,850 meters", "5,256 meters"], "ans": 3, "p1": "Record Surpassed: Beats China's Tanggula Railway Station (5,068 meters) on the Qinghai–Tibet Railway.", "p2": "Exam Fact: Located along the strategic Bhanupali–Bilaspur–Manali–Leh railway line in Ladakh."}, {"id": 3, "video_q": 4, "cat": "Infrastructure, Ports & Energy", "q": "At which Indian port will India's first port-based green e-Methanol plant (worth ₹2,300 crore) be established?", "opts": ["Deendayal Port (Kandla), Gujarat", "Paradip Port, Odisha", "Jawaharlal Nehru Port (JNPA), Maharashtra", "Visakhapatnam Port, Andhra Pradesh"], "ans": 0, "p1": "Project Shareholding: Total cost ₹2,300 crore; Deendayal Port Authority (DPA) holds a 76% stake in the green shipping fuel project.", "p2": "Exam Fact: Deendayal Port (Kandla) is a major tidal port located in the Gulf of Kutch, Gujarat."}, {"id": 4, "video_q": 5, "cat": "Government Schemes & Initiatives", "q": "Regarding Government e-Marketplace (GeM): (1) Launched on 9 August 2016; (2) Uses a 5-digit PIN code structure (14550) rather than 4 digits; (3) Celebrated its 10th Foundation Day; (4) Operates under the Ministry of Commerce and Industry. Which statements are correct?", "opts": ["1 and 2 only", "1, 3, and 4 only (PIN is 5 digits: 14550)", "2 and 3 only", "All 1, 2, 3, and 4"], "ans": 1, "p1": "Correction Note: Statement 2 is incorrect because the code is 5 digits (14550), not 4 digits.", "p2": "Exam Fact: GeM is India's national public procurement portal operating under the Ministry of Commerce and Industry."}, {"id": 5, "video_q": 6, "cat": "Science, Space & Environment", "q": "The Ministry of Earth Sciences (MoES) celebrated its 20th Foundation Day on 27 July 2026. In which year was its predecessor, the Department of Ocean Development (DOD), established?", "opts": ["1988", "1972", "1981", "2006"], "ans": 2, "p1": "Evolution: Department of Ocean Development was created in July 1981 and reorganized into the Ministry of Earth Sciences (MoES) in 2006.", "p2": "Exam Fact: IMD, NCMRWF, IITM, and NIOT function under the Ministry of Earth Sciences."}, {"id": 6, "video_q": 10, "cat": "Science, Space & Environment", "q": "Regarding Squadron Leader Bhawana Kanth: (1) Became the first woman to complete the Fighter Combat Leader (FCL) course; (2) Completed it at TACDE, Gwalior (not AFA Dundigal); (3) Commissioned in June 2016; (4) Hails from Darbhanga, Bihar (not Muzaffarpur). Which statements are correct?", "opts": ["2 and 4 only", "1, 2, and 3 only", "1 and 3 only (Course at TACDE Gwalior; native of Darbhanga, Bihar)", "All 1, 2, 3, and 4"], "ans": 2, "p1": "Corrections: She completed the FCL course at Tactics and Air Combat Development Establishment (TACDE), Gwalior, and hails from Darbhanga, Bihar.", "p2": "Exam Fact: Bhawana Kanth, Avani Chaturvedi, and Mohana Singh were India's first batch of women fighter pilots commissioned in June 2016."}, {"id": 7, "video_q": 13, "cat": "Banking, Finance & Regulatory", "q": "On which date did the Principal Purpose Test (PPT) under the amended India–Mauritius Double Taxation Avoidance Agreement (DTAA) come into effect?", "opts": ["1 April 2026", "10 August 2026", "1 July 2026", "1 October 2026"], "ans": 1, "p1": "Tax Treaty Rule: Effective 10 August 2026; denies treaty tax benefits if obtaining a tax advantage was one of the principal purposes of an arrangement.", "p2": "Exam Fact: Aligns the India–Mauritius DTAA with the OECD BEPS (Base Erosion and Profit Shifting) Multilateral Instrument (MLI) standards."}, {"id": 8, "video_q": 14, "cat": "Infrastructure, Ports & Energy", "q": "Regarding Tamil Nadu's Battery Energy Storage System (BESS) Policy: (1) Targets 2.5 GW to 10 GW of BESS over 3 years; (2) New solar projects of 1 MW or more must install BESS of at least 10% capacity; (3) Storage must have a 4-hour discharge duration (not 2-hour). Which statements are correct?", "opts": ["2 and 3 only", "1 and 3 only", "1 and 2 only (Discharge duration must be 4 hours)", "All 1, 2, and 3"], "ans": 2, "p1": "Correction Note: Statement 3 is incorrect because the policy mandates a 4-hour discharge duration (not 2 hours).", "p2": "Exam Fact: Supports grid stability and peak-hour renewable energy dispatch in Tamil Nadu."}, {"id": 9, "video_q": 16, "cat": "Polity, Bills & Governance", "q": "Under which Union Ministry does the Indian Cyber Crime Coordination Centre (I4C)—which launched two new portals for grievance redressal and money restoration—function?", "opts": ["Ministry of Home Affairs (MHA)", "Ministry of Electronics and Information Technology (MeitY)", "Ministry of Finance", "Ministry of Communications"], "ans": 0, "p1": "Parent Ministry: Ministry of Home Affairs (headed by Union Minister Amit Shah, Lok Sabha MP from Gandhinagar, Gujarat).", "p2": "Exam Fact: I4C operates the National Cyber Crime Reporting Portal (cybercrime.gov.in) and the 1930 financial cyber fraud helpline."}, {"id": 10, "video_q": 18, "cat": "Infrastructure, Ports & Energy", "q": "Where did Hindalco commission India's first superfine Precipitated Hydrate (PHT) plant with a capacity of 30,000 tonnes per annum in August 2026?", "opts": ["Hirakud, Odisha", "Renukoot, Uttar Pradesh", "Belagavi, Karnataka", "Muri, Jharkhand"], "ans": 2, "p1": "Location & Capacity: Belagavi (Belgaum), Karnataka — capacity of 30,000 tonnes per annum.", "p2": "Exam Fact: Hindalco Industries is the metals flagship company of the Aditya Birla Group."}, {"id": 11, "video_q": 22, "cat": "Sports & Tournaments", "q": "Regarding the Khelo India & ASMITA restructuring: (1) Combined outlay for FY 2027–31 is ₹36,441 crore; (2) Khelo India component accounts for ₹29,054 crore (while ASMITA/allied accounts for ₹7,387 crore); (3) Originally launched in 2017–18 by merging 3 older schemes; (4) Created a new 'Emerging Khelo India Athletes' category. Which statements are correct?", "opts": ["2 and 3 only", "1 and 2 only", "1, 3, and 4 only (Khelo India share is ₹29,054 crore)", "All 1, 2, 3, and 4"], "ans": 2, "p1": "Correction Note: Out of ₹36,441 crore, the Khelo India component is ₹29,054 crore and the remaining ₹7,387 crore is for the allied/ASMITA component.", "p2": "Exam Fact: ASMITA stands for Achieving Sports Milestone by Inspiring Women Through Action."}, {"id": 12, "video_q": 24, "cat": "Polity, Bills & Governance", "q": "Regarding Legal Metrology (Indian Standard Time) Rules, 2026: (1) IST is UTC + 5 hours 30 minutes; (2) Framed under Section 52 of Legal Metrology Act, 2009; (3) Based on 82.5° E longitude (not 75°); (4) Comes into effect after 180 days (not 30 days). Which statements are correct?", "opts": ["1 and 2 only (82.5° E longitude; effective in 180 days)", "1, 2, and 3 only", "2 and 4 only", "All 1, 2, 3, and 4"], "ans": 0, "p1": "Corrections: IST is anchored at 82.5° East longitude (passing through Mirzapur, UP), and the new rules take effect after 180 days (not 30 days).", "p2": "Exam Fact: CSIR-National Physical Laboratory (NPL, New Delhi) is the official timekeeper of India."}, {"id": 13, "video_q": 25, "cat": "Science, Space & Environment", "q": "What is the name of India's first nuclear training programme (a 3-month residential course) launched jointly by IIT Hyderabad and Crimson Energy in August 2026?", "opts": ["ATOM-X", "ANUYAN", "NUCLEAR-NEXT", "PARMANU-SHIKSHA"], "ans": 1, "p1": "Programme Details: 3-month residential nuclear engineering & safety training programme launched by IIT Hyderabad and Crimson Energy.", "p2": "Exam Fact: Prepares skilled manpower for India's Small Modular Reactor (SMR) and clean nuclear expansion."}, {"id": 14, "video_q": 27, "cat": "Banking, Finance & Regulatory", "q": "Regarding the National Investment and Infrastructure Fund (NIIF): (1) Total central commitment reached ₹60,000 crore after July 2026 approval; (2) Fresh funds flow into NIIF Infrastructure Fund II; (3) Founded in 2015 (not 2019); (4) Headquartered in Mumbai (not New Delhi). Which statements are correct?", "opts": ["All 1, 2, 3, and 4", "1, 2, and 3 only", "2 and 4 only", "1 and 2 only (Founded in 2015; HQ in Mumbai)"], "ans": 3, "p1": "Corrections: NIIF was established in 2015 as India's first sovereign-linked alternative asset manager and is headquartered in Mumbai.", "p2": "Exam Fact: The Government of India holds a 49% stake in NIIF, with the remainder held by domestic and international institutional investors."}, {"id": 15, "video_q": 28, "cat": "Science, Space & Environment", "q": "For which client is Larsen & Toubro's Vyoma AI building India's largest NVIDIA B300 AI factory (250 MW Phase-1 capacity, 10,000 GPUs) in Chennai?", "opts": ["Together AI", "OpenAI", "Anthropic", "Perplexity AI"], "ans": 0, "p1": "Location & Scale: Chennai, Tamil Nadu — 10,000 NVIDIA B300 GPUs with 250 MW Phase-1 capacity.", "p2": "Exam Fact: Positions Chennai as a major sovereign and hyperscale AI data center hub in South Asia."}, {"id": 16, "video_q": 29, "cat": "Banking, Finance & Regulatory", "q": "Regarding India's first sovereign-backed Protection & Indemnity (P&I) marine insurance product launched in August 2026: (1) Designed by New India Assurance (NIACL); (2) Coverage is USD 1.5 billion (not USD 5 billion); (3) Operates under Bharat Maritime Insurance Pool (BMIP); (4) Covers crew, cargo, pollution, and wreck removal. Which statements are correct?", "opts": ["1 and 2 only", "1, 3, and 4 only (Coverage limit is USD 1.5 billion)", "2 and 3 only", "All 1, 2, 3, and 4"], "ans": 1, "p1": "Correction Note: Coverage is up to USD 1.5 billion (not USD 5 billion), breaking foreign P&I club monopolies for Indian shipping.", "p2": "Exam Fact: New India Assurance Company Limited (NIACL) is headquartered in Mumbai, Maharashtra."}, {"id": 17, "video_q": 30, "cat": "Infrastructure, Ports & Energy", "q": "Under Tamil Nadu's Battery Energy Storage System (BESS) policy, what minimum percentage of capacity must new solar projects of 1 MW or more install as standalone/co-located storage?", "opts": ["15%", "5%", "10%", "20%"], "ans": 2, "p1": "Mandate: At least 10% of project capacity with a 4-hour discharge duration.", "p2": "Exam Fact: Helps absorb midday solar surplus and supply power during evening peak demand."}, {"id": 18, "video_q": 32, "cat": "Economy & Agriculture", "q": "In July 2026, NITI Aayog launched a 10-year Bioeconomy Roadmap aiming to grow India's bioeconomy to what size?", "opts": ["USD 691 billion", "USD 300 billion", "USD 500 billion", "USD 1 trillion"], "ans": 0, "p1": "Target: USD 691 billion over a 10-year roadmap.", "p2": "Exam Fact: Complements the Union Cabinet's BioE3 (Biotechnology for Economy, Environment and Employment) Policy."}, {"id": 19, "video_q": 33, "cat": "Economy & Agriculture", "q": "Which of the following is one of the three core pillars/components of the 'VISTAR' scheme approved by the Union Cabinet?", "opts": ["National Agricultural Census", "8th Economic Census (alongside Ecosystem & Operations and Sub-national Support)", " decennial Population Census", "Livestock & Fisheries Census"], "ans": 1, "p1": "Three Pillars of VISTAR: (1) Ecosystem & Operations, (2) Sub-national Support, and (3) 8th Economic Census.", "p2": "Exam Fact: Implemented by the Ministry of Statistics and Prog ce Day (79 completed years since 15 August 1947)."}, {"id": 23, "video_q": 38, "cat": "Banking, Finance & Regulatory", "q": "In June 2026, the Gujarat Government signed an MoU with which financial institution for ₹1 lakh crore long-term financing of metro, expressway, and Dholera projects?", "opts": ["SIDBI", "NABARD", "HUDCO (Housing and Urban Development Corporation)", "NaBFID"], "ans": 2, "p1": "Institution Details: HUDCO was founded in 1970 (Headquarters: New Delhi) and is a Navratna CPSE under MoHUA.", "p2": "Exam Fact: Dholera Special Investment Region (DSIR) is India's first greenfield smart industrial city under the Delhi–Mumbai Industrial Corridor."}, {"id": 24, "video_q": 40, "cat": "Government Schemes & Initiatives", "q": "Union Home Minister Amit Shah launched the 'PM Family Caretaker' pilot project in Gandhinagar, Gujarat. Up to what age of a child (from pregnancy) are welfare benefits tracked and provided?", "opts": ["18 years", "6 years", "14 years", "21 years"], "ans": 0, "p1": "Coverage Window: Tracks maternal and child health, nutrition, immunization, and education from pregnancy up to 18 years of age.", "p2": "Exam Fact: Launched in Gandhinagar, Gujarat (Amit Shah's Lok Sabha constituency)."}, {"id": 25, "video_q": 41, "cat": "Environment, Parks & GI Tags", "q": "Regarding Borjuli Biodiversity Heritage Site (notified July 2026): (1) Located in Sonitpur district, Assam; (2) Protects Oryza rufipogon (wild ancestor of cultivated rice); (3) Notified under Section 37 of Biological Diversity Act, 2002 (not Section 21); (4) Supported by ICAR-NBPGR and Assam State Biodiversity Board. Which statements are correct?", "opts": ["1 and 3 only", "1, 2, and 4 only (Notified under Section 37 of Biodiversity Act, 2002)", "2 and 3 only", "All 1, 2, 3, and 4"], "ans": 1, "p1": "Correction Note: Biodiversity Heritage Sites (BHS) are notified by State Governments under Section 37 of the Biological Diversity Act, 2002.", "p2": "Exam Fact: Nallur Tamarind Grove in Benga let mode = 'learn';
let hideAnswers = false;
let userAnswers = {};

function setup() {
  const select = document.getElementById('catSelect');
  const uniqueCats = [...new Set(QUESTIONS.map(q => q.cat))];
  uniqueCats.forEach(cat => {
    const count = QUESTIONS.filter(q => q.cat === cat).length;
    const option = document.createElement('option');
    option.value = cat;
    option.textContent = `${cat} (${count})`;
    select.appendChild(option);
  });
  refreshStats();
  render();
}

function setMode(newMode) {
  mode = newMode;
  document.getElementById('btn-learn').classList.toggle('active', mode === 'learn');
  document.getElementById('btn-practice').classList.toggle('active', mode === 'practice');
  document.getElementById('blurBtn').classList.toggle('hidden', mode !== 'learn');
  render();
}

function toggleBlur() {
  hideAnswers = !hideAnswers;
  document.getElementById('blurBtn').textContent = hideAnswers
    ? '👁️ Show All Answers'
    : '👁️ Hide Answers (Self-Test)';
  render();
}

function getFilteredList() {
  const cat = document.getElementById('catSelect').value;
  const term = document.getElementById('searchBox').value.trim().toLowerCase();

  return QUESTIONS.filter(item => {
    if (cat !== 'ALL' && item.cat !== cat) return false;
    if (!term) return true;
    return (
      item.q.toLowerCase().includes(term) ||
      item.opts.some(o => o.toLowerCase().includes(term)) ||
      item.p1.toLowerCase().includes(term) ||
      item.p2.toLowerCase().includes(term) ||
      String(item.video_q).includes(term)
    );
  });
}

function render() {
  const list = getFilteredList();
  document.getElementById('showingCount').textContent = `Showing ${list.length} question${list.length === 1 ? '' : 's'}`;
  const container = document.getElementById('cardsContainer');

  if (list.length === 0) {
    container.innerHTML = `<div class="no-results">No questions match your filter. Clear search or switch category.</div>`;
    return;
  }

  container.innerHTML = list
    .map(item => (mode === 'learn' ? buildLearnCard(item) : buildPracticeCard(item)))
    .join('');
}

function buildLearnCard(item) {
  const answerText = item.opts[item.ans];
  const blurClass = hideAnswers ? 'blurred' : '';
  return `
    <div class="card">
      <div class="card-top">
        <div class="badge-group">
          <span class="badge-num">Q.${item.id}</span>
          <span class="badge-seq">Video #${item.video_q}</span>
        </div>
        <span class="badge-cat">${item.cat}</span>
      </div>
      <div class="question-text">${item.q}</div>
      <div class="learn-answer-box ${blurClass}" onclick="this.classList.remove('blurred')" title="Click to reveal answer">
        ✓ Answer: ${answerText}
      </div>
      <div class="exam-points">
        <div class="exam-points-heading">📌 2 Exam-Related Extra Points</div>
        <ul>
          <li>${item.p1}</li>
          <li>${item.p2}</li>
        </ul>
      </div>
    </div>
  `;
}

function buildPracticeCard(item) {
  const record = userAnswers[item.id];
  const isAnswered = record !== undefined;
  const letters = ['A', 'B', 'C', 'D'];

  const optsMarkup = item.opts
    .map((opt, idx) => {
      let cls = '';
      if (isAnswered) {
        if (idx === item.ans) cls = 'correct';
        else if (idx === record.picked && !record.correct) cls = 'wrong';
      }
      return `
        <button class="option-btn ${cls}" ${isAnswered ? 'disabled' : ''} onclick="selectOption(${item.id}, ${idx})">
          <span class="opt-circle">${letters[idx]}</span>
          <span>${opt}</span>
        </button>
      `;
    })
    .join('');

  const bannerMarkup = isAnswered
    ? record.correct
      ? `<span class="result-pill right">✓ Correct!</span>`
      : `<span class="result-pill wrong">✕ Wrong Answer</span>`
    : '';

  return `
    <div class="card" id="card-${item.id}">
      <div class="card-top">
        <div class="badge-group">
          <span class="badge-num">Q.${item.id}</span>
          <span class="badge-seq">Video #${item.video_q}</span>
        </div>
        <span class="badge-cat">${item.cat}</span>
      </div>
      <div class="question-text">${item.q}</div>
      <div class="options-list">
        ${optsMarkup}
      </div>
      <div class="answer-panel ${isAnswered ? 'visible' : ''}" id="panel-${item.id}">
        <div class="result-banner">
          ${bannerMarkup}
          <div class="correct-label">Correct Answer: <span>${letters[item.ans]}. ${item.opts[item.ans]}</span></div>
        </div>
        <div class="exam-points">
          <div class="exam-points-heading">📌 2 Exam-Related Extra Points</div>
          <ul>
            <li>${item.p1}</li>
            <li>${item.p2}</li>
          </ul>
        </div>
      </div>
    </div>
  `;
}

function selectOption(qId, pickedIdx) {
  if (userAnswers[qId] !== undefined) return;
  const item = QUESTIONS.find(q => q.id === qId);
  if (!item) return;

  userAnswers[qId] = {
    picked: pickedIdx,
    correct: pickedIdx === item.ans
  };

  refreshStats();
  const cardEl = document.getElementById(`card-${qId}`);
  if (cardEl) {
    cardEl.outerHTML = buildPracticeCard(item);
  }
}

function refreshStats() {
  const keys = Object.keys(userAnswers);
  const attempted = keys.length;
  const correct = keys.filter(k => userAnswers[k].correct).length;
  const wrong = attempted - correct;

  document.getElementById('cnt-attempted').textContent = attempted;
  document.getElementById('cnt-correct').textContent = correct;
  document.getElementById('cnt-wrong').textContent = wrong;
}

function resetAll() {
  userAnswers = {};
  refreshStats();
  render();
}

setup();
</script>
