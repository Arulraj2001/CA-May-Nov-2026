<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>6-Month CA Rapid Revision (Part 6: Slides #801–#1000) — New & Unique Questions — Learn & Practice (White Theme)</title>
<style>
  :root {
    --bg-page: #ffffff;
    --bg-panel: #f9fafb;
    --bg-card: #ffffff;
    --border-light: #e5e7eb;
    --border-strong: #d1d5db;
    --text-main: #111827;
    --text-sub: #4b5563;
    --text-muted: #6b7280;
    --primary: #1d4ed8;
    --primary-soft: #eff6ff;
    --primary-border: #bfdbfe;
    --green-bg: #f0fdf4;
    --green-border: #22c55e;
    --green-text: #15803d;
    --red-bg: #fef2f2;
    --red-border: #ef4444;
    --red-text: #b91c1c;
    --amber-bg: #fffbeb;
    --amber-border: #f59e0b;
    --amber-text: #92400e;
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  body {
    background-color: var(--bg-page);
    color: var(--text-main);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, Arial, sans-serif;
    line-height: 1.6;
  }

  header {
    background-color: #ffffff;
    border-bottom: 1px solid var(--border-light);
    position: sticky;
    top: 0;
    z-index: 100;
    padding: 14px 20px;
  }

  .header-wrap {
    max-width: 1060px;
    margin: 0 auto;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
  }

  .title-block h1 {
    font-size: 1.15rem;
    font-weight: 700;
    color: var(--text-main);
  }

  .title-block p {
    font-size: 0.8rem;
    color: var(--text-muted);
  }

  .tabs {
    display: inline-flex;
    background-color: var(--bg-panel);
    border: 1px solid var(--border-light);
    border-radius: 8px;
    padding: 4px;
    gap: 4px;
  }

  .tab-btn {
    border: none;
    background: transparent;
    color: var(--text-sub);
    font-size: 0.88rem;
    font-weight: 600;
    padding: 7px 16px;
    border-radius: 6px;
    cursor: pointer;
    transition: 0.15s ease;
  }

  .tab-btn.active {
    background-color: #ffffff;
    color: var(--primary);
    border: 1px solid var(--border-light);
    box-shadow: 0 1px 2px rgba(0, 0, 0, 0.06);
  }

  .main-container {
    max-width: 1060px;
    margin: 0 auto;
    padding: 20px;
  }

  .controls-bar {
    background-color: var(--bg-panel);
    border: 1px solid var(--border-light);
    border-radius: 10px;
    padding: 12px 16px;
    margin-bottom: 18px;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
  }

  .filter-group {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    flex: 1;
  }

  select, input[type="text"] {
    background-color: #ffffff;
    color: var(--text-main);
    border: 1px solid var(--border-strong);
    border-radius: 6px;
    padding: 8px 12px;
    font-size: 0.875rem;
    outline: none;
  }

  select:focus, input[type="text"]:focus {
    border-color: var(--primary);
  }

  input[type="text"] {
    min-width: 230px;
  }

  .score-group {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 8px;
    font-size: 0.84rem;
    font-weight: 600;
  }

  .pill {
    background-color: #ffffff;
    border: 1px solid var(--border-light);
    border-radius: 999px;
    padding: 4px 11px;
    color: var(--text-sub);
  }

  .pill.green {
    background-color: var(--green-bg);
    border-color: var(--green-border);
    color: var(--green-text);
  }

  .pill.red {
    background-color: var(--red-bg);
    border-color: var(--red-border);
    color: var(--red-text);
  }

  .action-btn {
    background-color: #ffffff;
    color: var(--text-main);
    border: 1px solid var(--border-strong);
    border-radius: 6px;
    padding: 6px 12px;
    font-size: 0.82rem;
    font-weight: 600;
    cursor: pointer;
  }

  .action-btn:hover {
    background-color: #f3f4f6;
  }

  .learn-subbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 14px;
    font-size: 0.85rem;
    color: var(--text-muted);
  }

  .card {
    background-color: #ffffff;
    border: 1px solid var(--border-light);
    border-radius: 10px;
    padding: 18px 20px;
    margin-bottom: 14px;
  }

  .card-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 8px;
    gap: 8px;
  }

  .badge-group {
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .badge-num {
    background-color: var(--primary-soft);
    color: var(--primary);
    border: 1px solid var(--primary-border);
    font-size: 0.78rem;
    font-weight: 700;
    padding: 2px 8px;
    border-radius: 5px;
  }

  .badge-seq {
    background-color: var(--bg-panel);
    color: var(--text-sub);
    border: 1px solid var(--border-light);
    font-size: 0.74rem;
    font-weight: 600;
    padding: 2px 7px;
    border-radius: 5px;
  }

  .badge-cat {
    font-size: 0.75rem;
    font-weight: 600;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 0.03em;
  }

  .question-text {
    font-size: 1.02rem;
    font-weight: 600;
    color: var(--text-main);
    margin-bottom: 12px;
  }

  .learn-answer-box {
    display: inline-block;
    background-color: var(--green-bg);
    border: 1px solid #bbf7d0;
    color: var(--green-text);
    font-weight: 700;
    font-size: 0.94rem;
    padding: 6px 12px;
    border-radius: 6px;
    margin-bottom: 12px;
  }

  .learn-answer-box.blurred {
    filter: blur(5px);
    cursor: pointer;
    user-select: none;
  }

  .exam-points {
    background-color: var(--amber-bg);
    border: 1px solid #fde68a;
    border-left: 4px solid var(--amber-border);
    border-radius: 6px;
    padding: 10px 14px;
  }

  .exam-points-heading {
    font-size: 0.78rem;
    font-weight: 700;
    color: var(--amber-text);
    text-transform: uppercase;
    letter-spacing: 0.03em;
    margin-bottom: 4px;
  }

  .exam-points ul {
    margin-left: 18px;
    font-size: 0.88rem;
    color: #374151;
  }

  .exam-points li {
    margin-bottom: 3px;
  }

  .options-list {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
    gap: 10px;
  }

  .option-btn {
    display: flex;
    align-items: center;
    gap: 10px;
    width: 100%;
    text-align: left;
    background-color: #ffffff;
    border: 1.5px solid var(--border-light);
    border-radius: 8px;
    padding: 11px 14px;
    font-size: 0.92rem;
    font-weight: 500;
    color: var(--text-main);
    cursor: pointer;
    transition: all 0.15s ease;
  }

  .option-btn:hover:not(:disabled) {
    border-color: var(--primary);
    background-color: var(--primary-soft);
  }

  .option-btn:disabled {
    cursor: default;
  }

  .opt-circle {
    width: 24px;
    height: 24px;
    border-radius: 50%;
    background-color: var(--bg-panel);
    border: 1px solid var(--border-strong);
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-size: 0.78rem;
    font-weight: 700;
    color: var(--text-sub);
    flex-shrink: 0;
  }

  .option-btn.correct {
    background-color: var(--green-bg);
    border-color: var(--green-border);
    color: var(--green-text);
    font-weight: 700;
  }

  .option-btn.correct .opt-circle {
    background-color: var(--green-border);
    border-color: var(--green-border);
    color: #ffffff;
  }

  .option-btn.wrong {
    background-color: var(--red-bg);
    border-color: var(--red-border);
    color: var(--red-text);
    font-weight: 600;
  }

  .option-btn.wrong .opt-circle {
    background-color: var(--red-border);
    border-color: var(--red-border);
    color: #ffffff;
  }

  .answer-panel {
    display: none;
    margin-top: 14px;
    padding-top: 14px;
    border-top: 1px solid var(--border-light);
    animation: slideDown 0.18s ease-out;
  }

  .answer-panel.visible {
    display: block;
  }

  .result-banner {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    margin-bottom: 10px;
  }

  .result-pill {
    font-size: 0.84rem;
    font-weight: 700;
    padding: 4px 10px;
    border-radius: 6px;
  }

  .result-pill.right {
    background-color: var(--green-bg);
    color: var(--green-text);
    border: 1px solid var(--green-border);
  }

  .result-pill.wrong {
    background-color: var(--red-bg);
    color: var(--red-text);
    border: 1px solid var(--red-border);
  }

  .correct-label {
    font-size: 0.92rem;
    font-weight: 700;
    color: var(--text-main);
  }

  .correct-label span {
    color: var(--green-text);
  }

  .hidden {
    display: none !important;
  }

  .no-results {
    text-align: center;
    padding: 40px 20px;
    border: 1px dashed var(--border-strong);
    border-radius: 10px;
    color: var(--text-muted);
  }

  @keyframes slideDown {
    from { opacity: 0; transform: translateY(-4px); }
    to { opacity: 1; transform: translateY(0); }
  }

  @media (max-width: 640px) {
    .header-wrap { flex-direction: column; align-items: flex-start; }
    .options-list { grid-template-columns: 1fr; }
    input[type="text"] { width: 100%; }
  }
</style>
</head>

<header>
  <div class="header-wrap">
    <div class="title-block">
      <h1>6-Month CA Rapid Revision (Part 6: Slides #801–#1000) — New & Unique Questions (148 Questions)</h1>
      <p>Jeevitha Ma'am Session (English) | Exclusive Questions Not Covered in All 18 Previous Files</p>
    </div>
    <div class="tabs">
      <button class="tab-btn active" id="btn-learn" onclick="setMode('learn')">📖 Learn Mode</button>

<div class="main-container">

  <div id="cardsContainer"></div>
</div>

<script>
const QUESTIONS = [{"id": 1, "slide_q": 802, "cat": "International & Summits", "q": "In which city was the 16th BRICS Health Ministers' Meeting held in July 2026 under India's BRICS Chairmanship?", "opts": ["Bengaluru", "New Delhi", "Chandigarh", "Goa"], "ans": 2, "p1": "Host City: Chandigarh (under India's 2026 BRICS Chairmanship).", "p2": "Exam Fact: Union Minister of Health and Family Welfare is J. P. Nadda."}, {"id": 2, "slide_q": 803, "cat": "International & Summits", "q": "The 9th ASEAN–India Ministerial Meeting on Agriculture and Forestry held in New Delhi adopted a Plan of Action for which period?", "opts": ["2026–2035", "2025–2029", "2027–2031", "2026–2030"], "ans": 3, "p1": "Action Plan Horizon: 2026–2030.", "p2": "Exam Fact: ASEAN (Association of Southeast Asian Nations, HQ: Jakarta, Indonesia) comprises 10 Southeast Asian nations (with Timor-Leste as observer/acceding)."}, {"id": 3, "slide_q": 804, "cat": "International & Summits", "q": "In which city was the 7th edition of the Global Fintech Fest (GFF) hosted?", "opts": ["Mumbai, Maharashtra", "Bengaluru, Karnataka", "New Delhi", "GIFT City, Gandhinagar"], "ans": 0, "p1": "Host City: Mumbai, Maharashtra (Jio World Convention Centre).", "p2": "Exam Fact: Organized annually by the Payments Council of India (PCI), NPCI, and Fintech Convergence Council (FCC)."}, {"id": 4, "slide_q": 805, "cat": "International & Summits", "q": "In which city was the 52nd G7 Summit held from 15 to 17 June 2026?", "opts": ["Kananaskis, Canada", "Évian-les-Bains, France", "Apulia, Italy", "Hiroshima, Japan"], "ans": 1, "p1": "Host City: Évian-les-Bains, France (52nd G7 Summit).", "p2": "Exam Fact: G7 members are Canada, France, Germany, Italy, Japan, the United Kingdom, and the United States (plus the European Union)."}, {"id": 5, "slide_q": 806, "cat": "International & Summits", "q": "The 7th Agrivoltaics World Conference was held at Bharat Mandapam, New Delhi. Which country will host the next edition of the conference?", "opts": ["Germany", "Brazil", "France", "Japan"], "ans": 2, "p1": "Next Host Country: France.", "p2": "Exam Fact: Agrivoltaics combines solar photovoltaic power generation with agricultural crop cultivation on the same land."}, {"id": 6, "slide_q": 807, "cat": "National & State Affairs", "q": "Regarding the 29th National Conference on e-Governance: (1) Held in Jaipur, Rajasthan; (2) Conferred 17 National e-Governance Awards (not 25); (3) Jointly organized by DARPG, MeitY, and the Government of Rajasthan; (4) DARPG works under the Ministry of Personnel, Public Grievances and Pensions (not MHA). Which statements are correct?", "opts": ["All 1, 2, 3, and 4", "1 and 2 only", "2 and 4 only", "1 and 3 only (Conferred 17 awards; DARPG is under Ministry of Personnel)"], "ans": 3, "p1": "Corrections: Conferred 17 National e-Governance Awards (not 25), and DARPG operates under the Ministry of Personnel, Public Grievances and Pensions (headed by PM Modi / MoS Dr. Jitendra Singh).", "p2": "Exam Fact: DARPG stands for Department of Administrative Reforms and Public Grievances."}, {"id": 7, "slide_q": 808, "cat": "International & Summits", "q": "Where was UNCCD COP 17 (17th Conference of the Parties to the UN Convention to Combat Desertification) held (with theme 'Restoring Land, Restoring Hope')?", "opts": ["Ulaanbaatar, Mongolia", "Riyadh, Saudi Arabia", "Abidjan, Côte d'Ivoire", "New Delhi, India"], "ans": 0, "p1": "Venue & Theme: Ulaanbaatar, Mongolia — Theme: 'Restoring Land, Restoring Hope'.", "p2": "Exam Fact: UNCCD COP 16 (2024) was held in Riyadh, Saudi Arabia; UNCCD Secretariat is headquartered in Bonn, Germany."}, {"id": 8, "slide_q": 809, "cat": "Science, Space & Technology", "q": "At the Goa AI Tech Conclave, a specialized BHASHINI Large Language Model (LLM) was launched for which Indian language?", "opts": ["Marathi", "Konkani", "Tulu", "Kannada"], "ans": 1, "p1": "Language & Venue: Konkani (official language of Goa) — launched at the Goa AI Tech Conclave.", "p2": "Exam Fact: Konkani was added to the Eighth Schedule of the Indian Constitution via the 71st Amendment Act, 1992 (alongside Manipuri and Nepali)."}, {"id": 9, "slide_q": 810, "cat": "Infrastructure, Ports & Energy", "q": "What was the official theme of the 'Bharat Renewable Energy Summit & Expo 2026' inaugurated by PM Narendra Modi?", "opts": ["Solarizing India's Future", "Clean Energy for Viksit Bharat", "Invest, Innovate and Inspire", "Powering Green Growth"], "ans": 2, "p1": "Theme: 'Invest, Innovate and Inspire' (the 3 I's).", "p2": "Exam Fact: India targets 500 GW of non-fossil fuel installed electricity capacity by 2030."}, {"id": 10, "slide_q": 812, "cat": "International & Summits", "q": "The 16th BRICS Agriculture Ministers' Meeting held in June 2026 concluded with the adoption of a joint declaration named after which Indian city?", "opts": ["Indore", "Bhopal", "Varanasi", "Lucknow"], "ans": 0, "p1": "Declaration Name: Indore Declaration (adopted in Indore, Madhya Pradesh).", "p2": "Exam Fact: India holds the BRICS Chairmanship in 2026."}, {"id": 11, "slide_q": 813, "cat": "International & Summits", "q": "In which city was the BRICS Meeting of Heads of National Statistical Offices (NSOs) hosted in 2026?", "opts": ["New Delhi", "Lucknow, Uttar Pradesh", "Kolkata, West Bengal", "Jaipur, Rajasthan"], "ans": 1, "p1": "Host City: Lucknow, Uttar Pradesh (MoS Independent Charge for MoSPI: Rao Inderjit Singh).", "p2": "Exam Fact: BRICS publishes the annual BRICS Joint Statistical Publication."}, {"id": 12, "slide_q": 815, "cat": "International & Summits", "q": "In which Indian city was the 14th BRICS Science, Technology and Innovation (STI) Ministerial Meeting hosted?", "opts": ["Pune, Maharashtra", "Bengaluru, Karnataka", "Hyderabad, Telangana", "Chennai, Tamil Nadu"], "ans": 3, "p1": "Host City: Chennai, Tamil Nadu.", "p2": "Exam Fact: Union Minister of State (Independent Charge) for Science & Technology is Dr. Jitendra Singh."}, {"id": 13, "slide_q": 816, "cat": "International & Summits", "q": "In which city did the Competition Commission of India (CCI) host the BRICS Competition Authorities Meeting in August 2026?", "opts": ["Udaipur, Rajasthan", "Jaipur, Rajasthan", "New Delhi", "Mumbai, Maharashtra"], "ans": 0, "p1": "Host City: Udaipur ('City of Lakes'), Rajasthan.", "p2": "Exam Fact: Addresses digital market competition, AI algorithms, and cross-border merger enforcement."}, {"id": 14, "slide_q": 817, "cat": "International & Summits", "q": "Which Indian city hosted the 12th BRICS Labour and Employment Ministers' Meeting in 2026?", "opts": ["New Delhi", "Hyderabad, Telangana", "Bengaluru, Karnataka", "Ahmedabad, Gujarat"], "ans": 1, "p1": "Host City: Hyderabad, Telangana.", "p2": "Exam Fact: Union Minister of Labour and Employment is Dr. Mansukh Mandaviya."}, {"id": 15, "slide_q": 819, "cat": "Ranks, Indices & Reports", "q": "According to the World Intellectual Property Organization (WIPO) World Intangible Investment Highlights report, by what percentage did India's intangible investment grow?", "opts": ["11.5%", "5.4%", "9.2%", "7.9%"], "ans": 3, "p1": "Growth Rate: 7.9% growth in intangible asset investment (software, R&D, patents, brands, organizational capital).", "p2": "Exam Fact: WIPO is headquartered in Geneva, Switzerland (Director General: Daren Tang)."}, {"id": 16, "slide_q": 820, "cat": "Ranks, Indices & Reports", "q": "According to the BIMCO / ICS Seafarer Workforce Report, what is India's global rank as a supplier of trained seafarers to the global maritime industry?", "opts": ["2nd (after the Philippines)", "1st", "3rd", "4th"], "ans": 0, "p1": "Global Ranking: 1st — Philippines; 2nd — India.", "p2": "Exam Fact: National Maritime Day in India is celebrated annually on 5 April."}, {"id": 17, "slide_q": 821, "cat": "Ranks, Indices & Reports", "q": "What was India's rank in the February 2026 edition of the Henley Passport Index?", "opts": ["80th", "75th", "84th", "85th"], "ans": 1, "p1": "Rank: 75th in the Februar let mode = 'learn';
let hideAnswers = false;
let userAnswers = {};

function setup() {
  const select = document.getElementById('catSelect');
  const uniqueCats = [...new Set(QUESTIONS.map(q => q.cat))];
  uniqueCats.forEach(cat => {
    const count = QUESTIONS.filter(q => q.cat === cat).length;
    const option = document.createElement('option');
    option.value = cat;
    option.textContent = `${cat} (${count})`;
    select.appendChild(option);
  });
  refreshStats();
  render();
}

function setMode(newMode) {
  mode = newMode;
  document.getElementById('btn-learn').classList.toggle('active', mode === 'learn');
  document.getElementById('btn-practice').classList.toggle('active', mode === 'practice');
  document.getElementById('blurBtn').classList.toggle('hidden', mode !== 'learn');
  render();
}

function toggleBlur() {
  hideAnswers = !hideAnswers;
  document.getElementById('blurBtn').textContent = hideAnswers
    ? '👁️ Show All Answers'
    : '👁️ Hide Answers (Self-Test)';
  render();
}

function getFilteredList() {
  const cat = document.getElementById('catSelect').value;
  const term = document.getElementById('searchBox').value.trim().toLowerCase();

  return QUESTIONS.filter(item => {
    if (cat !== 'ALL' && item.cat !== cat) return false;
    if (!term) return true;
    return (
      item.q.toLowerCase().includes(term) ||
      item.opts.some(o => o.toLowerCase().includes(term)) ||
      item.p1.toLowerCase().includes(term) ||
      item.p2.toLowerCase().includes(term) ||
      String(item.slide_q).includes(term)
    );
  });
}

function render() {
  const list = getFilteredList();
  document.getElementById('showingCount').textContent = `Showing ${list.length} question${list.length === 1 ? '' : 's'}`;
  const container = document.getElementById('cardsContainer');

  if (list.length === 0) {
    container.innerHTML = `<div class="no-results">No questions match your filter. Clear search or switch category.</div>`;
    return;
  }

  container.innerHTML = list
    .map(item => (mode === 'learn' ? buildLearnCard(item) : buildPracticeCard(item)))
    .join('');
}

function buildLearnCard(item) {
  const answerText = item.opts[item.ans];
  const blurClass = hideAnswers ? 'blurred' : '';
  return `
    <div class="card">
      <div class="card-top">
        <div class="badge-group">
          <span class="badge-num">Q.${item.id}</span>
          <span class="badge-seq">Slide #${item.slide_q}</span>
        </div>
        <span class="badge-cat">${item.cat}</span>
      </div>
      <div class="question-text">${item.q}</div>
      <div class="learn-answer-box ${blurClass}" onclick="this.classList.remove('blurred')" title="Click to reveal answer">
        ✓ Answer: ${answerText}
      </div>
      <div class="exam-points">
        <div class="exam-points-heading">📌 2 Exam-Related Extra Points</div>
        <ul>
          <li>${item.p1}</li>
          <li>${item.p2}</li>
        </ul>
      </div>
    </div>
  `;
}

function buildPracticeCard(item) {
  const record = userAnswers[item.id];
  const isAnswered = record !== undefined;
  const letters = ['A', 'B', 'C', 'D'];

  const optsMarkup = item.opts
    .map((opt, idx) => {
      let cls = '';
      if (isAnswered) {
        if (idx === item.ans) cls = 'correct';
        else if (idx === record.picked && !record.correct) cls = 'wrong';
      }
      return `
        <button class="option-btn ${cls}" ${isAnswered ? 'disabled' : ''} onclick="selectOption(${item.id}, ${idx})">
          <span class="opt-circle">${letters[idx]}</span>
          <span>${opt}</span>
        </button>
      `;
    })
    .join('');

  const bannerMarkup = isAnswered
    ? record.correct
      ? `<span class="result-pill right">✓ Correct!</span>`
      : `<span class="result-pill wrong">✕ Wrong Answer</span>`
    : '';

  return `
    <div class="card" id="card-${item.id}">
      <div class="card-top">
        <div class="badge-group">
          <span class="badge-num">Q.${item.id}</span>
          <span class="badge-seq">Slide #${item.slide_q}</span>
        </div>
        <span class="badge-cat">${item.cat}</span>
      </div>
      <div class="question-text">${item.q}</div>
      <div class="options-list">
        ${optsMarkup}
      </div>
      <div class="answer-panel ${isAnswered ? 'visible' : ''}" id="panel-${item.id}">
        <div class="result-banner">
          ${bannerMarkup}
          <div class="correct-label">Correct Answer: <span>${letters[item.ans]}. ${item.opts[item.ans]}</span></div>
        </div>
        <div class="exam-points">
          <div class="exam-points-heading">📌 2 Exam-Related Extra Points</div>
          <ul>
            <li>${item.p1}</li>
            <li>${item.p2}</li>
          </ul>
        </div>
      </div>
    </div>
  `;
}

function selectOption(qId, pickedIdx) {
  if (userAnswers[qId] !== undefined) return;
  const item = QUESTIONS.find(q => q.id === qId);
  if (!item) return;

  userAnswers[qId] = {
    picked: pickedIdx,
    correct: pickedIdx === item.ans
  };

  refreshStats();
  const cardEl = document.getElementById(`card-${qId}`);
  if (cardEl) {
    cardEl.outerHTML = buildPracticeCard(item);
  }
}

function refreshStats() {
  const keys = Object.keys(userAnswers);
  const attempted = keys.length;
  const correct = keys.filter(k => userAnswers[k].correct).length;
  const wrong = attempted - correct;

  document.getElementById('cnt-attempted').textContent = attempted;
  document.getElementById('cnt-correct').textContent = correct;
  document.getElementById('cnt-wrong').textContent = wrong;
}

function resetAll() {
  userAnswers = {};
  refreshStats();
  render();
}

setup();
</script>
</body>
</html>
