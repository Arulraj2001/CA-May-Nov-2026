  [290, 3, "In which Indian state is the Valley of Flowers National Park situated?", ["Uttarakhand", "Himachal Pradesh", "Sikkim", "Arunachal Pradesh"], 0, false, "Valley of Flowers National Park is nestled in the Chamoli district of Uttarakhand and is world-renowned for its meadows of endemic alpine flowers and diverse Himalayan flora."],

  // PAGE 4 (291 to 351)
  [291, 4, "Where is Hemis National Park located, and what is its geographical distinction in India?", ["Ladakh; Largest National Park in India by area", "Madhya Pradesh; Oldest Tiger Reserve in India", "Andaman and Nicobar Islands; Smallest National Park in India", "Assam; Highest rainfall National Park"], 0, false, "Hemis National Park in the Union Territory of Ladakh spans approximately 4,400 square kilometers, making it the largest National Park in India and a prime habitat for the elusive Snow Leopard."],
  [292, 4, "In which Indian state is the Desert National Park located?", ["Rajasthan", "Gujarat", "Haryana", "Punjab"], 0, false, "Desert National Park is located near Jaisalmer and Barmer in Rajasthan, showcasing the fragile ecosystem of the Thar Desert and serving as a critical stronghold for the critically endangered Great Indian Bustard."],
  [293, 4, "In which Indian state is Periyar National Park and Wildlife Sanctuary located?", ["Kerala", "Tamil Nadu", "Karnataka", "Andhra Pradesh"], 0, false, "Periyar National Park is situated in the Cardamom Hills and Pandalam Hills of the southern Western Ghats in Idukki and Pathanamthitta districts of Kerala, noted for its elephant and tiger populations."],
  [294, 4, "In which Indian state is Bandipur National Park located?", ["Karnataka", "Tamil Nadu", "Kerala", "Telangana"], 0, false, "Bandipur National Park is located in Chamarajanagar district of Karnataka and forms a vital component of the Nilgiri Biosphere Reserve."],
  [295, 4, "In which Indian state is Nagarhole National Park (Rajiv Gandhi National Park) located?", ["Karnataka", "Kerala", "Andhra Pradesh", "Maharashtra"], 0, false, "Nagarhole National Park is spread across Kodagu and Mysuru districts in Karnataka and is rich in Asiatic elephants, tigers, Indian bison (gaur), and leopards."],
  [296, 4, "In which Indian state is Mudumalai National Park located?", ["Tamil Nadu", "Kerala", "Karnataka", "Andhra Pradesh"], 0, false, "Mudumalai National Park is located in the Nilgiris district of Tamil Nadu at the tri-junction of Tamil Nadu, Karnataka, and Kerala."],
  [297, 4, "In which Indian state is Manas National Park located?", ["Assam", "Arunachal Pradesh", "Meghalaya", "Manipur"], 0, false, "Manas National Park is located in Assam at the foothills of the Himalayas contiguous with Bhutan's Royal Manas National Park, recognized as a Project Tiger Reserve, Elephant Reserve, and World Heritage Site."],
  [298, 4, "In which Indian state is Namdapha National Park located?", ["Arunachal Pradesh", "Assam", "Nagaland", "Mizoram"], 0, false, "Namdapha National Park is located in Changlang district of Arunachal Pradesh and is the largest protected area in the Eastern Himalaya biodiversity hotspot."],
  [299, 4, "In which Indian state is the Great Himalayan National Park located?", ["Himachal Pradesh", "Uttarakhand", "Jammu and Kashmir", "Sikkim"], 0, false, "The Great Himalayan National Park is situated in the Kullu region of Himachal Pradesh and was inscribed as a United Nations Educational, Scientific and Cultural Organization World Heritage Site in 2014."],
  [300, 4, "In which Indian state is Silent Valley National Park located?", ["Kerala", "Tamil Nadu", "Karnataka", "Goa"], 0, false, "Silent Valley National Park is located in the Nilgiri Hills of Palakkad district, Kerala, famous for its undisturbed tropical evergreen rainforests and the endangered Lion-tailed Macaque."],
  [301, 4, "On which date was the state of Haryana formed?", ["1 November 1966", "1 November 1956", "1 May 1960", "15 August 1947"], 0, false, "Haryana was carved out of the former state of East Punjab on linguistic grounds on 1 November 1966 under the Punjab Reorganisation Act, 1966."],
  [302, 4, "What is the capital city of Haryana?", ["Chandigarh", "Gurugram", "Faridabad", "Panchkula"], 0, false, "Chandigarh, a Union Territory, serves as the joint capital of both Haryana and Punjab."],
  [303, 4, "Who is the Chief Minister of Haryana?", ["Nayab Singh Saini", "Manohar Lal Khattar", "Bhupinder Singh Hooda", "Anil Vij"], 0, false, "Nayab Singh Saini serves as the Chief Minister of Haryana, having initially assumed office in March 2024 and been sworn in for a consecutive term in October 2024."],
  [304, 4, "What is the official State Animal of Haryana?", ["Blackbuck", "Nilgiri Tahr", "One-horned Rhinoceros", "Swamp Deer"], 0, false, "The Blackbuck (Antilope cervicapra) is the official State Animal of Haryana, as well as the state animal of Punjab and Andhra Pradesh."],
  [305, 4, "What is the official State Bird of Haryana?", ["Black Francolin", "Emerald Dove", "Great Indian Bustard", "House Sparrow"], 0, false, "The Black Francolin (locally known as Kala Teetar) is the designated State Bird of Haryana."],
  [306, 4, "Which traditional folk dances and theater forms are associated with Haryana?", ["Saang and Phag", "Bhangra and Giddha", "Garba and Dandiya", "Bihu and Bagurumba"], 0, false, "Saang (Swang) is the traditional folk dance-drama of Haryana, while Phag (Phaag) is a vibrant seasonal folk dance performed by farmers during the month of Phalguna."],
  [307, 4, "Who was the first Chief Minister of Haryana upon its formation in 1966?", ["Bhagwat Dayal Sharma", "Bansi Lal", "Devi Lal", "Rao Birender Singh"], 0, false, "Pandit Bhagwat Dayal Sharma became the first Chief Minister of Haryana when the state came into existence on 1 November 1966."],
  [308, 4, "For which agricultural and sporting distinctions is Haryana especially famous?", ["Sports excellence, high per-capita milk production, and Murrah Buffalo", "Tea plantations and silk weaving", "Saffron cultivation and apple orchards", "Coffee estates and sandalwood"], 0, false, "Haryana is renowned as a powerhouse of Indian Olympic and Commonwealth Games athletes, as well as for its thriving dairy sector led by the high-yielding Murrah breed of water buffalo."],
  [309, 4, "How is Haryana recognized in relation to solar energy and sports initiatives?", ["Leading state in rooftop solar adoption and known as the Sports Capital of India", "First 100% organic farming state", "Largest wind energy producer in South India", "Home to India's first tidal power station"], 0, false, "Haryana actively promotes residential solar adoption under the Pradhan Mantri Surya Ghar scheme alongside state incentives, while consistently topping national medal tallies as India's sporting hub."],
  [310, 4, "On which date was the modern state of Punjab reorganized on linguistic lines?", ["1 November 1966", "1 November 1956", "26 January 1950", "1 May 1960"], 0, false, "Modern Punjabi-speaking Punjab was formed on 1 November 1966 on the same day Haryana was created and hill territories were transferred to Himachal Pradesh."],
  [311, 4, "What is the capital city of Punjab?", ["Chandigarh", "Ludhiana", "Amritsar", "Patiala"], 0, false, "Chandigarh serves as the shared capital city of Punjab and Haryana, designed by the Swiss-French architect Le Corbusier."],
  [312, 4, "When was Tamil Nadu formed under the States Reorganisation Act, and in which year was Madras State renamed Tamil Nadu?", ["Formed 1 November 1956; Renamed in 1969", "Formed 1 October 1953; Renamed in 1956", "Formed 1 May 1960; Renamed in 1972", "Formed 26 January 1950; Renamed in 1965"], 0, false, "The state was reorganized on 1 November 1956 as Madras State and was officially renamed Tamil Nadu on 14 January 1969 during the tenure of Chief Minister C. N. Annadurai."],
  [313, 4, "What is the capital city of Tamil Nadu?", ["Chennai", "Madurai", "Coimbatore", "Tiruchirappalli"], 0, false, "Chennai (formerly Madras), located on the Coromandel Coast of the Bay of Bengal, is the capital city of Tamil Nadu."],
  [314, 4, "What is the official State Animal of Tamil Nadu?", ["Nilgiri Tahr", "Indian Elephant", "Blackbuck", "Gaur"], 0, false, "The Nilgiri Tahr, an endangered mountain ungulate endemic to the Western Ghats, is the official State Animal of Tamil Nadu."],
  [315, 4, "What is the official State Bird of Tamil Nadu?", ["Emerald Dove", "Indian Roller", "Great Hornbill", "Peacock"], 0, false, "The Common Emerald Dove (Chalcophaps indica) is the official State Bird of Tamil Nadu."],
  [316, 4, "What is the official State Tree of Tamil Nadu?", ["Palmyra Palm", "Banyan Tree", "Coconut Tree", "Sandalwood Tree"], 0, false, "The Palmyra Palm (Borassus flabellifer), revered in Tamil literature and culture for its utility, is the official State Tree of Tamil Nadu."],
  [317, 4, "On which date was the state of Kerala formed?", ["1 November 1956", "1 October 1953", "1 May 1960", "2 June 2014"], 0, false, "Kerala was formed on 1 November 1956 under the States Reorganisation Act by merging Travancore-Cochin with the Malabar district of Madras State."],
  [318, 4, "What is the capital city of Kerala?", ["Thiruvananthapuram", "Kochi", "Kozhikode", "Thrissur"], 0, false, "Thiruvananthapuram (formerly Trivandrum), situated near the southern tip of mainland India, is the capital city of Kerala."],
  [319, 4, "On which date was Karnataka (originally as Mysore State) formed?", ["1 November 1956", "1 November 1966", "1 May 1960", "16 May 1975"], 0, false, "Karnataka was formed on 1 November 1956 as Mysore State by uniting all Kannada-speaking regions, and was officially renamed Karnataka in 1973."],
  [320, 4, "What is the capital city of Karnataka?", ["Bengaluru", "Mysuru", "Hubballi", "Mangaluru"], 0, false, "Bengaluru is the capital city of Karnataka and the administrative center of the state government."],
  [321, 4, "When was Andhra Pradesh formed as India's first linguistic state, and in which year was it bifurcated?", ["Formed 1 October 1953; Bifurcated in 2014", "Formed 1 November 1956; Bifurcated in 2000", "Formed 15 August 1947; Bifurcated in 2014", "Formed 1 May 1960; Bifurcated in 2019"], 0, false, "Andhra State was created on 1 October 1953 as India's first state formed on a linguistic basis (expanded into Andhra Pradesh in 1956), and was bifurcated on 2 June 2014 to create Telangana."],
  [322, 4, "On which date was Telangana officially formed as the 29th state of India?", ["2 June 2014", "1 October 1953", "1 November 2000", "9 November 2000"], 0, false, "Telangana was officially formed on 2 June 2014 under the Andhra Pradesh Reorganisation Act, 2014, with Hyderabad as its capital."],
  [323, 4, "On which date was the state of Maharashtra formed?", ["1 May 1960", "1 November 1956", "30 May 1987", "1 November 1966"], 0, false, "Maharashtra was formed on 1 May 1960 following the bifurcation of the bilingual Bombay State under the Bombay Reorganisation Act, 1960."],
  [324, 4, "On which date was the state of Gujarat formed?", ["1 May 1960", "1 November 1956", "15 August 1947", "16 May 1975"], 0, false, "Gujarat came into existence on 1 May 1960 alongside Maharashtra when the former Bombay State was divided on linguistic lines."],
  [325, 4, "On which date did Goa attain full statehood in India?", ["30 May 1987", "19 December 1961", "16 May 1975", "1 May 1960"], 0, false, "After being liberated from Portuguese rule on 19 December 1961 and administered as a Union Territory, Goa attained full statehood as India's 25th state on 30 May 1987."],
  [326, 4, "On which date did Sikkim become the 22nd state of the Indian Union?", ["16 May 1975", "30 May 1987", "26 January 1950", "1 November 1956"], 0, false, "Sikkim became the 22nd state of India on 16 May 1975 following the 36th Constitutional Amendment Act, 1975."],
  [327, 4, "Which is the highest mountain peak in India (including Pakistan-occupied Kashmir)?", ["Mount K2 (Godwin-Austen), 8,611 meters", "Kanchenjunga, 8,586 meters", "Nanda Devi, 7,816 meters", "Mount Everest, 8,848.86 meters"], 0, false, "Mount K2 (Godwin-Austen) in the Karakoram Range, standing at 8,611 meters in Pakistan-occupied Kashmir, is the highest peak in India and the second-highest peak in the world."],
  [328, 4, "Which is the highest mountain peak located entirely within administered Indian territory?", ["Kanchenjunga, 8,586 meters (Sikkim)", "Nanda Devi, 7,816 meters (Uttarakhand)", "Kamet, 7,756 meters (Uttarakhand)", "Saltoro Kangri, 7,742 meters (Ladakh)"], 0, false, "Kanchenjunga, located on the border of Sikkim and Nepal at an elevation of 8,586 meters, is the highest peak within administered Indian territory and the third-highest mountain globally."],
  [329, 4, "Which is the longest river flowing within India?", ["Ganga (2,525 kilometers)", "Godavari (1,465 kilometers)", "Yamuna (1,376 kilometers)", "Narmada (1,312 kilometers)"], 0, false, "The Ganga is the longest river in India with a total length of 2,525 kilometers, serving as the lifeline of the Indo-Gangetic Plain."],
  [330, 4, "Which is the longest river in the world?", ["Nile River (6,650 kilometers)", "Amazon River (6,400 kilometers)", "Yangtze River (6,300 kilometers)", "Mississippi-Missouri River (6,275 kilometers)"], 0, false, "The Nile River in northeastern Africa, stretching approximately 6,650 kilometers through 11 countries into the Mediterranean Sea, is recognized as the longest river in the world."],
  [331, 4, "Which is the largest state in India by geographical area?", ["Rajasthan", "Madhya Pradesh", "Maharashtra", "Uttar Pradesh"], 0, false, "Rajasthan is India's largest state by area, covering 342,239 square kilometers (about 10.4% of India's total geographical area)."],
  [332, 4, "Which is the smallest state in India by geographical area?", ["Goa", "Sikkim", "Tripura", "Nagaland"], 0, false, "Goa, located on India's southwestern Konkan coast, is the smallest state by area, spanning 3,702 square kilometers."],
  [333, 4, "Which is the largest Union Territory in India by geographical area?", ["Ladakh", "Jammu and Kashmir", "Andaman and Nicobar Islands", "Delhi"], 0, false, "Formed on 31 October 2019, Ladakh is the largest Union Territory in India by area, covering over 59,146 square kilometers of administered territory."],
  [334, 4, "Which is the most populous state in India?", ["Uttar Pradesh", "Maharashtra", "Bihar", "West Bengal"], 0, false, "Uttar Pradesh is the most populous state in India, accounting for over 16% of the nation's total population."],
  [335, 4, "Which is the least populous state in India?", ["Sikkim", "Mizoram", "Arunachal Pradesh", "Goa"], 0, false, "Sikkim in the northeastern Himalayas is the least populous state in India according to official Census figures."],
  [336, 4, "What is the current total strength of the Lok Sabha after the abolition of nominated Anglo-Indian seats?", ["543 elected seats", "545 seats", "550 seats", "552 seats"], 0, false, "Following the 104th Constitutional Amendment Act (effective January 2020) which discontinued the nomination of two Anglo-Indian members, the Lok Sabha consists of 543 directly elected members."],
  [337, 4, "What is the current sanctioned strength of the Rajya Sabha?", ["245 seats", "250 seats", "238 seats", "543 seats"], 0, false, "The Rajya Sabha (Council of States) currently has a total membership of 245 seats, comprising 233 representatives of States and Union Territories and 12 members nominated by the President of India."],
  [338, 4, "How many parliamentary sessions does the Lok Sabha normally hold in a calendar year?", ["3 sessions (Budget, Monsoon, and Winter)", "2 sessions (Summer and Winter)", "4 quarterly sessions", "1 continuous session"], 0, false, "By parliamentary convention, the Lok Sabha meets for three sessions each year: the Budget Session (January–April), the Monsoon Session (July–August), and the Winter Session (November–December)."],
  [339, 4, "Who is the Speaker of the 18th Lok Sabha?", ["Om Birla", "Sumitra Mahajan", "Meira Kumar", "Bhartruhari Mahtab"], 0, false, "Om Birla, Member of Parliament from Kota, Rajasthan, was re-elected as the Speaker of the 18th Lok Sabha in June 2024, having also served as Speaker of the 17th Lok Sabha."],
  [340, 4, "Who serves as the ex-officio Chairman of the Rajya Sabha?", ["Vice President of India (C. P. Radhakrishnan)", "Speaker of the Lok Sabha", "Prime Minister of India", "Chief Justice of India"], 0, false, "Under Article 64 of the Constitution of India, the Vice President of India serves as the ex-officio Chairman of the Rajya Sabha; C. P. Radhakrishnan assumed office as Vice President in September 2025."],
  [341, 4, "Who was appointed as India's first Chief of Defence Staff?", ["General Bipin Rawat", "General Anil Chauhan", "General Manoj Mukund Naravane", "Field Marshal Sam Manekshaw"], 0, false, "General Bipin Rawat became India's first Chief of Defence Staff on 1 January 2020, serving until his untimely demise in a helicopter crash in December 2021."],

  [343, 4, "Who served as the first President of independent India?", ["Dr. Rajendra Prasad", "Dr. Sarvepalli Radhakrishnan", "Dr. Zakir Husain", "C. Rajagopalachari"], 0, false, "Dr. Rajendra Prasad served as the first President of India from 26 January 1950 to 13 May 1962, remaining the only President to serve two full terms."],
  [344, 4, "Who is the current President of India?", ["Droupadi Murmu (15th President)", "Ram Nath Kovind", "Pratibha Patil", "C. P. Radhakrishnan"], 0, false, "Droupadi Murmu took oath as the 15th President of India on 25 July 2022, becoming the first tribal person and second woman to hold India's highest constitutional office."],
  [345, 4, "Who was the first Prime Minister of independent India?", ["Jawaharlal Nehru", "Lal Bahadur Shastri", "Sardar Vallabhbhai Patel", "Gulzarilal Nanda"], 0, false, "Pandit Jawaharlal Nehru served as the first Prime Minister of independent India from 15 August 1947 until his death on 27 May 1964."],
  [346, 4, "Who is the current Prime Minister of India serving his third consecutive term?", ["Narendra Modi", "Manmohan Singh", "Atal Bihari Vajpayee", "Amit Shah"], 0, false, "Narendra Modi was sworn in as Prime Minister of India for a third consecutive term on 9 June 2024, equaling Jawaharlal Nehru's record of three consecutive terms."],
  [347, 4, "Who was the first woman Chief Minister of an Indian state?", ["Sucheta Kripalani (Uttar Pradesh)", "Sarojini Naidu (Uttar Pradesh)", "Nandini Satpathy (Odisha)", "J. Jayalalithaa (Tamil Nadu)"], 0, false, "Sucheta Kripalani became India's first woman Chief Minister when she took office as Chief Minister of Uttar Pradesh on 2 October 1963."],
  [348, 4, "Who was the first woman Governor of an Indian state?", ["Sarojini Naidu (Uttar Pradesh)", "Vijayalakshmi Pandit (Maharashtra)", "Padmaja Naidu (West Bengal)", "Sucheta Kripalani (Uttar Pradesh)"], 0, false, "Sarojini Naidu, celebrated as the 'Nightingale of India', became the first woman Governor of an Indian state when she was appointed Governor of the United Provinces (now Uttar Pradesh) in August 1947."],
  [349, 4, "Under which Union Ministry does the Border Roads Organisation function?", ["Ministry of Defence", "Ministry of Road Transport and Highways", "Ministry of Home Affairs", "Ministry of External Affairs"], 0, false, "Since 2015, the Border Roads Organisation functions entirely under the administrative and operational control of the Ministry of Defence to develop and maintain strategic road networks in border areas."],
  [350, 4, "When was the Border Roads Organisation founded, and where is its headquarters located?", ["Founded on 7 May 1960; Headquarters in New Delhi", "Founded on 15 August 1947; Headquarters in Dehradun", "Founded on 26 January 1950; Headquarters in Chandigarh", "Founded on 1 April 1965; Headquarters in Leh"], 0, false, "The Border Roads Organisation was formed on 7 May 1960 with its headquarters at Seema Sadak Bhawan in New Delhi to secure India's borders and develop infrastructure in remote north and northeastern border states."],

  [382, 6, "What is the full form of the clean energy and waste-to-wealth scheme GOBARdhan?", ["Galvanizing Organic Bio-Agro Resources Dhan", "Green Organic Bio-Agro Resources Dhan", "Government Organic Bio-Agro Resources Dhan", "Global Organic Bio-Agricultural Resource Development"], 0, false, "GOBARdhan stands for Galvanizing Organic Bio-Agro Resources Dhan, supporting villages in safely managing cattle and biodegradable waste to generate biogas and organic slurry."],
  [383, 6, "Which Union Ministry launched the National e-Vidhan Application (NeVA)?", ["Ministry of Parliamentary Affairs", "Ministry of Home Affairs", "Ministry of Law and Justice", "Ministry of Electronics and Information Technology"], 0, false, "The Ministry of Parliamentary Affairs launched the National e-Vidhan Application to digitize and make all State Legislatures and Parliament paperless under the 'One Nation, One Application' vision."],
  [384, 6, "In the acronym NeVA (National e-Vidhan Application), what does the letter 'V' stand for?", ["Vidhan", "Vikas", "Vidya", "Vision"], 0, false, "In NeVA, 'V' stands for Vidhan (Legislative), representing the National e-Vidhan Application used for digital legislative business."],
  [385, 6, "What is the minimum annual contribution required for a National Pension System Tier-I account?", ["Rupees 500", "Rupees 1,000", "Rupees 2,000", "Rupees 5,000"], 1, false, "A minimum contribution of Rupees 1,000 per financial year is mandatory to maintain an active Tier-I account under the National Pension System."],

  [387, 6, "Which bank launched the green sustainability initiative 'Project Prakriti' in 2026?", ["State Bank of India", "HDFC Bank", "ICICI Bank", "Punjab National Bank"], 0, false, "The State Bank of India launched 'Project Prakriti' in 2026 as part of its environmental sustainability and green financing initiatives."],
  [388, 6, "Who is the Chairman and Managing Director of the Small Industries Development Bank of India?", ["Manoj Mittal", "Sivasubramanian Ramann", "Shaji K. V.", "Rajnish Kumar"], 0, false, "Manoj Mittal heads the Small Industries Development Bank of India as its Chairman and Managing Director, overseeing Micro, Small, and Medium Enterprise credit refinancing."],
  [389, 6, "Who was appointed as the Director of the Financial Intelligence Unit – India in July 2026?", ["Satya Pal Kumar", "Pankaj Kumar Mishra", "Amit Govil", "Rajesh Kumar"], 0, false, "Satya Pal Kumar, a 2005-batch Indian Revenue Service officer, took charge as Director of the Financial Intelligence Unit – India in July 2026."],
  [390, 6, "Which regulatory body oversees and regulates Credit Rating Agencies in India?", ["Reserve Bank of India", "Securities and Exchange Board of India", "Insurance Regulatory and Development Authority of India", "Pension Fund Regulatory and Development Authority"], 1, false, "Credit Rating Agencies in India are registered and regulated by the Securities and Exchange Board of India under the Securities and Exchange Board of India (Credit Rating Agencies) Regulations, 1999."],
  [391, 6, "Which regulatory body regulates Mutual Funds in India?", ["Securities and Exchange Board of India", "Reserve Bank of India", "Association of Mutual Funds in India", "Insurance Regulatory and Development Authority of India"], 0, false, "The Securities and Exchange Board of India regulates all Mutual Funds and Asset Management Companies in India, while the Association of Mutual Funds in India serves as the industry self-regulatory trade body."],
  [392, 6, "Which was the first spacecraft in the world to successfully enter Mars orbit on its maiden attempt?", ["Mangalyaan (Mars Orbiter Mission)", "Curiosity Rover", "Perseverance Rover", "Tianwen-1"], 0, false, "India's Mars Orbiter Mission, popularly known as Mangalyaan, launched by the Indian Space Research Organisation, became the first spacecraft globally to enter Martian orbit on its very first attempt on 24 September 2014."],
  [393, 6, "Which country is home to Umling La, the world's highest motorable road?", ["India", "China", "Bolivia", "Nepal"], 0, false, "Umling La pass in eastern Ladakh, India, constructed by the Border Roads Organisation at an altitude of 19,024 feet (5,798 meters), holds the Guinness World Record as the highest motorable road in the world."],

  [396, 6, "From which lake does the Teesta River originate?", ["Tso Lhamo Lake, Sikkim", "Gangotri Glacier, Uttarakhand", "Lake Mansarovar, Tibet", "Amarkantak, Madhya Pradesh"], 0, false, "The Teesta River originates from the glacial Tso Lhamo Lake (Cholamu Lake) in North Sikkim at an altitude of over 5,300 meters."],

  [398, 6, "How many days of pre-hospitalization expenses are covered under the Ayushman Bharat – Pradhan Mantri Jan Arogya Yojana?", ["3 days", "5 days", "7 days", "15 days"], 0, false, "The Ayushman Bharat – Pradhan Mantri Jan Arogya Yojana reimburses up to 3 days of pre-hospitalization diagnostic and medical expenses and up to 15 days of post-hospitalization care."],
  [399, 6, "On the recommendation of which committee was the National Stock Exchange of India set up?", ["Pherwani Committee", "Narasimham Committee", "Kelkar Committee", "Rangarajan Committee"], 0, false, "The National Stock Exchange of India was incorporated in 1992 on the recommendation of the High-Powered Study Group on Establishment of New Stock Exchanges headed by M. J. Pherwani."],
  [400, 6, "Who constitutes the State Finance Commission every five years under Article 243-I of the Constitution of India?", ["Governor of the State", "President of India", "Chief Minister of the State", "Union Finance Minister"], 0, false, "Under Article 243-I (and Article 243-Y) of the Constitution of India, the Governor of a state constitutes the State Finance Commission every five years to review the financial position of Panchayats and Municipalities."],
  [401, 6, "Under which Union Ministry does the Border Roads Organisation function?", ["Ministry of Defence", "Ministry of Home Affairs", "Ministry of Road Transport and Highways", "Ministry of Finance"], 0, false, "The Border Roads Organisation functions under the Ministry of Defence, constructing and maintaining strategic roads, bridges, and tunnels along India's frontiers."],
  [402, 6, "What do the first two digits of a Goods and Services Tax Identification Number denote?", ["State Code", "Permanent Account Number", "District Code", "Registration Year Code"], 0, false, "The first two digits of a 15-character Goods and Services Tax Identification Number represent the unique numeric State Code assigned to each Indian state and Union Territory."],
  [403, 6, "How many parliamentary sessions does the Lok Sabha normally convene in a year?", ["2 sessions", "3 sessions", "4 sessions", "1 session"], 1, false, "The Lok Sabha normally convenes three sessions each year—the Budget Session, the Monsoon Session, and the Winter Session—with no more than a six-month gap between two sessions."],
  [404, 6, "Who was the first Chief of Defence Staff of India?", ["General Bipin Rawat", "General Anil Chauhan", "General Manoj Mukund Naravane", "General Upendra Dwivedi"], 0, false, "General Bipin Rawat served as India's inaugural Chief of Defence Staff from January 2020 until December 2021."],
  [405, 6, "Which anti-corruption statutory body was originally established in 1964 (and received statutory status later) to advise the Central Government on vigilance matters?", ["Central Vigilance Commission", "Central Bureau of Investigation", "Union Public Service Commission", "Election Commission of India"], 0, false, "The Central Vigilance Commission was set up by the Government of India in February 1964 on the recommendations of the Santhanam Committee on Prevention of Corruption and was accorded statutory status in 2003."],
  [406, 6, "What does the acronym FSLRC stand for in Indian financial sector governance?", ["Financial Sector Legislative Reforms Commission", "Financial Sector Legal Reforms Council", "Fiscal Sector Legislative Reforms Commission", "Federal Sector Lending Reforms Committee"], 0, false, "FSLRC stands for Financial Sector Legislative Reforms Commission, constituted by the Ministry of Finance in 2011 under the chairmanship of Justice B. N. Srikrishna to rewrite and harmonize India's financial sector laws."],

  [414, 7, "Which Indian women boxers won Gold medals at the Asian Games (and World Championships)?", ["Nikhat Zareen", "Lovlina Borgohain", "Mary Kom", "Both Nikhat Zareen and Lovlina Borgohain"], 3, false, "Both Nikhat Zareen (two-time World Champion) and Lovlina Borgohain (Olympic Bronze medalist and World Champion) are premier Indian women boxers who have won Gold medals at major international multi-sport events."],

  [418, 7, "What is the core principle of 'Fair Trade' in global commerce?", ["Ethical trading standards ensuring farmers and producers receive fair prices and decent working conditions", "Completely tariff-free international trade without regulations", "High-frequency algorithmic stock market trading", "Interbank foreign exchange spot trading"], 0, false, "Fair Trade is an ethical trading partnership that seeks greater equity in international trade by guaranteeing fair prices, sustainable farming practices, and safe working conditions for marginalized producers and farmers."],
  [419, 7, "Which Union Ministry administers central agricultural welfare schemes such as Pradhan Mantri Kisan Samman Nidhi and Pradhan Mantri Fasal Bima Yojana?", ["Ministry of Agriculture and Farmers Welfare", "Ministry of Rural Development", "Ministry of Jal Shakti", "Ministry of Commerce and Industry"], 0, false, "The Ministry of Agriculture and Farmers Welfare is the nodal ministry responsible for formulating and implementing national agricultural production, crop insurance, and farmer income support schemes."],

  [421, 7, "Which is the largest National Park in India by geographical area?", ["Hemis National Park, Ladakh", "Jim Corbett National Park, Uttarakhand", "Kaziranga National Park, Assam", "Gir National Park, Gujarat"], 0, false, "Hemis National Park in Ladakh is India's largest National Park, spanning approximately 4,400 square kilometers in the trans-Himalayan region."],
  [422, 7, "Which peninsular river is famously known as 'Dakshin Ganga'?", ["Godavari", "Krishna", "Kaveri", "Narmada"], 0, false, "The Godavari River is called 'Dakshin Ganga' because of its vast basin area, length, and cultural significance across peninsular India."],

  [428, 7, "Which is India's highest lifetime achievement award in the field of Cinema?", ["Dadasaheb Phalke Award", "Bharat Ratna", "Padma Shri", "Arjuna Award"], 0, false, "Instituted in 1969 by the Government of India in honor of Dhundiraj Govind Phalke (the father of Indian cinema), the Dadasaheb Phalke Award is India's highest honor in cinema."],

let userAnswers = {};

function renderQuestions() {
  const filter = document.getElementById("pageFilter").value;
  const query = document.getElementById("searchBox").value.trim().toLowerCase();
  const root = document.getElementById("quizRoot");
  root.innerHTML = "";

  const filtered = RAW_DATA.filter(item => {
    const [qNum, page, qText, opts, correctIdx, isOutdated, exp] = item;
    if (filter === "flagged" && !isOutdated) return false;
    if (filter !== "all" && filter !== "flagged" && String(page) !== filter) return false;
    if (query) {
      const blob = (qNum + " " + qText + " " + opts.join(" ") + " " + exp).toLowerCase();
      if (!blob.includes(query)) return false;
    }
    return true;
  });

  if (filtered.length === 0) {
    root.innerHTML = "<p style='text-align:center;color:#64748b;padding:40px;'>No matching questions found.</p>";
    return;
  }

  filtered.forEach(item => {
    const [qNum, page, qText, opts, correctIdx, isOutdated, exp] = item;
    const card = document.createElement("div");
    card.className = "q-card";

    const answeredIdx = userAnswers[qNum];
    const isAnswered = answeredIdx !== undefined;

    let optionsHtml = "";
    const labels = ["A", "B", "C", "D"];
    opts.forEach((optText, idx) => {
      let cls = "opt-btn";
      if (isAnswered) {
        if (idx === correctIdx) cls += " correct";
        else if (idx === answeredIdx) cls += " wrong";
      }
      optionsHtml += `<button class="${cls}" ${isAnswered ? "disabled" : ""} onclick="selectOption(${qNum}, ${idx})"><strong>${labels[idx]})</strong> ${optText}</button>`;
    });

    const expClass = `explanation ${isAnswered ? "show" : ""} ${isOutdated ? "outdated" : ""}`;
    const statusLabel = isOutdated
      ? "Fact-Check Updated (November 2026 Verification) — Right Answer: " + labels[correctIdx] + ") " + opts[correctIdx]
      : "Right Answer: " + labels[correctIdx] + ") " + opts[correctIdx];

    card.innerHTML = `
      <div class="q-meta">
        <span><strong>Question #${qNum}</strong> &bull; Page ${page}</span>
        <span>${isOutdated ? '<span class="badge badge-amber">2026 Fact-Check Highlighted</span>' : 'Verified'}</span>
      </div>
      <div class="q-text">${qText}</div>
      <div class="options">${optionsHtml}</div>
      <div class="${expClass}" id="exp-${qNum}">
        <span class="exp-title">${statusLabel}</span>
        <div>${exp}</div>
      </div>
    `;
    root.appendChild(card);
  });

  updateScore();
}

function selectOption(qNum, chosenIdx) {
  userAnswers[qNum] = chosenIdx;
  renderQuestions();
}

function updateScore() {
  const keys = Object.keys(userAnswers);
  let correctCount = 0;
  keys.forEach(k => {
    const q = RAW_DATA.find(item => String(item[0]) === String(k));
    if (q && userAnswers[k] === q[4]) correctCount++;
  });
  document.getElementById("scoreBoard").textContent = `Answered: ${keys.length} / ${RAW_DATA.length} | Correct: ${correctCount}`;
}

function resetQuiz() {
  userAnswers = {};
  renderQuestions();
}

renderQuestions();
</script>
