const RAW_DATA = [
  // PAGE 1 (7 to 71)
  [7, 1, "Who is the current Governor of the Reserve Bank of India?", ["Sanjay Malhotra", "Shaktikanta Das", "Urjit Patel", "Raghuram Rajan"], 0, false, "Sanjay Malhotra assumed charge as the 26th Governor of the Reserve Bank of India in December 2024, succeeding Shaktikanta Das. Prior to this role, he served as the Revenue Secretary in the Ministry of Finance."],
  [8, 1, "In which year was the Reserve Bank of India Act enacted?", ["1934", "1935", "1949", "1955"], 0, false, "The Reserve Bank of India Act was enacted in 1934 to provide the statutory framework for establishing India's central bank. Based on this legislation, the Reserve Bank of India commenced operations on 1 April 1935."],
  [9, 1, "In which year was the Banking Regulation Act enacted in India?", ["1949", "1934", "1956", "1969"], 0, false, "The Banking Regulation Act was passed in 1949 to regulate all banking firms in India and empower the Reserve Bank of India to license and supervise banks. It was initially enacted as the Banking Companies Act, 1949."],
  [10, 1, "When was the State Bank of India founded after nationalizing the Imperial Bank of India?", ["1 July 1955", "1 April 1935", "19 July 1969", "12 July 1982"], 0, false, "The State Bank of India was established on 1 July 1955 through the State Bank of India Act, succeeding the Imperial Bank of India (founded in 1921). It is India's largest public sector commercial bank."],
  [11, 1, "Where is the headquarters of the State Bank of India located?", ["Mumbai", "New Delhi", "Kolkata", "Chennai"], 0, false, "The corporate headquarters of the State Bank of India is situated at Nariman Point in Mumbai, Maharashtra. It operates an extensive network of branches across India and overseas."],
  [12, 1, "Who is the Chairman of the State Bank of India?", ["Challa Sreenivasulu Setty", "Dinesh Kumar Khara", "Rajnish Kumar", "Arundhati Bhattacharya"], 0, false, "Challa Sreenivasulu Setty took charge as the Chairman of the State Bank of India in August 2024, succeeding Dinesh Kumar Khara. He previously served as the senior-most Managing Director of the bank."],
  [13, 1, "What is the official tagline of the State Bank of India?", ["Pure Banking Nothing Else", "Together We Can", "The Name You Can Bank Upon", "Good People to Bank With"], 0, false, "The widely recognized corporate tagline of the State Bank of India is 'Pure Banking Nothing Else'. Other major taglines include 'With You All The Way' and 'The Banker to Every Indian'."],
  [14, 1, "When was the National Bank for Agriculture and Rural Development founded?", ["12 July 1982", "2 April 1990", "1 July 1955", "1 January 1982"], 0, false, "The National Bank for Agriculture and Rural Development was established on 12 July 1982 on the recommendations of the B. Sivaraman Committee. It acts as the apex development financial institution for agriculture and rural development in India."],
  [15, 1, "Where is the headquarters of the National Bank for Agriculture and Rural Development located?", ["Mumbai", "Lucknow", "New Delhi", "Hyderabad"], 0, false, "The headquarters of the National Bank for Agriculture and Rural Development is located at Bandra Kurla Complex in Mumbai, Maharashtra. It supervises Regional Rural Banks and Cooperative Banks across India."],
  [16, 1, "Who is the Chairman of the National Bank for Agriculture and Rural Development?", ["Shaji K. V.", "Govinda Rajulu Chintala", "Harsh Kumar Bhanwala", "Manoj Mittal"], 0, false, "Shaji K. V. serves as the Chairman of the National Bank for Agriculture and Rural Development, having assumed office in December 2022. He previously worked as Deputy Managing Director of the institution."],
  [17, 1, "When was the Small Industries Development Bank of India founded?", ["2 April 1990", "12 July 1982", "9 July 1988", "12 April 1988"], 0, false, "The Small Industries Development Bank of India was established on 2 April 1990 under an Act of the Indian Parliament. It serves as the principal financial institution for the promotion, financing, and development of Micro, Small, and Medium Enterprises."],
  [18, 1, "Where is the headquarters of the Small Industries Development Bank of India located?", ["Lucknow", "Mumbai", "New Delhi", "Bengaluru"], 0, false, "The head office of the Small Industries Development Bank of India is located in Lucknow, Uttar Pradesh. It provides refinance facilities and direct credit support to small-scale industries nationwide."],
  [19, 1, "Who is the Chairman and Managing Director of the Small Industries Development Bank of India?", ["Manoj Mittal", "Sivasubramanian Ramann", "Mohammad Mustafa", "Shaji K. V."], 0, false, "Manoj Mittal serves as the Chairman and Managing Director of the Small Industries Development Bank of India. Before this appointment, he served as Managing Director of the Industrial Finance Corporation of India."],
  [20, 1, "In which year was the National Housing Bank founded?", ["1988", "1982", "1990", "1999"], 0, false, "The National Housing Bank was set up on 9 July 1988 under the National Housing Bank Act, 1987. It is wholly owned by the Government of India and acts as the apex institution for housing finance."],
  [21, 1, "Where is the headquarters of the National Housing Bank located?", ["New Delhi", "Mumbai", "Lucknow", "Hyderabad"], 0, false, "The headquarters of the National Housing Bank is located in New Delhi. It registers and supervises Housing Finance Companies and promotes inclusive housing credit."],
  [22, 1, "In which year was the Export-Import Bank of India founded?", ["1982", "1988", "1990", "1976"], 0, false, "The Export-Import Bank of India was established in 1982 under the Export-Import Bank of India Act, 1981. It finances, facilitates, and promotes India's international trade and cross-border investments."],
  [23, 1, "Where is the headquarters of the Export-Import Bank of India located?", ["Mumbai", "New Delhi", "Kolkata", "Chennai"], 0, false, "The headquarters of the Export-Import Bank of India is located at Maker Chambers in Mumbai, Maharashtra. It extends lines of credit to overseas financial institutions and sovereign governments."],
  [24, 1, "When was the Securities and Exchange Board of India founded, and when did it receive statutory status?", ["Founded 12 April 1988; Statutory status in 1992", "Founded 1992; Statutory status in 1995", "Founded 1982; Statutory status in 1988", "Founded 1999; Statutory status in 2000"], 0, false, "The Securities and Exchange Board of India was constituted as a non-statutory body on 12 April 1988 and received statutory powers on 30 January 1992 through the Securities and Exchange Board of India Act, 1992. It regulates securities and commodity markets in India."],
  [25, 1, "Where is the headquarters of the Securities and Exchange Board of India located?", ["Mumbai", "New Delhi", "Ahmedabad", "Kolkata"], 0, false, "The headquarters of the Securities and Exchange Board of India is located at Bandra Kurla Complex in Mumbai, Maharashtra. It also maintains regional offices in New Delhi, Kolkata, Chennai, and Ahmedabad."],
  [26, 1, "Who is the Chairman of the Securities and Exchange Board of India?", ["Tuhin Kanta Pandey", "Madhabi Puri Buch", "Ajay Tyagi", "Upendra Kumar Sinha"], 0, false, "Tuhin Kanta Pandey assumed charge as Chairman of the Securities and Exchange Board of India on 1 March 2025 for a three-year term, succeeding Madhabi Puri Buch. He previously served as Union Finance Secretary."],
  [27, 1, "In which year was the Insurance Regulatory and Development Authority of India founded?", ["1999", "2000", "1992", "2003"], 0, false, "The Insurance Regulatory and Development Authority of India was constituted in 1999 following the recommendations of the Malhotra Committee report and incorporated as a statutory body in April 2000. It regulates and promotes the insurance industry in India."],
  [28, 1, "Where is the headquarters of the Insurance Regulatory and Development Authority of India located?", ["Hyderabad", "Mumbai", "New Delhi", "Bengaluru"], 0, false, "The headquarters of the Insurance Regulatory and Development Authority of India is located in Hyderabad, Telangana, having shifted there from New Delhi in 2001. It oversees life, general, and health insurers."],
  [29, 1, "In which year was the Pension Fund Regulatory and Development Authority founded?", ["2003", "1999", "2008", "2014"], 0, false, "The Pension Fund Regulatory and Development Authority was established by the Government of India in 2003 to promote old-age income security and later gained statutory status under the 2013 Act. It administers the National Pension System and Atal Pension Yojana."],
  [30, 1, "Where is the headquarters of the Pension Fund Regulatory and Development Authority located?", ["New Delhi", "Mumbai", "Hyderabad", "Pune"], 0, false, "The headquarters of the Pension Fund Regulatory and Development Authority is located in New Delhi. It regulates pension funds and protects the interests of subscribers across India."],
  [31, 1, "What is the maximum deposit insurance coverage provided by the Deposit Insurance and Credit Guarantee Corporation per depositor per bank?", ["Rupees 5 Lakh", "Rupees 1 Lakh", "Rupees 2 Lakh", "Rupees 10 Lakh"], 0, false, "The Deposit Insurance and Credit Guarantee Corporation insures principal and interest up to a maximum limit of Rupees 5 Lakh per depositor per bank in the same right and capacity. This limit was raised from Rupees 1 Lakh in February 2020."],
  [32, 1, "The Deposit Insurance and Credit Guarantee Corporation is a wholly-owned subsidiary of which institution?", ["Reserve Bank of India", "State Bank of India", "Ministry of Finance", "National Bank for Agriculture and Rural Development"], 0, false, "The Deposit Insurance and Credit Guarantee Corporation is a wholly-owned subsidiary of the Reserve Bank of India established in 1978. It covers commercial banks, including Local Area Banks, Payments Banks, Small Finance Banks, and Regional Rural Banks."],
  [33, 1, "What is the Cash Reserve Ratio cited in the study material versus the current rate as of November 2026?", ["PDF states 4%; Current rate as of November 2026 is 3.00%", "PDF states 4%; Current rate is 4.50%", "PDF states 3%; Current rate is 4.00%", "PDF states 5%; Current rate is 3.50%"], 0, true, "UPDATED FACT-CHECK: The PDF lists Cash Reserve Ratio as 4%, whereas as per the Reserve Bank of India Monetary Policy in October–November 2026, the Cash Reserve Ratio is 3.00% of Net Demand and Time Liabilities. Banks must maintain this cash balance directly with the Reserve Bank of India."],
  [34, 1, "What is the current Statutory Liquidity Ratio required to be maintained by commercial banks?", ["18%", "15%", "20%", "4%"], 0, false, "The Statutory Liquidity Ratio is currently 18.00% of a bank's Net Demand and Time Liabilities. Banks maintain this reserve themselves in the form of liquid cash, gold, or approved government securities."],
  [35, 1, "What is the Policy Repo Rate given in the PDF versus the current rate as of November 2026?", ["PDF states 5.25%; Current rate as of November 2026 is 5.50%", "PDF states 5.25%; Current rate is 6.50%", "PDF states 6.00%; Current rate is 5.25%", "PDF states 5.50%; Current rate is 5.00%"], 0, true, "UPDATED FACT-CHECK: The PDF lists the Policy Repo Rate as 5.25%, whereas the Reserve Bank of India Monetary Policy Committee raised it by 25 basis points to 5.50% in October 2026 (with Standing Deposit Facility at 5.25%). Repo Rate is the rate at which the central bank lends short-term funds to commercial banks against government securities."],
  [36, 1, "What is the fixed Reverse Repo Rate of the Reserve Bank of India?", ["3.35%", "3.75%", "4.00%", "5.25%"], 0, false, "The fixed Reverse Repo Rate stands at 3.35%, while the Standing Deposit Facility rate (5.25%) serves as the operative floor of the Liquidity Adjustment Facility corridor. Reverse Repo is the rate at which the central bank absorbs liquidity from commercial banks."],
  [37, 1, "How is the Marginal Standing Facility rate calculated in relation to the Policy Repo Rate?", ["Policy Repo Rate plus 0.25%", "Policy Repo Rate minus 0.25%", "Policy Repo Rate plus 0.50%", "Equal to Policy Repo Rate"], 0, false, "The Marginal Standing Facility rate is pegged at 25 basis points (0.25%) above the Policy Repo Rate, standing at 5.75% when the Repo Rate is 5.50%. It allows scheduled commercial banks to borrow overnight funds in emergencies by dipping into their Statutory Liquidity Ratio portfolio."],
  [38, 1, "To which policy rate is the Bank Rate of the Reserve Bank of India aligned?", ["Same as Marginal Standing Facility Rate", "Same as Reverse Repo Rate", "Same as Cash Reserve Ratio", "Same as Standing Deposit Facility Rate"], 0, false, "The Bank Rate is aligned with the Marginal Standing Facility rate (currently 5.75%) and acts as the penal rate charged on banks for shortfalls in reserve requirements. It is the standard rate at which the Reserve Bank of India buys or rediscounts bills of exchange."],
  [39, 1, "Which lending benchmark system replaced the Base Rate system in India in April 2016?", ["Marginal Cost of Funds based Lending Rate", "Benchmark Prime Lending Rate", "External Benchmark Lending Rate", "Statutory Liquidity Ratio"], 0, false, "The Reserve Bank of India introduced the Marginal Cost of Funds based Lending Rate effective 1 April 2016 to replace the Base Rate system. It was designed to improve monetary policy transmission and bring transparency to bank lending rates."],
  [40, 1, "What is the full form of the banking acronym MCLR?", ["Marginal Cost of Funds based Lending Rate", "Minimum Cost of Funds based Lending Rate", "Marginal Credit of Funds based Loan Rate", "Monetary Cost of Funds based Lending Rate"], 0, false, "MCLR stands for Marginal Cost of Funds based Lending Rate, which is the minimum internal benchmark interest rate below which a bank cannot lend. It is calculated based on marginal cost of funds, operating costs, negative carry on Cash Reserve Ratio, and tenure premium."],
  [41, 1, "What is the Priority Sector Lending target for Domestic Scheduled Commercial Banks?", ["40% of Adjusted Net Bank Credit", "75% of Adjusted Net Bank Credit", "32% of Adjusted Net Bank Credit", "50% of Adjusted Net Bank Credit"], 0, false, "Domestic Scheduled Commercial Banks are mandated to lend 40% of their Adjusted Net Bank Credit or Credit Equivalent Amount of Off-Balance Sheet Exposure, whichever is higher, to priority sectors. Priority sectors include agriculture, micro-enterprises, education, housing, and weaker sections."],
  [42, 1, "What is the Priority Sector Lending target for Foreign Banks with 20 branches and above in India?", ["40% of Adjusted Net Bank Credit", "32% of Adjusted Net Bank Credit", "75% of Adjusted Net Bank Credit", "25% of Adjusted Net Bank Credit"], 0, false, "Foreign banks operating 20 or more branches in India must achieve a Priority Sector Lending target of 40% of Adjusted Net Bank Credit, on par with domestic banks. Foreign banks with fewer than 20 branches also have a 40% target with flexible sub-targets."],
  [43, 1, "What is the overall Priority Sector Lending target for Small Finance Banks?", ["75% of Adjusted Net Bank Credit", "40% of Adjusted Net Bank Credit", "50% of Adjusted Net Bank Credit", "60% of Adjusted Net Bank Credit"], 0, false, "Small Finance Banks are required to extend 75% of their Adjusted Net Bank Credit to sectors eligible for classification as Priority Sector Lending. This high mandate ensures credit penetration among unserved and underserved segments."],
  [44, 1, "What is the overall Priority Sector Lending target for Regional Rural Banks?", ["75% of Adjusted Net Bank Credit", "40% of Adjusted Net Bank Credit", "60% of Adjusted Net Bank Credit", "50% of Adjusted Net Bank Credit"], 0, false, "Regional Rural Banks have an overall Priority Sector Lending target of 75% of their total outstanding advances. This requirement reinforces their core mandate of supporting rural artisans, small farmers, and village industries."],
  [45, 1, "What is the Priority Sector Lending sub-target allocated to Agriculture for domestic banks?", ["18% of Adjusted Net Bank Credit", "10% of Adjusted Net Bank Credit", "12% of Adjusted Net Bank Credit", "7.5% of Adjusted Net Bank Credit"], 0, false, "Within the overall 40% Priority Sector Lending mandate, domestic commercial banks must allocate at least 18% of Adjusted Net Bank Credit to the Agriculture sector. This covers farm credit, agriculture infrastructure, and ancillary activities."],
  [46, 1, "What is the Priority Sector Lending sub-target for Small and Marginal Farmers within the agriculture quota?", ["10% of Adjusted Net Bank Credit", "8% of Adjusted Net Bank Credit", "12% of Adjusted Net Bank Credit", "7.5% of Adjusted Net Bank Credit"], 0, false, "Within the 18% agriculture lending target, a dedicated sub-target of 10% of Adjusted Net Bank Credit is prescribed for Small and Marginal Farmers. Marginal farmers hold up to 1 hectare of land, while small farmers hold between 1 and 2 hectares."],
  [47, 1, "What is the Priority Sector Lending sub-target prescribed for Micro Enterprises?", ["7.5% of Adjusted Net Bank Credit", "10% of Adjusted Net Bank Credit", "12% of Adjusted Net Bank Credit", "5% of Adjusted Net Bank Credit"], 0, false, "Domestic commercial banks and Small Finance Banks must allocate at least 7.5% of their Adjusted Net Bank Credit to Micro Enterprises. This ensures steady working capital and term loan access for grassroots businesses."],
  [48, 1, "What is the Priority Sector Lending sub-target allocated to Weaker Sections for domestic banks?", ["12% of Adjusted Net Bank Credit", "10% of Adjusted Net Bank Credit", "15% of Adjusted Net Bank Credit", "7.5% of Adjusted Net Bank Credit"], 0, false, "The Priority Sector Lending sub-target for Weaker Sections is 12% of Adjusted Net Bank Credit for domestic commercial banks (and 15% for Regional Rural Banks). Beneficiaries include Scheduled Castes, Scheduled Tribes, self-help groups, and distressed farmers."],
  [49, 1, "After how many days of overdue interest or principal installment is a loan classified as a Non-Performing Asset?", ["90 days", "30 days", "60 days", "180 days"], 0, false, "A loan or advance becomes a Non-Performing Asset when interest or principal installment remains overdue for a period of more than 90 days. Once classified as non-performing, banks stop accruing interest income on that account."],
  [50, 1, "For what duration does a Non-Performing Asset remain classified as a Sub-standard Asset?", ["Up to 12 months", "More than 12 months", "Up to 90 days", "Up to 24 months"], 0, false, "A Sub-standard Asset is one which has remained a Non-Performing Asset for a period less than or equal to 12 months. Such assets carry well-defined credit weaknesses that jeopardize the liquidation of the debt."],
  [51, 1, "When is a Non-Performing Asset classified into the Doubtful Asset category?", ["When it remains in the sub-standard category for more than 12 months", "When it is overdue for 90 days", "When it is declared uncollectible by auditors", "When it is overdue for 6 months"], 0, false, "An asset is classified as a Doubtful Asset if it has remained in the sub-standard category for a period exceeding 12 months. Full collection or liquidation in such accounts is highly questionable and improbable."],
  [52, 1, "How is a Loss Asset defined under Reserve Bank of India asset classification norms?", ["An uncollectible asset identified by the bank, auditors, or Reserve Bank of India inspection", "A loan overdue for 90 days", "A Non-Performing Asset up to 12 months", "A restructured standard loan"], 0, false, "A Loss Asset is one where loss has been identified by the bank, internal or external auditors, or the Reserve Bank of India inspection, but the amount has not been written off wholly. Such an asset is considered uncollectible and of negligible salvage value."],
  [53, 1, "In which year was the Securitisation and Reconstruction of Financial Assets and Enforcement of Security Interest Act enacted?", ["2002", "2016", "1993", "2005"], 0, false, "The Securitisation and Reconstruction of Financial Assets and Enforcement of Security Interest Act was enacted in 2002. It empowers banks and financial institutions to auction residential or commercial collateral properties to recover loans without court intervention."],
  [54, 1, "In which year was the Insolvency and Bankruptcy Code enacted in India?", ["2016", "2002", "2014", "2019"], 0, false, "The Insolvency and Bankruptcy Code was enacted in 2016 to consolidate and amend laws relating to reorganization and insolvency resolution of corporate persons, partnership firms, and individuals in a time-bound manner."],
  [55, 1, "What is the maximum overall timeline permitted for completing the Corporate Insolvency Resolution Process under the Insolvency and Bankruptcy Code?", ["330 days", "180 days", "270 days", "90 days"], 0, false, "Under the Insolvency and Bankruptcy Code (Amendment) Act, 2019, the Corporate Insolvency Resolution Process must be mandatorily completed within 330 days, including any extension granted and time taken in legal proceedings."],
  [56, 1, "Which quasi-judicial body deals with corporate insolvency resolution and company law disputes in India?", ["National Company Law Tribunal", "Debt Recovery Tribunal", "Securities Appellate Tribunal", "National Consumer Disputes Redressal Commission"], 0, false, "The National Company Law Tribunal acts as the Adjudicating Authority for insolvency resolution and liquidation of corporate persons under the Insolvency and Bankruptcy Code, 2016. Appeals against its orders lie before the National Company Law Appellate Tribunal."],
  [57, 1, "What is the numerical range of a Credit Information Bureau (India) Limited credit score?", ["300 to 900", "100 to 1000", "0 to 500", "200 to 800"], 0, false, "Credit Information Bureau (India) Limited calculates credit scores on a three-digit scale ranging from 300 to 900. A higher score reflects stronger creditworthiness and responsible repayment behavior."],
  [58, 1, "What score threshold is generally considered a good Credit Information Bureau (India) Limited credit score by lenders?", ["750 and above", "500 and above", "600 and above", "450 and above"], 0, false, "A credit score of 750 or above is widely regarded by banks and non-banking financial companies as an ideal credit score. Applicants with scores above 750 enjoy faster loan approvals and competitive interest rates."],
  [59, 1, "In which year was the National Electronic Funds Transfer system started in India?", ["2005", "2010", "2016", "2008"], 0, false, "The National Electronic Funds Transfer system was introduced by the Reserve Bank of India in November 2005. Since December 2019, it operates 24 hours a day, 7 days a week across 48 half-hourly settlement batches."],
  [60, 1, "What is the minimum transaction limit for Real Time Gross Settlement in India?", ["Rupees 2 Lakh", "Rupees 1 Lakh", "Rupees 5 Lakh", "Rupees 50,000"], 0, false, "The minimum amount to be remitted through Real Time Gross Settlement is Rupees 2 Lakh, with no upper or maximum ceiling. It settles high-value interbank and customer transactions individually on a real-time basis."],
  [61, 1, "What is the maximum per-transaction limit for Immediate Payment Service?", ["Rupees 5 Lakh", "Rupees 2 Lakh", "Rupees 1 Lakh", "Rupees 10 Lakh"], 0, false, "The Reserve Bank of India increased the per-transaction limit for Immediate Payment Service from Rupees 2 Lakh to Rupees 5 Lakh. Operated by the National Payments Corporation of India, it enables instant 24×7 electronic fund transfers."],
  [62, 1, "In which year was the Unified Payments Interface launched by the National Payments Corporation of India?", ["2016", "2014", "2012", "2018"], 0, false, "The Unified Payments Interface was launched in April 2016 by the National Payments Corporation of India. It powers multiple bank accounts into a single mobile application, merging several banking features and seamless merchant payments."],
  [63, 1, "When was the National Payments Corporation of India founded and where is its headquarters?", ["Founded in 2008; Headquarters in Mumbai", "Founded in 2016; Headquarters in New Delhi", "Founded in 2005; Headquarters in Bengaluru", "Founded in 2010; Headquarters in Hyderabad"], 0, false, "The National Payments Corporation of India was incorporated in December 2008 as a not-for-profit organization under Section 8 of the Companies Act, with its headquarters in Mumbai. It serves as the umbrella organization for operating retail payments and settlement systems in India."],
  [64, 1, "Who is the Managing Director and Chief Executive Officer of the National Payments Corporation of India?", ["Dilip Asbe", "A. P. Hota", "Biswamohan Mahapatra", "Ajay Kumar Choudhary"], 0, false, "Dilip Asbe serves as the Managing Director and Chief Executive Officer of the National Payments Corporation of India. He played a pivotal role in architecting and scaling the Unified Payments Interface platform."],
  [65, 1, "When was the Bharat Interface for Money mobile application launched?", ["December 2016", "April 2016", "August 2014", "November 2017"], 0, false, "The Bharat Interface for Money mobile application was launched by Prime Minister Narendra Modi on 30 December 2016. Developed by the National Payments Corporation of India, it facilitates direct bank-to-bank payments using the Unified Payments Interface."],
  [66, 1, "In which year was the domestic RuPay card payment network launched in India?", ["2012", "2016", "2008", "2014"], 0, false, "RuPay, India's indigenous card payment network, was conceived and launched by the National Payments Corporation of India in March 2012. It fulfills the Reserve Bank of India's vision of a domestic, open-loop multilateral payment system."],
  [67, 1, "What is the full form of the payment system NACH?", ["National Automated Clearing House", "National Automatic Credit Hub", "National Account Clearing House", "National Automated Cash Handling"], 0, false, "NACH stands for National Automated Clearing House, a centralized web-based payment solution operated by the National Payments Corporation of India. It consolidated multiple regional Electronic Clearing Service systems across the country."],
  [68, 1, "For what primary purpose is the National Automated Clearing House used?", ["Bulk recurring payments such as salaries, Equated Monthly Installments, pensions, and subsidies", "High-value real-time gross interbank settlements", "International cross-border wire transfers", "Issuing physical demand drafts"], 0, false, "The National Automated Clearing House is designed for high-volume, repetitive electronic transactions like salary disbursements, dividend payouts, pensions, utility bill collections, and loan Equated Monthly Installments."],
  [69, 1, "What is the full form of the cheque clearing mechanism CTS?", ["Cheque Truncation System", "Central Transaction System", "Cheque Transfer Service", "Clearing Truncation Standard"], 0, false, "CTS stands for Cheque Truncation System, an online image-based cheque clearing process implemented by the Reserve Bank of India. It eliminates the physical movement of paper cheques from the presenting bank to the drawee bank branch."],
  [70, 1, "What is the full form of MICR printed at the bottom of bank cheques?", ["Magnetic Ink Character Recognition", "Magnetic Internal Code Reader", "Machine Ink Character Recognition", "Magnetic Identification Code Registry"], 0, false, "MICR stands for Magnetic Ink Character Recognition, a 9-digit numeric code printed using special magnetic ink at the bottom of cheques. The first three digits represent the city, the next three represent the bank, and the last three identify the branch."],
  [71, 1, "How many alphanumeric characters does an Indian Financial System Code contain, and what is its structure?", ["11 characters (4 Bank code + 0 + 6 Branch code)", "9 digits (3 City + 3 Bank + 3 Branch)", "8 or 11 characters", "15 alphanumeric characters"], 0, false, "The Indian Financial System Code is an 11-character alphanumeric code assigned by the Reserve Bank of India to identify bank branches participating in electronic fund transfers. Its first four characters denote the bank, the fifth character is always zero, and the last six characters specify the branch."],

  // PAGE 2 (72 to 132)
  [72, 2, "How many characters does a Society for Worldwide Interbank Financial Telecommunication code contain?", ["8 or 11 characters", "11 characters only", "9 digits", "12 characters"], 0, false, "A Society for Worldwide Interbank Financial Telecommunication code (also known as a Bank Identifier Code) consists of either 8 or 11 alphanumeric characters. An 8-character code identifies the primary head office, while an 11-character code specifies a particular branch."],
  [73, 2, "What do the first two digits of a 15-digit Goods and Services Tax Identification Number denote?", ["State Code", "Permanent Account Number", "Entity Number", "Check Digit"], 0, false, "The Goods and Services Tax Identification Number is a 15-character alphanumeric identifier in which the first two digits represent the State Code as per the Indian Census 2011. Characters 3 to 12 contain the taxpayer's Permanent Account Number."],
  [74, 2, "In a 10-character Permanent Account Number, what does the fourth character denote?", ["Status of the holder (for example, P stands for Individual)", "First letter of the holder's surname", "State of registration", "Year of issuance"], 0, false, "The fourth character of a 10-character Permanent Account Number indicates the category or status of the taxpayer, such as 'P' for Individual, 'C' for Company, 'F' for Firm, and 'T' for Trust. The fifth character represents the first letter of the holder's surname or entity name."],
  [75, 2, "Which statutory authority issues the 12-digit Aadhaar unique identification number, and in which year was it established?", ["Unique Identification Authority of India (2009)", "National Informatics Centre (2005)", "Registrar General of India (2011)", "Reserve Bank of India (2008)"], 0, false, "Aadhaar is issued by the Unique Identification Authority of India, which was established by the Government of India in January 2009 and later given statutory backing under the Aadhaar Act, 2016. Each Aadhaar number is a random 12-digit biometric and demographic identifier."],
  [76, 2, "Where is the headquarters of the Unique Identification Authority of India located?", ["New Delhi", "Mumbai", "Bengaluru", "Hyderabad"], 0, false, "The headquarters of the Unique Identification Authority of India is located in New Delhi. It also operates eight regional offices across major Indian cities to manage enrollment and authentication services."],
  [77, 2, "What is the full form of KYC in banking compliance?", ["Know Your Customer", "Keep Your Credit", "Know Your Capital", "Key Yield Calculation"], 0, false, "KYC stands for Know Your Customer, a mandatory regulatory due diligence process used by banks and financial institutions to verify the identity and address of clients. It helps prevent identity theft, financial fraud, and illicit fund flows."],
  [78, 2, "What is the full form of AML in financial regulation?", ["Anti-Money Laundering", "Asset Management Liability", "Automated Monetary Ledger", "Anti-Market Liquidation"], 0, false, "AML stands for Anti-Money Laundering, referring to the laws, regulations, and procedures designed to prevent criminals from disguising illegally obtained funds as legitimate income. Banks must report suspicious transactions under these frameworks."],
  [79, 2, "In which year was the Prevention of Money Laundering Act enacted, and when did it come into force?", ["Enacted in 2002; Effective from 2005", "Enacted in 2005; Effective from 2008", "Enacted in 2000; Effective from 2002", "Enacted in 2016; Effective from 2017"], 0, false, "The Prevention of Money Laundering Act was enacted in 2002 to combat money laundering and provide for confiscation of property derived from criminal activities. Its provisions came into force on 1 July 2005."],
  [80, 2, "Under which Union Ministry does the Financial Intelligence Unit – India operate?", ["Ministry of Finance", "Ministry of Home Affairs", "Ministry of Corporate Affairs", "Ministry of External Affairs"], 0, false, "The Financial Intelligence Unit – India operates under the Department of Revenue, Ministry of Finance, Government of India. Set up in November 2004, it is the central national agency responsible for receiving, analyzing, and disseminating suspicious financial transaction reports."],
  [81, 2, "Who was appointed as the Director of the Financial Intelligence Unit – India in July 2026?", ["Satya Pal Kumar", "Pankaj Kumar Mishra", "Vivek Aggarwal", "Sanjay Kumar Mishra"], 0, false, "Indian Revenue Service officer Satya Pal Kumar was appointed as Director of the Financial Intelligence Unit – India in July 2026, succeeding Pankaj Kumar Mishra. He leads national financial intelligence efforts against money laundering and terror financing."],
  [82, 2, "What are the three sequential stages of Money Laundering?", ["Placement, Layering, and Integration", "Collection, Transfer, and Withdrawal", "Deposit, Lending, and Recovery", "Origination, Securitization, and Settlement"], 0, false, "Money laundering typically occurs in three stages: Placement (introducing illicit cash into the financial system), Layering (concealing the source through complex transactions), and Integration (reintroducing laundered funds into the legitimate economy)."],
  [83, 2, "What is the minimum paid-up voting equity capital required to set up a Small Finance Bank in India?", ["Rupees 200 Crore", "Rupees 100 Crore", "Rupees 500 Crore", "Rupees 300 Crore"], 0, false, "Under Reserve Bank of India guidelines for on-tap licensing, the minimum paid-up voting equity capital requirement for a Small Finance Bank is Rupees 200 Crore. For Urban Co-operative Banks transitioning voluntarily into a Small Finance Bank, the initial requirement is Rupees 100 Crore, rising to Rupees 200 Crore within five years."],
  [84, 2, "What is the maximum end-of-day deposit balance allowed per individual customer in a Payments Bank?", ["Rupees 2 Lakh", "Rupees 1 Lakh", "Rupees 5 Lakh", "Rupees 50,000"], 0, false, "The Reserve Bank of India enhanced the maximum end-of-day deposit limit per individual customer for Payments Banks from Rupees 1 Lakh to Rupees 2 Lakh. Payments Banks accept demand deposits and provide remittance services."],
  [85, 2, "Are Payments Banks permitted to undertake lending activities or issue credit cards in India?", ["No, they cannot lend or issue credit cards", "Yes, up to Rupees 50,000", "Yes, only to Priority Sector borrowers", "Yes, without any restriction"], 0, false, "Payments Banks are strictly prohibited from undertaking lending activities or issuing credit cards under Reserve Bank of India licensing norms. They can issue Automated Teller Machine or debit cards, accept deposits up to Rupees 2 Lakh, and distribute third-party financial products."],
  [86, 2, "Which entity became the first Payments Bank to commence live operations in India?", ["Airtel Payments Bank", "India Post Payments Bank", "Paytm Payments Bank", "Fino Payments Bank"], 0, false, "Airtel Payments Bank became the first Payments Bank in India to roll out live banking services, launching pilot operations in November 2016 and nationwide services in January 2017."],
  [87, 2, "Which bank became the first Small Finance Bank to start operations in India in 2016?", ["Capital Small Finance Bank", "AU Small Finance Bank", "Equitas Small Finance Bank", "Ujjivan Small Finance Bank"], 0, false, "Capital Small Finance Bank (formerly Capital Local Area Bank) became India's first Small Finance Bank when it commenced operations on 24 April 2016 in Jalandhar, Punjab."],
  [88, 2, "In which year was the Regional Rural Banks Act enacted in India?", ["1976", "1975", "1982", "1969"], 0, false, "The Regional Rural Banks Act was passed in 1976 to replace an ordinance promulgated on 26 September 1975, following the recommendations of the Narasimham Working Group. Prathama Bank was the first Regional Rural Bank established in India."],
  [89, 2, "What is the statutory shareholding pattern of a Regional Rural Bank among the Central Government, State Government, and Sponsor Bank?", ["Central Government 50%, State Government 15%, Sponsor Bank 35%", "Central Government 35%, State Government 15%, Sponsor Bank 50%", "Central Government 50%, State Government 25%, Sponsor Bank 25%", "Central Government 60%, State Government 20%, Sponsor Bank 20%"], 0, false, "The issued capital of a Regional Rural Bank is subscribed in the fixed statutory ratio of 50% by the Central Government, 15% by the concerned State Government, and 35% by the Sponsor Commercial Bank."],
  [90, 2, "In which year was the Lead Bank Scheme introduced by the Reserve Bank of India?", ["1969", "1975", "1982", "1991"], 0, false, "The Lead Bank Scheme was introduced by the Reserve Bank of India in December 1969 based on the recommendations of the Gadgil Study Group and Nariman Committee. Under this scheme, a designated bank coordinates credit and banking development in each district."],
  [91, 2, "Who chairs the State Level Bankers' Committee meetings in an Indian state?", ["Chairman or Managing Director of the Convenor Bank", "Governor of the State", "Regional Director of Reserve Bank of India", "State Finance Minister"], 0, false, "The State Level Bankers' Committee is an apex inter-institutional forum at the state level chaired by the Chairman and Managing Director or Executive Director of the designated Convenor Bank. It coordinates the implementation of government development programs and credit plans."],
  [92, 2, "When was the Pradhan Mantri Jan Dhan Yojana launched?", ["28 August 2014", "2 October 2014", "9 May 2015", "8 April 2015"], 0, false, "The Pradhan Mantri Jan Dhan Yojana, India's flagship National Mission for Financial Inclusion, was launched by Prime Minister Narendra Modi on 28 August 2014. It provides universal access to basic savings bank accounts, RuPay debit cards, and micro-insurance."],
  [93, 2, "What is the maximum overdraft facility limit available to eligible account holders under the Pradhan Mantri Jan Dhan Yojana?", ["Rupees 10,000", "Rupees 5,000", "Rupees 20,000", "Rupees 2,000"], 0, false, "Under the Pradhan Mantri Jan Dhan Yojana, the overdraft facility limit was doubled from Rupees 5,000 to Rupees 10,000 for eligible account holders after six months of satisfactory account operation. An overdraft of up to Rupees 2,000 is available without strict conditions."],
  [94, 2, "What is the accidental insurance cover provided with RuPay debit cards issued under the Pradhan Mantri Jan Dhan Yojana?", ["Rupees 2 Lakh", "Rupees 1 Lakh", "Rupees 5 Lakh", "Rupees 50,000"], 0, false, "For Pradhan Mantri Jan Dhan Yojana accounts opened after 28 August 2018, the accidental death insurance cover on RuPay debit cards was enhanced from Rupees 1 Lakh to Rupees 2 Lakh."],
  [95, 2, "When was the Pradhan Mantri Micro Units Development and Refinance Agency Yojana launched?", ["8 April 2015", "28 August 2014", "16 January 2016", "5 April 2016"], 0, false, "The Pradhan Mantri Micro Units Development and Refinance Agency Yojana was launched on 8 April 2015 to provide collateral-free institutional credit to non-corporate, non-farm small and micro enterprises."],
  [96, 2, "What is the loan limit under the 'Shishu' category of the Pradhan Mantri Micro Units Development and Refinance Agency Yojana?", ["Up to Rupees 50,000", "Above Rupees 50,000 and up to Rupees 5 Lakh", "Above Rupees 5 Lakh and up to Rupees 10 Lakh", "Above Rupees 10 Lakh and up to Rupees 20 Lakh"], 0, false, "The 'Shishu' category under the Micro Units Development and Refinance Agency scheme covers loans up to Rupees 50,000. It is aimed at nascent entrepreneurs and micro businesses just starting their operations."],
  [97, 2, "What is the loan range under the 'Kishore' category of the Pradhan Mantri Micro Units Development and Refinance Agency Yojana?", ["Above Rupees 50,000 and up to Rupees 5 Lakh", "Up to Rupees 50,000", "Above Rupees 5 Lakh and up to Rupees 10 Lakh", "Above Rupees 10 Lakh and up to Rupees 20 Lakh"], 0, false, "The 'Kishore' category provides loans ranging from above Rupees 50,000 up to Rupees 5 Lakh. It supports existing small enterprises seeking funds to expand equipment or working capital."],
  [98, 2, "What is the loan range under the 'Tarun' category of the Pradhan Mantri Micro Units Development and Refinance Agency Yojana?", ["Above Rupees 5 Lakh and up to Rupees 10 Lakh", "Above Rupees 50,000 and up to Rupees 5 Lakh", "Above Rupees 10 Lakh and up to Rupees 20 Lakh", "Up to Rupees 50,000"], 0, false, "The 'Tarun' category covers loans above Rupees 5 Lakh and up to Rupees 10 Lakh for established micro and small enterprises looking for significant business expansion."],
  [99, 2, "What is the loan range introduced in 2024 under the 'Tarun Plus' category of the Pradhan Mantri Micro Units Development and Refinance Agency Yojana?", ["Above Rupees 10 Lakh and up to Rupees 20 Lakh", "Above Rupees 5 Lakh and up to Rupees 10 Lakh", "Above Rupees 20 Lakh and up to Rupees 50 Lakh", "Up to Rupees 10 Lakh"], 0, false, "Announced in the Union Budget 2024–25 and notified in October 2024, the 'Tarun Plus' category offers loans above Rupees 10 Lakh and up to Rupees 20 Lakh for entrepreneurs who have previously availed and successfully repaid loans under the Tarun category."],
  [100, 2, "What is the composite loan range provided under the Stand-Up India Scheme (marked missing in PDF)?", ["Rupees 10 Lakh to Rupees 1 Crore", "Rupees 50,000 to Rupees 10 Lakh", "Rupees 1 Lakh to Rupees 50 Lakh", "Rupees 25 Lakh to Rupees 5 Crore"], 0, true, "UPDATED FACT-CHECK: The PDF leaves the answer blank ('[Answer not provided]'). Under the Stand-Up India Scheme launched on 5 April 2016, composite bank loans between Rupees 10 Lakh and Rupees 1 Crore are facilitated to at least one Scheduled Caste or Scheduled Tribe borrower and at least one Woman borrower per bank branch for setting up a greenfield enterprise."],
  [101, 2, "When and where was the Ayushman Bharat – Pradhan Mantri Jan Arogya Yojana launched?", ["23 September 2018 in Ranchi, Jharkhand", "15 August 2018 in New Delhi", "2 October 2018 in Varanasi", "14 April 2018 in Bijapur, Chhattisgarh"], 0, false, "The Ayushman Bharat – Pradhan Mantri Jan Arogya Yojana was launched by Prime Minister Narendra Modi on 23 September 2018 in Ranchi, Jharkhand. It is the world's largest publicly funded health assurance scheme."],
  [102, 2, "What is the annual health insurance coverage provided per eligible family under the Ayushman Bharat – Pradhan Mantri Jan Arogya Yojana?", ["Rupees 5 Lakh per family per year", "Rupees 2 Lakh per family per year", "Rupees 10 Lakh per family per year", "Rupees 3 Lakh per family per year"], 0, false, "The Ayushman Bharat – Pradhan Mantri Jan Arogya Yojana provides cashless health coverage of up to Rupees 5 Lakh per family per year for secondary and tertiary care hospitalization across empaneled public and private hospitals."],
  [103, 2, "How many days of pre-hospitalization and post-hospitalization expenses are covered under the Ayushman Bharat – Pradhan Mantri Jan Arogya Yojana?", ["3 days pre-hospitalization and 15 days post-hospitalization", "7 days pre-hospitalization and 30 days post-hospitalization", "5 days pre-hospitalization and 10 days post-hospitalization", "15 days pre-hospitalization and 30 days post-hospitalization"], 0, false, "The Ayushman Bharat – Pradhan Mantri Jan Arogya Yojana covers medical expenses incurred up to 3 days prior to hospitalization and up to 15 days post-hospitalization, including diagnostics and medicines."],
  [104, 2, "When was the Ayushman Bharat Digital Mission launched nationwide?", ["27 September 2021", "23 September 2018", "15 August 2020", "1 July 2021"], 0, false, "The Ayushman Bharat Digital Mission was launched nationwide on 27 September 2021 to create an integrated digital health infrastructure in India, providing citizens with a unique Ayushman Bharat Health Account number."],
  [105, 2, "When was the Pradhan Mantri Surya Ghar: Muft Bijli Yojana launched?", ["February 2024", "January 2023", "August 2024", "April 2022"], 0, false, "The Pradhan Mantri Surya Ghar: Muft Bijli Yojana was launched by Prime Minister Narendra Modi in February 2024 to promote residential rooftop solar installations across India and provide up to 300 units of free electricity per month."],
  [106, 2, "What is the maximum central financial subsidy provided for rooftop solar installation under the Pradhan Mantri Surya Ghar: Muft Bijli Yojana?", ["Up to Rupees 78,000", "Up to Rupees 50,000", "Up to Rupees 1,00,000", "Up to Rupees 30,000"], 0, false, "Under the Pradhan Mantri Surya Ghar: Muft Bijli Yojana, households receive a subsidy of Rupees 30,000 for 1 kilowatt, Rupees 60,000 for 2 kilowatts, and a maximum cap of Rupees 78,000 for rooftop solar systems of 3 kilowatts or higher."],
  [107, 2, "What is the household installation target and timeline under the Pradhan Mantri Surya Ghar: Muft Bijli Yojana?", ["1 Crore households by March 2027", "50 Lakh households by 2026", "2 Crore households by 2030", "1 Crore households by 2025"], 0, false, "The Pradhan Mantri Surya Ghar: Muft Bijli Yojana aims to install rooftop solar panels in 1 Crore residential households across India by March 2027, backed by a total financial outlay of Rupees 75,021 Crore."],
  [108, 2, "In which year was the Pradhan Mantri Awas Yojana (Urban) launched?", ["2015", "2016", "2014", "2017"], 0, false, "The Pradhan Mantri Awas Yojana (Urban) was launched on 25 June 2015 by the Ministry of Housing and Urban Affairs to address the urban housing shortage among Economically Weaker Sections, Low Income Groups, and Middle Income Groups."],
  [109, 2, "In which year was the Pradhan Mantri Awas Yojana (Gramin) launched?", ["2016", "2015", "2014", "2018"], 0, false, "The Pradhan Mantri Awas Yojana (Gramin) was launched on 20 November 2016, restructuring the erstwhile Indira Awaas Yojana to achieve the goal of 'Housing for All' in rural areas."],
  [110, 2, "What was the initial rural housing construction target under the Pradhan Mantri Awas Yojana (Gramin) mentioned in the material?", ["2.95 Crore houses", "1 Crore houses", "5 Crore houses", "1.5 Crore houses"], 0, false, "The original target under the Pradhan Mantri Awas Yojana (Gramin) was the construction of 2.95 Crore pucca houses with basic amenities, which was subsequently expanded in 2024 to support 2 Crore additional rural houses over five years."],
  [111, 2, "When was the Swachh Bharat Mission launched?", ["2 October 2014", "15 August 2014", "28 August 2014", "25 December 2014"], 0, false, "The Swachh Bharat Mission was launched nationwide on 2 October 2014 on the birth anniversary of Mahatma Gandhi to eliminate open defecation and improve solid waste management across rural and urban India."],
  [112, 2, "What is the implementation period of Swachh Bharat Mission (Urban) 2.0?", ["2021 to 2026", "2019 to 2024", "2020 to 2025", "2022 to 2027"], 0, false, "Launched on 1 October 2021, Swachh Bharat Mission 2.0 is implemented over a five-year period from 2021 to 2026 with the vision of making all Indian cities 'Garbage Free' and ensuring complete wastewater management."],
  [113, 2, "When was the Jal Jeevan Mission announced and launched?", ["15 August 2019", "2 October 2019", "22 March 2019", "15 August 2018"], 0, false, "The Jal Jeevan Mission was announced by Prime Minister Narendra Modi from the Red Fort on 15 August 2019 to provide safe and adequate drinking water through individual household tap connections across rural India."],
  [114, 2, "What is the core slogan and objective of the Jal Jeevan Mission?", ["Har Ghar Nal Se Jal (Functional Household Tap Connection to every rural home)", "Per Drop More Crop", "Catch the Rain", "Clean Ganga Clean India"], 0, false, "The Jal Jeevan Mission operates under the motto 'Har Ghar Nal Se Jal', aiming to supply at least 55 liters of potable water per capita per day to every rural household through functional tap connections."],
  [115, 2, "What is the full form of the government initiative GOBARdhan?", ["Galvanizing Organic Bio-Agro Resources Dhan", "Green Organic Bio-Agro Rural Dhan", "Government Organic Bio-Agricultural Resources Development", "Generating Organic Bio-Agro Renewable Dhan"], 0, false, "GOBARdhan stands for Galvanizing Organic Bio-Agro Resources Dhan, an umbrella initiative aimed at converting cattle dung, agricultural residue, and organic waste into compressed biogas and organic bio-fertilizer."],
  [116, 2, "Which Union Ministry serves as the nodal ministry for coordinating the GOBARdhan initiative?", ["Ministry of Jal Shakti", "Ministry of New and Renewable Energy", "Ministry of Agriculture and Farmers Welfare", "Ministry of Rural Development"], 0, false, "The Department of Drinking Water and Sanitation under the Ministry of Jal Shakti acts as the nodal coordinating department for the GOBARdhan initiative, working alongside multiple partner ministries."],
  [117, 2, "When was the Pradhan Mantri Kisan Samman Nidhi scheme launched?", ["February 2019", "April 2018", "August 2019", "January 2020"], 0, false, "The Pradhan Mantri Kisan Samman Nidhi scheme was launched on 24 February 2019 in Gorakhpur, Uttar Pradesh (effective from December 2018) to provide direct income support to landholding farmer families across India."],
  [118, 2, "How much annual financial assistance is provided to eligible farmers under the Pradhan Mantri Kisan Samman Nidhi scheme?", ["Rupees 6,000 per year in three equal installments", "Rupees 12,000 per year in four installments", "Rupees 5,000 per year in two installments", "Rupees 8,000 per year in four installments"], 0, false, "Under the Pradhan Mantri Kisan Samman Nidhi scheme, eligible farmer families receive Rupees 6,000 per year directly into their bank accounts in three equal four-monthly installments of Rupees 2,000 each."],
  [119, 2, "In which year was the Pradhan Mantri Fasal Bima Yojana launched?", ["2016", "2015", "2018", "2014"], 0, false, "The Pradhan Mantri Fasal Bima Yojana was launched in January 2016 to provide comprehensive crop insurance coverage against non-preventable natural risks from pre-sowing to post-harvest stages."],
  [120, 2, "What is the uniform maximum insurance premium payable by farmers under the Pradhan Mantri Fasal Bima Yojana?", ["Kharif: 2%, Rabi: 1.5%, Commercial and Horticultural Crops: 5%", "Kharif: 1.5%, Rabi: 2%, Commercial Crops: 5%", "Kharif: 5%, Rabi: 2%, Commercial Crops: 1.5%", "Uniform 2% for all crops"], 0, false, "Under the Pradhan Mantri Fasal Bima Yojana, farmers pay a maximum actuarial premium of 2% for all Kharif food and oilseed crops, 1.5% for all Rabi food and oilseed crops, and 5% for annual commercial and horticultural crops."],
  [121, 2, "What is the short-term crop loan limit and effective interest rate for prompt-repaying farmers under the Kisan Credit Card scheme?", ["Up to Rupees 3 Lakh at 4% effective interest rate", "Up to Rupees 5 Lakh at 7% effective interest rate", "Up to Rupees 2 Lakh at 3% effective interest rate", "Up to Rupees 1 Lakh at 5% effective interest rate"], 0, false, "Under the Modified Interest Subvention Scheme for Kisan Credit Card holders, short-term crop loans up to Rupees 3 Lakh carry a 7% benchmark interest rate, with an additional 3% prompt repayment incentive reducing the effective interest rate to 4% per annum."],
  [122, 2, "In which year was the Soil Health Card scheme launched?", ["2015", "2014", "2016", "2017"], 0, false, "The Soil Health Card scheme was launched by Prime Minister Narendra Modi on 19 February 2015 at Suratgarh, Rajasthan. It provides farmers with crop-wise recommendations of nutrients and fertilizers required for individual farms."],
  [123, 2, "In which year was the Electronic National Agriculture Market (e-NAM) trading portal launched?", ["2016", "2015", "2018", "2014"], 0, false, "The Electronic National Agriculture Market was launched on 14 April 2016 as a pan-India electronic trading portal networking existing Agricultural Produce Market Committee mandis to create a unified national market for agricultural commodities."],
  [124, 2, "Until which month and year has free foodgrain distribution under the Pradhan Mantri Garib Kalyan Anna Yojana been extended?", ["December 2028", "December 2026", "March 2027", "December 2030"], 0, false, "The Union Cabinet extended the provision of free foodgrains under the Pradhan Mantri Garib Kalyan Anna Yojana for a period of five years starting 1 January 2024 up to December 2028, benefiting over 81 Crore citizens."],
  [125, 2, "In which year was the One Nation One Ration Card plan launched to enable nationwide portability of food security benefits?", ["2019", "2020", "2018", "2021"], 0, false, "The One Nation One Ration Card scheme was initiated in August 2019 to allow migrant beneficiaries under the National Food Security Act to lift their entitled foodgrains from any Fair Price Shop across India using biometric authentication."],
  [126, 2, "In which year was the Mid-Day Meal Scheme renamed as Pradhan Mantri Poshan Shakti Nirman (PM POSHAN)?", ["2021", "2020", "2019", "2022"], 0, false, "In September 2021, the Union Cabinet approved the continuation of the National Scheme for Mid-Day Meal in Schools under the new name Pradhan Mantri Poshan Shakti Nirman for the five-year period 2021–22 to 2025–26."],
  [127, 2, "When and where was the Beti Bachao Beti Padhao scheme launched?", ["22 January 2015 in Panipat, Haryana", "8 March 2015 in New Delhi", "2 October 2014 in Ahmedabad", "11 October 2015 in Jaipur"], 0, false, "The Beti Bachao Beti Padhao scheme was launched on 22 January 2015 in Panipat, Haryana, to address the declining Child Sex Ratio and promote the survival, protection, and education of the girl child."],
  [128, 2, "What is the interest rate on the Sukanya Samriddhi Account Scheme as mentioned in the material?", ["8.2% per annum", "7.1% per annum", "7.6% per annum", "8.5% per annum"], 0, false, "The Sukanya Samriddhi Account Scheme offers an attractive interest rate of 8.2% per annum compounded yearly, with complete tax exemption under Section 80C of the Income Tax Act."],
  [129, 2, "What is the maximum annual deposit allowed in a Sukanya Samriddhi Account?", ["Rupees 1.5 Lakh per financial year", "Rupees 1 Lakh per financial year", "Rupees 2 Lakh per financial year", "Rupees 3 Lakh per financial year"], 0, false, "A guardian can deposit a minimum of Rupees 250 and a maximum of Rupees 1.5 Lakh in a financial year into a Sukanya Samriddhi Account opened for a girl child below 10 years of age."],
  [130, 2, "What is the maximum investment limit under the Senior Citizens Savings Scheme?", ["Rupees 30 Lakh", "Rupees 15 Lakh", "Rupees 20 Lakh", "Rupees 25 Lakh"], 0, false, "The maximum deposit limit under the Senior Citizens Savings Scheme was doubled from Rupees 15 Lakh to Rupees 30 Lakh in the Union Budget 2023–24, providing higher retirement income security for individuals aged 60 and above."],
  [131, 2, "What is the interest rate and payout frequency of the Senior Citizens Savings Scheme?", ["8.2% per annum, paid quarterly", "7.5% per annum, paid monthly", "8.0% per annum, paid half-yearly", "8.5% per annum, paid annually"], 0, false, "The Senior Citizens Savings Scheme carries an interest rate of 8.2% per annum, and interest is credited directly to the subscriber's account on a quarterly basis (at the end of March, June, September, and December)."],
  [132, 2, "What is the maturity tenure and extension option for the Senior Citizens Savings Scheme?", ["5 years, extendable by 3 years", "3 years, extendable by 2 years", "10 years, extendable by 5 years", "7 years, extendable by 3 years"], 0, false, "A Senior Citizens Savings Scheme account has a standard maturity period of 5 years from the date of opening, and it can be extended once for an additional block of 3 years within one year of maturity."],

  // PAGE 3 (133 to 290)
  [133, 3, "What is the minimum annual contribution required to keep a National Pension System Tier-1 account active?", ["Rupees 1,000", "Rupees 500", "Rupees 2,000", "Rupees 6,000"], 0, false, "Subscribers to a National Pension System Tier-1 account must contribute a minimum of Rupees 1,000 per financial year to keep the account active and avoid freezing."],
  [134, 3, "What is the minimum initial contribution required at the time of opening a National Pension System Tier-1 account?", ["Rupees 500", "Rupees 1,000", "Rupees 250", "Rupees 100"], 0, false, "A minimum contribution of Rupees 500 is required at the time of registration to open a National Pension System Tier-1 account, with no upper ceiling on annual contributions."],
  [135, 3, "When was the Atal Pension Yojana launched?", ["9 May 2015", "28 August 2014", "1 June 2015", "8 April 2015"], 0, false, "The Atal Pension Yojana was launched by Prime Minister Narendra Modi on 9 May 2015 in Kolkata to provide a universal social security system for all Indians, particularly workers in the unorganized sector."],
  [136, 3, "What is the guaranteed monthly pension slab range provided under the Atal Pension Yojana upon attaining 60 years of age?", ["Rupees 1,000 to Rupees 5,000 per month", "Rupees 500 to Rupees 3,000 per month", "Rupees 2,000 to Rupees 10,000 per month", "Rupees 3,000 flat per month"], 0, false, "Under the Atal Pension Yojana, subscribers receive a government-guaranteed minimum monthly pension of Rupees 1,000, Rupees 2,000, Rupees 3,000, Rupees 4,000, or Rupees 5,000 starting at age 60 depending on their chosen contribution slab."],
  [137, 3, "What is the eligible age group for joining the Atal Pension Yojana?", ["18 to 40 years", "18 to 50 years", "21 to 45 years", "18 to 60 years"], 0, false, "Any Indian citizen between 18 and 40 years of age who holds a savings bank account and is not an income tax payer (effective October 2022) is eligible to join the Atal Pension Yojana."],
  [138, 3, "What is the annual premium and life insurance cover under the Pradhan Mantri Jeevan Jyoti Bima Yojana?", ["Rupees 436 per year for Rupees 2 Lakh life cover", "Rupees 330 per year for Rupees 2 Lakh life cover", "Rupees 20 per year for Rupees 2 Lakh life cover", "Rupees 500 per year for Rupees 5 Lakh life cover"], 0, false, "The Pradhan Mantri Jeevan Jyoti Bima Yojana offers renewable one-year term life insurance cover of Rupees 2 Lakh for death due to any reason at an annual premium of Rupees 436 (revised upward from Rupees 330 in June 2022) for individuals aged 18 to 50 years."],
  [139, 3, "What is the annual premium and accidental insurance cover under the Pradhan Mantri Suraksha Bima Yojana?", ["Rupees 20 per year for Rupees 2 Lakh accidental cover", "Rupees 12 per year for Rupees 2 Lakh accidental cover", "Rupees 436 per year for Rupees 2 Lakh accidental cover", "Rupees 50 per year for Rupees 5 Lakh accidental cover"], 0, false, "The Pradhan Mantri Suraksha Bima Yojana provides accidental death and full disability cover of Rupees 2 Lakh (and Rupees 1 Lakh for partial disability) at an annual premium of Rupees 20 (revised from Rupees 12 in June 2022) for individuals aged 18 to 70 years."],
  [140, 3, "What is the maximum overdraft limit available to eligible account holders under the Pradhan Mantri Jan Dhan Yojana?", ["Rupees 10,000", "Rupees 5,000", "Rupees 15,000", "Rupees 25,000"], 0, false, "Eligible Pradhan Mantri Jan Dhan Yojana account holders can avail an overdraft facility of up to Rupees 10,000 after six months of satisfactory account maintenance, with upper age eligibility set at 65 years."],
  [141, 3, "What is the minimum age and target beneficiary group under the Stand-Up India Scheme?", ["18 years and above; Scheduled Caste, Scheduled Tribe, and Women entrepreneurs", "21 years and above; All Micro, Small, and Medium Enterprises", "18 to 40 years; Unorganized sector workers", "25 years and above; Rural farmers only"], 0, false, "The Stand-Up India Scheme supports greenfield enterprises in manufacturing, services, trading, or agri-allied sectors set up by Scheduled Caste, Scheduled Tribe, or Women entrepreneurs aged 18 years and above."],
  [142, 3, "In which year was the Skill India Mission (National Skill Development Mission) launched?", ["2015", "2014", "2016", "2018"], 0, false, "The Skill India Mission was launched by Prime Minister Narendra Modi on 15 July 2015 (World Youth Skills Day) to train over 40 Crore people in India in different industry-relevant skills."],
  [143, 3, "What is the primary objective of the Pradhan Mantri Kaushal Vikas Yojana?", ["Industry-relevant skill training and certification for youth", "Direct cash transfer to landholding farmers", "Collateral-free housing loans for urban poor", "Crop insurance against natural calamities"], 0, false, "The Pradhan Mantri Kaushal Vikas Yojana is the flagship skill certification scheme of the Ministry of Skill Development and Entrepreneurship, enabling Indian youth to take up industry-relevant skill training and secure better livelihoods."],
  [144, 3, "When was the Digital India campaign launched?", ["1 July 2015", "15 August 2014", "25 September 2014", "16 January 2016"], 0, false, "The Digital India program was launched on 1 July 2015 by Prime Minister Narendra Modi with the vision to transform India into a digitally empowered society and knowledge economy."],
  [145, 3, "When was the Make in India initiative launched?", ["25 September 2014", "1 July 2015", "28 August 2014", "16 January 2016"], 0, false, "The Make in India initiative was launched on 25 September 2014 to facilitate investment, foster innovation, build best-in-class manufacturing infrastructure, and turn India into a global design and manufacturing hub."],
  [146, 3, "When was the Startup India initiative launched?", ["16 January 2016", "25 September 2014", "1 July 2015", "8 April 2015"], 0, false, "The Startup India initiative was launched on 16 January 2016 to build a strong ecosystem for nurturing innovation and startups in the country. January 16 is officially celebrated as National Startup Day."],
  [147, 3, "In which year was the Mahatma Gandhi National Rural Employment Guarantee Act enacted, and how many days of wage employment did it originally guarantee?", ["Enacted in 2005; 100 days of guaranteed wage employment", "Enacted in 2006; 150 days of guaranteed wage employment", "Enacted in 2009; 100 days of guaranteed wage employment", "Enacted in 2004; 120 days of guaranteed wage employment"], 0, false, "The National Rural Employment Guarantee Act was passed in August 2005 (and later renamed after Mahatma Gandhi in 2009), guaranteeing at least 100 days of unskilled manual wage employment per financial year to every rural household."],
  [148, 3, "What is the full name of the legislation enacted in 2025 (commencing July 2026) that replaced the Mahatma Gandhi National Rural Employment Guarantee Act?", ["Viksit Bharat – Guarantee for Rozgar and Ajeevika Mission (Gramin) [VB-G RAM G]", "Viksit Bharat – Gramin Rozgar Guarantee Yojana", "Viksit Bharat – Guarantee for Rural Asset and Mobility Mission", "Viksit Bharat – National Rural Livelihood Act"], 0, false, "The Viksit Bharat – Guarantee for Rozgar and Ajeevika Mission (Gramin) Act, 2025 replaced the 2005 rural employment framework (commencing nationwide on 1 July 2026) and expanded the statutory employment guarantee to 125 days per rural household annually."],
  [149, 3, "When was the Pradhan Mantri Vishwakarma Yojana launched?", ["September 2023", "February 2024", "August 2022", "January 2023"], 0, false, "The Pradhan Mantri Vishwakarma Yojana was launched on 17 September 2023 (Vishwakarma Jayanti) as a Central Sector Scheme to support traditional artisans and craftspeople engaged in 18 traditional trades."],
  [150, 3, "What is the total collateral-free enterprise development loan amount and concessional interest rate under the Pradhan Mantri Vishwakarma Yojana?", ["Up to Rupees 3 Lakh at 5% concessional interest rate", "Up to Rupees 5 Lakh at 4% interest rate", "Up to Rupees 2 Lakh at 6% interest rate", "Up to Rupees 10 Lakh at 7% interest rate"], 0, false, "Under the Pradhan Mantri Vishwakarma Yojana, registered artisans receive collateral-free credit support of up to Rupees 3 Lakh in two tranches (Rupees 1 Lakh first tranche and Rupees 2 Lakh second tranche) at a concessional interest rate of 5%."],
  [251, 3, "Which Indian city is famously known as the 'Garden City of India'?", ["Bengaluru", "Mysuru", "Chandigarh", "Pune"], 0, false, "Bengaluru, the capital of Karnataka, is widely known as the 'Garden City of India' owing to its lush green parks such as Lalbagh Botanical Garden and Cubbon Park, as well as its pleasant year-round climate."],
  [252, 3, "Which Indian city is popularly known as the 'Silicon City' or 'Silicon Valley of India'?", ["Bengaluru", "Hyderabad", "Pune", "Chennai"], 0, false, "Bengaluru is termed the 'Silicon Valley of India' because it is the country's leading hub for information technology exports, research institutions, and technology startups."],
  [253, 3, "Which Indian city is famously known as the 'Pink City'?", ["Jaipur", "Jodhpur", "Udaipur", "Bikaner"], 0, false, "Jaipur, the capital of Rajasthan, is known as the 'Pink City' because Maharaja Sawai Ram Singh II had the entire old city painted terracotta pink in 1876 to welcome the Prince of Wales."],
  [254, 3, "Which city in Rajasthan is known as the 'Blue City' and 'Sun City'?", ["Jodhpur", "Jaipur", "Udaipur", "Jaisalmer"], 0, false, "Jodhpur is famously called the 'Blue City' due to the blue-painted houses surrounding the Mehrangarh Fort, and the 'Sun City' because of its bright, sunny weather throughout the year."],
  [255, 3, "Which Indian city is renowned as the 'City of Lakes'?", ["Udaipur", "Bhopal", "Nainital", "Srinagar"], 0, false, "Udaipur in Rajasthan is celebrated as the 'City of Lakes' (and 'Venice of the East') for its interconnected artificial lake system including Lake Pichola, Fateh Sagar Lake, and Udai Sagar Lake."],
  [256, 3, "Which city in Maharashtra is known as the 'Orange City' of India?", ["Nagpur", "Nashik", "Pune", "Aurangabad"], 0, false, "Nagpur is famous as the 'Orange City' of India because it is a major cultivation and trading center for high-quality Mandarin oranges grown in the Vidarbha region."],
  [257, 3, "Which Indian city was historically nicknamed the 'Manchester of India'?", ["Ahmedabad", "Surat", "Coimbatore", "Kanpur"], 0, false, "Ahmedabad in Gujarat earned the sobriquet 'Manchester of India' due to its thriving cotton textile mills along the Sabarmati River, paralleling Manchester's prominence in Great Britain's textile industry."],
  [258, 3, "Which city in Jharkhand is known as the 'Steel City of India'?", ["Jamshedpur", "Bokaro", "Rourkela", "Bhilai"], 0, false, "Jamshedpur (Tatanagar) is called the 'Steel City of India' as it is home to Tata Steel, India's first private sector iron and steel plant established by Jamsetji Tata in 1907."],
  [259, 3, "Which Indian metropolis is known as the 'Detroit of India'?", ["Chennai", "Pune", "Gurugram", "Sanand"], 0, false, "Chennai, the capital of Tamil Nadu, is widely referred to as the 'Detroit of India' because it hosts major global automobile and auto-component manufacturing plants accounting for a large share of India's vehicle exports."],
  [260, 3, "Which Indian city is known as the 'City of Joy'?", ["Kolkata", "Mumbai", "Lucknow", "Varanasi"], 0, false, "Kolkata, the capital of West Bengal, is affectionately known as the 'City of Joy', a title popularized by Dominique Lapierre's famous novel and reflecting the city's rich cultural, literary, and festive spirit."],
  [261, 3, "Which city is recognized as the 'Financial Capital of India'?", ["Mumbai", "New Delhi", "Bengaluru", "Ahmedabad"], 0, false, "Mumbai is India's Financial Capital, housing the headquarters of the Reserve Bank of India, Bombay Stock Exchange, National Stock Exchange, Securities and Exchange Board of India, and major commercial banks."],
  [262, 3, "Which city serves as the 'Political Capital of India'?", ["New Delhi", "Mumbai", "Kolkata", "Chandigarh"], 0, false, "New Delhi is the Political Capital of India, serving as the seat of the Executive, Parliament (Legislative), and the Supreme Court of India."],
  [263, 3, "From which glacial lake in Sikkim does the Teesta River originate?", ["Tso Lhamo Lake (Cholamu Lake), Sikkim", "Gurudongmar Lake, Sikkim", "Gangotri Glacier, Uttarakhand", "Mansarovar Lake, Tibet"], 0, false, "The Teesta River originates from the Tso Lhamo Lake (also known as Cholamu Lake) at an elevation of over 5,300 meters in North Sikkim, fed by the Zemu Glacier."],
  [264, 3, "Which major river does the Teesta River join in Bangladesh?", ["Brahmaputra River (Jamuna)", "Ganga River (Padma)", "Meghna River", "Barak River"], 0, false, "After flowing through Sikkim and northern West Bengal, the Teesta River enters Bangladesh and merges with the Brahmaputra River (locally known as the Jamuna) near Fulchhari."],
  [265, 3, "The Teesta River water-sharing dispute is between which two countries (and involves which Indian state)?", ["India (West Bengal) and Bangladesh", "India (Assam) and Bhutan", "India (Bihar) and Nepal", "India (Punjab) and Pakistan"], 0, false, "The Teesta River water-sharing dispute is a longstanding bilateral issue between India (specifically involving the state of West Bengal) and Bangladesh regarding equitable allocation of dry-season river flows."],
  [266, 3, "Where does the River Ganga originate?", ["Gangotri Glacier at Gomukh, Uttarakhand", "Yamunotri Glacier, Uttarakhand", "Mansarovar Lake, Tibet", "Amarkantak Plateau, Madhya Pradesh"], 0, false, "The River Ganga originates as the Bhagirathi from the Gangotri Glacier at Gomukh in Uttarkashi district, Uttarakhand, and takes the name Ganga after merging with the Alaknanda at Devprayag."],
  [267, 3, "Into which water body does the River Ganga finally empty?", ["Bay of Bengal", "Arabian Sea", "Indian Ocean directly", "Gulf of Khambhat"], 0, false, "After traversing over 2,525 kilometers across northern and eastern India and Bangladesh, the Ganga empties into the Bay of Bengal, forming the world's largest delta, the Sundarbans."],
  [268, 3, "Where does the Yamuna River originate?", ["Yamunotri Glacier, Uttarakhand", "Gangotri Glacier, Uttarakhand", "Rohtang Pass, Himachal Pradesh", "Kailash Range, Tibet"], 0, false, "The Yamuna, the largest tributary of the Ganga, originates from the Yamunotri Glacier near Banderpoonch peaks in Uttarkashi district, Uttarakhand, and joins the Ganga at Triveni Sangam in Prayagraj."],
  [269, 3, "From where does the Brahmaputra River originate in Tibet?", ["Angsi / Chemayungdung Glacier near Lake Mansarovar, Tibet (known as Yarlung Tsangpo)", "Gangotri Glacier, Uttarakhand", "Amarkantak, Madhya Pradesh", "Tso Lhamo Lake, Sikkim"], 0, false, "The Brahmaputra originates near Lake Mansarovar in the Kailash range of southern Tibet, where it flows eastward for over 1,600 kilometers under the name Yarlung Tsangpo before turning south into India."],
  [270, 3, "Through which Indian state does the Brahmaputra River enter India?", ["Arunachal Pradesh", "Assam", "Sikkim", "Nagaland"], 0, false, "The Yarlung Tsangpo makes a sharp U-turn around Namcha Barwa peak and enters India through Arunachal Pradesh, where it is known as the Siang or Dihang River before entering Assam."],
  [271, 3, "Where does the Indus River originate?", ["Bokhar Chu Glacier near Lake Mansarovar, Tibet", "Rohtang Pass, Himachal Pradesh", "Verinag Spring, Jammu and Kashmir", "Gangotri Glacier, Uttarakhand"], 0, false, "The Indus River originates in the Tibetan Plateau in the vicinity of Lake Mansarovar from the Bokhar Chu glacier in the Kailash mountain range."],
  [272, 3, "Through which Indian Union Territory and neighboring country does the Indus River flow?", ["Ladakh (India) and Pakistan", "Himachal Pradesh (India) and Nepal", "Sikkim (India) and Bangladesh", "Uttarakhand (India) and China"], 0, false, "In India, the Indus River flows northwestward exclusively through the Union Territory of Ladakh (passing Leh) before entering Gilgit-Baltistan and flowing southward through Pakistan into the Arabian Sea."],
  [273, 3, "From where does the Godavari River originate?", ["Trimbakeshwar in Nashik district, Maharashtra", "Mahabaleshwar, Maharashtra", "Talakaveri, Karnataka", "Amarkantak, Madhya Pradesh"], 0, false, "The Godavari River originates at Trimbakeshwar in the Western Ghats of Nashik district, Maharashtra, and flows eastward across the Deccan Plateau into the Bay of Bengal."],
  [274, 3, "By what honorific name is the Godavari River widely known?", ["Dakshin Ganga (Ganga of the South)", "Sorrow of Bengal", "Lifeline of Gujarat", "Vridha Kaveri"], 0, false, "The Godavari is called 'Dakshin Ganga' (and 'Vridha Ganga') because it is the longest river in Peninsular India (1,465 kilometers) and has the second-largest river basin in India after the Ganga."],
  [275, 3, "Where does the Krishna River originate?", ["Mahabaleshwar in Satara district, Maharashtra", "Trimbakeshwar, Maharashtra", "Talakaveri, Karnataka", "Multai, Madhya Pradesh"], 0, false, "The Krishna River rises in the Western Ghats near Jor village in Mahabaleshwar, Satara district, Maharashtra, and flows through Maharashtra, Karnataka, Telangana, and Andhra Pradesh into the Bay of Bengal."],
  [276, 3, "Where does the Kaveri River originate?", ["Talakaveri in Kodagu (Coorg) district, Karnataka", "Mahabaleshwar, Maharashtra", "Nandi Hills, Karnataka", "Nilgiri Hills, Tamil Nadu"], 0, false, "The Kaveri River originates at Talakaveri in the Brahmagiri hills of Kodagu district, Karnataka, and flows southeastward through Karnataka and Tamil Nadu to empty into the Bay of Bengal at Poompuhar."],
  [277, 3, "From where does the Narmada River originate?", ["Amarkantak Plateau in Anuppur district, Madhya Pradesh", "Multai in Betul district, Madhya Pradesh", "Sihawa, Chhattisgarh", "Trimbakeshwar, Maharashtra"], 0, false, "The Narmada River rises from the Narmada Kund on the Amarkantak Plateau in Madhya Pradesh, forming the traditional geographic boundary between North and South India."],
  [278, 3, "In which direction and into which sea does the Narmada River flow?", ["Westwards towards the Arabian Sea", "Eastwards towards the Bay of Bengal", "Northwards to join the Yamuna", "Southwards towards the Indian Ocean"], 0, false, "Unlike most major peninsular rivers that flow east, the Narmada flows westwards through a structural rift valley between the Vindhya and Satpura ranges into the Gulf of Khambhat in the Arabian Sea."],
  [279, 3, "Where does the Tapti (Tapi) River originate?", ["Multai in Betul district, Madhya Pradesh", "Amarkantak, Madhya Pradesh", "Sihawa, Chhattisgarh", "Mahabaleshwar, Maharashtra"], 0, false, "The Tapti River originates near Multai in the Satpura range of Betul district, Madhya Pradesh, and flows westwards parallel to the Narmada before draining into the Arabian Sea near Surat."],
  [280, 3, "From where does the Mahanadi River originate?", ["Sihawa hills in Dhamtari district, Chhattisgarh", "Amarkantak, Madhya Pradesh", "Chota Nagpur Plateau, Jharkhand", "Mahendragiri, Odisha"], 0, false, "The Mahanadi River rises from the Sihawa mountain range in Dhamtari district, Chhattisgarh, and flows eastwards through Odisha, where the famous Hirakud Dam is built across it."],
  [281, 3, "Which Indian state has the highest number of National Parks (11 National Parks)?", ["Madhya Pradesh", "Assam", "Rajasthan", "Uttarakhand"], 0, false, "Madhya Pradesh has the highest number of National Parks in India with 11 protected National Parks, including Kanha, Bandhavgarh, Pench, Satpura, Panna, and Kuno."],
  [282, 3, "In which state is Jim Corbett National Park located, and what is its historical distinction?", ["Uttarakhand; India's first National Park (established in 1936)", "Madhya Pradesh; Largest National Park in India", "Assam; First Biosphere Reserve in India", "Gujarat; Only habitat of Asiatic Lions"], 0, false, "Located in Nainital and Pauri Garhwal districts of Uttarakhand, Jim Corbett National Park was established in 1936 as Hailey National Park, making it India's oldest and first National Park."],
  [283, 3, "In which state is Kaziranga National Park located, and which animal is it globally famous for conserving?", ["Assam; Great Indian One-Horned Rhinoceros", "West Bengal; Royal Bengal Tiger", "Gujarat; Asiatic Lion", "Kerala; Nilgiri Tahr"], 0, false, "Kaziranga National Park is a United Nations Educational, Scientific and Cultural Organization World Heritage Site in Assam that hosts the world's largest population of the Great Indian One-Horned Rhinoceros."],
  [284, 3, "In which state is Gir National Park located, and which endangered big cat is found exclusively there in the wild?", ["Gujarat; Asiatic Lion", "Rajasthan; Bengal Tiger", "Ladakh; Snow Leopard", "Karnataka; Indian Leopard"], 0, false, "Gir National Park and Wildlife Sanctuary in Gujarat is the sole natural wilderness habitat in the world where the endangered Asiatic Lion survives."],
  [285, 3, "In which state is Kanha National Park located, and which famous literary work did it inspire?", ["Madhya Pradesh; Rudyard Kipling's 'The Jungle Book'", "Uttarakhand; Jim Corbett's 'Man-Eaters of Kumaon'", "Assam; 'The Kaziranga Trail'", "Maharashtra; 'The Man-Eating Leopard of Rudraprayag'"], 0, false, "Kanha National Park and Tiger Reserve in Madhya Pradesh is renowned for its lush sal and bamboo forests and served as the primary inspiration for Rudyard Kipling's classic novel 'The Jungle Book'."],
  [286, 3, "In which Indian state is Bandhavgarh National Park located?", ["Madhya Pradesh", "Chhattisgarh", "Odisha", "Rajasthan"], 0, false, "Bandhavgarh National Park is situated in the Umaria district of Madhya Pradesh and is celebrated for having one of the highest densities of Royal Bengal Tigers in India."],
  [287, 3, "In which state is Ranthambore National Park located?", ["Rajasthan", "Madhya Pradesh", "Gujarat", "Uttar Pradesh"], 0, false, "Ranthambore National Park is located near Sawai Madhopur in southeastern Rajasthan and is one of northern India's premier tiger reserves."],
  [288, 3, "In which state is Sundarbans National Park located, and what is it famous for?", ["West Bengal; Mangrove forests and Royal Bengal Tigers", "Odisha; Olive Ridley Sea Turtles", "Assam; One-horned Rhinoceros", "Gujarat; Wild Ass"], 0, false, "Sundarbans National Park in West Bengal is part of the world's largest tidal halophytic mangrove forest in the Ganges-Brahmaputra delta and is a designated habitat for the Royal Bengal Tiger."],
  [289, 3, "In which state is Keoladeo National Park (formerly Bharatpur Bird Sanctuary) located?", ["Rajasthan", "Haryana", "Gujarat", "Uttar Pradesh"], 0, false, "Keoladeo National Park is located in Bharatpur, Rajasthan, and is a famous man-made wetland and United Nations Educational, Scientific and Cultural Organization World Heritage Site hosting thousands of migratory waterfowl."],
