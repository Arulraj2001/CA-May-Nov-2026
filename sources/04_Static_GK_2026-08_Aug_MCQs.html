<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>August Static GK — Learn & Practice (White Theme)</title>
<style>
  :root {
    --bg-page: #ffffff;
    --bg-panel: #f9fafb;
    --bg-card: #ffffff;
    --border-light: #e5e7eb;
    --border-strong: #d1d5db;
    --text-main: #111827;
    --text-sub: #4b5563;
    --text-muted: #6b7280;
    --primary: #1d4ed8;
    --primary-soft: #eff6ff;
    --primary-border: #bfdbfe;
    --green-bg: #f0fdf4;
    --green-border: #22c55e;
    --green-text: #15803d;
    --red-bg: #fef2f2;
    --red-border: #ef4444;
    --red-text: #b91c1c;
    --amber-bg: #fffbeb;
    --amber-border: #f59e0b;
    --amber-text: #92400e;
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  body {
    background-color: var(--bg-page);
    color: var(--text-main);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, Arial, sans-serif;
    line-height: 1.6;
  }

  header {
    background-color: #ffffff;
    border-bottom: 1px solid var(--border-light);
    position: sticky;
    top: 0;
    z-index: 100;
    padding: 14px 20px;
  }

  .header-wrap {
    max-width: 1060px;
    margin: 0 auto;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
  }

  .title-block h1 {
    font-size: 1.15rem;
    font-weight: 700;
    color: var(--text-main);
  }

  .title-block p {
    font-size: 0.8rem;
    color: var(--text-muted);
  }

  .tabs {
    display: inline-flex;
    background-color: var(--bg-panel);
    border: 1px solid var(--border-light);
    border-radius: 8px;
    padding: 4px;
    gap: 4px;
  }

  .tab-btn {
    border: none;
    background: transparent;
    color: var(--text-sub);
    font-size: 0.88rem;
    font-weight: 600;
    padding: 7px 16px;
    border-radius: 6px;
    cursor: pointer;
    transition: 0.15s ease;
  }

  .tab-btn.active {
    background-color: #ffffff;
    color: var(--primary);
    border: 1px solid var(--border-light);
    box-shadow: 0 1px 2px rgba(0, 0, 0, 0.06);
  }

  .main-container {
    max-width: 1060px;
    margin: 0 auto;
    padding: 20px;
  }

  .controls-bar {
    background-color: var(--bg-panel);
    border: 1px solid var(--border-light);
    border-radius: 10px;
    padding: 12px 16px;
    margin-bottom: 18px;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
  }

  .filter-group {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    flex: 1;
  }

  select, input[type="text"] {
    background-color: #ffffff;
    color: var(--text-main);
    border: 1px solid var(--border-strong);
    border-radius: 6px;
    padding: 8px 12px;
    font-size: 0.875rem;
    outline: none;
  }

  select:focus, input[type="text"]:focus {
    border-color: var(--primary);
  }

  input[type="text"] {
    min-width: 230px;
  }

  .score-group {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 8px;
    font-size: 0.84rem;
    font-weight: 600;
  }

  .pill {
    background-color: #ffffff;
    border: 1px solid var(--border-light);
    border-radius: 999px;
    padding: 4px 11px;
    color: var(--text-sub);
  }

  .pill.green {
    background-color: var(--green-bg);
    border-color: var(--green-border);
    color: var(--green-text);
  }

  .pill.red {
    background-color: var(--red-bg);
    border-color: var(--red-border);
    color: var(--red-text);
  }

  .action-btn {
    background-color: #ffffff;
    color: var(--text-main);
    border: 1px solid var(--border-strong);
    border-radius: 6px;
    padding: 6px 12px;
    font-size: 0.82rem;
    font-weight: 600;
    cursor: pointer;
  }

  .action-btn:hover {
    background-color: #f3f4f6;
  }

  .learn-subbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 14px;
    font-size: 0.85rem;
    color: var(--text-muted);
  }

  .card {
    background-color: #ffffff;
    border: 1px solid var(--border-light);
    border-radius: 10px;
    padding: 18px 20px;
    margin-bottom: 14px;
  }

  .card-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 8px;
  }

  .badge-num {
    background-color: var(--primary-soft);
    color: var(--primary);
    border: 1px solid var(--primary-border);
    font-size: 0.78rem;
    font-weight: 700;
    padding: 2px 8px;
    border-radius: 5px;
  }

  .badge-cat {
    font-size: 0.75rem;
    font-weight: 600;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 0.03em;
  }

  .question-text {
    font-size: 1.02rem;
    font-weight: 600;
    color: var(--text-main);
    margin-bottom: 12px;
  }

  .learn-answer-box {
    display: inline-block;
    background-color: var(--green-bg);
    border: 1px solid #bbf7d0;
    color: var(--green-text);
    font-weight: 700;
    font-size: 0.94rem;
    padding: 6px 12px;
    border-radius: 6px;
    margin-bottom: 12px;
  }

  .learn-answer-box.blurred {
    filter: blur(5px);
    cursor: pointer;
    user-select: none;
  }

  .exam-points {
    background-color: var(--amber-bg);
    border: 1px solid #fde68a;
    border-left: 4px solid var(--amber-border);
    border-radius: 6px;
    padding: 10px 14px;
  }

  .exam-points-heading {
    font-size: 0.78rem;
    font-weight: 700;
    color: var(--amber-text);
    text-transform: uppercase;
    letter-spacing: 0.03em;
    margin-bottom: 4px;
  }

  .exam-points ul {
    margin-left: 18px;
    font-size: 0.88rem;
    color: #374151;
  }

  .exam-points li {
    margin-bottom: 3px;
  }

  .options-list {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
    gap: 10px;
  }

  .option-btn {
    display: flex;
    align-items: center;
    gap: 10px;
    width: 100%;
    text-align: left;
    background-color: #ffffff;
    border: 1.5px solid var(--border-light);
    border-radius: 8px;
    padding: 11px 14px;
    font-size: 0.92rem;
    font-weight: 500;
    color: var(--text-main);
    cursor: pointer;
    transition: all 0.15s ease;
  }

  .option-btn:hover:not(:disabled) {
    border-color: var(--primary);
    background-color: var(--primary-soft);
  }

  .option-btn:disabled {
    cursor: default;
  }

  .opt-circle {
    width: 24px;
    height: 24px;
    border-radius: 50%;
    background-color: var(--bg-panel);
    border: 1px solid var(--border-strong);
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-size: 0.78rem;
    font-weight: 700;
    color: var(--text-sub);
    flex-shrink: 0;
  }

  .option-btn.correct {
    background-color: var(--green-bg);
    border-color: var(--green-border);
    color: var(--green-text);
    font-weight: 700;
  }

  .option-btn.correct .opt-circle {
    background-color: var(--green-border);
    border-color: var(--green-border);
    color: #ffffff;
  }

  .option-btn.wrong {
    background-color: var(--red-bg);
    border-color: var(--red-border);
    color: var(--red-text);
    font-weight: 600;
  }

  .option-btn.wrong .opt-circle {
    background-color: var(--red-border);
    border-color: var(--red-border);
    color: #ffffff;
  }

  .answer-panel {
    display: none;
    margin-top: 14px;
    padding-top: 14px;
    border-top: 1px solid var(--border-light);
    animation: slideDown 0.18s ease-out;
  }

  .answer-panel.visible {
    display: block;
  }

  .result-banner {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    margin-bottom: 10px;
  }

  .result-pill {
    font-size: 0.84rem;
    font-weight: 700;
    padding: 4px 10px;
    border-radius: 6px;
  }

  .result-pill.right {
    background-color: var(--green-bg);
    color: var(--green-text);
    border: 1px solid var(--green-border);
  }

  .result-pill.wrong {
    background-color: var(--red-bg);
    color: var(--red-text);
    border: 1px solid var(--red-border);
  }

  .correct-label {
    font-size: 0.92rem;
    font-weight: 700;
    color: var(--text-main);
  }

  .correct-label span {
    color: var(--green-text);
  }

  .hidden {
    display: none !important;
  }

  .no-results {
    text-align: center;
    padding: 40px 20px;
    border: 1px dashed var(--border-strong);
    border-radius: 10px;
    color: var(--text-muted);
  }

  @keyframes slideDown {
    from { opacity: 0; transform: translateY(-4px); }
    to { opacity: 1; transform: translateY(0); }
  }

  @media (max-width: 640px) {
    .header-wrap { flex-direction: column; align-items: flex-start; }
    .options-list { grid-template-columns: 1fr; }
    input[type="text"] { width: 100%; }
  }
</style>
</head>
<body>

<header>
  <div class="header-wrap">
    <div class="title-block">
      <h1>August Static GK — Learn & Practice (173 Questions)</h1>
      <p>SBI Mains & IBPS Mains Static Awareness | English Medium</p>
    </div>
    <div class="tabs">
      <button class="tab-btn active" id="btn-learn" onclick="setMode('learn')">📖 Learn Mode</button>
      <button class="tab-btn" id="btn-practice" onclick="setMode('practice')">✍️ Practice MCQs</button>
    </div>
  </div>
</header>

<div class="main-container">
  <div class="controls-bar">
    <div class="filter-group">
      <select id="catSelect" onchange="render()">
        <option value="ALL">All Categories (173)</option>
      </select>
      <input type="text" id="searchBox" placeholder="Search question, answer, or extra points..." oninput="render()">
    </div>
    <div class="score-group">
      <span class="pill">Attempted: <span id="cnt-attempted">0</span>/173</span>
      <span class="pill green">Correct: <span id="cnt-correct">0</span></span>
      <span class="pill red">Wrong: <span id="cnt-wrong">0</span></span>
      <button class="action-btn" onclick="resetAll()">Reset Practice</button>
    </div>
  </div>

  <div class="learn-subbar" id="learnSubbar">
    <span id="showingCount">Showing 173 questions</span>
    <button class="action-btn" id="blurBtn" onclick="toggleBlur()">👁️ Hide Answers (Self-Test)</button>
  </div>

  <div id="cardsContainer"></div>
</div>

const QUESTIONS = [{"id": 1, "cat": "Banking & Financial Institutions", "q": "Where is the headquarters of the Asian Development Bank (ADB) located?", "opts": ["Beijing, China", "Manila, Philippines", "Tokyo, Japan", "Washington, D.C., USA"], "ans": 1, "p1": "Established: 19 December 1966 | Current Member Countries: 69 (as noted in session).", "p2": "Exam Fact: ADB approved a $230 million loan project for Chennai water supply/management, as highlighted in the session."}, {"id": 2, "cat": "Banking & Financial Institutions", "q": "In which year was the Asian Development Bank (ADB) established?", "opts": ["1944", "1958", "1966", "1982"], "ans": 2, "p1": "Headquarters: Mandaluyong, Metro Manila, Philippines | President: Masato Kanda.", "p2": "Exam Fact: India is a founding member of ADB (1966) and its fourth-largest shareholder."}, {"id": 3, "cat": "Banking & Financial Institutions", "q": "Who is listed as the President of the Asian Development Bank (ADB)?", "opts": ["Masato Kanda", "Masatsugu Asakawa", "Ajay Banga", "Jin Liqun"], "ans": 0, "p1": "Headquarters: Manila, Philippines | Total Members: 69.", "p2": "Exam Fact: By tradition, the President of ADB has always been nominated by Japan, its largest shareholder."}, {"id": 4, "cat": "Banking & Financial Institutions", "q": "Where is the headquarters of the World Bank located?", "opts": ["Geneva, Switzerland", "New York, USA", "Washington, D.C., United States", "Paris, France"], "ans": 2, "p1": "Same city as the International Monetary Fund (IMF) and International Finance Corporation (IFC).", "p2": "Exam Fact: Both the World Bank and IMF are called the 'Bretton Woods Twins'."}, {"id": 5, "cat": "Banking & Financial Institutions", "q": "In which year was the World Bank established?", "opts": ["1935", "1944", "1948", "1966"], "ans": 1, "p1": "Established during the July 1944 Bretton Woods Conference | Headquarters: Washington, D.C.", "p2": "Exam Fact: The World Bank Group consists of 5 institutions: IBRD, IDA, IFC, MIGA, and ICSID."}, {"id": 6, "cat": "Banking & Financial Institutions", "q": "Who is the President of the World Bank?", "opts": ["David Malpass", "Ajay Banga", "Sanjay Malhotra", "Kristalina Georgieva"], "ans": 1, "p1": "Headquarters: Washington, D.C., USA | Established: 1944.", "p2": "Exam Fact: Ajay Banga is the 14th President of the World Bank and the first Indian-American to lead it."}, {"id": 7, "cat": "Banking & Financial Institutions", "q": "Where is the headquarters of the Reserve Bank of India (RBI) located?", "opts": ["New Delhi", "Kolkata", "Mumbai, Maharashtra", "Chennai, Tamil Nadu"], "ans": 2, "p1": "Initially established in Kolkata in 1935 and permanently shifted to Mumbai in 1937.", "p2": "Exam Fact: RBI was nationalized on 1 January 1949 under the Reserve Bank (Transfer to Public Ownership) Act, 1948."}, {"id": 8, "cat": "Banking & Financial Institutions", "q": "In which year was the Reserve Bank of India (RBI) established?", "opts": ["1921", "1934", "1935", "1949"], "ans": 2, "p1": "Established on 1 April 1935 under the RBI Act, 1934 on the recommendation of the Hilton Young Commission.", "p2": "Exam Fact: RBI's accounting year runs from April to March (aligned with the Union Government's fiscal year)."}, {"id": 9, "cat": "Banking & Financial Institutions", "q": "Who is the Governor of the Reserve Bank of India (RBI)?", "opts": ["Shaktikanta Das", "Sanjay Malhotra", "T. Rabi Sankar", "Swaminathan Janakiraman"], "ans": 1, "p1": "Designation: 26th Governor of the Reserve Bank of India.", "p2": "Exam Fact: The RBI Monetary Policy Committee (MPC) consists of 6 members (3 from RBI including the Governor, 3 external) and meets bi-monthly."}, {"id": 10, "cat": "Banking & Financial Institutions", "q": "Where is the headquarters of Axis Bank located?", "opts": ["New Delhi", "Mumbai, Maharashtra", "Ahmedabad, Gujarat", "Bengaluru, Karnataka"], "ans": 1, "p1": "Established: 1993 (originally as UTI Bank; renamed Axis Bank in 2007).", "p2": "Exam Fact: Axis Bank is India's third-largest private sector bank by assets."}, {"id": 11, "cat": "Banking & Financial Institutions", "q": "In which year was Axis Bank established?", "opts": ["1991", "1993", "1994", "1996"], "ans": 1, "p1": "Registered in December 1993 and commenced operations in 1994 in Ahmedabad (registered office: Ahmedabad; corporate HQ: Mumbai).", "p2": "Exam Fact: Axis Bank acquired Citibank India's consumer banking business in 2023."}, {"id": 12, "cat": "Banking & Financial Institutions", "q": "Who is the MD & CEO of Axis Bank?", "opts": ["Amitabh Chaudhry", "Sandeep Bakhshi", "Uday Kotak", "Sashidhar Jagdishan"], "ans": 0, "p1": "Headquarters: Mumbai, Maharashtra | Established: 1993.", "p2": "Exam Fact: Amitabh Chaudhry previously served as MD & CEO of HDFC Standard Life Insurance before joining Axis Bank."}, {"id": 13, "cat": "Banking & Financial Institutions", "q": "What is the tagline of Axis Bank?", "opts": ["We Understand Your World", "Badhti Ka Naam Zindagi", "Hum Hai Na, Khayal Apka", "Pure Banking, Nothing Else"], "ans": 1, "p1": "MD & CEO: Amitabh Chaudhry | Headquarters: Mumbai, Maharashtra.", "p2": "Exam Fact: 'We Understand Your World' is the tagline of HDFC Bank; 'Hum Hai Na, Khayal Apka' belongs to ICICI Bank."}, {"id": 14, "cat": "Banking & Financial Institutions", "q": "Where is the headquarters of HDFC Bank located?", "opts": ["New Delhi", "Pune, Maharashtra", "Mumbai, Maharashtra", "Chennai, Tamil Nadu"], "ans": 2, "p1": "Established: August 1994 | Tagline: 'We Understand Your World'.", "p2": "Exam Fact: HDFC Bank is classified as a Domestic Systemically Important Bank (D-SIB) by the RBI."}, {"id": 15, "cat": "Banking & Financial Institutions", "q": "In which year was HDFC Bank established?", "opts": ["1992", "1993", "1994", "1996"], "ans": 2, "p1": "Incorporated in August 1994 in Mumbai, Maharashtra.", "p2": "Exam Fact: Its parent housing finance company, HDFC Ltd, was established earlier in 1977 and merged with HDFC Bank in July 2023."}, {"id": 16, "cat": "Banking & Financial Abbreviations", "q": "What is the full form of AIF in investment and finance?", "opts": ["Authorized Investment Facility", "Alternative Investment Fund", "Asset Integration Framework", "Annual Income Fund"], "ans": 1, "p1": "Regulator: Regulated by SEBI under the SEBI (Alternative Investment Funds) Regulations, 2012.", "p2": "Exam Fact: Unlike retail mutual funds, AIFs target high-net-worth investors with a minimum ticket size of ₹1 crore."}, {"id": 17, "cat": "Banking & Financial Abbreviations", "q": "What is the full form of ATM?", "opts": ["Any Time Money", "Automated Teller Machine", "Automatic Transfer Module", "Authorized Transaction Machine"], "ans": 1, "p1": "Types: On-site ATMs (inside bank branch premises), Off-site ATMs (standalone locations), and Mobile ATMs.", "p2": "Exam Fact: White Label ATMs are operated by non-banks; Pink Label ATMs are dedicated to women; Green Label ATMs serve agricultural transactions."}, {"id": 18, "cat": "Banking & Financial Abbreviations", "q": "What is the full form of AUM in mutual funds and wealth management?", "opts": ["Annualized Unit Margin", "Assets Under Management", "Authorized User Mandate", "Asset Utilization Metric"], "ans": 1, "p1": "Definition: Total market value of financial assets/investments that a bank, mutual fund, or institution manages on behalf of clients.", "p2": "Exam Fact: Higher AUM generally indicates stronger investor inflows and scale in Asset Management Companies (AMCs)."}, {"id": 19, "cat": "Banking & Financial Abbreviations", "q": "What is the full form of BCBS in international banking regulation?", "opts": ["Banking Council for Business Standards", "Basel Committee on Banking Supervision", "Board of Central Banking Systems", "Bilateral Credit & Banking Secretariat"], "ans": 1, "p1": "Headquarters: Hosted by the Bank for International Settlements (BIS) in Basel, Switzerland.", "p2": "Exam Fact: BCBS sets global prudential standards (Basel I, II, and III norms) to prevent bank failures and systemic financial crises."}, {"id": 20, "cat": "Banking & Financial Abbreviations", "q": "What is the full form of CAD in macroeconomics?", "opts": ["Capital Account Deposit", "Current Account Deficit", "Centralized Asset Division", "Credit Adjustment Demand"], "ans": 1, "p1": "Definition: Occurs when the total value of a country's imports of goods, services, and transfers exceeds its exports.", "p2": "Exam Fact: India's Balance of Payments (BoP) data is compiled and published quarterly by the RBI."}, {"id": 21, "cat": "Banking & Financial Abbreviations", "q": "What is the full form of CAR in Basel banking norms?", "opts": ["Credit Allocation Ratio", "Capital Adequacy Ratio", "Cash Asset Reserve", "Centralized Audit Rate"], "ans": 1, "p1": "Formula: CAR (also called CRAR) = (Tier 1 Capital + Tier 2 Capital) ÷ Risk-Weighted Assets (RWA).", "p2": "Exam Fact: Basel III global minimum CAR is 8%, whereas the RBI mandates a stricter minimum of 9% for Indian Scheduled Commercial Banks."}, {"id": 22, "cat": "Banking & Financial Abbreviations", "q": "What is the full form of CPI?", "opts": ["Corporate Profit Index", "Consumer Price Index", "Central Payment Infrastructure", "Credit Performance Indicator"], "ans": 1, "p1": "Function: Measures retail inflation by tracking price changes in a basket of consumer goods and services.", "p2": "Exam Fact: RBI's Monetary Policy Committee targets CPI inflation at 4% with a tolerance band of ±2% (2% to 6%)."}, {"id": 23, "cat": "Banking & Financial Abbreviations", "q": "What is the full form of CRA in financial markets?", "opts": ["Central Reserve Authority", "Credit Rating Agency", "Commercial Risk Assessment", "Capital Recovery Act"], "ans": 1, "p1": "Examples in India: CRISIL, ICRA, CARE, India Ratings, Acuité, and Brickwork Ratings.", "p2": "Exam Fact: Credit Rating Agencies in India are regulated by SEBI under the SEBI (Credit Rating Agencies) Regulations, 1999."}, {"id": 24, "cat": "Banking & Financial Abbreviations", "q": "What is the full form of CVA in derivative risk management?", "opts": ["Central Value Assessment", "Credit Valuation Adjustment", "Capital Volatility Allowance", "Cumulative Venture Asset"], "ans": 1, "p1": "Definition: Market value of counterparty credit risk in over-the-counter (OTC) derivative contracts.", "p2": "Exam Fact: CVA capital charges were introduced under Basel III to cover losses from counterparty credit quality deterioration."}, {"id": 25, "cat": "Banking & Financial Abbreviations", "q": "What is the full form of D-SIB?", "opts": ["Direct Savings & Investment Bank", "Domestic Systemically Important Bank", "Designated State Industrial Bank", "Digital Settlement & Interbank Bureau"], "ans": 1, "p1": "Meaning: Banks deemed 'Too Big To Fail' (TBTF) whose failure would disrupt the entire domestic financial system.", "p2": "Exam Fact: RBI designates three D-SIBs in India—State Bank of India (SBI), HDFC Bank, and ICICI Bank—requiring higher Common Equity Tier 1 buffers."}, {"id": 26, "cat": "Banking & Financial Abbreviations", "q": "What is the full form of FEMA?", "opts": ["Federal Economic Management Authority", "Foreign Exchange Management Act", "Financial Equity Monitoring Act", "Foreign Export & Monetary Agency"], "ans": 1, "p1": "Year: Enacted in 1999 (came into force in June 2000), replacing FERA (1973).", "p2": "Exam Fact: Payment and Settlement Systems Act was enacted later in 2007, empowering RBI to regulate payment systems."}, {"id": 27, "cat": "Banking & Financial Abbreviations", "q": "What is the full form of FCNR account?", "opts": ["Foreign Capital National Reserve", "Foreign Currency Non-Resident", "Fixed Credit Non-Repatriable", "Fiscal Currency Network Rate"], "ans": 1, "p1": "Function: Term deposit account maintained by NRIs in India in designated foreign currencies (USD, GBP, EUR, JPY, AUD, CAD).", "p2": "Exam Fact: FCNR(B) accounts protect NRIs against exchange rate fluctuations and both principal and interest are fully repatriable."}, {"id": 28, "cat": "Banking & Financial Abbreviations", "q": "What is the full form of FD in retail banking?", "opts": ["Fiscal Deficit", "Fixed Deposit", "Foreign Draft", "Financial Disclosure"], "ans": 1, "p1": "Tenure Limits: Minimum tenure is 7 days; Maximum tenure is generally 10 years.", "p2": "Exam Fact: Bank deposits (including FD, RD, Savings, Current) are insured up to ₹5 lakh per depositor per bank by DICGC."}, {"id": 29, "cat": "Banking & Financial Abbreviations", "q": "What is the full form of FIRE in regulatory reporting?", "opts": ["Financial Risk & Equity", "Format for Incident Reporting Exchange", "Federal Insurance & Reserve Entity", "Fiscal Information Retrieval Engine"], "ans": 1, "p1": "Function: Standardized framework/format used for reporting operational or cybersecurity incidents across financial exchanges.", "p2": "Exam Fact: Standardized incident reporting enables timely systemic risk monitoring by financial market regulators."}, {"id": 30, "cat": "Banking & Financial Abbreviations", "q": "What is the full form of GDP?", "opts": ["General Domestic Price", "Gross Domestic Product", "Global Development Parameter", "Gross Debt Production"], "ans": 1, "p1": "Definition: Total monetary value of all final goods and services produced within a country's domestic territory in a given period.", "p2": "Exam Fact: Real GDP adjusts Nominal GDP for inflation using a base year."}, {"id": 31, "cat": "Banking & Financial Abbreviations", "q": "What is the full form of GST?", "opts": ["General Sales Tariff", "Goods and Services Tax", "Government Service Tax", "Gross Supply Tax"], "ans": 1, "p1": "Launch Date: Implemented across India on 1 July 2017 via the 101st Constitutional Amendment Act.", "p2": "Exam Fact: 1 July is also observed as National Doctors' Day, Chartered Accountants' Day, and SBI Foundation Day."}, {"id": 32, "cat": "Banking & Financial Abbreviations", "q": "What is the full form of GVA in national income accounting?", "opts": ["General Valuation Account", "Gross Value Added", "Government Venture Allocation", "Gross Volume Assessment"], "ans": 1, "p1": "Formula: GDP = GVA + Taxes on Products − Subsidies on Products.", "p2": "Exam Fact: GVA measures economic output from the supply/producer side across agriculture, industry, and services."}, {"id": 33, "cat": "Banking & Financial Abbreviations", "q": "What is the full form of GFCF in macroeconomic statistics?", "opts": ["Global Financial Capital Fund", "Gross Fixed Capital Formation", "Government Fiscal Credit Facility", "Gross Foreign Currency Flow"], "ans": 1, "p1": "Definition: Measures net investment in physical fixed assets (machinery, infrastructure, buildings, equipment) within an economy.", "p2": "Exam Fact: GFCF is a key indicator of private and public capital expenditure (CapEx) in GDP expenditure calculations."}, {"id": 34, "cat": "Banking & Financial Abbreviations", "q": "What is the full form of IIBF?", "opts": ["International Institute of Banking & Finance", "Indian Institute of Banking and Finance", "Integrated Investment & Banking Federation", "Indian Industrial & Business Forum"], "ans": 1, "p1": "Headquarters: Mumbai, Maharashtra | Established: 1928.", "p2": "Exam Fact: IIBF conducts flagship banking professional certifications such as JAIIB and CAIIB."}, {"id": 35, "cat": "Banking & Financial Abbreviations", "q": "What is the full form of IPO?", "opts": ["Internal Payment Order", "Initial Public Offering", "Institutional Portfolio Option", "Indian Public Offering"], "ans": 1, "p1": "Function: First sale of shares by a privately owned company to the public to list on a stock exchange.", "p2": "Exam Fact: IPOs are regulated by SEBI and operate in the Primary Capital Market."}, {"id": 36, "cat": "Banking & Financial Abbreviations", "q": "What is the full form of IMPS?", "opts": ["Instant Money Processing System", "Immediate Payment Service", "Interbank Mobile Payment Service", "Integrated Monetary Payment Standard"], "ans": 1, "p1": "Operator: Managed by NPCI (National Payments Corporation of India) 24x7x365.", "p2": "Exam Fact: Alongside IMPS, India's other major electronic fund transfer rails are NEFT (no min/max limit) and RTGS (minimum ₹2 lakh)."}, {"id": 37, "cat": "Banking & Financial Abbreviations", "q": "What is the full form of LRS under RBI foreign exchange rules?", "opts": ["Liquidity Reserve Scheme", "Liberalised Remittance Scheme", "Local Remittance Standard", "Lending Rate Structure"], "ans": 1, "p1": "Introduction: Introduced by the RBI on 4 February 2004.", "p2": "Exam Fact: Under LRS, resident individuals (including minors) are permitted to freely remit up to USD 2,50,000 per financial year for permissible transactions."}, {"id": 38, "cat": "Banking & Financial Abbreviations", "q": "What is the full form of MSF in RBI's Liquidity Adjustment Facility?", "opts": ["Monetary Stability Fund", "Marginal Standing Facility", "Minimum Statutory Finance", "Market Support Facility"], "ans": 1, "p1": "Function: Emergency overnight liquidity window allowing Scheduled Commercial Banks to borrow from RBI by dipping into their SLR portfolio.", "p2": "Exam Fact: The MSF rate is typically 25 basis points (0.25%) above the RBI Policy Repo Rate and forms the upper ceiling of the LAF corridor."}, {"id": 39, "cat": "Banking & Financial Abbreviations", "q": "What is the full form of NBFC?", "opts": ["National Banking & Finance Corporation", "Non-Banking Financial Company", "Net Balance Financial Credit", "New Business Finance Council"], "ans": 1, "p1": "Key Restriction: NBFCs provide loans and credit facilities but cannot accept demand deposits (savings/current accounts).", "p2": "Exam Fact: NBFCs do not form part of the payment and settlement system and cannot issue cheques drawn on themselves."}, {"id": 40, "cat": "Banking & Financial Abbreviations", "q": "What is the full form of NCS in capital markets?", "opts": ["National Clearing System", "Non-Convertible Securities", "Net Capital Stock", "Nominal Credit Security"], "ans": 1, "p1": "Definition: Debt instruments (such as Non-Convertible Debentures) that cannot be converted into equity shares of the issuing company.", "p2": "Exam Fact: Public issue and listing of Non-Convertible Securities in India are regulated by SEBI."}, {"id": 41, "cat": "Banking & Financial Abbreviations", "q": "What is the full form of OFCB?", "opts": ["Overseas Fiscal Credit Bank", "Offshore Foreign Currency Borrowing", "Official Foreign Central Bank", "Open Financial Clearing Bureau"], "ans": 1, "p1": "Function: Raising debt/loans in foreign currency from international financial markets outside the domestic jurisdiction.", "p2": "Exam Fact: External Commercial Borrowings (ECBs) in India are governed by RBI guidelines under FEMA."}, {"id": 42, "cat": "Banking & Financial Abbreviations", "q": "What is the full form of PAN?", "opts": ["Personal Account Number", "Permanent Account Number", "Public Authorization Number", "Primary Asset Number"], "ans": 1, "p1": "Format: 10-character alphanumeric identifier (First 3 letters: AAA–ZZZ; 4th: holder status; 5th: first letter of surname/name; 4 digits; 1 check letter).", "p2": "Exam Fact: PAN is issued by the Income Tax Department and is mandatory for high-value financial transactions."}, {"id": 43, "cat": "Banking & Financial Abbreviations", "q": "What is the full form of PMS in wealth management?", "opts": ["Public Monetary System", "Portfolio Management Service", "Primary Market Security", "Personal Margin Scheme"], "ans": 1, "p1": "Definition: Customized investment management service offered by licensed portfolio managers for wealthy investors.", "p2": "Exam Fact: SEBI mandates a minimum investment threshold of ₹50 lakh for Portfolio Management Services (PMS) in India."}, {"id": 44, "cat": "Banking & Financial Abbreviations", "q": "What is the full form of QR (as in QR Code)?", "opts": ["Quick Receipt", "Quick Response", "Quantum Recognition", "Query Relay"], "ans": 1, "p1": "Function: Two-dimensional matrix barcode enabling instant optical scanning for digital payments and data access.", "p2": "Exam Fact: BharatQR and UPI QR codes power interoperable merchant payments across India."}, {"id": 45, "cat": "Banking & Financial Abbreviations", "q": "What is the full form of SCB in Indian banking classification?", "opts": ["State Cooperative Bank", "Scheduled Commercial Bank", "Special Credit Bureau", "Standard Central Bank"], "ans": 1, "p1": "Definition: Banks listed in the Second Schedule of the Reserve Bank of India Act, 1934.", "p2": "Exam Fact: SCBs include Public Sector Banks (12), Private Sector Banks (21), Regional Rural Banks (28 post-amalgamation), Small Finance Banks, Payments Banks, and Foreign Banks."}, {"id": 46, "cat": "Banking & Financial Abbreviations", "q": "What is the full form of SDF introduced by the RBI in 2022?", "opts": ["Special Development Fund", "Standing Deposit Facility", "Statutory Debt Framework", "Systemic Deposit Finance"], "ans": 1, "p1": "Function: Collateral-free liquidity absorption tool allowing RBI to absorb excess cash from commercial banks without pledging G-Secs.", "p2": "Exam Fact: Introduced in April 2022, the SDF rate sits 25 bps below the Policy Repo Rate and serves as the floor of the LAF corridor."}, {"id": 47, "cat": "Banking & Financial Abbreviations", "q": "What is the full form of SDI in fixed-income markets?", "opts": ["State Development Index", "Securitised Debt Instrument", "Secured Deposit Insurance", "Standard Debt Issue"], "ans": 1, "p1": "Definition: Financial securities created by pooling illiquid debt/receivables and issuing tradable certificates backed by those cash flows.", "p2": "Exam Fact: Listed Securitised Debt Instruments in India are regulated by SEBI."}, {"id": 48, "cat": "Banking & Financial Abbreviations", "q": "What is the full form of UPI, and in which year was it launched?", "opts": ["Unified Payment Interface — 2016", "Universal Payment Integration — 2014", "Unified Portal for India — 2018", "United Payment Infrastructure — 2015"], "ans": 0, "p1": "Launch: Launched by NPCI in April 2016 (UPI 2.0 launched in 2018).", "p2": "Exam Fact: Bhutan was the first country to adopt India's UPI standards for QR deployment, and UPI has expanded across 10+ international markets."}, {"id": 49, "cat": "Banking & Financial Abbreviations", "q": "What is the full form of UPU?", "opts": ["United Payments Union", "Universal Postal Union", "Urban Public Utility", "Unified Postal Undertaking"], "ans": 1, "p1": "Headquarters: Bern, Switzerland | Established: 1874 (Treaty of Bern).", "p2": "Exam Fact: Universal Postal Union is a specialized agency of the United Nations and one of the oldest international organizations."}, {"id": 50, "cat": "Banking & Financial Abbreviations", "q": "What is the full form of WPI?", "opts": ["World Poverty Index", "Wholesale Price Index", "Weighted Production Indicator", "Weekly Price Inflation"], "ans": 1, "p1": "Function: Measures price changes of goods traded in bulk at the wholesale level before retail sale.", "p2": "Exam Fact: Unlike CPI (which includes services), WPI tracks only goods and is published monthly by the Office of the Economic Adviser (Ministry of Commerce & Industry)."}, {"id": 51, "cat": "Indian States & UTs", "q": "What is the capital of Andhra Pradesh?", "opts": ["Visakhapatnam", "Amaravati", "Vijayawada", "Kurnool"], "ans": 1, "p1": "Location: Situated on the southern bank of the Krishna River in Guntur district.", "p2": "Exam Fact: Andhra Pradesh was the first state in India formed on a linguistic basis (1953)."}, {"id": 52, "cat": "Indian States & UTs", "q": "Which of the following National Parks are located in Andhra Pradesh?", "opts": ["Rajiv Gandhi (Rameswaram) NP & Papikonda NP", "Valmiki NP & Betla NP", "Murlen NP & Phawngpui NP", "Guindy NP & Mudumalai NP"], "ans": 0, "p1": "Other Major NP in Andhra Pradesh: Sri Venkateswara National Park.", "p2": "Exam Fact: Papikonda National Park lies in the Papi Hills across the Godavari River basin."}, {"id": 53, "cat": "Indian States & UTs", "q": "Which of the following International Airports are located in Andhra Pradesh?", "opts": ["Visakhapatnam International Airport & Vijayawada International Airport", "Agartala Airport & Imphal Airport", "Trivandrum Airport & Cochin Airport", "Gaya Airport & Patna Airport"], "ans": 0, "p1": "Additional Airport in AP: Tirupati International Airport (Renigunta).", "p2": "Exam Fact: Visakhapatnam Port is one of India's 13 major seaports and a natural deep-water harbour on the east coast."}, {"id": 54, "cat": "Indian States & UTs", "q": "Which of the following Bird Sanctuaries are located in Andhra Pradesh?", "opts": ["Atapaka, Kolleru & Pulicat Bird Sanctuaries", "Ranganathittu & Kumarakom Bird Sanctuaries", "Vedanthangal & Point Calimere Bird Sanctuaries", "Sultanpur & Bhindawas Bird Sanctuaries"], "ans": 0, "p1": "Geography: Kolleru Lake is one of India's largest freshwater lakes (located between Krishna and Godavari deltas).", "p2": "Exam Fact: Pulicat Lake is India's second-largest brackish water lagoon (after Chilika) and straddles Andhra Pradesh and Tamil Nadu."}, {"id": 55, "cat": "Indian States & UTs", "q": "What is the capital of Bihar?", "opts": ["Gaya", "Patna", "Muzaffarpur", "Bhagalpur"], "ans": 1, "p1": "Historical Name: Known in ancient times as Pataliputra.", "p2": "Exam Fact: Patna is situated on the southern bank of the River Ganga."}, {"id": 56, "cat": "Indian States & UTs", "q": "Which is the only National Park located in Bihar?", "opts": ["Valmiki National Park", "Kaziranga National Park", "Dudhwa National Park", "Simlipal National Park"], "ans": 0, "p1": "Location: West Champaran district of Bihar along the India–Nepal border.", "p2": "Exam Fact: Valmiki National Park is also a designated Project Tiger Reserve along the Gandak River."}, {"id": 57, "cat": "Indian States & UTs", "q": "What is the capital of Gujarat?", "opts": ["Ahmedabad", "Surat", "Gandhinagar", "Rajkot"], "ans": 2, "p1": "Landmark: Named after Mahatma Gandhi and located on the banks of the Sabarmati River.", "p2": "Exam Fact: GIFT City (India's first operational Smart City and IFSC) is located in Gandhinagar."}, {"id": 58, "cat": "Indian States & UTs", "q": "Which of the following National Parks are located in Gujarat?", "opts": ["Gir, Marine (Gulf of Kutch), Blackbuck (Velavadar) & Vansda National Parks", "Periyar, Eravikulam & Silent Valley National Parks", "Nameri, Orang & Manas National Parks", "Hemis, Dachigam & Kishtwar National Parks"], "ans": 0, "p1": "Unique Biodiversity: Gir National Park (Junagadh/Amreli) is the sole natural habitat of the Asiatic Lion.", "p2": "Exam Fact: Marine National Park in the Gulf of Kutch (Jamnagar) was India's first marine national park (established 1982)."}, {"id": 59, "cat": "Indian States & UTs", "q": "What is the capital of Kerala?", "opts": ["Kochi", "Kozhikode", "Thiruvananthapuram", "Thrissur"], "ans": 2, "p1": "Note from session: The state assembly passed a resolution to officially adopt the name 'Keralam'.", "p2": "Exam Fact: Thiruvananthapuram hosts the Vikram Sarabhai Space Centre (VSSC) of ISRO."}, {"id": 60, "cat": "Indian States & UTs", "q": "Which of the following Wildlife Sanctuaries are located in Kerala?", "opts": ["Karimpuzha Wildlife Sanctuary & Kurinjimala Sanctuary", "Trishna Wildlife Sanctuary & Rowa Wildlife Sanctuary", "Chandaka Dampara & Balukhand-Konark Sanctuaries", "Coringa & Kambalakonda Sanctuaries"], "ans": 0, "p1": "Location: Karimpuzha WLS is in Nilambur (Malappuram); Kurinjimala Sanctuary is in Idukki (protects Neelakurinji habitat).", "p2": "Exam Fact: Neelakurinji flowers bloom once every 12 years in the Western Ghats."}, {"id": 61, "cat": "Indian States & UTs", "q": "Which of the following National Parks are located in Kerala?", "opts": ["Eravikulam, Mathikettan Shola & Periyar National Parks", "Murlen & Phawngpui National Parks", "Guindy & Gulf of Mannar National Parks", "Valmiki & Rajgir National Parks"], "ans": 0, "p1": "Other NPs in Kerala: Silent Valley, Anamudi Shola, and Pambadum Shola National Parks.", "p2": "Exam Fact: Eravikulam National Park (Munnar) is famous for protecting the endangered Nilgiri Tahr and Anamudi (highest peak in South India)."}, {"id": 62, "cat": "Indian States & UTs", "q": "What is the capital of Mizoram?", "opts": ["Imphal", "Aizawl", "Kohima", "Agartala"], "ans": 1, "p1": "Geography: Mizoram is known as the 'Land of the Hill People' or 'Songbird of the East'.", "p2": "Exam Fact: The Tropic of Cancer (23.5° N) passes directly through Mizoram (and Tripura)."}, {"id": 63, "cat": "Indian States & UTs", "q": "Which of the following National Parks are located in Mizoram?", "opts": ["Murlen National Park & Phawngpui (Blue Mountain) National Park", "Nokrek National Park & Balpakram National Park", "Keibul Lamjao National Park & Shirui National Park", "Namdapha National Park & Mouling National Park"], "ans": 0, "p1": "Geography: Phawngpui (Blue Mountain) is the highest mountain peak in Mizoram.", "p2": "Exam Fact: Murlen National Park is located in Champhai district near the Myanmar border."}, {"id": 64, "cat": "Indian States & UTs", "q": "What is the capital of Odisha?", "opts": ["Cuttack", "Bhubaneswar", "Puri", "Sambalpur"], "ans": 1, "p1": "Statehood Day: Odisha celebrates Utkala Dibasa on 1 April.", "p2": "Exam Fact: Bhubaneswar, Puri, and Konark together form the 'Golden Triangle' of Odisha tourism."}, {"id": 65, "cat": "Indian States & UTs", "q": "Which of the following Wildlife Sanctuaries are located in Odisha?", "opts": ["Chandaka-Dampara WLS & Balukhand-Konark WLS", "Karimpuzha WLS & Kurinjimala WLS", "Gumti WLS & Sepahijala WLS", "Kolleru & Pulicat Sanctuaries"], "ans": 0, "p1": "Other Major Reserves in Odisha: Bhitarkanika National Park (saltwater crocodiles) and Simlipal Biosphere Reserve.", "p2": "Exam Fact: Gahirmatha Marine Sanctuary in Odisha is the world's largest nesting beach for Olive Ridley sea turtles."}, {"id": 66, "cat": "Indian States & UTs", "q": "What is the capital of Tamil Nadu?", "opts": ["Madurai", "Coimbatore", "Chennai", "Tiruchirappalli"], "ans": 2, "p1": "Port Importance: Chennai Port and Kamarajar Port (Ennore) are two major seaports in the Chennai region.", "p2": "Exam Fact: Tamil Nadu has the highest number of Ramsar wetland sites in India."}, {"id": 67, "cat": "Indian States & UTs", "q": "Which of the following National Parks are located in Tamil Nadu?", "opts": ["Guindy National Park & Mudumalai National Park", "Papikonda & Sri Venkateswara National Parks", "Eravikulam & Periyar National Parks", "Vansda & Blackbuck National Parks"], "ans": 0, "p1": "Other NPs in Tamil Nadu: Mukurthi NP, Indira Gandhi (Anamalai) NP, and Gulf of Mannar Marine NP.", "p2": "Exam Fact: Mudumalai National Park lies at the tri-junction of Tamil Nadu, Karnataka, and Kerala in the Nilgiri Biosphere Reserve."}, {"id": 68, "cat": "Indian States & UTs", "q": "What is the capital of Tripura?", "opts": ["Aizawl", "Agartala", "Imphal", "Shillong"], "ans": 1, "p1": "Geography: Tripura is surrounded by Bangladesh on three sides (north, west, and south).", "p2": "Exam Fact: Maharaja Bir Bikram Airport is located in Agartala, Tripura."}, {"id": 69, "cat": "Indian States & UTs", "q": "Which of the following Wildlife Sanctuaries are located in Tripura?", "opts": ["Gumti, Rowa, Trishna & Sepahijala Wildlife Sanctuaries", "Chandaka-Dampara & Sunabeda Wildlife Sanctuaries", "Peppara & Neyyar Wildlife Sanctuaries", "Bori & Pachmarhi Wildlife Sanctuaries"], "ans": 0, "p1": "National Parks in Tripura: Clouded Leopard National Park (inside Sepahijala) and Bison (Rajbari) National Park (inside Trishna).", "p2": "Exam Fact: Sepahijala Wildlife Sanctuary is famous for the spectacled monkey (Phayre's langur)."}, {"id": 70, "cat": "Indian States & UTs", "q": "What are the capitals of the Union Territory of Ladakh?", "opts": ["Leh and Kargil", "Srinagar and Jammu", "Leh only", "Kargil only"], "ans": 0, "p1": "Formation: Became a separate Union Territory (without legislature) on 31 October 2019.", "p2": "Exam Fact: Ladakh is the largest Union Territory in India by geographical area."}, {"id": 71, "cat": "Indian States & UTs", "q": "Who is listed as the Lieutenant Governor of Ladakh in the session?", "opts": ["B. D. Mishra", "Vinai Kumar Saxena", "R. K. Mathur", "Manoj Sinha"], "ans": 1, "p1": "Capitals: Leh and Kargil.", "p2": "Exam Fact: Pangong Tso and Tso Moriri (a Ramsar site) are famous high-altitude lakes in Ladakh."}, {"id": 72, "cat": "Indian States & UTs", "q": "Which famous National Park is located in Ladakh?", "opts": ["Hemis National Park", "Valmiki National Park", "Guindy National Park", "Murlen National Park"], "ans": 0, "p1": "Distinction: Hemis National Park is the largest National Park in India by area (over 4,400 sq. km).", "p2": "Exam Fact: Hemis National Park is globally famous for having the highest density of Snow Leopards."}, {"id": 73, "cat": "Indian States & UTs", "q": "Who is the Chief Minister of Puducherry?", "opts": ["N. Rangasamy", "V. Narayanasamy", "K. Kailashnathan", "M. K. Stalin"], "ans": 0, "p1": "Structure: Puducherry is a Union Territory with an elected Legislative Assembly (alongside Delhi and J&K).", "p2": "Exam Fact: Puducherry comprises four non-contiguous enclaves—Puducherry, Karaikal (in TN), Yanam (in AP), and Mahé (in Kerala)."}, {"id": 74, "cat": "Indian States & UTs", "q": "Who is the Lieutenant Governor of Puducherry?", "opts": ["Tamilisai Soundararajan", "K. Kailashnathan", "C. P. Radhakrishnan", "Kiran Bedi"], "ans": 1, "p1": "Chief Minister: N. Rangasamy.", "p2": "Exam Fact: K. Kailashnathan is a former IAS officer who previously served as Chief Principal Secretary to the Gujarat Chief Minister."}, {"id": 75, "cat": "Indian States & UTs", "q": "Which sports stadium complex is located in Puducherry?", "opts": ["Indira Gandhi Sports Complex (Outdoor Stadium)", "Narendra Modi Stadium", "Greenfield International Stadium", "Birsa Munda Hockey Stadium"], "ans": 0, "p1": "Location: Uppalam, Puducherry.", "p2": "Exam Fact: Puducherry also hosts the Siechem Cricket Stadium (CAP Ground)."}, {"id": 76, "cat": "Countries, Capitals & Currencies", "q": "What is the capital of Armenia?", "opts": ["Baku", "Tbilisi", "Yerevan", "Astana"], "ans": 2, "p1": "President: Vahagn Khachaturyan | Currency: Armenian Dram (AMD).", "p2": "Exam Fact: Armenia is a landlocked country in the South Caucasus region between Europe and Asia."}, {"id": 77, "cat": "Countries, Capitals & Currencies", "q": "What is the currency of Armenia?", "opts": ["Armenian Rial", "Armenian Dram", "Singapore Dollar", "Georgian Lari"], "ans": 1, "p1": "Capital: Yerevan | Symbol: ֏ | ISO Code: AMD.", "p2": "Exam Fact: Do not confuse Armenian Dram (AMD) with Moroccan Dirham (MAD) or UAE Dirham (AED)."}, {"id": 78, "cat": "Countries, Capitals & Currencies", "q": "Who is the President of Armenia?", "opts": ["Nikol Pashinyan", "Vahagn Khachaturyan", "Armen Sarkissian", "Ilham Aliyev"], "ans": 1, "p1": "Capital: Yerevan | Currency: Armenian Dram.", "p2": "Exam Fact: Nikol Pashinyan serves as the Prime Minister of Armenia while Vahagn Khachaturyan is President."}, {"id": 79, "cat": "Countries, Capitals & Currencies", "q": "What is the capital of Australia?", "opts": ["Sydney", "Melbourne", "Canberra", "Brisbane"], "ans": 2, "p1": "Currency: Australian Dollar (AUD) | Prime Minister: Anthony Albanese.", "p2": "Exam Fact: India and Australia signed the Economic Cooperation and Trade Agreement (ECTA) in 2022."}, {"id": 80, "cat": "Countries, Capitals & Currencies", "q": "What is the currency of Australia?", "opts": ["Australian Dollar", "Australian Pound", "Euro", "New Zealand Dollar"], "ans": 0, "p1": "Capital: Canberra | ISO Code: AUD.", "p2": "Exam Fact: Australia's central bank is the Reserve Bank of Australia (RBA), headquartered in Sydney."}, {"id": 81, "cat": "Countries, Capitals & Currencies", "q": "What is the capital of Bangladesh?", "opts": ["Chittagong", "Dhaka", "Sylhet", "Khulna"], "ans": 1, "p1": "Currency: Bangladeshi Taka (BDT).", "p2": "Exam Fact: Dhaka hosts the permanent Secretariat of BIMSTEC (Bay of Bengal Initiative for Multi-Sectoral Technical and Economic Cooperation)."}, {"id": 82, "cat": "Countries, Capitals & Currencies", "q": "What is the currency of Bangladesh?", "opts": ["Bangladeshi Rupee", "Bangladeshi Taka", "Kyat", "Ngultrum"], "ans": 1, "p1": "Capital: Dhaka | Symbol: ৳ | ISO Code: BDT.", "p2": "Exam Fact: India shares its longest international land border with Bangladesh (4,096.7 km)."}, {"id": 83, "cat": "Countries, Capitals & Currencies", "q": "What is the capital of Hungary?", "opts": ["Bucharest", "Budapest", "Prague", "Vienna"], "ans": 1, "p1": "Currency: Hungarian Forint (HUF) | Listed Leader: András Baka / Tamás Sulyok.", "p2": "Exam Fact: Budapest is divided by the River Danube into historic Buda and Pest."}, {"id": 84, "cat": "Countries, Capitals & Currencies", "q": "What is the currency of Hungary?", "opts": ["Euro", "Hungarian Forint", "Hungarian Dram", "Złoty"], "ans": 1, "p1": "Capital: Budapest | ISO Code: HUF.", "p2": "Exam Fact: Although Hungary is a member of the European Union, it retains its own national currency (Forint) rather than the Euro."}, {"id": 85, "cat": "Countries, Capitals & Currencies", "q": "Who is listed as the leader/President of Hungary in the session?", "opts": ["Viktor Orbán", "András Baka", "Katalin Novák", "János Áder"], "ans": 1, "p1": "Capital: Budapest | Currency: Hungarian Forint.", "p2": "Exam Fact: Hungary is a landlocked Central European country bordered by seven nations."}, {"id": 86, "cat": "Countries, Capitals & Currencies", "q": "Who is the Prime Minister of Japan?", "opts": ["Fumio Kishida", "Sanae Takaichi", "Shigeru Ishiba", "Anthony Albanese"], "ans": 1, "p1": "Capital: Tokyo | Currency: Japanese Yen (JPY).", "p2": "Exam Fact: Japan is a member of the G7, G20, and QUAD groupings."}, {"id": 87 let mode = 'learn';
let hideAnswers = false;
let userAnswers = {};

function setup() {
  const select = document.getElementById('catSelect');
  const uniqueCats = [...new Set(QUESTIONS.map(q => q.cat))];
  uniqueCats.forEach(cat => {
    const count = QUESTIONS.filter(q => q.cat === cat).length;
    const option = document.createElement('option');
    option.value = cat;
    option.textContent = `${cat} (${count})`;
    select.appendChild(option);
  });
  refreshStats();
  render();
}

function setMode(newMode) {
  mode = newMode;
  document.getElementById('btn-learn').classList.toggle('active', mode === 'learn');
  document.getElementById('btn-practice').classList.toggle('active', mode === 'practice');
  document.getElementById('blurBtn').classList.toggle('hidden', mode !== 'learn');
  render();
}

function toggleBlur() {
  hideAnswers = !hideAnswers;
  document.getElementById('blurBtn').textContent = hideAnswers
    ? '👁️ Show All Answers'
    : '👁️ Hide Answers (Self-Test)';
  render();
}

function getFilteredList() {
  const cat = document.getElementById('catSelect').value;
  const term = document.getElementById('searchBox').value.trim().toLowerCase();

  return QUESTIONS.filter(item => {
    if (cat !== 'ALL' && item.cat !== cat) return false;
    if (!term) return true;
    return (
      item.q.toLowerCase().includes(term) ||
      item.opts.some(o => o.toLowerCase().includes(term)) ||
      item.p1.toLowerCase().includes(term) ||
      item.p2.toLowerCase().includes(term)
    );
  });
}

function render() {
  const list = getFilteredList();
  document.getElementById('showingCount').textContent = `Showing ${list.length} question${list.length === 1 ? '' : 's'}`;
  const container = document.getElementById('cardsContainer');

  if (list.length === 0) {
    container.innerHTML = `<div class="no-results">No questions match your filter. Clear search or switch category.</div>`;
    return;
  }

  container.innerHTML = list
    .map(item => (mode === 'learn' ? buildLearnCard(item) : buildPracticeCard(item)))
    .join('');
}

function buildLearnCard(item) {
  const answerText = item.opts[item.ans];
  const blurClass = hideAnswers ? 'blurred' : '';
  return `
    <div class="card">
      <div class="card-top">
        <span class="badge-num">Q.${item.id}</span>
        <span class="badge-cat">${item.cat}</span>
      </div>
      <div class="question-text">${item.q}</div>
      <div class="learn-answer-box ${blurClass}" onclick="this.classList.remove('blurred')" title="Click to reveal answer">
        ✓ Answer: ${answerText}
      </div>
      <div class="exam-points">
        <div class="exam-points-heading">📌 2 Exam-Related Extra Points</div>
        <ul>
          <li>${item.p1}</li>
          <li>${item.p2}</li>
        </ul>
      </div>
    </div>
  `;
}

function buildPracticeCard(item) {
  const record = userAnswers[item.id];
  const isAnswered = record !== undefined;
  const letters = ['A', 'B', 'C', 'D'];

  const optsMarkup = item.opts
    .map((opt, idx) => {
      let cls = '';
      if (isAnswered) {
        if (idx === item.ans) cls = 'correct';
        else if (idx === record.picked && !record.correct) cls = 'wrong';
      }
      return `
        <button class="option-btn ${cls}" ${isAnswered ? 'disabled' : ''} onclick="selectOption(${item.id}, ${idx})">
          <span class="opt-circle">${letters[idx]}</span>
          <span>${opt}</span>
        </button>
      `;
    })
    .join('');

  const bannerMarkup = isAnswered
    ? record.correct
      ? `<span class="result-pill right">✓ Correct!</span>`
      : `<span class="result-pill wrong">✕ Wrong Answer</span>`
    : '';

  return `
    <div class="card" id="card-${item.id}">
      <div class="card-top">
        <span class="badge-num">Q.${item.id}</span>
        <span class="badge-cat">${item.cat}</span>
      </div>
      <div class="question-text">${item.q}</div>
      <div class="options-list">
        ${optsMarkup}
      </div>
      <div class="answer-panel ${isAnswered ? 'visible' : ''}" id="panel-${item.id}">
        <div class="result-banner">
          ${bannerMarkup}
          <div class="correct-label">Correct Answer: <span>${letters[item.ans]}. ${item.opts[item.ans]}</span></div>
        </div>
        <div class="exam-points">
          <div class="exam-points-heading">📌 2 Exam-Related Extra Points</div>
          <ul>
            <li>${item.p1}</li>
            <li>${item.p2}</li>
          </ul>
        </div>
      </div>
    </div>
  `;
}

function selectOption(qId, pickedIdx) {
  if (userAnswers[qId] !== undefined) return;
  const item = QUESTIONS.find(q => q.id === qId);
  if (!item) return;

  userAnswers[qId] = {
    picked: pickedIdx,
    correct: pickedIdx === item.ans
  };

  refreshStats();
  const cardEl = document.getElementById(`card-${qId}`);
  if (cardEl) {
    cardEl.outerHTML = buildPracticeCard(item);
  }
}

function refreshStats() {
  const keys = Object.keys(userAnswers);
  const attempted = keys.length;
  const correct = keys.filter(k => userAnswers[k].correct).length;
  const wrong = attempted - correct;

  document.getElementById('cnt-attempted').textContent = attempted;
  document.getElementById('cnt-correct').textContent = correct;
  document.getElementById('cnt-wrong').textContent = wrong;
}

function resetAll() {
  userAnswers = {};
  refreshStats();
  render();
}

setup();
</script>
