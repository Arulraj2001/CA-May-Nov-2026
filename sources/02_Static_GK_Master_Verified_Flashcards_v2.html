const container = document.getElementById("contentContainer");
const searchInput = document.getElementById("searchInput");
const toggleQuizBtn = document.getElementById("toggleQuizBtn");
const navPills = document.querySelectorAll(".nav-pill");
const visibleCountEl = document.getElementById("visibleCount");

let activeCategory = "all";
let quizMode = false;

function render() {
  container.innerHTML = "";
  const query = searchInput.value.trim().toLowerCase();
  let globalIndex = 0;
  let shownCount = 0;

  sections.forEach(sec => {
    if (activeCategory !== "all" && activeCategory !== sec.id) {
      globalIndex += sec.items.length;
      return;
    }

    const filteredItems = [];
    sec.items.forEach(item => {
      globalIndex++;
      const match = item.q.toLowerCase().includes(query) || item.a.toLowerCase().includes(query);
      if (match) {
        filteredItems.push({ num: globalIndex, ...item });
      }
    });

    if (filteredItems.length === 0) return;
    shownCount += filteredItems.length;

    const secEl = document.createElement("section");
    secEl.className = "section-block";

    const titleEl = document.createElement("div");
    titleEl.className = "section-title";
    titleEl.innerHTML = `<span>${sec.title}</span><span class="section-badge">${filteredItems.length} Questions</span>`;
    secEl.appendChild(titleEl);

    const gridEl = document.createElement("div");
    gridEl.className = "grid";

    filteredItems.forEach(item => {
      const card = document.createElement("div");
      card.className = "card";
      const badgeHtml = item.updated ? `<div class="updated-tag">Verified Fix</div>` : "";
      card.innerHTML = `
        <div class="q-header">
          <span class="q-num">#${item.num}</span>
          <div class="q-text">${item.q}</div>
        </div>
        <div class="a-box">${badgeHtml}<div>${item.a}</div></div>
      `;
      card.addEventListener("click", () => {
        if (quizMode) {
          card.classList.toggle("revealed");
        }
      });
      gridEl.appendChild(card);
    });

    secEl.appendChild(gridEl);
    container.appendChild(secEl);
  });

  visibleCountEl.textContent = shownCount === 152
    ? "Showing all 152 verified questions"
    : `Showing ${shownCount} of 152 verified questions`;
}

searchInput.addEventListener("input", render);

toggleQuizBtn.addEventListener("click", () => {
  quizMode = !quizMode;
  document.body.classList.toggle("quiz-mode", quizMode);
  toggleQuizBtn.textContent = quizMode ? "Quiz Mode: ON" : "Quiz Mode: OFF";
  document.querySelectorAll(".card.revealed").forEach(c => c.classList.remove("revealed"));
});

navPills.forEach(pill => {
  pill.addEventListener("click", () => {
    navPills.forEach(p => p.classList.remove("active"));
    pill.classList.add("active");
    activeCategory = pill.dataset.cat;
    render();
  });
});

render();
</script>
</body>
</html>
