<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>6-Month CA Rapid Revision (Part 2: Slides #101–#330) — Repeated Revision Questions — Learn & Practice (White Theme)</title>
<style>
  :root {
    --bg-page: #ffffff;
    --bg-panel: #f9fafb;
    --bg-card: #ffffff;
    --border-light: #e5e7eb;
    --border-strong: #d1d5db;
    --text-main: #111827;
    --text-sub: #4b5563;
    --text-muted: #6b7280;
    --primary: #1d4ed8;
    --primary-soft: #eff6ff;
    --primary-border: #bfdbfe;
    --green-bg: #f0fdf4;
    --green-border: #22c55e;
    --green-text: #15803d;
    --red-bg: #fef2f2;
    --red-border: #ef4444;
    --red-text: #b91c1c;
    --amber-bg: #fffbeb;
    --amber-border: #f59e0b;
    --amber-text: #92400e;
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  body {
    background-color: var(--bg-page);
    color: var(--text-main);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, Arial, sans-serif;
    line-height: 1.6;
  }

  header {
    background-color: #ffffff;
    border-bottom: 1px solid var(--border-light);
    position: sticky;
    top: 0;
    z-index: 100;
    padding: 14px 20px;
  }

  .header-wrap {
    max-width: 1060px;
    margin: 0 auto;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
  }

  .title-block h1 {
    font-size: 1.15rem;
    font-weight: 700;
    color: var(--text-main);
  }

  .title-block p {
    font-size: 0.8rem;
    color: var(--text-muted);
  }

  .tabs {
    display: inline-flex;
    background-color: var(--bg-panel);
    border: 1px solid var(--border-light);
    border-radius: 8px;
    padding: 4px;
    gap: 4px;
  }

  .tab-btn {
    border: none;
    background: transparent;
    color: var(--text-sub);
    font-size: 0.88rem;
    font-weight: 600;
    padding: 7px 16px;
    border-radius: 6px;
    cursor: pointer;
    transition: 0.15s ease;
  }

  .tab-btn.active {
    background-color: #ffffff;
    color: var(--primary);
    border: 1px solid var(--border-light);
    box-shadow: 0 1px 2px rgba(0, 0, 0, 0.06);
  }

  .main-container {
    max-width: 1060px;
    margin: 0 auto;
    padding: 20px;
  }

  .controls-bar {
    background-color: var(--bg-panel);
    border: 1px solid var(--border-light);
    border-radius: 10px;
    padding: 12px 16px;
    margin-bottom: 18px;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
  }

  .filter-group {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    flex: 1;
  }

  select, input[type="text"] {
    background-color: #ffffff;
    color: var(--text-main);
    border: 1px solid var(--border-strong);
    border-radius: 6px;
    padding: 8px 12px;
    font-size: 0.875rem;
    outline: none;
  }

  select:focus, input[type="text"]:focus {
    border-color: var(--primary);
  }

  input[type="text"] {
    min-width: 230px;
  }

  .score-group {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 8px;
    font-size: 0.84rem;
    font-weight: 600;
  }

  .pill {
    background-color: #ffffff;
    border: 1px solid var(--border-light);
    border-radius: 999px;
    padding: 4px 11px;
    color: var(--text-sub);
  }

  .pill.green {
    background-color: var(--green-bg);
    border-color: var(--green-border);
    color: var(--green-text);
  }

  .pill.red {
    background-color: var(--red-bg);
    border-color: var(--red-border);
    color: var(--red-text);
  }

  .action-btn {
    background-color: #ffffff;
    color: var(--text-main);
    border: 1px solid var(--border-strong);
    border-radius: 6px;
    padding: 6px 12px;
    font-size: 0.82rem;
    font-weight: 600;
    cursor: pointer;
  }

  .action-btn:hover {
    background-color: #f3f4f6;
  }

  .learn-subbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 14px;
    font-size: 0.85rem;
    color: var(--text-muted);
  }

  .card {
    background-color: #ffffff;
    border: 1px solid var(--border-light);
    border-radius: 10px;
    padding: 18px 20px;
    margin-bottom: 14px;
  }

  .card-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 8px;
    gap: 8px;
  }

  .badge-group {
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .badge-num {
    background-color: var(--primary-soft);
    color: var(--primary);
    border: 1px solid var(--primary-border);
    font-size: 0.78rem;
    font-weight: 700;
    padding: 2px 8px;
    border-radius: 5px;
  }

  .badge-seq {
    background-color: var(--bg-panel);
    color: var(--text-sub);
    border: 1px solid var(--border-light);
    font-size: 0.74rem;
    font-weight: 600;
    padding: 2px 7px;
    border-radius: 5px;
  }

  .badge-cat {
    font-size: 0.75rem;
    font-weight: 600;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 0.03em;
  }

  .question-text {
    font-size: 1.02rem;
    font-weight: 600;
    color: var(--text-main);
    margin-bottom: 12px;
  }

  .learn-answer-box {
    display: inline-block;
    background-color: var(--green-bg);
    border: 1px solid #bbf7d0;
    color: var(--green-text);
    font-weight: 700;
    font-size: 0.94rem;
    padding: 6px 12px;
    border-radius: 6px;
    margin-bottom: 12px;
  }

  .learn-answer-box.blurred {
    filter: blur(5px);
    cursor: pointer;
    user-select: none;
  }

  .exam-points {
    background-color: var(--amber-bg);
    border: 1px solid #fde68a;
    border-left: 4px solid var(--amber-border);
    border-radius: 6px;
    padding: 10px 14px;
  }

  .exam-points-heading {
    font-size: 0.78rem;
    font-weight: 700;
    color: var(--amber-text);
    text-transform: uppercase;
    letter-spacing: 0.03em;
    margin-bottom: 4px;
  }

  .exam-points ul {
    margin-left: 18px;
    font-size: 0.88rem;
    color: #374151;
  }

  .exam-points li {
    margin-bottom: 3px;
  }

  .options-list {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
    gap: 10px;
  }

  .option-btn {
    display: flex;
    align-items: center;
    gap: 10px;
    width: 100%;
    text-align: left;
    background-color: #ffffff;
    border: 1.5px solid var(--border-light);
    border-radius: 8px;
    padding: 11px 14px;
    font-size: 0.92rem;
    font-weight: 500;
    color: var(--text-main);
    cursor: pointer;
    transition: all 0.15s ease;
  }

  .option-btn:hover:not(:disabled) {
    border-color: var(--primary);
    background-color: var(--primary-soft);
  }

  .option-btn:disabled {
    cursor: default;
  }

  .opt-circle {
    width: 24px;
    height: 24px;
    border-radius: 50%;
    background-color: var(--bg-panel);
    border: 1px solid var(--border-strong);
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-size: 0.78rem;
    font-weight: 700;
    color: var(--text-sub);
    flex-shrink: 0;
  }

  .option-btn.correct {
    background-color: var(--green-bg);
    border-color: var(--green-border);
    color: var(--green-text);
    font-weight: 700;
  }

  .option-btn.correct .opt-circle {
    background-color: var(--green-border);
    border-color: var(--green-border);
    color: #ffffff;
  }

  .option-btn.wrong {
    background-color: var(--red-bg);
    border-color: var(--red-border);
    color: var(--red-text);
    font-weight: 600;
  }

  .option-btn.wrong .opt-circle {
    background-color: var(--red-border);
    border-color: var(--red-border);
    color: #ffffff;
  }

  .answer-panel {
    display: none;
    margin-top: 14px;
    padding-top: 14px;
    border-top: 1px solid var(--border-light);
    animation: slideDown 0.18s ease-out;
  }

  .answer-panel.visible {
    display: block;
  }

  .result-banner {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    margin-bottom: 10px;
  }

  .result-pill {
    font-size: 0.84rem;
    font-weight: 700;
    padding: 4px 10px;
    border-radius: 6px;
  }

  .result-pill.right {
    background-color: var(--green-bg);
    color: var(--green-text);
    border: 1px solid var(--green-border);
  }

  .result-pill.wrong {
    background-color: var(--red-bg);
    color: var(--red-text);
    border: 1px solid var(--red-border);
  }

  .correct-label {
    font-size: 0.92rem;
    font-weight: 700;
    color: var(--text-main);
  }

  .correct-label span {
    color: var(--green-text);
  }

  .hidden {
    display: none !important;
  }

  .no-results {
    text-align: center;
    padding: 40px 20px;
    border: 1px dashed var(--border-strong);
    border-radius: 10px;
    color: var(--text-muted);
  }

  @keyframes slideDown {
    from { opacity: 0; transform: translateY(-4px); }
    to { opacity: 1; transform: translateY(0); }
  }

  @media (max-width: 640px) {
    .header-wrap { flex-direction: column; align-items: flex-start; }
    .options-list { grid-template-columns: 1fr; }
    input[type="text"] { width: 100%; }
  }
</style>
</head>

<header>
  <div class="header-wrap">
    <div class="title-block">
      <h1>6-Month CA Rapid Revision (Part 2: Slides #101–#330) — Repeated Revision Questions (47 Questions)</h1>

<script>
const QUESTIONS = [{"id": 1, "slide_q": 102, "cat": "National & State Affairs", "q": "Regarding 'Shabdalok', India's first immersive language museum: (1) Inaugurated by Union Home Minister Amit Shah in July 2026; (2) Located at National Library (Belvedere Estate), Kolkata (not National Museum); (3) Operates under Ministry of Culture; (4) Total outlay is ₹41 crore (not ₹141 crore). Which statements are correct?", "opts": ["2 and 4 only", "1, 2, and 3 only", "1 and 3 only (Located at National Library, Kolkata; outlay ₹41 crore)", "All 1, 2, 3, and 4"], "ans": 2, "p1": "Repeated From Previous Sources: Priya Ma'am 6M GA (New) Q.106 & Veranda Part 1 (New) Q.43 — Classical languages & Ministry of Culture initiatives.", "p2": "Exam Fact: Celebrates India's linguistic diversity across classical and scheduled Indian languages."}, {"id": 2, "slide_q": 103, "cat": "Government Schemes & Initiatives", "q": "Which Union Minister launched India's first Organic Fisheries Cluster under the Pradhan Mantri Matsya Sampada Yojana (PMMSY)?", "opts": ["George Kurian", "Sarbananda Sonowal", "Shivraj Singh Chouhan", "Rajiv Ranjan Singh (Lalan Singh)"], "ans": 3, "p1": "Repeated From Previous Sources: Priya Ma'am 6M GA (New) Q.39 & Q.87 — PM Matsya Sampada Yojana (PMMSY) & Union Minister Rajiv Ranjan Singh.", "p2": "Exam Fact: India's first Organic Fisheries Cluster was launched in Soreng district, Sikkim."}, {"id": 3, "slide_q": 108, "cat": "Government Schemes & Initiatives", "q": "Pradhan Mantri Jan Dhan Yojana (PMJDY) completed 12 years in August 2026. What is the accidental insurance cover (alongside ₹10,000 overdraft limit) provided under PMJDY?", "opts": ["₹2 lakh", "₹1 lakh", "₹3 lakh", "₹5 lakh"], "ans": 0, "p1": "Repeated From Previous Sources: Banking Awareness PDF (New) Q.53–Q.55 — PM Jan Dhan Yojana (PMJDY) ₹2 lakh accidental cover & ₹10,000 overdraft limit.", "p2": "Exam Fact: PMJDY was launched on 28 August 2014 under the Department of Financial Services, Ministry of Finance."}, {"id": 4, "slide_q": 109, "cat": "Government Schemes & Initiatives", "q": "Regarding India's first Organic Fisheries Cluster: (1) Located in Soreng district, Sikkim; (2) Notified as an organic cluster; (3) Implemented under PMMSY (not Blue Revolution Scheme). Which statements are correct?", "opts": ["1 and 3 only", "1 and 2 only (Implemented under PMMSY)", "2 and 3 only", "All 1, 2, and 3"], "ans": 1, "p1": "Repeated From Previous Sources: Priya Ma'am 6M GA (New) Q.106 — PMMSY & Sikkim organic initiatives.", "p2": "Exam Fact: Sikkim was India's first 100% organic farming state (2016)."}, {"id": 5, "slide_q": 114, "cat": "International & Summits", "q": "Regarding the India–New Zealand Free Trade Agreement (FTA): (1) Signed on 27 April 2026; (2) Came into force on 20 October 2026; (3) Bilateral trade target is USD 20 billion (not USD 50 billion); (4) Grants 5,000 temporary employment visas (not 15,000). Which statements are correct?", "opts": ["2 and 4 only", "1, 2, and 3 only", "1 and 2 only (Trade target USD 20 billion; 5,000 temporary visas)", "All 1, 2, 3, and 4"], "ans": 2, "p1": "Repeated From Previous Sources: Priya Ma'am 6M GA (New) Q.177 — India–New Zealand bilateral cooperation.", "p2": "Exam Fact: Capital of New Zealand: Wellington | Currency: New Zealand Dollar."}, {"id": 6, "slide_q": 116, "cat": "Awards & Festivals", "q": "What was the official theme of the 21st International Tipitaka Chanting Ceremony held at Bodh Gaya?", "opts": ["Different Languages, One Meaning", "Peace and Harmony Through Dhamma", "Buddhism for Global Sustainability", "Wisdom Across Borders"], "ans": 0, "p1": "Repeated From Previous Sources: Veranda Part 1 (New) Q.55 — 21st International Tipitaka Chanting Ceremony at Bodh Gaya (Theme: 'Different Languages, One Meaning').", "p2": "Exam Fact: Tipitaka (Three Baskets) is the traditional canonical scripture of Theravada Buddhism."}, {"id": 7, "slide_q": 118, "cat": "National & State Affairs", "q": "India Post launched its first drone-based mail and parcel service in Himachal Pradesh connecting Rehar Dhar Branch Post Office with the Head Post Office in which district?", "opts": ["Shimla", "Kangra", "Mandi", "Kullu"], "ans": 2, "p1": "Repeated From Previous Sources: Priya Ma'am 6M GA (New) Q.38 — India Post's first drone-based mail & parcel service in Himachal Pradesh.", "p2": "Exam Fact: Reduces mountain transit time from hours to minutes."}, {"id": 8, "slide_q": 119, "cat": "Government Schemes & Initiatives", "q": "Regarding the expanded GOBARdhan Scheme: (1) Administered price set at ₹2,110; (2) Administered price fixed for 10 years up to 2036; (3) 3% CBG blending mandate by 2027; (4) Overall blending target is 5% (not 10%). Which statements are correct?", "opts": ["All 1, 2, 3, and 4", "1 and 4 only", "2 and 4 only", "1, 2, and 3 only (Overall CBG blending target is 5%)"], "ans": 3, "p1": "Repeated From Previous Sources: Veranda Part 1 (Repeated) Q.21 — Expanded GOBARdhan Scheme (2027–2036) & CBG blending.", "p2": "Exam Fact: Supports circular economy and reduces crude natural gas imports."}, {"id": 9, "slide_q": 120, "cat": "National & State Affairs", "q": "Who is the Lieutenant Governor of Ladakh?", "opts": ["Vinai Kumar Saxena", "Manoj Sinha", "B. D. Mishra", "R. K. Mathur"], "ans": 0, "p1": "Repeated From Previous Sources: August Static HTML Q.71 & October Static HTML Q.55 — Lieutenant Governor of Ladakh: Vinai Kumar Saxena.", "p2": "Exam Fact: Ladakh was constituted as a separate Union Territory on 31 October 2019."}, {"id": 10, "slide_q": 122, "cat": "Health, Science & Technology", "q": "Regarding NITI Aayog's Data Centre Evaluation Framework: (1) Capacity projected to grow from 375 MW (2020) to 1.5 GW (2026); (2) Developed by NITI Frontier Tech Hub; (3) Built on 5 pillars (not 3); (4) Tax holiday for eligible foreign cloud workloads extended till 2047 (not 2035). Which statements are correct?", "opts": ["2 and 4 only", "1, 2, and 3 only", "1 and 2 only (Built on 5 pillars; tax holiday till 2047)", "All 1, 2, 3, and 4"], "ans": 2, "p1": "Repeated From Previous Sources: Veranda Part 1 (New) Q.14 — NITI Aayog Data Centre Evaluation Framework (5 pillars; tax holiday till 2047).", "p2": "Exam Fact: NITI Aayog is chaired ex-officio by Prime Minister Narendra Modi."}, {"id": 11, "slide_q": 124, "cat": "Environment, Parks & GI Tags", "q": "Regarding Glaw Lake Ramsar Site: (1) India's 101st Ramsar Site; (2) Located inside Kamlang Tiger Reserve & Wildlife Sanctuary; (3) First Ramsar site of Arunachal Pradesh; (4) Situated at an elevation of 1,168 meters (not 3,168 m). Which statements are correct?", "opts": ["1, 2, and 3 only (Elevation is 1,168 meters)", "1 and 4 only", "2 and 4 only", "All 1, 2, 3, and 4"], "ans": 0, "p1": "Repeated From Previous Sources: Priya Ma'am 6M GA (New) Q.75 & Veranda Part 1 (New) Q.24 — Glaw Lake (India's 101st Ramsar Site) in Arunachal Pradesh.", "p2": "Exam Fact: Capital of Arunachal Pradesh: Itanagar | CM: Pema Khandu | Governor: Lt. Gen. K. T. Parnaik."}, {"id": 12, "slide_q": 127, "cat": "Environment, Parks & GI Tags", "q": "In which year was the WMO/ESCAP Panel on Tropical Cyclones naming list (under which Tamil name 'Murasu' was contributed) initiated for North Indian Ocean cyclones?", "opts": ["2018", "2000", "2010", "2004"], "ans": 3, "p1": "Repeated From Previous Sources: Veranda Part 1 (New) Q.30 — Cyclonic Storm 'Murasu' & North Indian Ocean cyclone naming.", "p2": "Exam Fact: 13 member countries (Bangladesh, India, Iran, Maldives, Myanmar, Oman, Pakistan, Qatar, Saudi Arabia, Sri Lanka, Thailand, UAE, Yemen) contribute 13 names each (169 names total)."}, {"id": 13, "slide_q": 130, "cat": "Government Schemes & Initiatives", "q": "What monthly financial assistance is provided to eligible women under the 'Delhi Lakshmi Yojana'?", "opts": ["₹2,000", "₹1,500", "₹2,500", "₹3,000"], "ans": 2, "p1": "Repeated From Previous Sources: Priya Ma'am 6M GA (New) Q.67 — Delhi Lakshmi Yojana ₹2,500 monthly financial assistance.", "p let mode = 'learn';
let hideAnswers = false;
let userAnswers = {};

function setup() {
  const select = document.getElementById('catSelect');
  const uniqueCats = [...new Set(QUESTIONS.map(q => q.cat))];
  uniqueCats.forEach(cat => {
    const count = QUESTIONS.filter(q => q.cat === cat).length;
    const option = document.createElement('option');
    option.value = cat;
    option.textContent = `${cat} (${count})`;
    select.appendChild(option);
  });
  refreshStats();
  render();
}

function setMode(newMode) {
  mode = newMode;
  document.getElementById('btn-learn').classList.toggle('active', mode === 'learn');
  document.getElementById('btn-practice').classList.toggle('active', mode === 'practice');
  document.getElementById('blurBtn').classList.toggle('hidden', mode !== 'learn');
  render();
}

function toggleBlur() {
  hideAnswers = !hideAnswers;
  document.getElementById('blurBtn').textContent = hideAnswers
    ? '👁️ Show All Answers'
    : '👁️ Hide Answers (Self-Test)';
  render();
}

function getFilteredList() {
  const cat = document.getElementById('catSelect').value;
  const term = document.getElementById('searchBox').value.trim().toLowerCase();

  return QUESTIONS.filter(item => {
    if (cat !== 'ALL' && item.cat !== cat) return false;
    if (!term) return true;
    return (
      item.q.toLowerCase().includes(term) ||
      item.opts.some(o => o.toLowerCase().includes(term)) ||
      item.p1.toLowerCase().includes(term) ||
      item.p2.toLowerCase().includes(term) ||
      String(item.slide_q).includes(term)
    );
  });
}

function render() {
  const list = getFilteredList();
  document.getElementById('showingCount').textContent = `Showing ${list.length} question${list.length === 1 ? '' : 's'}`;
  const container = document.getElementById('cardsContainer');

  if (list.length === 0) {
    container.innerHTML = `<div class="no-results">No questions match your filter. Clear search or switch category.</div>`;
    return;
  }

  container.innerHTML = list
    .map(item => (mode === 'learn' ? buildLearnCard(item) : buildPracticeCard(item)))
    .join('');
}

function buildLearnCard(item) {
  const answerText = item.opts[item.ans];
  const blurClass = hideAnswers ? 'blurred' : '';
  return `
    <div class="card">
      <div class="card-top">
        <div class="badge-group">
          <span class="badge-num">Q.${item.id}</span>
          <span class="badge-seq">Slide #${item.slide_q}</span>
        </div>
        <span class="badge-cat">${item.cat}</span>
      </div>
      <div class="question-text">${item.q}</div>
      <div class="learn-answer-box ${blurClass}" onclick="this.classList.remove('blurred')" title="Click to reveal answer">
        ✓ Answer: ${answerText}
      </div>
      <div class="exam-points">
        <div class="exam-points-heading">📌 2 Exam-Related Extra Points</div>
        <ul>
          <li>${item.p1}</li>
          <li>${item.p2}</li>
        </ul>
      </div>
    </div>
  `;
}

function buildPracticeCard(item) {
  const record = userAnswers[item.id];
  const isAnswered = record !== undefined;
  const letters = ['A', 'B', 'C', 'D'];

  const optsMarkup = item.opts
    .map((opt, idx) => {
      let cls = '';
      if (isAnswered) {
        if (idx === item.ans) cls = 'correct';
        else if (idx === record.picked && !record.correct) cls = 'wrong';
      }
      return `
        <button class="option-btn ${cls}" ${isAnswered ? 'disabled' : ''} onclick="selectOption(${item.id}, ${idx})">
          <span class="opt-circle">${letters[idx]}</span>
          <span>${opt}</span>
        </button>
      `;
    })
    .join('');

  const bannerMarkup = isAnswered
    ? record.correct
      ? `<span class="result-pill right">✓ Correct!</span>`
      : `<span class="result-pill wrong">✕ Wrong Answer</span>`
    : '';

  return `
    <div class="card" id="card-${item.id}">
      <div class="card-top">
        <div class="badge-group">
          <span class="badge-num">Q.${item.id}</span>
          <span class="badge-seq">Slide #${item.slide_q}</span>
        </div>
        <span class="badge-cat">${item.cat}</span>
      </div>
      <div class="question-text">${item.q}</div>
      <div class="options-list">
        ${optsMarkup}
      </div>
      <div class="answer-panel ${isAnswered ? 'visible' : ''}" id="panel-${item.id}">
        <div class="result-banner">
          ${bannerMarkup}
          <div class="correct-label">Correct Answer: <span>${letters[item.ans]}. ${item.opts[item.ans]}</span></div>
        </div>
        <div class="exam-points">
          <div class="exam-points-heading">📌 2 Exam-Related Extra Points</div>
          <ul>
            <li>${item.p1}</li>
            <li>${item.p2}</li>
          </ul>
        </div>
      </div>
    </div>
  `;
}

function selectOption(qId, pickedIdx) {
  if (userAnswers[qId] !== undefined) return;
  const item = QUESTIONS.find(q => q.id === qId);
  if (!item) return;

  userAnswers[qId] = {
    picked: pickedIdx,
    correct: pickedIdx === item.ans
  };

  refreshStats();
  const cardEl = document.getElementById(`card-${qId}`);
  if (cardEl) {
    cardEl.outerHTML = buildPracticeCard(item);
  }
}

function refreshStats() {
  const keys = Object.keys(userAnswers);
  const attempted = keys.length;
  const correct = keys.filter(k => userAnswers[k].correct).length;
  const wrong = attempted - correct;

  document.getElementById('cnt-attempted').textContent = attempted;
  document.getElementById('cnt-correct').textContent = correct;
  document.getElementById('cnt-wrong').textContent = wrong;
}

function resetAll() {
  userAnswers = {};
  refreshStats();
  render();
}

setup();
</script>
