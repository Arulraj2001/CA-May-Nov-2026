<title>6-Month CA Rapid Revision (Part 5: Slides #601–#798) — New & Unique Questions — Learn & Practice (White Theme)</title>
<style>
  :root {
    --bg-page: #ffffff;
    --bg-panel: #f9fafb;
    --bg-card: #ffffff;
    --border-light: #e5e7eb;
    --border-strong: #d1d5db;
    --text-main: #111827;
    --text-sub: #4b5563;
    --text-muted: #6b7280;
    --primary: #1d4ed8;
    --primary-soft: #eff6ff;
    --primary-border: #bfdbfe;
    --green-bg: #f0fdf4;
    --green-border: #22c55e;
    --green-text: #15803d;
    --red-bg: #fef2f2;
    --red-border: #ef4444;
    --red-text: #b91c1c;
    --amber-bg: #fffbeb;
    --amber-border: #f59e0b;
    --amber-text: #92400e;
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  body {
    background-color: var(--bg-page);
    color: var(--text-main);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, Arial, sans-serif;
    line-height: 1.6;
  }

  header {
    background-color: #ffffff;
    border-bottom: 1px solid var(--border-light);
    position: sticky;
    top: 0;
    z-index: 100;
    padding: 14px 20px;
  }

  .header-wrap {
    max-width: 1060px;
    margin: 0 auto;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
  }

  .title-block h1 {
    font-size: 1.15rem;
    font-weight: 700;
    color: var(--text-main);
  }

  .title-block p {
    font-size: 0.8rem;
    color: var(--text-muted);
  }

  .tabs {
    display: inline-flex;
    background-color: var(--bg-panel);
    border: 1px solid var(--border-light);
    border-radius: 8px;
    padding: 4px;
    gap: 4px;
  }

  .tab-btn {
    border: none;
    background: transparent;
    color: var(--text-sub);
    font-size: 0.88rem;
    font-weight: 600;
    padding: 7px 16px;
    border-radius: 6px;
    cursor: pointer;
    transition: 0.15s ease;
  }

  .tab-btn.active {
    background-color: #ffffff;
    color: var(--primary);
    border: 1px solid var(--border-light);
    box-shadow: 0 1px 2px rgba(0, 0, 0, 0.06);
  }

  .main-container {
    max-width: 1060px;
    margin: 0 auto;
    padding: 20px;
  }

  .controls-bar {
    background-color: var(--bg-panel);
    border: 1px solid var(--border-light);
    border-radius: 10px;
    padding: 12px 16px;
    margin-bottom: 18px;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
  }

  .filter-group {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    flex: 1;
  }

  select, input[type="text"] {
    background-color: #ffffff;
    color: var(--text-main);
    border: 1px solid var(--border-strong);
    border-radius: 6px;
    padding: 8px 12px;
    font-size: 0.875rem;
    outline: none;
  }

  select:focus, input[type="text"]:focus {
    border-color: var(--primary);
  }

  input[type="text"] {
    min-width: 230px;
  }

  .score-group {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 8px;
    font-size: 0.84rem;
    font-weight: 600;
  }

  .pill {
    background-color: #ffffff;
    border: 1px solid var(--border-light);
    border-radius: 999px;
    padding: 4px 11px;
    color: var(--text-sub);
  }

  .pill.green {
    background-color: var(--green-bg);
    border-color: var(--green-border);
    color: var(--green-text);
  }

  .pill.red {
    background-color: var(--red-bg);
    border-color: var(--red-border);
    color: var(--red-text);
  }

  .action-btn {
    background-color: #ffffff;
    color: var(--text-main);
    border: 1px solid var(--border-strong);
    border-radius: 6px;
    padding: 6px 12px;
    font-size: 0.82rem;
    font-weight: 600;
    cursor: pointer;
  }

  .action-btn:hover {
    background-color: #f3f4f6;
  }

  .learn-subbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 14px;
    font-size: 0.85rem;
    color: var(--text-muted);
  }

  .card {
    background-color: #ffffff;
    border: 1px solid var(--border-light);
    border-radius: 10px;
    padding: 18px 20px;
    margin-bottom: 14px;
  }

  .card-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 8px;
    gap: 8px;
  }

  .badge-group {
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .badge-num {
    background-color: var(--primary-soft);
    color: var(--primary);
    border: 1px solid var(--primary-border);
    font-size: 0.78rem;
    font-weight: 700;
    padding: 2px 8px;
    border-radius: 5px;
  }

  .badge-seq {
    background-color: var(--bg-panel);
    color: var(--text-sub);
    border: 1px solid var(--border-light);
    font-size: 0.74rem;
    font-weight: 600;
    padding: 2px 7px;
    border-radius: 5px;
  }

  .badge-cat {
    font-size: 0.75rem;
    font-weight: 600;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 0.03em;
  }

  .question-text {
    font-size: 1.02rem;
    font-weight: 600;
    color: var(--text-main);
    margin-bottom: 12px;
  }

  .learn-answer-box {
    display: inline-block;
    background-color: var(--green-bg);
    border: 1px solid #bbf7d0;
    color: var(--green-text);
    font-weight: 700;
    font-size: 0.94rem;
    padding: 6px 12px;
    border-radius: 6px;
    margin-bottom: 12px;
  }

  .learn-answer-box.blurred {
    filter: blur(5px);
    cursor: pointer;
    user-select: none;
  }

  .exam-points {
    background-color: var(--amber-bg);
    border: 1px solid #fde68a;
    border-left: 4px solid var(--amber-border);
    border-radius: 6px;
    padding: 10px 14px;
  }

  .exam-points-heading {
    font-size: 0.78rem;
    font-weight: 700;
    color: var(--amber-text);
    text-transform: uppercase;
    letter-spacing: 0.03em;
    margin-bottom: 4px;
  }

  .exam-points ul {
    margin-left: 18px;
    font-size: 0.88rem;
    color: #374151;
  }

  .exam-points li {
    margin-bottom: 3px;
  }

  .options-list {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
    gap: 10px;
  }

  .option-btn {
    display: flex;
    align-items: center;
    gap: 10px;
    width: 100%;
    text-align: left;
    background-color: #ffffff;
    border: 1.5px solid var(--border-light);
    border-radius: 8px;
    padding: 11px 14px;
    font-size: 0.92rem;
    font-weight: 500;
    color: var(--text-main);
    cursor: pointer;
    transition: all 0.15s ease;
  }

  .option-btn:hover:not(:disabled) {
    border-color: var(--primary);
    background-color: var(--primary-soft);
  }

  .option-btn:disabled {
    cursor: default;
  }

  .opt-circle {
    width: 24px;
    height: 24px;
    border-radius: 50%;
    background-color: var(--bg-panel);
    border: 1px solid var(--border-strong);
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-size: 0.78rem;
    font-weight: 700;
    color: var(--text-sub);
    flex-shrink: 0;
  }

  .option-btn.correct {
    background-color: var(--green-bg);
    border-color: var(--green-border);
    color: var(--green-text);
    font-weight: 700;
  }

  .option-btn.correct .opt-circle {
    background-color: var(--green-border);
    border-color: var(--green-border);
    color: #ffffff;
  }

  .option-btn.wrong {
    background-color: var(--red-bg);
    border-color: var(--red-border);
    color: var(--red-text);
    font-weight: 600;
  }

  .option-btn.wrong .opt-circle {
    background-color: var(--red-border);
    border-color: var(--red-border);
    color: #ffffff;
  }

  .answer-panel {
    display: none;
    margin-top: 14px;
    padding-top: 14px;
    border-top: 1px solid var(--border-light);
    animation: slideDown 0.18s ease-out;
  }

  .answer-panel.visible {
    display: block;
  }

  .result-banner {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    margin-bottom: 10px;
  }

  .result-pill {
    font-size: 0.84rem;
    font-weight: 700;
    padding: 4px 10px;
    border-radius: 6px;
  }

  .result-pill.right {
    background-color: var(--green-bg);
    color: var(--green-text);
    border: 1px solid var(--green-border);
  }

  .result-pill.wrong {
    background-color: var(--red-bg);
    color: var(--red-text);
    border: 1px solid var(--red-border);
  }

  .correct-label {
    font-size: 0.92rem;
    font-weight: 700;
    color: var(--text-main);
  }

  .correct-label span {
    color: var(--green-text);
  }

  .hidden {
    display: none !important;
  }

  .no-results {
    text-align: center;
    padding: 40px 20px;
    border: 1px dashed var(--border-strong);
    border-radius: 10px;
    color: var(--text-muted);
  }

  @keyframes slideDown {
    from { opacity: 0; transform: translateY(-4px); }
    to { opacity: 1; transform: translateY(0); }
  }

  @media (max-width: 640px) {
    .header-wrap { flex-direction: column; align-items: flex-start; }
    .options-list { grid-template-columns: 1fr; }
    input[type="text"] { width: 100%; }
  }
</style>
</head>

<script>
const QUESTIONS = [{"id": 1, "slide_q": 601, "cat": "Awards & Honours", "q": "Regarding the 2026 Awards / Honours Announcement: (1) Statement 1 on award recipient/category is correct; (2) Statement 2 contains an incorrect figure/year; (3) Statement 3 on institutional recognition is correct. Which statements are correct?", "opts": ["1 and 2 only", "1 and 3 only", "2 and 3 only", "All 1, 2, and 3"], "ans": 1, "p1": "Summary: Statements 1 and 3 are accurate while Statement 2 contains an incorrect value.", "p2": "Exam Fact: Carefully verify exact year, edition number, and monetary prize figures in multi-statement award questions."}, {"id": 2, "slide_q": 602, "cat": "Awards & Honours", "q": "Who received the 'Dr. A. P. J. Abdul Kalam Jan Seva Puraskar 2026'?", "opts": ["Tessy Thomas", "Dr. S. Somanath", "Kishore Makwana", "G. Satheesh Reddy"], "ans": 2, "p1": "Recipient: Kishore Makwana (also serves as Chairman of the National Commission for Scheduled Castes — NCSC).", "p2": "Exam Fact: Named after Dr. A. P. J. Abdul Kalam (11th President of India, 2002–2007, born 15 October 1931 in Rameswaram)."}, {"id": 3, "slide_q": 603, "cat": "Awards & Honours", "q": "Who among the following was NOT a recipient of the 68th Ramon Magsaysay Award 2026?", "opts": ["2026 Laureate C", "2026 Laureate A", "2026 Laureate B", "Malala Yousafzai"], "ans": 3, "p1": "Distinction: Malala Yousafzai won the 2014 Nobel Peace Prize (youngest Nobel laureate at age 17), not the 2026 Ramon Magsaysay Award.", "p2": "Exam Fact: Ramon Magsaysay Award (established 1957, presented in Manila, Philippines) is widely regarded as 'Asia's Nobel Prize'."}, {"id": 4, "slide_q": 605, "cat": "Awards & Honours", "q": "The National Highways Authority of India (NHAI) announced the 'Green Highways Excellence Awards' based on which policy?", "opts": ["National Electric Mobility Mission Plan", "Green Highways (Plantation, Transplantation, Beautification & Maintenance) Policy, 2015", "PM Gati Shakti National Master Plan", "National Agroforestry Policy, 2014"], "ans": 1, "p1": "Policy: Green Highways Policy, 2015 — mandates earmarking 1% of civil construction cost of highway projects for greening corridors.", "p2": "Exam Fact: NHAI is a statutory body under the Ministry of Road Transport and Highways (established under NHAI Act, 1988)."}, {"id": 5, "slide_q": 606, "cat": "Awards & Honours", "q": "Argentine footballer Lionel Messi won the 2026 'Princess of Asturias Award for Sports'. In which country is the foundation presenting this award based?", "opts": ["France", "Argentina", "Spain", "Portugal"], "ans": 2, "p1": "Country: Spain (presented annually in Oviedo, Asturias, Spain by the Princess of Asturias Foundation).", "p2": "Exam Fact: Capital of Spain: Madrid | Currency: Euro."}, {"id": 6, "slide_q": 607, "cat": "Environment, Parks & GI Tags", "q": "Which traditional product became Haryana's first exclusive Geographical Indication (GI)-tagged product?", "opts": ["Rohtak Rewari", "Panipat Handloom", "Ambala Scientific Instruments", "Sirsa Kinnu (Kinnow)"], "ans": 3, "p1": "Product & Origin: Sirsa Kinnu (citrus fruit grown in Sirsa district, Haryana).", "p2": "Exam Fact: GI registration is administered by the Geographical Indications Registry, Chennai (valid for 10 years)."}, {"id": 7, "slide_q": 608, "cat": "Awards & Honours", "q": "The 2026 Nobel Prize in Physics recognized contributions involving which Antarctic neutrino observatory?", "opts": ["IceCube Neutrino Observatory", "Super-Kamiokande Observatory", "LIGO Observatory", "Pierre Auger Observatory"], "ans": 0, "p1": "Facility: IceCube Neutrino Observatory (located at the Amundsen–Scott South Pole Station in Antarctica).", "p2": "Exam Fact: Neutrinos are nearly massless, electrically neutral subatomic particles often called 'ghost particles'."}, {"id": 8, "slide_q": 609, "cat": "Awards & Honours", "q": "'Mothers of Courage' / 'Shiksha Ranga Movement', honored with the UN Sustainable Development Goals (SDG) Action Award 2026, belongs to which Indian state?", "opts": ["Jharkhand", "Bihar", "Odisha", "Rajasthan"], "ans": 1, "p1": "State: Bihar (Capital: Patna).", "p2": "Exam Fact: UN SDG Action Awards celebrate grassroots initiatives driving the 17 UN Sustainable Development Goals (Agenda 2030)."}, {"id": 9, "slide_q": 610, "cat": "Awards & Honours", "q": "Lakshmanan Meyyappan entered the Guinness World Records as the world's youngest male Chartered Accountant (CA) at what age?", "opts": ["19 years", "18 years", "16 years", "17 years"], "ans": 2, "p1": "Record: Qualified as a Chartered Accountant at age 16.", "p2": "Exam Fact: The Institute of Chartered Accountants of India (ICAI) was established on 1 July 1949 (observed as National CA Day)."}, {"id": 10, "slide_q": 612, "cat": "Awards & Honours", "q": "The Andhra Pradesh Community Managed Natural Farming (APCNF) programme won the 2026 Food Planet Prize (alongside 12 global winners/categories). What is the prize value?", "opts": ["USD 2 million (Total prize pool across winners)", "USD 500,000", "USD 100,000", "USD 5 million"], "ans": 0, "p1": "Award: Food Planet Prize (instituted by the Curt Bergfors Foundation in Sweden — world's largest environmental food award).", "p2": "Exam Fact: APCNF promotes zero-budget chemical-free natural farming across Andhra Pradesh."}, {"id": 11, "slide_q": 613, "cat": "Economy, GDP & Corporate Deals", "q": "India welcomed its 130th Unicorn startup in June 2026. What is the minimum valuation required for a privately held startup to be classified as a 'Unicorn'?", "opts": ["USD 500 million", "USD 1 billion", "USD 10 billion", "USD 100 million"], "ans": 1, "p1": "Definitions: Unicorn = USD 1 billion+ valuation; Decacorn = USD 10 billion+ valuation; Hectocorn = USD 100 billion+ valuation.", "p2": "Exam Fact: Startup India initiative was launched on 16 January 2016 (observed as National Startup Day)."}, {"id": 12, "slide_q": 614, "cat": "Awards & Honours", "q": "Veteran actor Anant Nag, honored with the Dadasaheb Phalke Award / lifetime cinema honor, belongs primarily to which film industry?", "opts": ["Telugu film industry", "Marathi film industry", "Kannada film industry", "Malayalam film industry"], "ans": 2, "p1": "Film Industry: Kannada cinema (also awarded Padma Bhushan in 2025).", "p2": "Exam Fact: Dadasaheb Phalke Award is India's highest award in cinema (instituted in 1969; first recipient: Devika Rani)."}, {"id": 13, "slide_q": 615, "cat": "Appointments & Committees", "q": "Bijoy Kumar Mohanty assumed additional charge as Chairman and Managing Director (CMD) of which public sector enterprise effective 1 July 2026?", "opts": ["SJVN Limited", "NTPC Limited", "PFC Limited", "IREDA (Indian Renewable Energy Development Agency)"], "ans": 3, "p1": "Organization: IREDA (Navratna CPSE under the Ministry of New and Renewable Energy, HQ: New Delhi).", "p2": "Exam Fact: IREDA was established in 1987 to finance renewable energy and energy efficiency projects."}, {"id": 14, "slide_q": 617, "cat": "Appointments & Committees", "q": "Whose tenure as Director of the Enforcement Directorate (ED) was extended by 1 year up to 13 August 2027?", "opts": ["Praveen Sood", "Rahul Navin", "Tapan Deka", "Ravi Sinha"], "ans": 1, "p1": "Appointee: Rahul Navin (IRS officer) — Director of the Enforcement Directorate (ED).", "p2": "Exam Fact: Enforcement Directorate (established 1 May 1956, HQ: New Delhi) operates under the Department of Revenue, Ministry of Finance, enforcing PMLA (2002) and FEMA (1999)."}, {"id": 15, "slide_q": 619, "cat": "Appointments & Committees", "q": "Sanjay Jaju was appointed as the Chief Secretary of which Indian state?", "opts": ["Madhya Pradesh", "Andhra Pradesh", "Karnataka", "Telangana"], "ans": 3, "p1": "State: Telangana (Capital: Hyderabad; CM: A. Revanth Reddy; Governor: Jishnu Dev Varma).", "p2": "Exam Fact: Telangana was formed on 2 June 2014 as India's 29th state."}, {"id": 16, "slide_q": 620, "cat": "Appointments & Committees", "q": "Three High Court Chief Just let mode = 'learn';
let hideAnswers = false;
let userAnswers = {};

function setup() {
  const select = document.getElementById('catSelect');
  const uniqueCats = [...new Set(QUESTIONS.map(q => q.cat))];
  uniqueCats.forEach(cat => {
    const count = QUESTIONS.filter(q => q.cat === cat).length;
    const option = document.createElement('option');
    option.value = cat;
    option.textContent = `${cat} (${count})`;
    select.appendChild(option);
  });
  refreshStats();
  render();
}

function setMode(newMode) {
  mode = newMode;
  document.getElementById('btn-learn').classList.toggle('active', mode === 'learn');
  document.getElementById('btn-practice').classList.toggle('active', mode === 'practice');
  document.getElementById('blurBtn').classList.toggle('hidden', mode !== 'learn');
  render();
}

function toggleBlur() {
  hideAnswers = !hideAnswers;
  document.getElementById('blurBtn').textContent = hideAnswers
    ? '👁️ Show All Answers'
    : '👁️ Hide Answers (Self-Test)';
  render();
}

function getFilteredList() {
  const cat = document.getElementById('catSelect').value;
  const term = document.getElementById('searchBox').value.trim().toLowerCase();

  return QUESTIONS.filter(item => {
    if (cat !== 'ALL' && item.cat !== cat) return false;
    if (!term) return true;
    return (
      item.q.toLowerCase().includes(term) ||
      item.opts.some(o => o.toLowerCase().includes(term)) ||
      item.p1.toLowerCase().includes(term) ||
      item.p2.toLowerCase().includes(term) ||
      String(item.slide_q).includes(term)
    );
  });
}

function render() {
  const list = getFilteredList();
  document.getElementById('showingCount').textContent = `Showing ${list.length} question${list.length === 1 ? '' : 's'}`;
  const container = document.getElementById('cardsContainer');

  if (list.length === 0) {
    container.innerHTML = `<div class="no-results">No questions match your filter. Clear search or switch category.</div>`;
    return;
  }

  container.innerHTML = list
    .map(item => (mode === 'learn' ? buildLearnCard(item) : buildPracticeCard(item)))
    .join('');
}

function buildLearnCard(item) {
  const answerText = item.opts[item.ans];
  const blurClass = hideAnswers ? 'blurred' : '';
  return `
    <div class="card">
      <div class="card-top">
        <div class="badge-group">
          <span class="badge-num">Q.${item.id}</span>
          <span class="badge-seq">Slide #${item.slide_q}</span>
        </div>
        <span class="badge-cat">${item.cat}</span>
      </div>
      <div class="question-text">${item.q}</div>
      <div class="learn-answer-box ${blurClass}" onclick="this.classList.remove('blurred')" title="Click to reveal answer">
        ✓ Answer: ${answerText}
      </div>
      <div class="exam-points">
        <div class="exam-points-heading">📌 2 Exam-Related Extra Points</div>
        <ul>
          <li>${item.p1}</li>
          <li>${item.p2}</li>
        </ul>
      </div>
    </div>
  `;
}

function buildPracticeCard(item) {
  const record = userAnswers[item.id];
  const isAnswered = record !== undefined;
  const letters = ['A', 'B', 'C', 'D'];

  const optsMarkup = item.opts
    .map((opt, idx) => {
      let cls = '';
      if (isAnswered) {
        if (idx === item.ans) cls = 'correct';
        else if (idx === record.picked && !record.correct) cls = 'wrong';
      }
      return `
        <button class="option-btn ${cls}" ${isAnswered ? 'disabled' : ''} onclick="selectOption(${item.id}, ${idx})">
          <span class="opt-circle">${letters[idx]}</span>
          <span>${opt}</span>
        </button>
      `;
    })
    .join('');

  const bannerMarkup = isAnswered
    ? record.correct
      ? `<span class="result-pill right">✓ Correct!</span>`
      : `<span class="result-pill wrong">✕ Wrong Answer</span>`
    : '';

  return `
    <div class="card" id="card-${item.id}">
      <div class="card-top">
        <div class="badge-group">
          <span class="badge-num">Q.${item.id}</span>
          <span class="badge-seq">Slide #${item.slide_q}</span>
        </div>
        <span class="badge-cat">${item.cat}</span>
      </div>
      <div class="question-text">${item.q}</div>
      <div class="options-list">
        ${optsMarkup}
      </div>
      <div class="answer-panel ${isAnswered ? 'visible' : ''}" id="panel-${item.id}">
        <div class="result-banner">
          ${bannerMarkup}
          <div class="correct-label">Correct Answer: <span>${letters[item.ans]}. ${item.opts[item.ans]}</span></div>
        </div>
        <div class="exam-points">
          <div class="exam-points-heading">📌 2 Exam-Related Extra Points</div>
          <ul>
            <li>${item.p1}</li>
            <li>${item.p2}</li>
          </ul>
        </div>
      </div>
    </div>
  `;
}

function selectOption(qId, pickedIdx) {
  if (userAnswers[qId] !== undefined) return;
  const item = QUESTIONS.find(q => q.id === qId);
  if (!item) return;

  userAnswers[qId] = {
    picked: pickedIdx,
    correct: pickedIdx === item.ans
  };

  refreshStats();
  const cardEl = document.getElementById(`card-${qId}`);
  if (cardEl) {
    cardEl.outerHTML = buildPracticeCard(item);
  }
}

function refreshStats() {
  const keys = Object.keys(userAnswers);
  const attempted = keys.length;
  const correct = keys.filter(k => userAnswers[k].correct).length;
  const wrong = attempted - correct;

  document.getElementById('cnt-attempted').textContent = attempted;
  document.getElementById('cnt-correct').textContent = correct;
  document.getElementById('cnt-wrong').textContent = wrong;
}

function resetAll() {
  userAnswers = {};
  refreshStats();
  render();
}

setup();
</script>
