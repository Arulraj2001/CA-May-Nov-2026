    --text-sub: #4b5563;

  }

  }

  }

    align-items: center;
    justify-content: space-between;
    gap: 12px;
  }

  .filter-group {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    flex: 1;
  }

  select, input[type="text"] {
    background-color: #ffffff;

    border: 1px solid var(--border-strong);

  }

    min-width: 230px;
  }

  .score-group {

    border-color: var(--green-border);

  }

  .pill.red {
    background-color: var(--red-bg);
    border-color: var(--red-border);
    color: var(--red-text);

  .action-btn {

    border: 1px solid var(--border-strong);

    font-weight: 600;
    cursor: pointer;
  }

  .action-btn:hover {
    background-color: #f3f4f6;
  }

  .learn-subbar {

    align-items: center;

    color: var(--text-muted);

  .card-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 8px;
    gap: 8px;
  }

  .badge-group {
    display: flex;
    align-items: center;
    gap: 6px;

  .badge-num {
    background-color: var(--primary-soft);
    color: var(--primary);

  .badge-seq {
    background-color: var(--bg-panel);
    color: var(--text-sub);
    border: 1px solid var(--border-light);
    font-size: 0.74rem;
    font-weight: 600;
    padding: 2px 7px;
    border-radius: 5px;
  }

  .badge-cat {
    font-size: 0.75rem;
    font-weight: 600;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 0.03em;
  }

  .question-text {
    font-size: 1.02rem;
    font-weight: 600;
    color: var(--text-main);
    margin-bottom: 12px;
  }

  .learn-answer-box {
    display: inline-block;
    background-color: var(--green-bg);
    border: 1px solid #bbf7d0;
    color: var(--green-text);
    font-weight: 700;
    font-size: 0.94rem;
    padding: 6px 12px;
    border-radius: 6px;
    margin-bottom: 12px;
  }

  .learn-answer-box.blurred {
    filter: blur(5px);
    cursor: pointer;
    user-select: none;
  }

  .exam-points {
    background-color: var(--amber-bg);
    border: 1px solid #fde68a;
    border-left: 4px solid var(--amber-border);
    border-radius: 6px;

  .exam-points-heading {
    font-size: 0.78rem;

    letter-spacing: 0.03em;
    margin-bottom: 4px;

    text-align: left;

    padding: 11px 14px;

    color: var(--text-main);
    cursor: pointer;

  .option-btn:hover:not(:disabled) {
    border-color: var(--primary);
    background-color: var(--primary-soft);

  .option-btn:disabled {
    cursor: default;
  }

  .opt-circle {

    height: 24px;
    border-radius: 50%;
    background-color: var(--bg-panel);
    border: 1px solid var(--border-strong);

    align-items: center;
    justify-content: center;
    font-size: 0.78rem;
    font-weight: 700;
    color: var(--text-sub);

    border-color: var(--green-border);
    color: var(--green-text);
    font-weight: 700;

    border-color: var(--green-border);
    color: #ffffff;
  }

  .option-btn.wrong {
    background-color: var(--red-bg);
    border-color: var(--red-border);
    color: var(--red-text);
    font-weight: 600;
  }

  .option-btn.wrong .opt-circle {
    background-color: var(--red-border);
    border-color: var(--red-border);
    color: #ffffff;
  }

  .answer-panel {
    display: none;
    margin-top: 14px;
    padding-top: 14px;
    border-top: 1px solid var(--border-light);
    animation: slideDown 0.18s ease-out;

  .answer-panel.visible {
    display: block;
  }

  .result-banner {

    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    margin-bottom: 10px;
  }

  .result-pill {

    font-weight: 700;

  }

  .result-pill.wrong {

    color: var(--red-text);
    border: 1px solid var(--red-border);
  }

  .correct-label {
    font-size: 0.92rem;
    font-weight: 700;
    color: var(--text-main);
  }

  .correct-label span {
    color: var(--green-text);
  }

  .hidden {
    display: none !important;
  }

  .no-results {

    padding: 40px 20px;
    border: 1px dashed var(--border-strong);
    border-radius: 10px;
    color: var(--text-muted);
  }

  @keyframes slideDown {
    from { opacity: 0; transform: translateY(-4px); }
    to { opacity: 1; transform: translateY(0); }
  }

  @media (max-width: 640px) {
    .header-wrap { flex-direction: column; align-items: flex-start; }
    .options-list { grid-template-columns: 1fr; }
    input[type="text"] { width: 100%; }
  }
</style>
</head>

wth projected at 3.0% for 2026. Which statements are correct?", "opts": ["1, 3, and 4 (FY28 India growth projected at 6.7%)", "1 and 2 only", "2 and 3 only", "All 1, 2, 3, and 4"], "ans": 0, "p1": "Correction Note: IMF projected India's FY28 GDP growth at 6.7% (and 6.4% for FY27), with global growth at 3.0%.", "p2": "Exam Fact: IMF publishes the World Economic Outlook (WEO) twice a year (April and October)."}, {"id": 12, "slide_q": 467, "cat": "Economy, GDP & Corporate Deals", "q": "Adani Ports and Special Economic Zone (APSEZ) secured a 10-year USD 70 million marine services contract for the first Liquefied Natural Gas (LNG) export project of which country?", "opts": ["Mozambique", "Argentina", "Guyana", "Suriname"], "ans": 1, "p1": "Country: Argentina (Capital: Buenos Aires | Currency: Argentine Peso).", "p2": "Exam Fact: Supports Argentina's Vaca Muerta shale gas LNG export terminal operations."}, {"id": 13, "slide_q": 468, "cat": "Economy, GDP & Corporate Deals", "q": "According to the Ministry of Finance's Monthly Economic Review (October 2026), what was India's nowcasted Q2 FY27 GDP growth rate?", "opts": ["7.80%", "6.80%", "7.35%", "6.50%"], "ans": 2, "p1": "Growth Figure: 7.35% Q2 FY27 real GDP growth nowcast.", "p2": "Exam Fact: Published monthly by the Department of Economic Affairs (DEA), Ministry of Finance."}, {"id": 14, "slide_q": 470, "cat": "Economy, GDP & Corporate Deals", "q": "Adani Energy Solutions topped the FTSE Global ESG Ranking for electric utilities with what ESG score (out of 100)?", "opts": ["90", "82", "85", "95"], "ans": 0, "p1": "Score: 90 out of 100 in FTSE Russell's Global ESG Ranking for utilities.", "p2": "Exam Fact: ESG stands for Environmental, Social, and Governance."}, {"id": 15, "slide_q": 471, "cat": "Science, Space & Technology", "q": "Amazon announced a USD 48 billion investment in India by 2030. In which year was Amazon Web Services (AWS) originally launched?", "opts": ["2002", "2006", "2010", "2012"], "ans": 1, "p1": "AWS tricity trade across Africa.", "p2": "Exam Fact: Africa50 was founded by African governments and the African Development Bank (AfDB, HQ: Abidjan, Côte d'Ivoire)."}, {"id": 19, "slide_q": 476, "cat": "Science, Space & Technology", "q": "Adani Enterprises and US-based Jabil formed a 50:50 joint venture to manufacture what in India?", "opts": ["Submarine Sonar Systems", "Commercial Passenger Aircraft", "AI Data Center Hardware", "Semiconductor Lithography Machines"], "ans": 2, "p1": "Joint Venture: 50:50 JV between Adani Enterprises and Jabil (Headquarters: St. Petersburg, Florida, USA).", "p2": "Exam Fact: Manufactures hyperscale AI server racks and data center hardware in India."}, {"id": 20, "slide_q": 477, "cat": "Economy, GDP & Corporate Deals", "q": "To what percentage did the Asian Development Bank (ADB) revise India's inflation forecast?", "opts": ["5.6%", "4.5%", "4.8%", "5.2%"], "ans": 3, "p1": "Forecast: 5.2% CPI inflation projection by ADB.", "p2": "Exam Fact: ADB publishes the Asian Development Outlook (ADO)."}, {"id": 21, "slide_q": 478, "cat": "Economy, GDP & Corporate Deals", "q": "Regarding the WTO Global Trade Outlook and Statistics Report (October 2026): (1) Global merchandise trade growth projected at 3.9% for CY 2026; (2) Merchandise trade growth for CY 2027 projected at 4.1% (not 2.7%); (3) Asia's export growth projected at 9.9%; (4) Commercial services trade growth projected at 3.3%. Which statements are correct?", "opts": ["1, 3, and 4 only (CY 2027 merchandise trade growth is 4.1%)", "1 and 2 only", "2 and 3 only", "All 1, 2, 3, and 4"], "ans": 0, "p1": "Correction Note: Statement 2 is incorrect because CY 2027 merchandise trade growth is projected at 4.1% (not 2.7%).", "p2": "Exam Fact: WTO was established on 1 January 1995 (replacing GATT) and is headquartered in Geneva, Switzerland."}, {"id": 22, "slide_q": 479, "cat": "Economy, GDP & Corporate Deals", "q": "In October 2026, India's gross GST collections crossed the ₹2 lakh crore mark for wh let mode = 'learn';
let hideAnswers = false;
let userAnswers = {};

function setup() {
  const select = document.getElementById('catSelect');
  const uniqueCats = [...new Set(QUESTIONS.map(q => q.cat))];
  uniqueCats.forEach(cat => {
    const count = QUESTIONS.filter(q => q.cat === cat).length;
    const option = document.createElement('option');
    option.value = cat;
    option.textContent = `${cat} (${count})`;
    select.appendChild(option);
  });
  refreshStats();
  render();
}

function setMode(newMode) {
  mode = newMode;
  document.getElementById('btn-learn').classList.toggle('active', mode === 'learn');
  document.getElementById('btn-practice').classList.toggle('active', mode === 'practice');
  document.getElementById('blurBtn').classList.toggle('hidden', mode !== 'learn');
  render();
}

function toggleBlur() {
  hideAnswers = !hideAnswers;
  document.getElementById('blurBtn').textContent = hideAnswers
    ? '👁️ Show All Answers'
    : '👁️ Hide Answers (Self-Test)';
  render();
}

function getFilteredList() {
  const cat = document.getElementById('catSelect').value;
  const term = document.getElementById('searchBox').value.trim().toLowerCase();

  return QUESTIONS.filter(item => {
    if (cat !== 'ALL' && item.cat !== cat) return false;
    if (!term) return true;
    return (
      item.q.toLowerCase().includes(term) ||
      item.opts.some(o => o.toLowerCase().includes(term)) ||
      item.p1.toLowerCase().includes(term) ||
      item.p2.toLowerCase().includes(term) ||
      String(item.slide_q).includes(term)
    );
  });
}

function render() {
  const list = getFilteredList();
  document.getElementById('showingCount').textContent = `Showing ${list.length} question${list.length === 1 ? '' : 's'}`;
  const container = document.getElementById('cardsContainer');

  if (list.length === 0) {
    container.innerHTML = `<div class="no-results">No questions match your filter. Clear search or switch category.</div>`;
    return;
  }

  container.innerHTML = list
    .map(item => (mode === 'learn' ? buildLearnCard(item) : buildPracticeCard(item)))
    .join('');
}

function buildLearnCard(item) {
  const answerText = item.opts[item.ans];
  const blurClass = hideAnswers ? 'blurred' : '';
  return `
    <div class="card">
      <div class="card-top">
        <div class="badge-group">
          <span class="badge-num">Q.${item.id}</span>
          <span class="badge-seq">Slide #${item.slide_q}</span>
        </div>
        <span class="badge-cat">${item.cat}</span>
      </div>
      <div class="question-text">${item.q}</div>
      <div class="learn-answer-box ${blurClass}" onclick="this.classList.remove('blurred')" title="Click to reveal answer">
        ✓ Answer: ${answerText}
      </div>
      <div class="exam-points">
        <div class="exam-points-heading">📌 2 Exam-Related Extra Points</div>
        <ul>
          <li>${item.p1}</li>
          <li>${item.p2}</li>
        </ul>
      </div>
    </div>
  `;
}

function buildPracticeCard(item) {
  const record = userAnswers[item.id];
  const isAnswered = record !== undefined;
  const letters = ['A', 'B', 'C', 'D'];

  const optsMarkup = item.opts
    .map((opt, idx) => {
      let cls = '';
      if (isAnswered) {
        if (idx === item.ans) cls = 'correct';
        else if (idx === record.picked && !record.correct) cls = 'wrong';
      }
      return `
        <button class="option-btn ${cls}" ${isAnswered ? 'disabled' : ''} onclick="selectOption(${item.id}, ${idx})">
          <span class="opt-circle">${letters[idx]}</span>
          <span>${opt}</span>
        </button>
      `;
    })
    .join('');

  const bannerMarkup = isAnswered
    ? record.correct
      ? `<span class="result-pill right">✓ Correct!</span>`
      : `<span class="result-pill wrong">✕ Wrong Answer</span>`
    : '';

  return `
    <div class="card" id="card-${item.id}">
      <div class="card-top">
        <div class="badge-group">
          <span class="badge-num">Q.${item.id}</span>
          <span class="badge-seq">Slide #${item.slide_q}</span>
        </div>
        <span class="badge-cat">${item.cat}</span>
      </div>
      <div class="question-text">${item.q}</div>
      <div class="options-list">
        ${optsMarkup}
      </div>
      <div class="answer-panel ${isAnswered ? 'visible' : ''}" id="panel-${item.id}">
        <div class="result-banner">
          ${bannerMarkup}
          <div class="correct-label">Correct Answer: <span>${letters[item.ans]}. ${item.opts[item.ans]}</span></div>
        </div>
        <div class="exam-points">
          <div class="exam-points-heading">📌 2 Exam-Related Extra Points</div>
          <ul>
            <li>${item.p1}</li>
            <li>${item.p2}</li>
          </ul>
        </div>
      </div>
    </div>
  `;
}

function selectOption(qId, pickedIdx) {
  if (userAnswers[qId] !== undefined) return;
  const item = QUESTIONS.find(q => q.id === qId);
  if (!item) return;

  userAnswers[qId] = {
    picked: pickedIdx,
    correct: pickedIdx === item.ans
  };

  refreshStats();
  const cardEl = document.getElementById(`card-${qId}`);
  if (cardEl) {
    cardEl.outerHTML = buildPracticeCard(item);
  }
}

function refreshStats() {
  const keys = Object.keys(userAnswers);
  const attempted = keys.length;
  const correct = keys.filter(k => userAnswers[k].correct).length;
  const wrong = attempted - correct;

  document.getElementById('cnt-attempted').textContent = attempted;
  document.getElementById('cnt-correct').textContent = correct;
  document.getElementById('cnt-wrong').textContent = wrong;
}

function resetAll() {
  userAnswers = {};
  refreshStats();
  render();
}

setup();
</script>
