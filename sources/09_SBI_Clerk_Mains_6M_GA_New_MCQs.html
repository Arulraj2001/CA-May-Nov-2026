<!DOCTYPE html>
<html lang="en">
<head>

<title>SBI Clerk Mains 6-Month GA — New & Unique Questions — Learn & Practice (White Theme)</title>
<style>
  :root {
    --bg-page: #ffffff;
    --bg-panel: #f9fafb;
    --bg-card: #ffffff;
    --border-light: #e5e7eb;
    --border-strong: #d1d5db;
    --text-main: #111827;
    --text-sub: #4b5563;
    --text-muted: #6b7280;
    --primary: #1d4ed8;
    --primary-soft: #eff6ff;
    --primary-border: #bfdbfe;
    --green-bg: #f0fdf4;
    --green-border: #22c55e;
    --green-text: #15803d;
    --red-bg: #fef2f2;
    --red-border: #ef4444;
    --red-text: #b91c1c;
    --amber-bg: #fffbeb;
    --amber-border: #f59e0b;
    --amber-text: #92400e;
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  body {
    background-color: var(--bg-page);
    color: var(--text-main);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, Arial, sans-serif;
    line-height: 1.6;
  }

  header {
    background-color: #ffffff;
    border-bottom: 1px solid var(--border-light);
    position: sticky;
    top: 0;
    z-index: 100;
    padding: 14px 20px;
  }

  .header-wrap {
    max-width: 1060px;
    margin: 0 auto;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
  }

  .title-block h1 {
    font-size: 1.15rem;
    font-weight: 700;
    color: var(--text-main);
  }

  .title-block p {
    font-size: 0.8rem;
    color: var(--text-muted);
  }

  .tabs {
    display: inline-flex;
    background-color: var(--bg-panel);
    border: 1px solid var(--border-light);
    border-radius: 8px;
    padding: 4px;
    gap: 4px;
  }

  .tab-btn {
    border: none;
    background: transparent;
    color: var(--text-sub);
    font-size: 0.88rem;
    font-weight: 600;
    padding: 7px 16px;
    border-radius: 6px;
    cursor: pointer;
    transition: 0.15s ease;
  }

  .tab-btn.active {
    background-color: #ffffff;
    color: var(--primary);
    border: 1px solid var(--border-light);
    box-shadow: 0 1px 2px rgba(0, 0, 0, 0.06);
  }

  .main-container {
    max-width: 1060px;
    margin: 0 auto;
    padding: 20px;
  }

  .controls-bar {
    background-color: var(--bg-panel);
    border: 1px solid var(--border-light);
    border-radius: 10px;
    padding: 12px 16px;
    margin-bottom: 18px;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
  }

  .filter-group {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    flex: 1;
  }

  select, input[type="text"] {
    background-color: #ffffff;
    color: var(--text-main);
    border: 1px solid var(--border-strong);
    border-radius: 6px;
    padding: 8px 12px;
    font-size: 0.875rem;
    outline: none;
  }

  select:focus, input[type="text"]:focus {
    border-color: var(--primary);
  }

  input[type="text"] {
    min-width: 230px;
  }

  .score-group {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 8px;
    font-size: 0.84rem;
    font-weight: 600;
  }

  .pill {
    background-color: #ffffff;
    border: 1px solid var(--border-light);
    border-radius: 999px;
    padding: 4px 11px;
    color: var(--text-sub);
  }

  .pill.green {
    background-color: var(--green-bg);
    border-color: var(--green-border);
    color: var(--green-text);
  }

  .pill.red {
    background-color: var(--red-bg);
    border-color: var(--red-border);
    color: var(--red-text);
  }

  .action-btn {
    background-color: #ffffff;
    color: var(--text-main);
    border: 1px solid var(--border-strong);
    border-radius: 6px;
    padding: 6px 12px;
    font-size: 0.82rem;
    font-weight: 600;
    cursor: pointer;
  }

  .action-btn:hover {
    background-color: #f3f4f6;
  }

  .learn-subbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 14px;
    font-size: 0.85rem;
    color: var(--text-muted);
  }

  .card {
    background-color: #ffffff;
    border: 1px solid var(--border-light);
    border-radius: 10px;
    padding: 18px 20px;
    margin-bottom: 14px;
  }

  .card-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 8px;
    gap: 8px;
  }

  .badge-group {
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .badge-num {
    background-color: var(--primary-soft);
    color: var(--primary);
    border: 1px solid var(--primary-border);
    font-size: 0.78rem;
    font-weight: 700;
    padding: 2px 8px;
    border-radius: 5px;
  }

  .badge-seq {
    background-color: var(--bg-panel);
    color: var(--text-sub);
    border: 1px solid var(--border-light);
    font-size: 0.74rem;
    font-weight: 600;
    padding: 2px 7px;
    border-radius: 5px;
  }

  .badge-cat {
    font-size: 0.75rem;
    font-weight: 600;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 0.03em;
  }

  .question-text {
    font-size: 1.02rem;
    font-weight: 600;
    color: var(--text-main);
    margin-bottom: 12px;
  }

  .learn-answer-box {
    display: inline-block;
    background-color: var(--green-bg);
    border: 1px solid #bbf7d0;
    color: var(--green-text);
    font-weight: 700;
    font-size: 0.94rem;
    padding: 6px 12px;
    border-radius: 6px;
    margin-bottom: 12px;
  }

  .learn-answer-box.blurred {
    filter: blur(5px);
    cursor: pointer;
    user-select: none;
  }

  .exam-points {
    background-color: var(--amber-bg);
    border: 1px solid #fde68a;
    border-left: 4px solid var(--amber-border);
    border-radius: 6px;
    padding: 10px 14px;
  }

  .exam-points-heading {
    font-size: 0.78rem;
    font-weight: 700;
    color: var(--amber-text);
    text-transform: uppercase;
    letter-spacing: 0.03em;
    margin-bottom: 4px;
  }

  .exam-points ul {
    margin-left: 18px;
    font-size: 0.88rem;
    color: #374151;
  }

  .exam-points li {
    margin-bottom: 3px;
  }

  .options-list {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
    gap: 10px;
  }

  .option-btn {
    display: flex;
    align-items: center;
    gap: 10px;
    width: 100%;
    text-align: left;
    background-color: #ffffff;
    border: 1.5px solid var(--border-light);
    border-radius: 8px;
    padding: 11px 14px;
    font-size: 0.92rem;
    font-weight: 500;
    color: var(--text-main);
    cursor: pointer;
    transition: all 0.15s ease;
  }

  .option-btn:hover:not(:disabled) {
    border-color: var(--primary);
    background-color: var(--primary-soft);
  }

  .option-btn:disabled {
    cursor: default;
  }

  .opt-circle {
    width: 24px;
    height: 24px;
    border-radius: 50%;
    background-color: var(--bg-panel);
    border: 1px solid var(--border-strong);
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-size: 0.78rem;
    font-weight: 700;
    color: var(--text-sub);
    flex-shrink: 0;
  }

  .option-btn.correct {
    background-color: var(--green-bg);
    border-color: var(--green-border);
    color: var(--green-text);
    font-weight: 700;
  }

  .option-btn.correct .opt-circle {
    background-color: var(--green-border);
    border-color: var(--green-border);
    color: #ffffff;
  }

  .option-btn.wrong {
    background-color: var(--red-bg);
    border-color: var(--red-border);
    color: var(--red-text);
    font-weight: 600;
  }

  .option-btn.wrong .opt-circle {
    background-color: var(--red-border);
    border-color: var(--red-border);
    color: #ffffff;
  }

  .answer-panel {
    display: none;
    margin-top: 14px;
    padding-top: 14px;
    border-top: 1px solid var(--border-light);
    animation: slideDown 0.18s ease-out;
  }

  .answer-panel.visible {
    display: block;
  }

  .result-banner {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    margin-bottom: 10px;
  }

  .result-pill {
    font-size: 0.84rem;
    font-weight: 700;
    padding: 4px 10px;
    border-radius: 6px;
  }

  .result-pill.right {
    background-color: var(--green-bg);
    color: var(--green-text);
    border: 1px solid var(--green-border);
  }

  .result-pill.wrong {
    background-color: var(--red-bg);
    color: var(--red-text);
    border: 1px solid var(--red-border);
  }

  .correct-label {
    font-size: 0.92rem;
    font-weight: 700;
    color: var(--text-main);
  }

  .correct-label span {
    color: var(--green-text);
  }

  .hidden {
    display: none !important;
  }

  .no-results {
    text-align: center;
    padding: 40px 20px;
    border: 1px dashed var(--border-strong);
    border-radius: 10px;
    color: var(--text-muted);
  }

  @keyframes slideDown {
    from { opacity: 0; transform: translateY(-4px); }
    to { opacity: 1; transform: translateY(0); }
  }

  @media (max-width: 640px) {
    .header-wrap { flex-direction: column; align-items: flex-start; }
    .options-list { grid-template-columns: 1fr; }
    input[type="text"] { width: 100%; }
  }
</style>
</head>

<script>
const QUESTIONS = [{"id": 1, "video_q": 1, "cat": "National & State Affairs", "q": "Sikkim became which state in India to receive the President's Police Colour?", "opts": ["12th", "15th", "14th", "18th"], "ans": 1, "p1": "Significance: The President's Police Colour is the highest honor bestowed upon a state police force for exceptional service and bravery.", "p2": "Exam Fact: Sikkim became the 22nd state of India on 16 May 1975 via the 36th Constitutional Amendment Act."}, {"id": 2, "video_q": 2, "cat": "Science, Space & Defence", "q": "Who launched 'Mission SANA', India's first indigenous super-pressure balloon platform?", "opts": ["ISRO", "DRDO", "Red Balloon Aerospace", "Skyroot Aerospace"], "ans": 2, "p1": "Platform Details: SANA is India's first indigenous stratospheric super-pressure hydrogen balloon platform.", "p2": "Exam Fact: High-altitude stratospheric platforms enable persistent earth observation, weather monitoring, and telecom relays at a fraction of satellite costs."}, {"id": 3, "video_q": 3, "cat": "Science, Space & Defence", "q": "With Mission SANA, India joined which group of nations possessing indigenous stratospheric hydrogen balloon technology?", "opts": ["France, Germany, South Korea, and Japan", "Russia, Germany, UK, and Israel", "USA, UK, Canada, and Australia", "United States, France, Japan, and China"], "ans": 3, "p1": "Strategic Milestone: Places India among an elite 5-nation group (with USA, France, Japan, and China) mastering indigenous stratospheric balloon tech.", "p2": "Exam Fact: Stratospheric platforms operate in the 'near-space' region (~18–25 km altitude) above commercial air traffic."}, {"id": 4, "video_q": 4, "cat": "Science, Space & Defence", "q": "Where was India's first 'SkyCast' aviation weather forecasting system launched?", "opts": ["Indira Gandhi International Airport, New Delhi", "Chhatrapati Shivaji Maharaj International Airport, Mumbai", "Kempegowda International Airport, Bengaluru", "Rajiv Gandhi International Airport, Hyderabad"], "ans": 0, "p1": "Location: Indira Gandhi International Airport (IGIA), New Delhi.", "p2": "Exam Fact: Developed by the India Meteorological Department (IMD) to provide ultra-high-resolution nowcasting for aviation safety."}, {"id": 5, "video_q": 5, "cat": "Government Schemes & Initiatives", "q": "Under which Government of India initiative was the SkyCast system launched?", "opts": ["UDAN Scheme", "Mission Mausam", "National Monsoon Mission", "Digital Sky Initiative"], "ans": 1, "p1": "Parent Ministry: Ministry of Earth Sciences (MoES) — implemented via IMD, IITM, and NCMRWF.", "p2": "Exam Fact: Mission Mausam aims to make India a 'Weather-Ready and Climate-Smart' nation using next-gen radars and AI models."}, {"id": 6, "video_q": 6, "cat": "Economy, Ports & Indices", "q": "Under which framework was the Logistics Port Performance Index (LPPI) developed?", "opts": ["PM Gati Shakti Framework", "Sagarmala Framework", "Sagar Aankalan Framework", "Maritime India Vision 2030"], "ans": 2, "p1": "Nodal Ministry: Ministry of Ports, Shipping and Waterways (MoPSW).", "p2": "Exam Fact: Sagar Aankalan guidelines standardize port performance benchmarking across Indian major and non-major ports."}, {"id": 7, "video_q": 7, "cat": "Economy, Ports & Indices", "q": "Which port secured the top position in the Container Cargo category in LPPI 2024–25?", "opts": ["Chennai Port (Tamil Nadu)", "Jawaharlal Nehru Port (Maharashtra)", "Visakhapatnam Port (Andhra Pradesh)", "Mundra Port (Gujarat)"], "ans": 3, "p1": "Location: Mundra Port is located in Kutch district, Gujarat (India's largest private commercial port).", "p2": "Exam Fact: Mundra Port is operated by Adani Ports and Special Economic Zone (APSEZ)."}, {"id": 8, "video_q": 8, "cat": "Government Schemes & Initiatives", "q": "Until which date was the lending period of the restructured PM SVANidhi scheme extended?", "opts": ["31 March 2030", "31 December 2029", "31 March 2028", "31 March 2031"], "ans": 0, "p1": "Launch & Purpose: Launched in June 2020 by MoHUA to provide collateral-free working capital loans to urban street vendors.", "p2": "Exam Fact: PM SVANidhi offers progressive loan tranches (₹10,000 → ₹20,000 → ₹50,000) with a 7% interest subsidy."}, {"id": 9, "video_q": 9, "cat": "Sports & Tournaments", "q": "In which year will Meghalaya host the 39th National Games of India?", "opts": ["2026", "2027", "2028", "2029"], "ans": 1, "p1": "Host State & Edition: Meghalaya (Capital: Shillong) will host the 39th edition of the National Games in 2027.", "p2": "Exam Fact: The 38th National Games were hosted by Uttarakhand in 2025."}, {"id": 10, "video_q": 10, "cat": "Economy, Ports & Indices", "q": "What has been adopted as the new base year for the revised Index of Industrial Production (IIP)?", "opts": ["2011–12", "2017–18", "2022–23", "2020–21"], "ans": 2, "p1": "Compiler: Compiled and published monthly by the National Statistical Office (NSO) under MoSPI.", "p2": "Exam Fact: IIP measures short-term changes in production volume across three broad sectors: Mining, Manufacturing, and Electricity."}, {"id": 11, "video_q": 11, "cat": "Economy, Ports & Indices", "q": "After the revision, the total number of item groups in IIP increased from 407 to how many?", "opts": ["435", "450", "492", "463"], "ans": 3, "p1": "Revision Change: Expanded from 407 item groups to 463 item groups to reflect modern industrial output.", "p2": "Exam Fact: Eight Core Industries account for 40.27% of the total weight in IIP."}, {"id": 12, "video_q": 12, "cat": "Science, Space & Defence", "q": "India formally issued a Letter of Request (LoR) to which country for the procurement of 144 Rafale fighter aircraft?", "opts": ["France", "United States", "Russia", "Israel"], "ans": 0, "p1": "Manufacturer: Dassault Aviation (France).", "p2": "Exam Fact: This government-to-government (G2G) procurement strengthens the Indian Air Force's multi-role combat squadron strength."}, {"id": 13, "video_q": 13, "cat": "Science, Space & Defence", "q": "The proposed government-to-government deal for 144 Rafale fighter aircraft is estimated at approximately what amount?", "opts": ["₹1.75 lakh crore", "₹3.25 lakh crore", "₹2.50 lakh crore", "₹4.10 lakh crore"], "ans": 1, "p1": "Deal Value: Approximately ₹3.25 lakh crore.", "p2": "Exam Fact: India had previously procured 36 Rafale jets for the IAF and 26 Rafale-Marine jets for the Indian Navy."}, {"id": 14, "video_q": 14, "cat": "Economy, Ports & Indices", "q": "Which seafood product remained the top export product in India's seafood exports during FY 2025–26?", "opts": ["Dried Seafood", "Frozen Fish", "Frozen Shrimp", "Frozen Squid"], "ans": 2, "p1": "Export Authority: Marine Products Export Development Authority (MPEDA, HQ: Kochi, Kerala).", "p2": "Exam Fact: Frozen shrimp consistently accounts for the largest share of India's marine export earnings, with the USA and China as major buyers."}, {"id": 15, "video_q": 15, "cat": "Government Schemes & Initiatives", "q": "Who launched the 'Navachar Mantra' initiative for grassroots innovators and early-stage entrepreneurs?", "opts": ["Ashwini Vaishnaw", "Piyush Goyal", "Dr. Jitendra Singh", "Jayant Chaudhary"], "ans": 3, "p1": "Portfolio: Jayant Chaudhary is MoS (Independent Charge) for Skill Development & Entrepreneurship and MoS for Education.", "p2": "Exam Fact: Navachar Mantra fosters grassroots innovation and startup incubation among young entrepreneurs."}, {"id": 16, "video_q": 16, "cat": "International & Summits", "q": "Which five countries were elected as non-permanent members of the UN Security Council (UNSC) for the 2027–28 term?", "opts": ["Austria, Kyrgyzstan, Portugal, Trinidad & Tobago, and Zimbabwe", "Denmark, Greece, Pakistan, Panama, and Somalia", "India, Brazil, Japan, Germany, and South Africa", "Bahrain, Colombia, DRC, Latvia, and Liberia"], "ans": 0, "p1": "UNSC Composition: 15 total members — 5 permanent (China, France, Russia, UK, USA) and 10 non-permanent elected by UNGA.", "p2": "Exam Fact: Non-permanent seats are distributed regionally across Africa, Asia-Pacific, Eastern Europe, GRULAC, and WEOG."}, {"id": 17, "video_q": 17, "cat": "International & Summits", "q": "For how long do newly elected non-permanent members serve on the United Nations Security Council (UNSC)?", "opts": ["1 year", "2 years", "3 years", "5 years"], "ans": 1, "p1": "Rotation Rule: Five new non-permanent members are elected every year for a staggered 2-year term (not eligible for immediate re-election).", "p2": "Exam Fact: India has served as a non-permanent member of the UNSC 8 times (most recently 2021–22)."}, {"id": 18, "video_q": 18, "cat": "International & Summits", "q": "The five newly elected non-permanent members of UNSC (2027–28) will replace which group of countries whose term ends on 31 December 2026?", "opts": ["Austria, Kyrgyzstan, Portugal, Trinidad & Tobago, and Zimbabwe", "Algeria, Guyana, South Korea, Sierra Leone, and Slovenia", "Denmark, Greece, Pakistan, Panama, and Somalia", "Ecuador, Japan, Malta, Mozambique, and Switzerland"], "ans": 2, "p1": "Outgoing Cohort (2025–26 term): Denmark, Greece, Pakistan, Panama, and Somalia.", "p2": "Exam Fact: A two-thirds majority in the UN General Assembly is required to win election to a non-permanent UNSC seat."}, {"id": 19, "video_q": 19, "cat": "National & State Affairs", "q": "Which two places in Odisha will be connected by the new Coastal Highway Project?", "opts": ["Balasore and Chandipur", "Gopalpur and Dhamra", "Puri and Konark", "Rameswar and Paradip"], "ans": 3, "p1": "Corridor Significance: Connects Rameswar (near Chilika/Khordha) to Paradip Port in Odisha.", "p2": "Exam Fact: Improves coastal logistics connectivity, port access, and cyclone-resilient transport infrastructure in Odisha."}, {"id": 20, "video_q": 20, "cat": "Banking, Finance & Regulatory", "q": "What is the name of the new digital onboarding platform launched by PFRDA for National Pension System (NPS) subscribers?", "opts": ["STAR-NPS", "e-NPS Pro", "NPS Sahaj", "PRAN Connect"], "ans": 0, "p1": "Regulator: Pension Fund Regulatory and Development Authority (PFRDA, HQ: New Delhi).", "p2": "Exam Fact: Streamlines paperless onboarding and subscriber lifecycle management under NPS."}, {"id": 21, "video_q": 21, "cat": "Banking, Finance & Regulatory", "q": "Under the new STAR-NPS framework, what is the eligible age range for resident Indian individuals?", "opts": ["18 to 60 years", "18 to 85 years", "18 to 75 years", "18 to 70 years"], "ans": 1, "p1": "Eligibility Expansion: Expands entry/coverage window up to 85 years under the updated framework.", "p2": "Exam Fact: Upon joining NPS, every subscriber receives a unique 12-digit Permanent Retirement Account Number (PRAN)."}, {"id": 22, "video_q": 22, "cat": "Environment, Parks & GI Tags", "q": "Suraha Tal, located in which district of Uttar Pradesh, was designated as India's 100th Ramsar Site?", "opts": ["Gorakhpur", "Varanasi", "Ballia", "Prayagraj"], "ans": 2, "p1": "Location: Ballia district, eastern Uttar Pradesh (a natural oxbow lake fed by the Ganga and Ghaghara rivers).", "p2": "Exam Fact: Marking India's 100th Ramsar wetland milestone highlights rapid expansion of protected wetlands under the Ramsar Convention (1971)."}, {"id": 23, "video_q": 23, "cat": "Environment, Parks & GI Tags", "q": "By which official name is Suraha Tal (India's 100th Ramsar Site) also known?", "opts": ["Patna Bird Sanctuary", "Nawabganj Bird Sanctuary", "Saman Bird Sanctuary", "Jai Prakash Narayan Bird Sanctuary"], "ans": 3, "p1": "Official Designation: Declared as Jai Prakash Narayan Bird Sanctuary in 1991.", "p2": "Exam Fact: Named after Loknayak Jayaprakash Narayan, who hailed from Sitabdiara in Ballia."}, {"id": 24, "video_q": 24, "cat": "International & Summits", "q": "Which country was the world's largest military spender in 2025 according to the SIPRI Yearbook 2026?", "opts": ["United States", "China", "Russia", "India"], "ans": 0, "p1": "Report Publisher: Stockholm International Peace Research Institute (SIPRI, HQ: Solna/Stockholm, Sweden).", "p2": "Exam Fact: The United States consistently leads global military expenditure, followed by China and Russia."}, {"id": 25, "video_q": 25, "cat": "National & State Affairs", "q": "Which organization developed the Land Port Management System 'LPMS-Vinimay'?", "opts": ["Central Board of Indirect Taxes and Customs (CBIC)", "Land Ports Authority of India (LPAI)", "National Informatics Centre (NIC)", "Food Corporation of India (FCI)"], "ans": 1, "p1": "Parent Ministry: LPAI is a statutory body under the Ministry of Home Affairs (Department of Border Management).", "p2": "Exam Fact: LPMS-Vinimay digitizes cross-border cargo and passenger movement at Integrated Check Posts (ICPs)."}, {"id": 26, "video_q": 26, "cat": "National & State Affairs", "q": "Which three foreign universities received Letters of Approval (LoA) to establish campuses in India?", "opts": ["Deakin University, University of Wollongong, and Queen's University", "University of Oxford, MIT, and Stanford University", "University of Bristol, University of York, and University of New South Wales", "University of Melbourne, Monash University, and Imperial College London"], "ans": 2, "p1": "Regulatory Framework: Approved under UGC (Setting up and Operation of Campuses of Foreign Higher Educational Institutions in India) Regulations.", "p2": "Exam Fact: Enables top global universities to offer degree programs directly in India under NEP 2020 internationalization goals."}, {"id": 27, "video_q": 27, "cat": "National & State Affairs", "q": "Where will the University of New South Wales (UNSW) establish its Indian campus?", "opts": ["Hyderabad", "Mumbai", "GIFT City (Gandhinagar)", "Bengaluru"], "ans": 3, "p1": "Host City: Bengaluru, Karnataka (India's technology and R&D hub).", "p2": "Exam Fact: UNSW is a leading Australian public research university based in Sydney."}, {"id": 28, "video_q": 28, "cat": "Government Schemes & Initiatives", "q": "What is the total outlay of the 'VB-G RAM G' rural development initiative?", "opts": ["₹1.25 lakh crore", "₹1.00 lakh crore", "₹85,000 crore", "₹1.50 lakh crore"], "ans": 0, "p1": "Full Form: Viksit Bharat Guarantee for Rozgar and Ajeevika Mission (replaces/restructures MGNREGA).", "p2": "Exam Fact: Total outlay approved is ₹1.25 lakh crore for rural wage employment and livelihood infrastructure."}, {"id": 29, "video_q": 29, "cat": "National & State Affairs", "q": "Which city became the first city to be integrated into India's 'Easy Connect' hub-and-spoke aviation model?", "opts": ["Amritsar", "Varanasi", "Ahmedabad", "Lucknow"], "ans": 1, "p1": "Rollout Order: Varanasi was the first city, followed by Amritsar and Ahmedabad.", "p2": "Exam Fact: Allows international passengers from regional airports to complete baggage check-in/immigration formalities seamlessly at the hub."}, {"id": 30, "video_q": 30, "cat": "Government Schemes & Initiatives", "q": "On which date was the Pradhan Mantri Surakshit Matritva Abhiyan (PMSMA) launched?", "opts": ["8 March 2018", "22 January 2015", "9 June 2016", "15 August 2019"], "ans": 2, "p1": "Nodal Ministry: Ministry of Health and Family Welfare.", "p2": "Exam Fact: PMSMA provides assured, comprehensive, and quality antenatal care free of cost to pregnant women on the 9th of every month."}, {"id": 31, "video_q": 31, "cat": "National & State Affairs", "q": "Narendra Modi became India's longest-serving elected Prime Minister after completing how many consecutive days in office?", "opts": ["4,078 days", "4,250 days", "4,500 days", "4,399 days"], "ans": 3, "p1": "Milestone: Surpassed previous records for consecutive days in office as an elected Prime Minister.", "p2": "Exam Fact: Narendra Modi first took oath as Prime Minister of India on 26 May 2014."}, {"id": 32, "video_q": 32, "cat": "International & Summits", "q": "In which city was the 114th International Labour Conference (ILC) held?", "opts": ["Geneva, Switzerland", "Paris, France", "Vienna, Austria", "New York, USA"], "ans": 0, "p1": "Host Organization: International Labour Organization (ILO, HQ: Geneva, Switzerland).", "p2": "Exam Fact: Often referred to as the 'International Parliament of Labour', ILC meets annually in Geneva."}, {"id": 33, "video_q": 33, "cat": "Economy, Ports & Indices", "q": "Which country had the highest number of startups in the World Economic Forum (WEF) 2026 Technology Pioneers cohort?", "opts": ["India", "USA", "China", "United Kingdom"], "ans": 1, "p1": "Organizer: World Economic Forum (HQ: Cologny, Geneva, Switzerland).", "p2": "Exam Fact: WEF's Technology Pioneers community recognizes early-to-growth-stage companies pioneering breakthrough technologies."}, {"id": 34, "video_q": 34, "cat": "Government Schemes & Initiatives", "q": "In July 2026, the Ministry of Skill Development and Entrepreneurship completed how many years of the Skill India Mission?", "opts": ["10 years", "11 years", "12 years", "15 years"], "ans": 2, "p1": "Launch Date: Skill India Mission was launched on 15 July 2015 (World Youth Skills Day).", "p2": "Exam Fact: PMKVY (Pradhan Mantri Kaushal Vikas Yojana) is the flagship scheme under Skill India."}, {"id": 35, "video_q": 35, "cat": "Government Schemes & Initiatives", "q": "What is 'Oilseed Kisan Mitra', India's first nationwide WhatsApp-based platform?", "opts": ["A mandi e-auction marketplace", "A digital crop insurance claim portal", "A direct subsidy payment gateway", "An AI advisory platform for oilseed farmers"], "ans": 3, "p1": "Function: Provides real-time, multilingual AI-driven agronomic and weather advisory to oilseed growers via WhatsApp.", "p2": "Exam Fact: Supports the National Mission on Edible Oils – Oilseeds (NMEO-Oilseeds) to boost domestic edible oil self-reliance."}, {"id": 36, "video_q": 36, "cat": "Economy, Ports & Indices", "q": "Which Indian port retained the top position among Indian container ports in the Container Port Performance Index (CPPI) 2025?", "opts": ["Jawaharlal Nehru Port Authority (JNPA)", "Mundra Port", "Visakhapatnam Port", "Cochin Port"], "ans": 0, "p1": "Index Compiler: Published jointly by the World Bank and S&P Global Market Intelligence.", "p2": "Exam Fact: JNPA (Nhava Sheva, Navi Mumbai) is India's premier state-owned container port."}, {"id": 37, "video_q": 37, "cat": "International & Summits", "q": "India and which country launched the 'Atal Bridge' initiative to strengthen youth innovation collaboration?", "opts": ["Germany", "France", "Japan", "Israel"], "ans": 1, "p1": "Implementing Body: Atal Innovation Mission (AIM, NITI Aayog) in partnership with France.", "p2": "Exam Fact: Connects Atal Tinkering Labs (ATLs) and student innovators between India and France."}, {"id": 38, "video_q": 38, "cat": "National & State Affairs", "q": "In which state did India Post launch its first drone-based mail and parcel transmission service?", "opts": ["Arunachal Pradesh", "Uttarakhand", "Himachal Pradesh", "Sikkim"], "ans": 2, "p1": "Objective: Overcomes difficult mountainous terrain to speed up last-mile postal and parcel delivery.", "p2": "Exam Fact: India Post Payments Bank (IPPB) and Department of Posts operate under the Ministry of Communications."}, {"id": 39, "video_q": 39, "cat": "Environment, Parks & GI Tags", "q": "Raja Parba (Raja Festival) is a major traditional festival of which Indian state?", "opts": ["Jharkhand", "West Bengal", "Assam", "Odisha"], "ans": 3, "p1": "Cultural Significance: A 3-day festival in Odisha celebrating womanhood, fertility, and the onset of monsoon.", "p2": "Exam Fact: Other famous festivals of Odisha include Rath Yatra, Nuakhai, and Konark Dance Festival."}, {"id": 40, "video_q": 40, "cat": "Economy, Ports & Indices", "q": "What is the new base year adopted for the Wholesale Price Index (WPI) and Producer Price Index (PPI)?", "opts": ["2022–23", "2017–18", "2020–21", "2011–12"], "ans": 0, "p1": "Base Year Alignment: Revised from 2011–12 to 2022–23 alongside IIP.", "p2": "Exam Fact: WPI is compiled by the Office of the Economic Adviser, Department for Promotion of Industry and Internal Trade (DPIIT)."}, {"id": 41, "video_q": 41, "cat": "Economy, Ports & Indices", "q": "For how many years will the revised WPI and Producer Price Index (PPI) be published alongside each other during the transition period?", "opts": ["2 years", "5 years", "3 years", "7 years"], "ans": 1, "p1": "Transition Plan: Both WPI and PPI will run parallel for 5 years before PPI fully replaces WPI.", "p2": "Exam Fact: Unlike WPI (which includes indirect taxes and excludes services), PPI measures price changes received by domestic producers for both goods and services."}, {"id": 42, "video_q": 42, "cat": "Appointments & Committees", "q": "Who was appointed Chairman of the study group constituted to examine challenges and opportunities facing the Indian film industry?", "opts": ["Shyam Benegal", "Shekhar Kapur", "Prasoon Joshi", "Anupam Kher"], "ans": 2, "p1": "Role: Prasoon Joshi also serves as Chairperson of the Central Board of Film Certification (CBFC).", "p2": "Exam Fact: Examines OTT disruption, piracy, financing, and global export competitiveness of Indian cinema."}, {"id": 43, "video_q": 43, "cat": "Government Schemes & Initiatives", "q": "Which state government launched the 'Gyanodaya Sikshar Samriddhi' scheme to promote free and equitable education?", "opts": ["Bihar", "Madhya Pradesh", "Chhattisgarh", "Odisha"], "ans": 3, "p1": "State: Government of Odisha (Chief Minister: Mohan Charan Majhi).", "p2": "Exam Fact: Focuses on bridging learning gaps and upgrading school infrastructure across Odisha."}, {"id": 44, "video_q": 44, "cat": "Government Schemes & Initiatives", "q": "The Digital India programme completed how many years on 1 July 2026?", "opts": ["11 years", "10 years", "12 years", "9 years"], "ans": 0, "p1": "Milestone: Launched on 1 July 2015, completing 11 years on 1 July 2026.", "p2": "Exam Fact: Implemented under the Ministry of Electronics and Information Technology (MeitY)."}, {"id": 45, "video_q": 46, "cat": "Environment, Parks & GI Tags", "q": "Which famous sweet from Chandannagar, West Bengal recently received a Geographical Indication (GI) tag?", "opts": ["Mihidana", "Joynagarer Moa", "Jalbhara Sandesh", "Sitabhog"], "ans": 2, "p1": "Origin: Chandannagar (Hooghly district), West Bengal—famous for rose-water-filled sandesh.", "p2": "Exam Fact: GI tags are administered by the Geographical Indications Registry in Chennai under the GI of Goods (Registration and Protection) Act, 1999 (valid for 10 years)."}, {"id": 46, "video_q": 47, "cat": "National & State Affairs", "q": "Where will IIM Bengaluru establish its first overseas campus?", "opts": ["Malaysia", "UAE (Dubai)", "Singapore", "Indonesia"], "ans": 3, "p1": "Institution: Indian Institute of Management Bangalore (IIMB).", "p2": "Exam Fact: Follows IIT Madras (Zanzibar) and IIT Delhi (Abu Dhabi) in expanding Indian higher education footprints abroad."}, {"id": 47, "video_q": 48, "cat": "International & Summits", "q": "Narendra Modi became the first Indian Prime Minister to address the Parliament of which country?", "opts": ["Indonesia", "Guyana", "Trinidad & Tobago", "Mauritius"], "ans": 0, "p1": "Milestone: First Indian PM to address the Indonesian Parliament (People's Consultative Assembly / MPR).", "p2": "Exam Fact: India and Indonesia share a Comprehensive Strategic Partnership and celebrate deep historical maritime ties."}, {"id": 48, "video_q": 49, "cat": "International & Summits", "q": "In which city was the 36th NATO Summit 2026 held?", "opts": ["The Hague, Netherlands", "Ankara, Türkiye", "Washington, D.C., USA", "Brussels, Belgium"], "ans": 1, "p1": "Host Country: Türkiye (Ankara) hosted the 2026 NATO Summit.", "p2": "Exam Fact: NATO (North Atlantic Treaty Organization) was founded in 1949 and has 32 member countries (HQ: Brussels, Belgium)."}, {"id": 49, "video_q": 50, "cat": "Economy, Ports & Indices", "q": "Which Indian major port became the second, after Visakhapatnam Port, to achieve an operational draft of 18 meters?", "opts": ["Chennai Port", "Paradip Port", "Kamarajar Port Limited (Ennore)", "Cochin Port"], "ans": 2, "p1": "Location: Kamarajar Port Limited is located at Ennore near Chennai, Tamil Nadu.", "p2": "Exam Fact: Kamarajar Port is the only corporate major port in India registered as a company under the Companies Act."}, {"id": 50, "video_q": 51, "cat": "National & State Affairs", "q": "Which state made the full versions of both 'Vande Mataram' and 'Jana Gana Mana' compulsory in all schools?", "opts": ["Gujarat", "Assam", "Uttar Pradesh", "Tripura"], "ans": 3, "p1": "State: Government of Tripura (Capital: Agartala).", "p2": "Exam Fact: 'Vande Mataram' was composed by Bankim Chandra Chattopadhyay (from Anandamath), and 'Jana Gana Mana' by Rabindranath Tagore."}, {"id": 51, "video_q": 52, "cat": "International & Summits", "q": "In which city of Kyrgyzstan was the Manas and Mahabharata Centre inaugurated?", "opts": ["Bishkek", "Osh", "Karakol", "Jalal-Abad"], "ans": 0, "p1": "Cultural Link: Connects the Kyrgyz Epic of Manas with India's epic Mahabharata.", "p2": "Exam Fact: Bishkek is the capital of Kyrgyzstan (Currency: Kyrgyzstani Som)."}, {"id": 52, "video_q": 53, "cat": "Banking, Finance & Regulatory", "q": "Which programme did NABARD launch on its 45th Foundation Day to promote rural entrepreneurship?", "opts": ["Gram Unnati", "Gramodyam", "Udyam Gram", "Saksham Kisan"], "ans": 1, "p1": "Occasion: Launched on NABARD's 45th Foundation Day (12 July 2026).", "p2": "Exam Fact: NABARD was established on 12 July 1982 on the recommendation of the B. Sivaraman Committee."}, {"id": 53, "video_q": 54, "cat": "Banking, Finance & Regulatory", "q": "During its pilot phase, NABARD's 'Gramodyam' aims to create approximately how many rural entrepreneurs over three years?", "opts": ["2,000", "3,000", "4,000", "5,000"], "ans": 2, "p1": "Target: 4,000 rural entrepreneurs over a 3-year pilot period.", "p2": "Exam Fact: Provides handholding, credit linkage, and market access to rural youth and micro-enterprises."}, {"id": 54, "video_q": 55, "cat": "National & State Affairs", "q": "Lakhanpur, recently selected for a Street Food Hub under the PM SVANidhi initiative, is located in which district of Jammu & Kashmir?", "opts": ["Samba", "Jammu", "Udhampur", "Kathua"], "ans": 3, "p1": "Location: Lakhanpur is the gateway town to Jammu & Kashmir in Kathua district.", "p2": "Exam Fact: Safe and hygienic street food hubs are developed jointly by MoHUA and FSSAI."}, {"id": 55, "video_q": 56, "cat": "Environment, Parks & GI Tags", "q": "Which two spice products from Unjha, Gujarat received GI tags?", "opts": ["Cumin (Jeera) and Fennel (Saunf)", "Turmeric and Cardamom", "Black Pepper and Clove", "Coriander and Fenugreek"], "ans": 0, "p1": "Origin: Unjha (Mehsana district, Gujarat) is Asia's largest spice trading hub for cumin and fennel.", "p2": "Exam Fact: GI tagging protects regional authenticity and boosts export pricing power for local spice farmers."}, {"id": 56, "video_q": 57, "cat": "International & Summits", "q": "Thailand reduced the maximum visa-free stay for Indian passport holders from 60 days to how many days?", "opts": ["15 days", "30 days", "45 days", "21 days"], "ans": 1, "p1": "Revision: Reduced from 60 days down to 30 days.", "p2": "Exam Fact: Capital of Thailand: Bangkok | Currency: Thai Baht."}, {"id": 57, "video_q": 58, "cat": "National & State Affairs", "q": "Navi Mumbai International Airport launched its first scheduled international flight to which destination?", "opts": ["Singapore", "Dubai", "Abu Dhabi", "London"], "ans": 2, "p1": "Destination: Abu Dhabi, United Arab Emirates.", "p2": "Exam Fact: Navi Mumbai International Airport (NMIA) serves as the second major international airport for the Mumbai Metropolitan Region."}, {"id": 58, "video_q": 59, "cat": "National & State Affairs", "q": "The 31st Divya Kala Mela was jointly organized for the first time by the Government of India and which state government?", "opts": ["Odisha", "Maharashtra", "Uttar Pradesh", "West Bengal"], "ans": 3, "p1": "Organizer: Department of Empowerment of Persons with Disabilities (DEPwD), Ministry of Social Justice & Empowerment, with West Bengal.", "p2": "Exam Fact: Divya Kala Mela showcases products and craftsmanship of Divyangjan (persons with disabilities) entrepreneurs."}, {"id": 59, "video_q": 60, "cat": "National & State Affairs", "q": "The Digital Local Pass introduced on the Rajmargyatra app is available to residents living within what distance of an eligible toll plaza?", "opts": ["Within 20 km radius", "Within 15 km radius", "Within 10 km radius", "Within 25 km radius"], "ans": 0, "p1": "App Operator: Rajmargyatra is the official highway user mobile app of the National Highways Authority of India (NHAI).", "p2": "Exam Fact: Eliminates physical paperwork at toll plazas by allowing instant digital verification of local residential proof."}, {"id": 60, "video_q": 61, "cat": "International & Summits", "q": "France became the first European Union country to introduce a nationwide restriction on social media use for children below what age?", "opts": ["13 years", "15 years", "14 years", "16 years"], "ans": 1, "p1": "Age Threshold: Children under 15 years of age.", "p2": "Exam Fact: Aims to safeguard youth mental health and online safety across EU digital platforms."}, {"id": 61, "video_q": 62, "cat": "Environment, Parks & GI Tags", "q": "'Mission Golden Spice' is aimed at promoting which GI-tagged product of Meghalaya?", "opts": ["Muga Silk", "Khasi Mandarin", "Lakadong Turmeric", "Byadagi Chilli"], "ans": 2, "p1": "Specialty: Lakadong Turmeric (grown in West Jaintia Hills, Meghalaya) is famed for its exceptionally high curcumin content (7%–12%).", "p2": "Exam Fact: Curcumin is the primary bioactive compound responsible for turmeric's medicinal and anti-inflammatory properties."}, {"id": 62, "video_q": 63, "cat": "Environment, Par ": "Exam Fact: Reduces daily commuting expenses and boosts female workforce participation."}, {"id": 258, "video_q": 262, "cat": "Banking, Finance & Regulatory", "q": "Which health insurance proposition did ICICI Lombard General Insurance launch specifically targeting young consumers?", "opts": ["Elevate Lite", "Youth Shield", "Vibe", "GenZ Care"], "ans": 2, "p1": "Insurer: ICICI Lombard General Insurance (Headquarters: Mumbai, Maharashtra).", "p2": "Exam Fact: Modular, digital-first health cover tailored for young adults and first-time insurance buyers."}, {"id": 259, "video_q": 263, "cat": "Appointments & Committees", "q": "Who assumed charge as the Secretary of the Ministry of Environment, Forest and Climate Change (MoEFCC)?", "opts": ["Vivek Aggarwal", "Leena Nandan", "Tanmay Kumar", "Narendra Bhushan"], "ans": 3, "p1": "Ministry: MoEFCC (Union Cabinet Minister: Bhupender Yadav).", "p2": "Exam Fact: Senior IAS officer heading administrative policy for climate change, forestry, and wildlife conservation."}, {"id": 260, "video_q": 265, "cat": "Science, Space & Defence", "q": "India exported its indigenous Akash air defence missile system to which two Central Asian countries in addition to Armenia?", "opts": ["Kazakhstan and Uzbekistan", "Tajikistan and Turkmenistan", "Kyrgyzstan and Tajikistan", "Uzbekistan and Turkmenistan"], "ans": 1, "p1": "Importers: Armenia (first foreign buyer), followed by Tajikistan and Turkmenistan.", "p2": "Exam Fact: Akash is an all-weather medium-range surface-to-air missile system developed by DRDO."}, {"id": 261, "video_q": 266, "cat": "Science, Space & Defence", "q": "Exercise 'Jai Se Vijay' was conducted by which command of the Indian Army near the India–Pakistan international border in Rajasthan?", "opts": ["Western Command", "Southern Command", "Sapta Shakti Command (South Western Command)", "Northern Command"], "ans": 2, "p1": "Location & Highlight: Conducted on NH-911 in Rajasthan, featuring emergency highway helicopter landing let mode = 'learn';
let hideAnswers = false;
let userAnswers = {};

function setup() {
  const select = document.getElementById('catSelect');
  const uniqueCats = [...new Set(QUESTIONS.map(q => q.cat))];
  uniqueCats.forEach(cat => {
    const count = QUESTIONS.filter(q => q.cat === cat).length;
    const option = document.createElement('option');
    option.value = cat;
    option.textContent = `${cat} (${count})`;
    select.appendChild(option);
  });
  refreshStats();
  render();
}

function setMode(newMode) {
  mode = newMode;
  document.getElementById('btn-learn').classList.toggle('active', mode === 'learn');
  document.getElementById('btn-practice').classList.toggle('active', mode === 'practice');
  document.getElementById('blurBtn').classList.toggle('hidden', mode !== 'learn');
  render();
}

function toggleBlur() {
  hideAnswers = !hideAnswers;
  document.getElementById('blurBtn').textContent = hideAnswers
    ? '👁️ Show All Answers'
    : '👁️ Hide Answers (Self-Test)';
  render();
}

function getFilteredList() {
  const cat = document.getElementById('catSelect').value;
  const term = document.getElementById('searchBox').value.trim().toLowerCase();

  return QUESTIONS.filter(item => {
    if (cat !== 'ALL' && item.cat !== cat) return false;
    if (!term) return true;
    return (
      item.q.toLowerCase().includes(term) ||
      item.opts.some(o => o.toLowerCase().includes(term)) ||
      item.p1.toLowerCase().includes(term) ||
      item.p2.toLowerCase().includes(term) ||
      String(item.video_q).includes(term)
    );
  });
}

function render() {
  const list = getFilteredList();
  document.getElementById('showingCount').textContent = `Showing ${list.length} question${list.length === 1 ? '' : 's'}`;
  const container = document.getElementById('cardsContainer');

  if (list.length === 0) {
    container.innerHTML = `<div class="no-results">No questions match your filter. Clear search or switch category.</div>`;
    return;
  }

  container.innerHTML = list
    .map(item => (mode === 'learn' ? buildLearnCard(item) : buildPracticeCard(item)))
    .join('');
}

function buildLearnCard(item) {
  const answerText = item.opts[item.ans];
  const blurClass = hideAnswers ? 'blurred' : '';
  return `
    <div class="card">
      <div class="card-top">
        <div class="badge-group">
          <span class="badge-num">Q.${item.id}</span>
          <span class="badge-seq">Video #${item.video_q}</span>
        </div>
        <span class="badge-cat">${item.cat}</span>
      </div>
      <div class="question-text">${item.q}</div>
      <div class="learn-answer-box ${blurClass}" onclick="this.classList.remove('blurred')" title="Click to reveal answer">
        ✓ Answer: ${answerText}
      </div>
      <div class="exam-points">
        <div class="exam-points-heading">📌 2 Exam-Related Extra Points</div>
        <ul>
          <li>${item.p1}</li>
          <li>${item.p2}</li>
        </ul>
      </div>
    </div>
  `;
}

function buildPracticeCard(item) {
  const record = userAnswers[item.id];
  const isAnswered = record !== undefined;
  const letters = ['A', 'B', 'C', 'D'];

  const optsMarkup = item.opts
    .map((opt, idx) => {
      let cls = '';
      if (isAnswered) {
        if (idx === item.ans) cls = 'correct';
        else if (idx === record.picked && !record.correct) cls = 'wrong';
      }
      return `
        <button class="option-btn ${cls}" ${isAnswered ? 'disabled' : ''} onclick="selectOption(${item.id}, ${idx})">
          <span class="opt-circle">${letters[idx]}</span>
          <span>${opt}</span>
        </button>
      `;
    })
    .join('');

  const bannerMarkup = isAnswered
    ? record.correct
      ? `<span class="result-pill right">✓ Correct!</span>`
      : `<span class="result-pill wrong">✕ Wrong Answer</span>`
    : '';

  return `
    <div class="card" id="card-${item.id}">
      <div class="card-top">
        <div class="badge-group">
          <span class="badge-num">Q.${item.id}</span>
          <span class="badge-seq">Video #${item.video_q}</span>
        </div>
        <span class="badge-cat">${item.cat}</span>
      </div>
      <div class="question-text">${item.q}</div>
      <div class="options-list">
        ${optsMarkup}
      </div>
      <div class="answer-panel ${isAnswered ? 'visible' : ''}" id="panel-${item.id}">
        <div class="result-banner">
          ${bannerMarkup}
          <div class="correct-label">Correct Answer: <span>${letters[item.ans]}. ${item.opts[item.ans]}</span></div>
        </div>
        <div class="exam-points">
          <div class="exam-points-heading">📌 2 Exam-Related Extra Points</div>
          <ul>
            <li>${item.p1}</li>
            <li>${item.p2}</li>
          </ul>
        </div>
      </div>
    </div>
  `;
}

function selectOption(qId, pickedIdx) {
  if (userAnswers[qId] !== undefined) return;
  const item = QUESTIONS.find(q => q.id === qId);
  if (!item) return;

  userAnswers[qId] = {
    picked: pickedIdx,
    correct: pickedIdx === item.ans
  };

  refreshStats();
  const cardEl = document.getElementById(`card-${qId}`);
  if (cardEl) {
    cardEl.outerHTML = buildPracticeCard(item);
  }
}

function refreshStats() {
  const keys = Object.keys(userAnswers);
  const attempted = keys.length;
  const correct = keys.filter(k => userAnswers[k].correct).length;
  const wrong = attempted - correct;

  document.getElementById('cnt-attempted').textContent = attempted;
  document.getElementById('cnt-correct').textContent = correct;
  document.getElementById('cnt-wrong').textContent = wrong;
}

function resetAll() {
  userAnswers = {};
  refreshStats();
  render();
}

setup();
</script>
