<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>6-Month CA Rapid Revision (Part 2: Slides #101–#330) — New & Unique Questions — Learn & Practice (White Theme)</title>
<style>
  :root {
    --bg-page: #ffffff;
    --bg-panel: #f9fafb;
    --bg-card: #ffffff;
    --border-light: #e5e7eb;
    --border-strong: #d1d5db;
    --text-main: #111827;
    --text-sub: #4b5563;
    --text-muted: #6b7280;
    --primary: #1d4ed8;
    --primary-soft: #eff6ff;
    --primary-border: #bfdbfe;
    --green-bg: #f0fdf4;
    --green-border: #22c55e;
    --green-text: #15803d;
    --red-bg: #fef2f2;
    --red-border: #ef4444;
    --red-text: #b91c1c;
    --amber-bg: #fffbeb;
    --amber-border: #f59e0b;
    --amber-text: #92400e;
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  body {
    background-color: var(--bg-page);
    color: var(--text-main);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, Arial, sans-serif;
    line-height: 1.6;
  }

  header {
    background-color: #ffffff;
    border-bottom: 1px solid var(--border-light);
    position: sticky;
    top: 0;
    z-index: 100;
    padding: 14px 20px;
  }

  .header-wrap {
    max-width: 1060px;
    margin: 0 auto;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
  }

  .title-block h1 {
    font-size: 1.15rem;
    font-weight: 700;
    color: var(--text-main);
  }

  .title-block p {
    font-size: 0.8rem;
    color: var(--text-muted);
  }

  .tabs {
    display: inline-flex;
    background-color: var(--bg-panel);
    border: 1px solid var(--border-light);
    border-radius: 8px;
    padding: 4px;
    gap: 4px;
  }

  .tab-btn {
    border: none;
    background: transparent;
    color: var(--text-sub);
    font-size: 0.88rem;
    font-weight: 600;
    padding: 7px 16px;
    border-radius: 6px;
    cursor: pointer;
    transition: 0.15s ease;
  }

  .tab-btn.active {
    background-color: #ffffff;
    color: var(--primary);
    border: 1px solid var(--border-light);
    box-shadow: 0 1px 2px rgba(0, 0, 0, 0.06);
  }

  .main-container {
    max-width: 1060px;
    margin: 0 auto;
    padding: 20px;
  }

  .controls-bar {
    background-color: var(--bg-panel);
    border: 1px solid var(--border-light);
    border-radius: 10px;
    padding: 12px 16px;
    margin-bottom: 18px;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
  }

  .filter-group {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    flex: 1;
  }

  select, input[type="text"] {
    background-color: #ffffff;
    color: var(--text-main);
    border: 1px solid var(--border-strong);
    border-radius: 6px;
    padding: 8px 12px;
    font-size: 0.875rem;
    outline: none;
  }

  select:focus, input[type="text"]:focus {
    border-color: var(--primary);
  }

  input[type="text"] {
    min-width: 230px;
  }

  .score-group {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 8px;
    font-size: 0.84rem;
    font-weight: 600;
  }

  .pill {
    background-color: #ffffff;
    border: 1px solid var(--border-light);
    border-radius: 999px;
    padding: 4px 11px;
    color: var(--text-sub);
  }

  .pill.green {
    background-color: var(--green-bg);
    border-color: var(--green-border);
    color: var(--green-text);
  }

  .pill.red {
    background-color: var(--red-bg);
    border-color: var(--red-border);
    color: var(--red-text);
  }

  .action-btn {
    background-color: #ffffff;
    color: var(--text-main);
    border: 1px solid var(--border-strong);
    border-radius: 6px;
    padding: 6px 12px;
    font-size: 0.82rem;
    font-weight: 600;
    cursor: pointer;
  }

  .action-btn:hover {
    background-color: #f3f4f6;
  }

  .learn-subbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 14px;
    font-size: 0.85rem;
    color: var(--text-muted);
  }

  .card {
    background-color: #ffffff;
    border: 1px solid var(--border-light);
    border-radius: 10px;
    padding: 18px 20px;
    margin-bottom: 14px;
  }

  .card-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 8px;
    gap: 8px;
  }

  .badge-group {
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .badge-num {
    background-color: var(--primary-soft);
    color: var(--primary);
    border: 1px solid var(--primary-border);
    font-size: 0.78rem;
    font-weight: 700;
    padding: 2px 8px;
    border-radius: 5px;
  }

  .badge-seq {
    background-color: var(--bg-panel);
    color: var(--text-sub);
    border: 1px solid var(--border-light);
    font-size: 0.74rem;
    font-weight: 600;
    padding: 2px 7px;
    border-radius: 5px;
  }

  .badge-cat {
    font-size: 0.75rem;
    font-weight: 600;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 0.03em;
  }

  .question-text {
    font-size: 1.02rem;
    font-weight: 600;
    color: var(--text-main);
    margin-bottom: 12px;
  }

  .learn-answer-box {
    display: inline-block;
    background-color: var(--green-bg);
    border: 1px solid #bbf7d0;
    color: var(--green-text);
    font-weight: 700;
    font-size: 0.94rem;
    padding: 6px 12px;
    border-radius: 6px;
    margin-bottom: 12px;
  }

  .learn-answer-box.blurred {
    filter: blur(5px);
    cursor: pointer;
    user-select: none;
  }

  .exam-points {
    background-color: var(--amber-bg);
    border: 1px solid #fde68a;
    border-left: 4px solid var(--amber-border);
    border-radius: 6px;
    padding: 10px 14px;
  }

  .exam-points-heading {
    font-size: 0.78rem;
    font-weight: 700;
    color: var(--amber-text);
    text-transform: uppercase;
    letter-spacing: 0.03em;
    margin-bottom: 4px;
  }

  .exam-points ul {
    margin-left: 18px;
    font-size: 0.88rem;
    color: #374151;
  }

  .exam-points li {
    margin-bottom: 3px;
  }

  .options-list {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
    gap: 10px;
  }

  .option-btn {
    display: flex;
    align-items: center;
    gap: 10px;
    width: 100%;
    text-align: left;
    background-color: #ffffff;
    border: 1.5px solid var(--border-light);
    border-radius: 8px;
    padding: 11px 14px;
    font-size: 0.92rem;
    font-weight: 500;
    color: var(--text-main);
    cursor: pointer;
    transition: all 0.15s ease;
  }

  .option-btn:hover:not(:disabled) {
    border-color: var(--primary);
    background-color: var(--primary-soft);
  }

  .option-btn:disabled {
    cursor: default;
  }

  .opt-circle {
    width: 24px;
    height: 24px;
    border-radius: 50%;
    background-color: var(--bg-panel);
    border: 1px solid var(--border-strong);
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-size: 0.78rem;
    font-weight: 700;
    color: var(--text-sub);
    flex-shrink: 0;
  }

  .option-btn.correct {
    background-color: var(--green-bg);
    border-color: var(--green-border);
    color: var(--green-text);
    font-weight: 700;
  }

  .option-btn.correct .opt-circle {
    background-color: var(--green-border);
    border-color: var(--green-border);
    color: #ffffff;
  }

  .option-btn.wrong {
    background-color: var(--red-bg);
    border-color: var(--red-border);
    color: var(--red-text);
    font-weight: 600;
  }

  .option-btn.wrong .opt-circle {
    background-color: var(--red-border);
    border-color: var(--red-border);
    color: #ffffff;
  }

  .answer-panel {
    display: none;
    margin-top: 14px;
    padding-top: 14px;
    border-top: 1px solid var(--border-light);
    animation: slideDown 0.18s ease-out;
  }

  .answer-panel.visible {
    display: block;
  }

  .result-banner {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    margin-bottom: 10px;
  }

  .result-pill {
    font-size: 0.84rem;
    font-weight: 700;
    padding: 4px 10px;
    border-radius: 6px;
  }

  .result-pill.right {
    background-color: var(--green-bg);
    color: var(--green-text);
    border: 1px solid var(--green-border);
  }

  .result-pill.wrong {
    background-color: var(--red-bg);
    color: var(--red-text);
    border: 1px solid var(--red-border);
  }

  .correct-label {
    font-size: 0.92rem;
    font-weight: 700;
    color: var(--text-main);
  }

  .correct-label span {
    color: var(--green-text);
  }

  .hidden {
    display: none !important;
  }

  .no-results {
    text-align: center;
    padding: 40px 20px;
    border: 1px dashed var(--border-strong);
    border-radius: 10px;
    color: var(--text-muted);
  }

  @keyframes slideDown {
    from { opacity: 0; transform: translateY(-4px); }
    to { opacity: 1; transform: translateY(0); }
  }

  @media (max-width: 640px) {
    .header-wrap { flex-direction: column; align-items: flex-start; }
    .options-list { grid-template-columns: 1fr; }
    input[type="text"] { width: 100%; }
  }
</style>
</head>
<body>

<header>
  <div class="header-wrap">
    <div class="title-block">
      <h1>6-Month CA Rapid Revision (Part 2: Slides #101–#330) — New & Unique Questions (180 Questions)</h1>
      <p>Pradeep Sir & Jeevitha Ma'am Session (English) | Exclusive Questions Not Covered in All 10 Previous Files</p>
    </div>
    <div class="tabs">
      <button class="tab-btn active" id="btn-learn" onclick="setMode('learn')">📖 Learn Mode</button>
      <button class="tab-btn" id="btn-practice" onclick="setMode('practice')">✍️ Practice MCQs</button>
    </div>
  </div>
</header>

<div class="main-container">
  <div class="controls-bar">
    <div class="filter-group">
      <select id="catSelect" onchange="render()">
        <option value="ALL">All Categories (180)</option>
      </select>
      <input type="text" id="searchBox" placeholder="Search question, answer, or extra points..." oninput="render()">
    </div>
    <div class="score-group">
      <span class="pill">Attempted: <span id="cnt-attempted">0</span>/180</span>
      <span class="pill green">Correct: <span id="cnt-correct">0</span></span>
      <span class="pill red">Wrong: <span id="cnt-wrong">0</span></span>
      <button class="action-btn" onclick="resetAll()">Reset Practice</button>
    </div>
  </div>

  <div class="learn-subbar" id="learnSubbar">
    <span id="showingCount">Showing 180 questions</span>
    <button class="action-btn" id="blurBtn" onclick="toggleBlur()">👁️ Hide Answers (Self-Test)</button>
  </div>

  <div id="cardsContainer"></div>
</div>

<script>
const QUESTIONS = [{"id": 1, "slide_q": 101, "cat": "Health, Science & Technology", "q": "India's first dengue vaccine 'Qdenga', approved by DCGI in July 2026 for individuals aged 4 to 60 years, was developed by which company?", "opts": ["Serum Institute of India", "Takeda Pharmaceutical", "Bharat Biotech", "Sanofi Pasteur"], "ans": 1, "p1": "Regulatory Approval: Approved by the Drugs Controller General of India (DCGI) in July 2026 for ages 4–60 years.", "p2": "Exam Fact: Takeda is a leading Japanese multinational biopharmaceutical company."}, {"id": 2, "slide_q": 104, "cat": "Infrastructure, Ports & Energy", "q": "Which company holds the 40-year Build, Operate and Maintain (DBFOO/PPP) concession agreement for Vizhinjam International Seaport in Kerala?", "opts": ["Adani Ports and Special Economic Zone (APSEZ)", "DP World", "APM Terminals", "Larsen & Toubro"], "ans": 0, "p1": "Concession Model: Public-Private Partnership (PPP) model for 40 years between the Kerala Government and APSEZ.", "p2": "Exam Fact: Vizhinjam (Thiruvananthapuram) is India's first deep-water automated container transshipment port."}, {"id": 3, "slide_q": 105, "cat": "Government Schemes & Initiatives", "q": "Regarding the 9th Rashtriya Poshan Maah 2026: (1) Theme: 'Hamari Anganwadi, Hamari Zimmedari'; (2) Held in Varanasi, UP (not Lucknow); (3) Observed from 9 September to 8 October 2026; (4) Led by Ministry of Women & Child Development (not Health). Which statements are correct?", "opts": ["1, 2, and 3 only", "1 and 3 only (Held in Varanasi; led by Ministry of Women & Child Development)", "2 and 4 only", "All 1, 2, 3, and 4"], "ans": 1, "p1": "Corrections: Hosted in Varanasi, Uttar Pradesh, and led by the Ministry of Women and Child Development (Union Minister: Annpurna Devi, Kodarma MP).", "p2": "Exam Fact: POSHAN Abhiyaan was originally launched on 8 March 2018 in Jhunjhunu, Rajasthan."}, {"id": 4, "slide_q": 106, "cat": "Banking, Finance & Regulatory", "q": "On World Standards Day (14 October), BIS notified hallmarking purity grades for silver bullion and coins. Which purity grades are included?", "opts": ["916, 958, and 999", "925, 958, and 990", "999.9, 999.5, and 999.0", "900, 950, and 995"], "ans": 2, "p1": "BIS Silver Bullion Grades: 999.9, 999.5, and 999.0 fine silver purity standards.", "p2": "Exam Fact: Bureau of Indian Standards (BIS) operates under the Ministry of Consumer Affairs, Food and Public Distribution."}, {"id": 5, "slide_q": 107, "cat": "International & Summits", "q": "Regarding the Southern Indian Ocean Fisheries Agreement (SIOFA): (1) India upgraded its status from Cooperating Non-Contracting Party to full Contracting Party; (2) Signed in Rome on 7 July 2006; (3) Entered into force on 21 June 2012 (not June 2008); (4) Target species include squid, toothfish, and alfonsino. Which statements are correct?", "opts": ["All 1, 2, 3, and 4", "1 and 3 only", "2 and 3 only", "1, 2, and 4 only (Entered into force in June 2012)"], "ans": 3, "p1": "Correction Note: SIOFA entered into force on 21 June 2012 (not June 2008).", "p2": "Exam Fact: Becoming a full Contracting Party strengthens India's sustainable deep-sea fishing rights in the Southern Indian Ocean."}, {"id": 6, "slide_q": 110, "cat": "Polity, Bills & Governance", "q": "Which Union Ministry launched the portal/guidelines for repurposing closed and abandoned coal mines?", "opts": ["Ministry of Power", "Ministry of Environment, Forest and Climate Change", "Ministry of Coal", "Ministry of Mines"], "ans": 2, "p1": "Nodal Ministry: Ministry of Coal (Union Cabinet Minister: G. Kishan Reddy, Secunderabad MP).", "p2": "Exam Fact: Converts closed mine voids into eco-tourism parks, pumped hydro storage, and solar energy sites."}, {"id": 7, "slide_q": 111, "cat": "Infrastructure, Ports & Energy", "q": "In which valley of Ladakh were India's first two geothermal wells commissioned in July 2026?", "opts": ["Markha Valley", "Nubra Valley", "Zanskar Valley", "Puga Valley"], "ans": 3, "p1": "Location: Puga Valley (Changthang region), eastern Ladakh.", "p2": "Exam Fact: Developed by ONGC Energy Centre to tap clean 24x7 geothermal energy in high-altitude Ladakh."}, {"id": 8, "slide_q": 112, "cat": "Banking, Finance & Regulatory", "q": "Regarding EPFO's 'Vishwas Scheme 2026': (1) Reduces penal damages under Section 14B of the EPF & MP Act, 1952; (2) Valid for 6 months from 29 June 2026; (3) Applications filed online via the EPFO portal. Which statements are correct?", "opts": ["1 and 3 only (Valid for 6 months)", "1 and 2 only", "2 and 3 only", "All 1, 2, and 3"], "ans": 0, "p1": "Correction Note: The Vishwas Scheme 2026 has a 6-month validity window to settle pending EPF penal damage disputes.", "p2": "Exam Fact: Section 14B of the EPF & MP Act, 1952 governs recovery of damages from defaulting employers."}, {"id": 9, "slide_q": 113, "cat": "National & State Affairs", "q": "Whom does Kerala's 'NORKA Private Industrial Estate Scheme' primarily aim to attract for industrial investment in the state?", "opts": ["Foreign sovereign wealth funds only", "Non-Resident Keralites (NRKs) and expatriate entrepreneurs", "Central Public Sector Enterprises", "Agricultural cooperative societies"], "ans": 1, "p1": "Target Group: Non-Resident Keralites (NRKs) and returning expatriate entrepreneurs.", "p2": "Exam Fact: Provides up to ₹3 crore reimbursement per private industrial estate project."}, {"id": 10, "slide_q": 115, "cat": "Banking, Finance & Regulatory", "q": "How many Gram Panchayats and Urban Local Bodies (ULBs) were covered under the DFS nationwide Financial Inclusion Saturation Campaign?", "opts": ["3.5 lakh", "1.5 lakh", "2.0 lakh", "2.7 lakh"], "ans": 3, "p1": "Coverage: 2.7 lakh Gram Panchayats and ULBs across India.", "p2": "Exam Fact: Conducted by the Department of Financial Services (DFS) to saturate PMJDY, PMJJBY, PMSBY, and APY enrollment."}, {"id": 11, "slide_q": 117, "cat": "National & State Affairs", "q": "Regarding the Cluster-based initiative for Assam's Muga Silk sector: (1) Aims to revive Assam's Muga silk sector; (2) Muga silk was Assam's first GI-tagged product (2007); (3) Implemented by Ministry of DoNER (not Textiles); (4) Partnered with Government of Assam (not Meghalaya) to boost output. Which statements are correct?", "opts": ["1, 2, and 3 only", "1 and 2 only (Led by Ministry of DoNER with Govt of Assam)", "2 and 4 only", "All 1, 2, 3, and 4"], "ans": 1, "p1": "Corrections: Led by the Ministry of Development of North Eastern Region (DoNER) in partnership with the Government of Assam to increase Muga silk output.", "p2": "Exam Fact: Sualkuchi in Assam is famously known as the 'Manchester of Assam' for its Muga and Eri silk weaving."}, {"id": 12, "slide_q": 121, "cat": "Polity, Bills & Governance", "q": "Which state ranked first in implementing the 'Swamitva Adhikar Abhilekh Nishpadan Evam Panjiyan Yojana'?", "opts": ["Uttar Pradesh", "Madhya Pradesh", "Rajasthan", "Maharashtra"], "ans": 1, "p1": "Top State: Madhya Pradesh (Capital: Bhopal).", "p2": "Exam Fact: Facilitates seamless mutation and registration of rural property cards generated under the SVAMITVA drone survey scheme."}, {"id": 13, "slide_q": 123, "cat": "National & State Affairs", "q": "Which police force received the President's Police Colour on 1 November 2026 during its Diamond Jubilee celebrations?", "opts": ["Punjab Police", "Delhi Police", "Haryana Police", "Chandigarh Police"], "ans": 3, "p1": "Occasion: Diamond Jubilee (60th anniversary of Chandigarh UT formation on 1 November 1966).", "p2": "Exam Fact: Chandigarh serves as the joint capital of Punjab and Haryana."}, {"id": 14, "slide_q": 125, "cat": "Health, Science & Technology", "q": "Which AI company is leading 'Project Glasswing'?", "opts": ["OpenAI", "Anthropic", "Google DeepMind", "Mistral AI"], "ans": 1, "p1": "Company: Anthropic (developer of the Claude AI models, headquartered in San Francisco, USA).", "p2": "Exam Fact: Focuses on advanced AI cybersecurity defense and vulnerability discovery."}, {"id": 15, "slide_q": 126, "cat": "Polity, Bills & Governance", "q": "Regarding the Prevention of Unfair Means in Public Examinations Rules/Amendment (July 2026): (1) Up to ₹10 crore fine for organized paper leaks; (2) Imprisonment of 5 to 10 years for individual offences (not 1–3 years); (3) Parent Act enacted in 2024; (4) High-level reform committee was chaired by Dr. K. Radhakrishnan (not Raghuram Rajan/Nandan Nilekani). Which statements are correct?", "opts": ["2 and 4 only", "1, 2, and 3 only", "1 and 3 only (5–10 years jail; committee chaired by Dr. K. Radhakrishnan)", "All 1, 2, 3, and 4"], "ans": 2, "p1": "Corrections: Individual offences carry 3–5 / 5–10 years imprisonment and up to ₹10 lakh fine (up to ₹1 crore–₹10 crore for organized institutions), and the NTA exam reform panel was chaired by former ISRO Chairman Dr. K. Radhakrishnan.", "p2": "Exam Fact: The Public Examinations (Prevention of Unfair Means) Act was enacted in 2024."}, {"id": 16, "slide_q": 128, "cat": "Infrastructure, Ports & Energy", "q": "Which company is implementing the first-of-its-kind 250 MW solar power project at Sitapur Cantonment in Uttar Pradesh?", "opts": ["NTPC Limited", "NHPC Limited", "SECI", "Tata Power Solar"], "ans": 0, "p1": "Location & Developer: Sitapur Cantonment, Uttar Pradesh — implemented by NTPC Limited (Maharatna CPSE).", "p2": "Exam Fact: NTPC was established in 1975 (Headquarters: New Delhi)."}, {"id": 17, "slide_q": 129, "cat": "Infrastructure, Ports & Energy", "q": "Regarding the Delhi-NCR Old Commercial Vehicle Replacement Scheme (2026): (1) 8% discount on ex-showroom price for replacement vehicles; (2) Interest subvention is 5% for 5 years (not 3% for 3 years); (3) Targets BS-IV and below trucks & buses; (4) Funds routed through NCRPB (not DDA). Which statements are correct?", "opts": ["1, 2, and 3 only", "1 and 3 only (5% interest subvention for 5 years; routed via NCRPB)", "2 and 4 only", "All 1, 2, 3, and 4"], "ans": 1, "p1": "Corrections: Interest subvention is 5% for 5 years, and funds are routed through the National Capital Region Planning Board (NCRPB).", "p2": "Exam Fact: Aims to curb vehicular particulate pollution across Delhi-NCR."}, {"id": 18, "slide_q": 131, "cat": "Infrastructure, Ports & Energy", "q": "Regarding CAFE-III (Corporate Average Fuel Efficiency) Norms: (1) Target CO2 limit is 91.7 g/km (or 16.7% reduction); (2) Applies to M1 passenger vehicle category; (3) Reference weight increased from 1,082 kg to 1,229 kg; (4) Strong hybrids get 1.6x super-credit (while BEVs get 3x). Which statements are correct?", "opts": ["All 1, 2, 3, and 4", "1, 2, and 3 only", "2 and 4 only", "1 and 2 only (Weight increased from 1,082 to 1,229 kg; Strong hybrids get 1.6x)"], "ans": 3, "p1": "Corrections: Reference vehicle weight was increased from 1,082 kg to 1,229 kg, and Strong Hybrids receive 1.6x super-credits (3x is for Battery Electric Vehicles).", "p2": "Exam Fact: CAFE norms are enforced by the Bureau of Energy Efficiency (BEE) under the Ministry of Power."}, {"id": 19, "slide_q": 133, "cat": "Health, Science & Technology", "q": "Where is the new DRDO weapon and missile testing range (approved by the West Bengal government) located?", "opts": ["Balasore (Chandipur), Odisha", "Junput, West Bengal", "Pokhran, Rajasthan", "Sriharikota, Andhra Pradesh"], "ans": 1, "p1": "Location: Junput (Purba Medinipur district, coastal West Bengal), complementing DRDO's ITR Chandipur in Odisha.", "p2": "Exam Fact: DRDO was established in 1958 (HQ: New Delhi; Chairman: Dr. Samir V. Kamat)."}, {"id": 20, "slide_q": 134, "cat": "Government Schemes & Initiatives", "q": "Regarding the National Social Assistance Programme (NSAP): (1) Extended for FY 2027–31; (2) Outlay is ₹53,428 crore (not ₹35,428 crore); (3) Includes Indira Gandhi National Old Age Pension Scheme (IGNOAPS) and widow/disability pensions. Which statements are correct?", "opts": ["2 and 3 only", "1 and 2 only", "1, 3, and 4 (Outlay is ₹53,428 crore)", "All 1, 2, 3, and 4"], "ans": 2, "p1": "Correction Note: Total approved outlay for NSAP (FY 2027–31) is ₹53,428 crore (not ₹35,428 crore).", "p2": "Exam Fact: NSAP is a Centrally Sponsored Scheme administered by the Ministry of Rural Development."}, {"id": 21, "slide_q": 135, "cat": "Infrastructure, Ports & Energy", "q": "Between which two stations in Gujarat was India's first LNG-powered (Liquefied Natural Gas) train flagged off in September 2026?", "opts": ["Rajkot and Jamnagar", "Ahmedabad and Vadodara", "Surat and Valsad", "Sabarmati and Mahesana"], "ans": 3, "p1": "Route: Sabarmati to Mahesana (Mehsana) in Gujarat (Western Railway).", "p2": "Exam Fact: Dual-fuel DEMU train retrofitted to run on Liquefied Natural Gas (LNG), cutting diesel emissions."}, {"id": 22, "slide_q": 136, "cat": "Infrastructure, Ports & Energy", "q": "Regarding the 'Samudra Manthan' scheme: (1) Outlay is ₹84,084 crore; (2) Boosts offshore oil and gas exploration; (3) 100% Central Sector funding (not 60:40); (4) Targets 80 MMT domestic oil & gas production annually (not 50). Which statements are correct?", "opts": ["1 and 2 only (100% Central Sector; target 80 MMT)", "1, 2, and 3 only", "2 and 4 only", "All 1, 2, 3, and 4"], "ans": 0, "p1": "Corrections: Samudra Manthan is 100% Central Sector funded (not 60:40), and targets 80 MMT annual domestic oil & gas output.", "p2": "Exam Fact: Regional Rural Banks (RRBs) follow the 50:35:15 shareholding pattern (Centre 50%, Sponsor Bank 35%, State Govt 15%)."}, {"id": 23, "slide_q": 137, "cat": "National & State Affairs", "q": "Chhattisgarh became the first Indian state to adopt a Risk-Based Business Approval System under which law/framework?", "opts": ["Jan Vishwas Act, 2023", "Ease of Doing Business Rules / Act, 2026", "Chhattisgarh Industrial Policy, 2024", "MSME Facilitation Act, 2020"], "ans": 1, "p1": "Framework: Ease of Doing Business 2026 rules in Chhattisgarh.", "p2": "Exam Fact: Classifies industries by environmental/safety risk tiers to grant instant deemed approvals for low-risk enterprises."}, {"id": 24, "slide_q": 139, "cat": "Economy & Agriculture", "q": "Regarding the 'Bhavya Rasayan' (Bulk Drug & Chemical Parks) scheme: (1) Outlay is ₹3,030 crore (not ₹5,030 crore); (2) Establishes 3 Chemical Parks in 5 years; (3) Central grant up to ₹1,000 crore per park; (4) States must contribute at least ₹500 crore per park. Which statements are correct?", "opts": ["All 1, 2, 3, and 4", "1 and 2 only", "1, 3, and 4 only", "2, 3, and 4 only (Total outlay is ₹3,030 crore)"], "ans": 3, "p1": "Correction Note: Statement 1 is incorrect because the total outlay is ₹3,030 crore (not ₹5,030 crore).", "p2": "Exam Fact: Reduces India's import dependence on specialty chemicals and Active Pharmaceutical Ingredients (APIs)."}, {"id": 25, "slide_q": 140, "cat": "Environment, Parks & GI Tags", "q": "Which ancient temple in Telangana was declared a Monument of National Importance by the Archaeological Survey of India (ASI) in September 2026?", "opts": ["Gollathagudi Temple (Mahabubnagar)", "Ramappa Temple (Mulugu)", "Thousand Pillar Temple (Hanamkonda)", "Alampur Navabrahma Temple"], "ans": 0, "p1": "Location: Gollathagudi (Gollagudi) Temple in Mahabubnagar district, Telangana (an ancient 9th–10th century Jain/Hindu brick temple complex).", "p2": "Exam Fact: Ramappa (Kakatiya Rudreshwara) Temple in Telangana is already a UNESCO World Heritage Site (2021)."}, {"id": 26, "slide_q": 141, "cat": "Polity, Bills & Governance", "q": "Regarding the Mediation Council of India: (1) Set up under Section 31 of the Mediation Act, 2023; (2) Headquartered in New Delhi (not Mumbai); (3) Notified by Department of Legal Affairs; (4) Regulates mediators and mediation institutes. Which statements are correct?", "opts": ["1 and 2 only", "1, 3, and 4 only (Headquartered in New Delhi)", "2 and 3 only", "All 1, 2, 3, and 4"], "ans": 1, "p1": "Correction Note: The Mediation Council of India is headquartered in New Delhi (not Mumbai).", "p2": "Exam Fact: The Mediation Act, 2023 promotes institutional and online Alternative Dispute Resolution (ADR) to reduce court pendency."}, {"id": 27, "slide_q": 142, "cat": "Polity, Bills & Governance", "q": "Where was the 3rd permanent/circuit judicial seat of the High Court of Jammu & Kashmir and Ladakh established?", "opts": ["Anantnag, J&K", "Kargil, Ladakh", "Leh, Ladakh", "Udhampur, J&K"], "ans": 2, "p1": "Judicial Seats: 1st — Srinagar; 2nd — Jammu; 3rd — Leh (Ladakh).", "p2": "Exam Fact: Improves access to higher judiciary for residents of Ladakh."}, {"id": 28, "slide_q": 143, "cat": "Government Schemes & Initiatives", "q": "Regarding the 'MAHA Water Mission' (Jal Shakti): (1) Launched by Ministry of Jal Shakti with Anusandhan National Research Foundation (ANRF); (2) Total outlay is ₹200 crore over 5 years (not ₹500 crore); (3) Up to ₹20 crore per multi-disciplinary consortium; (4) MoU signed between ISRO and Department of Water Resources. Which statements are correct?", "opts": ["All 1, 2, 3, and 4", "1 and 3 only", "2 and 3 only", "1, 2, and 4 (Outlay is ₹200 crore over 5 years)"], "ans": 3, "p1": "Correction Note: Total outlay is ₹200 crore over 5 years (not ₹500 crore).", "p2": "Exam Fact: ANRF (Anusandhan National Research Foundation) was established under the ANRF Act, 2023 (chaired by PM Modi)."}, {"id": 29, "slide_q": 145, "cat": "Economy & Agriculture", "q": "With the base year revised to 2022–23, how many Core Industries are tracked in the updated Index of Core Industries (ICI) series?", "opts": ["8", "9", "10", "12"], "ans": 1, "p1": "Revision Update: Expanded from 8 Core Industries to 9 Core Industries in the new 2022–23 base series.", "p2": "Exam Fact: Traditional 8 core industries were Coal, Crude Oil, Natural Gas, Refinery Products, Fertilizers, Steel, Cement, and Electricity."}, {"id": 30, "slide_q": 146, "cat": "Government Schemes & Initiatives", "q": "Regarding PM Viksit Bharat Rozgar Yojana: (1) Total outlay is ₹99,446 crore; (2) Effective from 1 August 2025 to 31 July 2027 (not April 2025–March 2027); (3) Benefits 1.92 crore first-time employees; (4) Implemented by Ministry of Labour & Employment via EPFO. Which statements are correct?", "opts": ["2 and 3 only", "1 and 2 only", "1, 3, and 4 only (Effective 1 August 2025 to 31 July 2027)", "All 1, 2, 3, and 4"], "ans": 2, "p1": "Correction Note: The implementation window is 1 August 2025 to 31 July 2027 (not April 2025–March 2027).", "p2": "Exam Fact: Employment Linked Incentive (ELI) scheme incentivizing formal job creation through EPFO."}, {"id": 31, "slide_q": 148, "cat": "Banking, Finance & Regulatory", "q": "Regarding PFRDA's 'NPS Swasthya' guidelines: (1) Maximum health coverage is ₹30 lakh; (2) Entry age is 18 to 70 years (not 21–60); (3) Subscribers can withdraw up to 25% of contributions; (4) Transferable to spouse/children. Which statements are correct?", "opts": ["1, 3, and 4 only (Entry age is 18 to 70 years)", "1 and 2 only", "2 and 3 only", "All 1, 2, 3, and 4"], "ans": 0, "p1": "Correction Note: Entry age under NPS Swasthya is 18 to 70 years (not 21 to 60).", "p2": "Exam Fact: Integrates long-term medical expense coverage within the National Pension System."}, {"id": 32, "slide_q": 149, "cat": "Infrastructure, Ports & Energy", "q": "In the 3rd round of PPAC (Project Appraisal Committee), how many greenfield airport proposals were granted 'In-Principle' approval?", "opts": ["6", "11", "8", "15"], "ans": 1, "p1": "Approval Count: 11 greenfield airports granted In-Principle approval.", "p2": "Exam Fact: Greenfield airports are built from scratch on undeveloped land (e.g., Jewar, Bhogapuram, Mopa)."}, {"id": 33, "slide_q": 150, "cat": "National & State Affairs", "q": "Which Indian city was declared the 'World's First Drug-Free City' by Union Home Minister Amit Shah?", "opts": ["Panaji", "Indore", "Chandigarh", "Gangtok"], "ans": 2, "p1": "City: Chandigarh (Union Territory).", "p2": "Exam Fact: Achieved through zero-tolerance enforcement, rehabilitation centres, and community vigilance under Nasha Mukt Bharat Abhiyaan."}, {"id": 34, "slide_q": 152, "cat": "International & Summits", "q": "Which four countries joined the 'Bay of Bengal Network on Ocean Research & Fisheries' (BOB-NORF)?", "opts": ["India, Sri Lanka, Bangladesh, and Maldives", "India, Thailand, Myanmar, and Indonesia", "India, Bangladesh, Myanmar, and Thailand", "India, Sri Lanka, Mauritius, and Seychelles"], "ans": 0, "p1": "Member Nations: India, Sri Lanka, Bangladesh, and Maldives.", "p2": "Exam Fact: Enhances marine biodiversity research, blue economy cooperation, and sustainable fisheries in the Bay of Bengal."}, {"id": 35, "slide_q": 153, "cat": "Environment, Parks & GI Tags", "q": "In which Union Territory is the 'Krest Mud Volcano' complex (recently added to India's UNESCO Tentative List) located?", "opts": ["Lakshadweep", "Andaman and Nicobar Islands", "Puducherry", "Daman & Diu"], "ans": 1, "p1": "Location: Andaman and Nicobar Islands (Baratang Island is also famous for India's active mud volcanoes).", "p2": "Exam Fact: Mud volcanoes are formed by subterranean pressurized gases and mud eruptions rather than molten lava."}, {"id": 36, "slide_q": 154, "cat": "International & Summits", "q": "The 49th Session of the Codex Alimentarius Commission (CAC) is a joint food standards body of which two UN organizations?", "opts": ["WTO and UNCTAD", "UNEP and UNDP", "FAO and WHO", "UNICEF and WFP"], "ans": 2, "p1": "Parent Bodies: Food and Agriculture Organization (FAO, founded 1945, HQ: Rome) and World Health Organization (WHO, founded 1948, HQ: Geneva).", "p2": "Exam Fact: Codex Alimentarius ('Food Code', established 1963) sets international food safety and quality standards."}, {"id": 37, "slide_q": 155, "cat": "International & Summits", "q": "In which capital city did the Ministry of External Affairs (MEA) open a new Indian Resident Mission (Embassy) in Costa Rica?", "opts": ["Managua", "Panama City", "San Salvador", "San José"], "ans": 3, "p1": "Capital & Currency: San José is the capital of Costa Rica (Currency: Costa Rican Colón).", "p2": "Exam Fact: Costa Rica is a Central American nation renowned for abolishing its standing army in 1948 and leading in eco-tourism."}, {"id": 38, "slide_q": 156, "cat": "International & Summits", "q": "Regarding the AI Global Impact / Coalition launched in July 2026: (1) Comprises 44 founding members; (2) Co-chaired by Paul Kagame (President of Rwanda) and Marc Benioff (Salesforce CEO); (3) Indian founding members include Mukesh Ambani, Lakshmi N. Mittal, and Sunil Bharti Mittal (not Gautam Adani). Which statements are correct?", "opts": ["1 and 2 only (Indian members: Mukesh Ambani, Lakshmi Mittal & Sunil Bharti Mittal)", "1 and 3 only", "2 and 3 only", "All 1, 2, and 3"], "ans": 0, "p1": "Correction Note: Statement 3 is incorrect because Gautam Adani is not the sole Indian member; Mukesh Ambani, Lakshmi N. Mittal, and Sunil Bharti Mittal represent India.", "p2": "Exam Fact: Paul Kagame is the President of Rwanda (Capital: Kigali)."}, {"id": 39, "slide_q": 157, "cat": "Science, Space & Environment", "q": "The US Defense Security Cooperation Agency (DSCA) notified a USD 482.2 million defence sale to India covering M777A2 howitzers and support for which attack helicopter?", "opts": ["CH-47F Chinook", "AH-64E Apache", "MH-60R Seahawk", "HAL Prachand"], "ans": 1, "p1": "Platform: Boeing AH-64E Apache multi-role attack helicopter (operated by both the Indian Air Force and Indian Army).", "p2": "Exam Fact: M777A2 is an ultra-lightweight 155 mm towed howitzer deployed in high-altitude Himalayan sectors."}, {"id": 40, "slide_q": 159, "cat": "Banking, Finance & Regulatory", "q": "Regarding the Financial Action Task Force (FATF): (1) Global money laundering & terrorist financing watchdog; (3) Headquartered in Paris, France (at OECD); (4) India became a full member in 2010. Which statements are correct?", "opts": ["All 1, 2, 3, and 4", "1 and 2 only", "2 and 4 only", "1 and 3 only"], "ans": 3, "p1": "Key Facts: FATF was founded in 1989 by the G7 (HQ: Paris, France); India joined as the 34th member in 2010.", "p2": "Exam Fact: FATF maintains the 'Grey List' (Jurisdictions under Increased Monitoring) and 'Black List' (High-Risk Jurisdictions)."}, {"id": 41, "slide_q": 160, "cat": "Environment, Parks & GI Tags", "q": "Which of the following sites in Madhya Pradesh is NOT among the 5 newly added sites on India's UNESCO Tentative List?", "opts": ["Namdapha National Park", "Bhojeshwar Mahadev Temple (Bhojpur)", "Rock Art Sites of Chambal Valley", "Khooni Bhandara (Burhanpur) & Gond Monuments of Ramnagar"], "ans": 0, "p1": "Location Distinction: Namdapha National Park is located in Arunachal Pradesh (not Madhya Pradesh).", "p2": "Exam Fact: Madhya Pradesh's UNESCO World Heritage Sites are Khajuraho, Sanchi Stupa, and Rock Shelters of Bhimbetka."}, {"id": 42, "slide_q": 161, "cat": "International & Summits", "q": "Which city hosted the 45th CCAMLR (Commission for the Conservation of Antarctic Marine Living Resources) meeting where India reiterated its stand on Southern Ocean conservation?", "opts": ["Christchurch, New Zealand", "Hobart, Australia", "Cape Town, South Africa", "Ushuaia, Argentina"], "ans": 1, "p1": "Host City: Hobart (Tasmania), Australia — permanent headquarters of CCAMLR.", "p2": "Exam Fact: India operates two active research stations in Antarctica—Maitri and Bharati (Dakshin Gangotri was the first, now decommissioned)."}, {"id": 43, "slide_q": 162, "cat": "International & Summits", "q": "Which country chaired/hosted the 16th BRICS National Security Advisers (NSAs) Meeting?", "opts": ["Russia", "Brazil", "India", "South Africa"], "ans": 2, "p1": "Chair: India (National Security Adviser: Ajit Doval).", "p2": "Exam Fact: India holds the BRICS Chairmanship in 2026."}, {"id": 44, "slide_q": 163, "cat": "International & Summits", "q": "Regarding the Red Sea / Islamic Defence Alliance formed in August 2026: (1) Comprises 14 founding members led by Saudi Arabia; (2) Secures the Red Sea, Bab-el-Mandeb Strait, and Gulf of Aden; (3) India is NOT a founding member (includes Egypt, Pakistan, Bangladesh); (4) Permanent HQ is in Saudi Arabia (not Egypt). Which statements are correct?", "opts": ["All 1, 2, 3, and 4", "1, 2, and 3 only", "2 and 4 only", "1 and 2 only (India is not a member; HQ is in Saudi Arabia)"], "ans": 3, "p1": "Corrections: India is not among the founding members, and the permanent headquarters is in Saudi Arabia (not Egypt).", "p2": "Exam Fact: The Bab-el-Mandeb Strait connects the Red Sea to the Gulf of Aden and Indian Ocean."}, {"id": 45, "slide_q": 164, "cat": "Banking, Finance & Regulatory", "q": "Which Central Asian country became the 10th member (and first Central Asian member) of the BRICS New Development Bank (NDB)?", "opts": ["Uzbekistan", "Kazakhstan", "Kyrgyzstan", "Tajikistan"], "ans": 0, "p1": "Milestone: Uzbekistan became the 10th member of NDB (Capital: Tashkent | Currency: Uzbekistani Som).", "p2": "Exam Fact: New Development Bank (NDB) was founded in 2014 by BRICS nations (HQ: Shanghai, China; President: Dilma Rousseff)."}, {"id": 46, "slide_q": 167, "cat": "Environment, Parks & GI Tags", "q": "At FAO's COFO 28 (Committee on Forestry), what is India's global ranking for average annual net forest area gain under the Global Forest Resources Assessment 2025?", "opts": ["5th", "1st", "2nd", "3rd"], "ans": 3, "p1": "Global Ranking: India ranked 3rd globally in net annual forest area gain (after China and Australia).", "p2": "Exam Fact: FAO (Food and Agriculture Organization) is headquartered in Rome, Italy."}, {"id": 47, "slide_q": 168, "cat": "International & Summits", "q": "Which country became the 116th member to ratify/join the International Solar Alliance (ISA)?", "opts": ["The Bahamas", "Spain", "Paraguay", "Armenia"], "ans": 0, "p1": "Country: The Bahamas (Capital: Nassau | Currency: Bahamian Dollar).", "p2": "Exam Fact: ISA was co-founded by India and France in 2015 and is headquartered in Gurugram, Haryana (Director General: Ashish Khanna)."}, {"id": 48, "slide_q": 169, "cat": "International & Summits", "q": "Regarding the Coalition of Finance Ministers for Climate Action: (1) Drives climate-aligned fiscal policy; (2) Launched in 2019 (or Helsinki Principles) — not announced in Washington D.C. in 2020 (launched at Spring/Bangkok/Helsinki meetings); (3) India is a member. Which statements are correct?", "opts": ["1 and 2 only", "1, 3, and 4 (Announced in Bangkok/Helsinki rather than Washington D.C. in 2020)", "2 only", "All 1, 2, 3, and 4"], "ans": 1, "p1": "Correction Note: Statement 2 is incorrect (announced in Bangkok rather than Washington D.C. in 2020).", "p2": "Exam Fact: Brings together fiscal and economic policymakers from over 90 countries to mainstream climate action into economic policy."}, {"id": 49, "slide_q": 170, "cat": "Awards & Festivals", "q": "What rank did India achieve at the WorldSkills Competition 2026 held in Shanghai, China?", "opts": ["8th", "5th", "10th", "13th"], "ans": 2, "p1": "Rank & Host: India finished 10th overall at WorldSkills Shanghai 2026.", "p2": "Exam Fact: WorldSkills is the world's premier vocational education and skills excellence competition."}, {"id": 50, "slide_q": 173, "cat": "Science, Space & Environment", "q": "Regarding the Critical Minerals & Recycling Innovation Centre: (1) Launched at IIT Bombay (not IIT Delhi); (2) Inaugurated by Union Coal & Mines Minister G. Kishan Reddy in New Delhi (not UK PM in London); (3) Supports India's National Critical Mineral Mission. Which statements are correct?", "opts": ["1 and 2 only", "1 and 3 only (Inaugurated by Union Minister G. Kishan Reddy)", "2 and 3 only", "All 1, 2, and 3"], "ans": 1, "p1": "Correction Note: Statement 2 is incorrect because it was launched by Union Minister G. Kishan Reddy in New Delhi (not by the UK PM in London).", "p2": "Exam Fact: Critical minerals like lithium, cobalt, nickel, and rare earth elements are vital for EV batteries and semiconductors."}, {"id": 51, "slide_q": 174, "cat": "International & Summits", "q": "In which city did India sign the Host Country Agreement for the regional office of the International Organization for Migration / partner international body?", "opts": ["Geneva, Switzerland", "New Delhi, India", "Vienna, Austria", "Bangkok, Thailand"], "ans": 2, "p1": "City: Vienna, Austria (major UN headquarters hub alongside New York, Geneva, and Nairobi).", "p2": "Exam Fact: Vienna hosts IAEA, UNIDO, UNODC, UNOOSA, and OPEC."}, {"id": 52, "slide_q": 175, "cat": "Science, Space & Environment", "q": "Türkiye joined the Artemis Accords in September 2026. How many countries in total had joined the Artemis Accords up to that point?", "opts": ["72", "65", "68", "71"], "ans": 3, "p1": "Sequence: Türkiye became the 71st signatory (followed later by Djibouti as the 72nd signatory).", "p2": "Exam Fact: Initiated by NASA and the US State Department in 2020."}, {"id": 53, "slide_q": 177, "cat": "International & Summits", "q": "PM Narendra Modi hosted the Prime Minister of which country in Jodhpur, Rajasthan on 4 July 2026 (launching a modified bilateral scheme)?", "opts": ["Australia", "New Zealand", "Mauritius", "Singapore"], "ans": 1, "p1": "Venue: Jodhpur ('Blue City'), Rajasthan.", "p2": "Exam Fact: Prime Minister of New Zealand: Christopher Luxon."}, {"id": 54, "slide_q": 178, "cat": "International & Summits", "q": "Regarding Venezuela's withdrawal from the Rome Statute (ICC) in August 2026: (1) Under Article 127, withdrawal takes effect 1 year after notification; (2) Venezuela ratified the Rome Statute in 2000 (not 2012); (3) ICC is headquartered in The Hague, Netherlands; (4) Rome Statute was adopted in 1998. Which statements are correct?", "opts": ["2 and 3 only", "1 and 2 only", "1, 3, and 4 only (Venezuela joined in 2000, not 2012)", "All 1, 2, 3, and 4"], "ans": 2, "p1": "Correction Note: Venezuela ratified the Rome Statute in June 2000 (not 2012); under Article 127, withdrawal takes effect 12 months after written notification to the UN Secretary-General.", "p2": "Exam Fact: The Rome Statute was adopted on 17 July 1998 and entered into force on 1 July 2002."}, {"id": 55, "slide_q": 179, "cat": "International & Summits", "q": "For which Caribbean nation did India announce a USD 500 million Line of Credit (LoC) during bilateral summit talks?", "opts": ["Barbados", "Trinidad and Tobago", "Guyana", "Antigua and Barbuda"], "ans": 3, "p1": "Country: Antigua and Barbuda (Capital: St. John's | Currency: East Caribbean Dollar).", "p2": "Exam Fact: Supports resilient infrastructure, renewable energy, and healthcare projects in CARICOM nations."}, {"id": 56, "slide_q": 180, "cat": "International & Summits", "q": "At which summit in Paris did European nations and Ukraine announce a joint anti-ballistic missile coalition in 2026?", "opts": ["Coalition of the Willing Summit, Paris", "G7 Summit, Évian", "NATO Summit, Ankara", "Munich Security Conference"], "ans": 0, "p1": "Venue: Paris, France.", "p2": "Exam Fact: Strengthens integrated European air and ballistic missile defense."}, {"id": 57, "slide_q": 181, "cat": "Science, Space & Environment", "q": "Regarding the International AI Safety & Governance Coalition (September 2026): (1) India joined 25 other countries; (2) Led by the United States / NIST (not European Union); (3) Signed/represented by MoS Jitin Prasada. Which statements are correct?", "opts": ["1 and 2 only", "1 and 3 only (Led by the United States, not EU)", "2 and 3 only", "All 1, 2, and 3"], "ans": 1, "p1": "Correction Note: Statement 2 is incorrect because the coalition is led by the United States (not the European Union).", "p2": "Exam Fact: Jitin Prasada is Minister of State in MeitY and Commerce & Industry."}, {"id": 58, "slide_q": 182, "cat": "International & Summits", "q": "What is the total value of the 8 High-Impact Community Development Projects (HICDPs) signed between India and Nepal?", "opts": ["NPR 1.2 billion", "NPR 500 million", "NPR 803 million", "NPR 650 million"], "ans": 2, "p1": "Value: NPR 803 million (Nepalese Rupees).", "p2": "Exam Fact: Funds education, healthcare, and drinking water community projects across Nepal."}, {"id": 59, "slide_q": 183, "cat": "International & Summits", "q": "Which of the following countries is NOT a dialogue partner in the Global Compact Programme (GCP)?", "opts": ["Australia", "India", "Japan", "France"], "ans": 3, "p1": "Exclusion: France is not listed among the dialogue partners.", "p2": "Exam Fact: Focuses on Indo-Pacific maritime and development cooperation."}, {"id": 60, "slide_q": 184, "cat": "International & Summits", "q": "Regarding the Global Health & Space Announcements: (1) Held in Berlin, Germany (World Health Summit); (2) Commitments worth ~USD 20 billion; (3) ISRO signed a space cooperation partnership. Which statements are correct?", "opts": ["2 and 3 only", "1 and 2 only", "1 and 3 only", "All 1, 2, and 3"], "ans": 0, "p1": "Key Details: Commitments totaled USD 20 billion alongside ISRO's bilateral space cooperation agreement.", "p2": "Exam Fact: World Health Summit is held annually in Berlin, Germany."}, {"id": 61, "slide_q": 185, "cat": "International & Summits", "q": "In which Saudi Arabian city did India and Saudi Arabia sign an MoU on Water Resources Cooperation during the inaugural Saudi Water Week?", "opts": ["Riyadh", "Jeddah", "Dammam", "Mecca"], "ans": 1, "p1": "Host City: Jeddah, Saudi Arabia (located on the Red Sea coast).", "p2": "Exam Fact: Covers desalination, wastewater recycling, and smart water management technologies."}, {"id": 62, "slide_q": 187, "cat": "International & Summits", "q": "Regarding the India–EU / Bilateral Summit Statements: (1) First two statements on strategic & trade roadmap are accurate; (2) Statements 3 and 4 contain factual errors. Which statements are correct?", "opts": ["All 1, 2, 3, and 4", "1 and 3 only", "2 and 4 only", "1 and 2 only"], "ans": 3, "p1": "Summary: Statements 1 and 2 are correct while Statements 3 and 4 are incorrect.", "p2": "Exam Fact: The European Union is headquartered in Brussels, Belgium."}, {"id": 63, "slide_q": 188, "cat": "International & Summits", "q": "Under what label did Iran designate the UK Royal Navy and Royal Air Force in retaliation for Western sanctions?", "opts": ["Hostile Group / Terrorist Entity Label", "Axis of Aggression", "Non-State Combatant Force", "Sanctioned Maritime Bloc"], "ans": 0, "p1": "Designation: Hostile Group / Terrorist Organization designation by Iran.", "p2": "Exam Fact: Capital of Iran: Tehran | Currency: Iranian Rial."}, {"id": 64, "slide_q": 189, "cat": "Sports & Tournaments", "q": "Which country is hosting the postponed AFC Asian Cup (rescheduled to December 2027 – January 2028)?", "opts": ["Qatar", "Saudi Arabia", "UAE", "Japan"], "ans": 1, "p1": "Host Country: Saudi Arabia (AFC = Asian Football Confederation, HQ: Kuala Lumpur, Malaysia).", "p2": "Exam Fact: Qatar hosted and won the 2023 AFC Asian Cup."}, {"id": 65, "slide_q": 190, "cat": "International & Summits", "q": "Regarding India–Singapore Bilateral Relations: (1) 3rd India–Singapore Ministerial Roundtable (ISMR) held in 2026; (2) Elevated to Comprehensive Strategic Partnership in September 2024; (3) MoU signed between FSSAI and Singapore Food Agency (SFA). Which statements are correct?", "opts": ["2 and 3 only", "1 and 2 only", "All 1, 2, and 3", "1 and 3 only"], "ans": 2, "p1": "Key Milestones: Elevated to Comprehensive Strategic Partnership during PM Modi's visit in September 2024; FSSAI and SFA signed food safety cooperation.", "p2": "Exam Fact: Singapore is among the top sources of FDI equity inflows into India."}, {"id": 66, "slide_q": 191, "cat": "International & Summits", "q": "Which area-accurate world map projection was adopted under a global resolution in September 2026 to replace distorted Mercator maps?", "opts": ["Winkel tripel projection", "Peters projection", "Robinson projection", "Equal Earth projection"], "ans": 3, "p1": "Projection Name: Equal Earth map projection (created in 2018 by Bojan Šavrič, Tom Patterson, and Bernhard Jenny).", "p2": "Exam Fact: Accurately represents the true relative land sizes of Africa, South America, and Asia compared to high-latitude regions."}, {"id": 67, "slide_q": 193, "cat": "Health, Science & Technology", "q": "The World Health Organization (WHO) announced the closure of two circulating vaccine-derived poliovirus (cVDPV) outbreaks. Which country was NOT part of this specific closure announcement?", "opts": ["Madagascar", "Nigeria", "Mozambique", "DR Congo"], "ans": 1, "p1": "Exclusion: Nigeria was not among the countries in that specific outbreak closure notice.", "p2": "Exam Fact: India was officially certified polio-free by WHO in March 2014."}, {"id": 68, "slide_q": 194, "cat": "International & Summits", "q": "Regarding WTO Ministerial Conferences: (1) Statement 1 is correct; (2) MC12 was held in Geneva, Switzerland (not MC13 in Abu Dhabi in that statement); (3) Statement 3 is correct. Which statements are correct?", "opts": ["2 and 3 only", "1 and 2 only", "1 and 3 only (MC12 was held in Geneva)", "All 1, 2, and 3"], "ans": 2, "p1": "Correction Note: The 12th WTO Ministerial Conference (MC12) was held in Geneva, Switzerland (MC13 was held in Abu Dhabi in Feb 2024).", "p2": "Exam Fact: WTO is headquartered in Geneva, Switzerland (Director-General: Ngozi Okonjo-Iweala)."}, {"id": 69, "slide_q": 195, "cat": "International & Summits", "q": "Under Myanmar's leader Min Aung Hlaing, which Myanmar business chamber co-organized the India–Myanmar Business Conclave?", "opts": ["Mekong Business Chamber", "ASEAN Business Advisory Council", "Myanmar Trade Promotion Organization", "UMFCCI (Union of Myanmar Federation of Chambers of Commerce and Industry)"], "ans": 3, "p1": "Partner Body: Union of Myanmar Federation of Chambers of Commerce and Industry (UMFCCI).", "p2": "Exam Fact: Capital of Myanmar: Naypyidaw | Currency: Myanmar Kyat."}, {"id": 70, "slide_q": 196, "cat": "International & Summits", "q": "The Pacific Island nation of Nauru was renamed as which official title?", "opts": ["Pacific Republic of Nauru (Naurio)", "Commonwealth of Nauru", "Federated States of Nauru", "Sovereign Atoll of Nauru"], "ans": 0, "p1": "Country Profile: Nauru is the world's smallest island nation and third-smallest country by area (after Vatican City and Monaco).", "p2": "Exam Fact: Nauru has no official capital city (Yaren serves as the de facto seat of government) and uses the Australian Dollar."}, {"id": 71, "slide_q": 197, "cat": "International & Summits", "q": "Regarding India–Japan Joint Crediting Mechanism (JCM) & bilateral cooperation: (1) JCM operates under Article 6.2 of the Paris Agreement; (2) Signed/operationalized in 2026; (3) Statement 4 is incorrect (historical date was 2010 rather than the stated year). Which statements are correct?", "opts": ["1 and 4 only", "1, 2, and 3 only", "2 and 4 only", "All 1, 2, 3, and 4"], "ans": 1, "p1": "Mechanism: Joint Crediting Mechanism (JCM) facilitates diffusion of low-carbon technologies between Japan and partner countries under Article 6.2 of the Paris Agreement.", "p2": "Exam Fact: Capital of Japan: Tokyo | PM: Sanae Takaichi | Currency: Japanese Yen."}, {"id": 72, "slide_q": 198, "cat": "Economy & Agriculture", "q": "Which research institute in Kochi, Kerala hosted the meeting launching the 'BOB-FO' (Bay of Bengal Fisheries) initiative?", "opts": ["MPEDA, Kochi", "ICAR-CIFT, Kochi", "ICAR-CMFRI (Central Marine Fisheries Research Institute), Kochi", "NIO, Goa"], "ans": 2, "p1": "Host Institute: ICAR-Central Marine Fisheries Research Institute (CMFRI), Kochi, Kerala.", "p2": "Exam Fact: CMFRI is India's premier marine fisheries research institute under ICAR."}, {"id": 73, "slide_q": 199, "cat": "Science, Space & Environment", "q": "In June 2026, Russian President Vladimir Putin offered India joint production of which Russian 5th-generation stealth fighter aircraft?", "opts": ["Tupolev Tu-160", "Mikoyan MiG-35", "Sukhoi Su-35", "Sukhoi Su-57"], "ans": 3, "p1": "Aircraft: Sukhoi Su-57 (NATO reporting name: Felon) — Russia's twin-engine stealth multirole fighter.", "p2": "Exam Fact: India and Russia jointly manufacture BrahMos supersonic cruise missiles and AK-203 assault rifles (at Korwa, Amethi, UP)."}, {"id": 74, "slide_q": 201, "cat": "Infrastructure, Ports & Energy", "q": "During his visit to Dadra & Nagar Haveli and Daman & Diu on World Environment Day (5 June 2026), PM Narendra Modi inaugurated development projects worth what amount?", "opts": ["₹15,000 crore", "₹21,700 crore", "₹18,500 crore", "₹25,000 crore"], "ans": 1, "p1": "Project Value: ₹21,700 crore (inaugurated on 5 June 2026).", "p2": "Exam Fact: Dadra & Nagar Haveli and Daman & Diu were merged into a single Union Territory on 26 January 2020 (Capital: Daman)."}, {"id": 75, "slide_q": 202, "cat": "Banking, Finance & Regulatory", "q": "In which two currencies are transactions settled under the Asian Development Bank's Supply Chain Finance Program arrangement?", "opts": ["INR and JPY", "USD and EUR", "USD and INR", "USD and SGD"], "ans": 2, "p1": "Currencies: United States Dollar (USD) and Indian Rupee (INR).", "p2": "Exam Fact: ADB's Supply Chain Finance Program (SCFP) bridges trade finance gaps for SMEs across Asia-Pacific."}, {"id": 76, "slide_q": 203, "cat": "Banking, Finance & Regulatory", "q": "Which two credentials are required for OTP-based citizen login on the PFRDA / NPS digital portal?", "opts": ["PRAN and Passport Number", "PAN Number and Bank Account Number", "Email ID and Mother's Maiden Name", "Registered Mobile Number and Date of Birth"], "ans": 3, "p1": "Authentication: Registered Mobile Number + Date of Birth + OTP.", "p2": "Exam Fact: Enables instant e-PRAN download and statement access for NPS subscribers."}, {"id": 77, "slide_q": 204, "cat": "Banking, Finance & Regulatory", "q": "For which Government of India programme did the Asian ing."}, {"id": 84, "slide_q": 214, "cat": "Banking, Finance & Regulatory", "q": "Karur Vysya Bank (HQ: Karur, Tamil Nadu; founded 1916) signed a bancassurance partnership with which insurer to distribute general insurance products?", "opts": ["HDFC ERGO General Insurance", "ICICI Lombard General Insurance", "Bajaj Allianz General Insurance", "Zurich Kotak General Insurance"], "ans": 3, "p1": "Partner Insurer: Zurich Kotak General Insurance (formed after Zurich Insurance Group acquired a 70% stake in Kotak Mahindra General Insurance).", "p2": "Exam Fact: Bancassurance refers to an arrangement where a bank sells insurance products of an insurance company through its branch network."}, {"id": 85, "slide_q": 215, "cat": "Banking, Finance & Regulatory", "q": "At which campus will BITS Pilani and Axis Bank establish an Industry Research, Technology and Innovation Park under their ₹100 crore agreement?", "opts": ["Hyderabad Campus", "Pilani Campus", "Goa Campus", "Mumbai Campus"], "ans": 0, "p1": "Location & Outlay: BITS Pilani Hyderabad Campus — ₹100 crore commitment from Axis Bank.", "p2": "Exam Fact: Axis Bank is headquartered in Mumbai, Maharashtra (MD & CEO: Amitabh Chaudhry)."}, {"id": 86, "slide_q": 216, "cat": "Banking, Finance & Regulatory", "q": "Which Indian bank completely removed forex markup charges across its entire credit card portfolio?", "opts": ["HDFC Bank", "IDFC FIRST Bank", "Axis Bank", "ICICI Bank"], "ans": 1, "p1": "Bank: IDFC FIRST Bank (Headquarters: Mumbai, Maharashtra; MD & CEO: V. Vaidyanathan).", "p2": "Exam Fact: Zero forex markup saves cardholders the standard 1.5%–3.5% foreign currency conversion fee on international transactions."}, {"id": 87, "slide_q": 217, "cat": "Banking, Finance & Regulatory", "q": "In which European country did Paytm Europe secure a Payment Institution (PI) license?", "opts": ["Netherlands", "Ireland", "Luxembourg", "Germany"], "ans": 2, "p1": "Country: Luxembourg (Capital: Luxembourg City | Currency: Euro).", "p2": let mode = 'learn';
let hideAnswers = false;
let userAnswers = {};

function setup() {
  const select = document.getElementById('catSelect');
  const uniqueCats = [...new Set(QUESTIONS.map(q => q.cat))];
  uniqueCats.forEach(cat => {
    const count = QUESTIONS.filter(q => q.cat === cat).length;
    const option = document.createElement('option');
    option.value = cat;
    option.textContent = `${cat} (${count})`;
    select.appendChild(option);
  });
  refreshStats();
  render();
}

function setMode(newMode) {
  mode = newMode;
  document.getElementById('btn-learn').classList.toggle('active', mode === 'learn');
  document.getElementById('btn-practice').classList.toggle('active', mode === 'practice');
  document.getElementById('blurBtn').classList.toggle('hidden', mode !== 'learn');
  render();
}

function toggleBlur() {
  hideAnswers = !hideAnswers;
  document.getElementById('blurBtn').textContent = hideAnswers
    ? '👁️ Show All Answers'
    : '👁️ Hide Answers (Self-Test)';
  render();
}

function getFilteredList() {
  const cat = document.getElementById('catSelect').value;
  const term = document.getElementById('searchBox').value.trim().toLowerCase();

  return QUESTIONS.filter(item => {
    if (cat !== 'ALL' && item.cat !== cat) return false;
    if (!term) return true;
    return (
      item.q.toLowerCase().includes(term) ||
      item.opts.some(o => o.toLowerCase().includes(term)) ||
      item.p1.toLowerCase().includes(term) ||
      item.p2.toLowerCase().includes(term) ||
      String(item.slide_q).includes(term)
    );
  });
}

function render() {
  const list = getFilteredList();
  document.getElementById('showingCount').textContent = `Showing ${list.length} question${list.length === 1 ? '' : 's'}`;
  const container = document.getElementById('cardsContainer');

  if (list.length === 0) {
    container.innerHTML = `<div class="no-results">No questions match your filter. Clear search or switch category.</div>`;
    return;
  }

  container.innerHTML = list
    .map(item => (mode === 'learn' ? buildLearnCard(item) : buildPracticeCard(item)))
    .join('');
}

function buildLearnCard(item) {
  const answerText = item.opts[item.ans];
  const blurClass = hideAnswers ? 'blurred' : '';
  return `
    <div class="card">
      <div class="card-top">
        <div class="badge-group">
          <span class="badge-num">Q.${item.id}</span>
          <span class="badge-seq">Slide #${item.slide_q}</span>
        </div>
        <span class="badge-cat">${item.cat}</span>
      </div>
      <div class="question-text">${item.q}</div>
      <div class="learn-answer-box ${blurClass}" onclick="this.classList.remove('blurred')" title="Click to reveal answer">
        ✓ Answer: ${answerText}
      </div>
      <div class="exam-points">
        <div class="exam-points-heading">📌 2 Exam-Related Extra Points</div>
        <ul>
          <li>${item.p1}</li>
          <li>${item.p2}</li>
        </ul>
      </div>
    </div>
  `;
}

function buildPracticeCard(item) {
  const record = userAnswers[item.id];
  const isAnswered = record !== undefined;
  const letters = ['A', 'B', 'C', 'D'];

  const optsMarkup = item.opts
    .map((opt, idx) => {
      let cls = '';
      if (isAnswered) {
        if (idx === item.ans) cls = 'correct';
        else if (idx === record.picked && !record.correct) cls = 'wrong';
      }
      return `
        <button class="option-btn ${cls}" ${isAnswered ? 'disabled' : ''} onclick="selectOption(${item.id}, ${idx})">
          <span class="opt-circle">${letters[idx]}</span>
          <span>${opt}</span>
        </button>
      `;
    })
    .join('');

  const bannerMarkup = isAnswered
    ? record.correct
      ? `<span class="result-pill right">✓ Correct!</span>`
      : `<span class="result-pill wrong">✕ Wrong Answer</span>`
    : '';

  return `
    <div class="card" id="card-${item.id}">
      <div class="card-top">
        <div class="badge-group">
          <span class="badge-num">Q.${item.id}</span>
          <span class="badge-seq">Slide #${item.slide_q}</span>
        </div>
        <span class="badge-cat">${item.cat}</span>
      </div>
      <div class="question-text">${item.q}</div>
      <div class="options-list">
        ${optsMarkup}
      </div>
      <div class="answer-panel ${isAnswered ? 'visible' : ''}" id="panel-${item.id}">
        <div class="result-banner">
          ${bannerMarkup}
          <div class="correct-label">Correct Answer: <span>${letters[item.ans]}. ${item.opts[item.ans]}</span></div>
        </div>
        <div class="exam-points">
          <div class="exam-points-heading">📌 2 Exam-Related Extra Points</div>
          <ul>
            <li>${item.p1}</li>
            <li>${item.p2}</li>
          </ul>
        </div>
      </div>
    </div>
  `;
}

function selectOption(qId, pickedIdx) {
  if (userAnswers[qId] !== undefined) return;
  const item = QUESTIONS.find(q => q.id === qId);
  if (!item) return;

  userAnswers[qId] = {
    picked: pickedIdx,
    correct: pickedIdx === item.ans
  };

  refreshStats();
  const cardEl = document.getElementById(`card-${qId}`);
  if (cardEl) {
    cardEl.outerHTML = buildPracticeCard(item);
  }
}

function refreshStats() {
  const keys = Object.keys(userAnswers);
  const attempted = keys.length;
  const correct = keys.filter(k => userAnswers[k].correct).length;
  const wrong = attempted - correct;

  document.getElementById('cnt-attempted').textContent = attempted;
  document.getElementById('cnt-correct').textContent = correct;
  document.getElementById('cnt-wrong').textContent = wrong;
}

function resetAll() {
  userAnswers = {};
  refreshStats();
  render();
}

setup();
</script>
</body>
</html>
