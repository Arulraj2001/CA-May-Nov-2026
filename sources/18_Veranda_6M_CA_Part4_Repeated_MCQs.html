    --primary-border: #bfdbfe;

  }

  * {

    padding: 0;
  }

  }

  header {

    z-index: 100;
    padding: 14px 20px;
  }

  .header-wrap {
    max-width: 1060px;
    margin: 0 auto;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
  }

  .title-block h1 {
    font-size: 1.15rem;
    font-weight: 700;
    color: var(--text-main);
  }

  .title-block p {
    font-size: 0.8rem;
    color: var(--text-muted);
  }

  .tabs {
    display: inline-flex;
    background-color: var(--bg-panel);

    border-radius: 8px;
    padding: 4px;
    gap: 4px;
  }

  .tab-btn {
    border: none;
    background: transparent;
    color: var(--text-sub);
    font-size: 0.88rem;
    font-weight: 600;
    padding: 7px 16px;
    border-radius: 6px;

    transition: 0.15s ease;
  }

  .tab-btn.active {
    background-color: #ffffff;

  }

  .main-container {

  }

    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
  }

    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    flex: 1;
  }

    background-color: #ffffff;
    color: var(--text-main);

  }

    min-width: 230px;
  }

    gap: 8px;

  }

    border-color: var(--green-border);
    color: var(--green-text);
  }

    border-color: var(--red-border);

    align-items: center;
    justify-content: space-between;
    margin-bottom: 8px;

  .badge-group {

    align-items: center;

    font-weight: 700;

    font-weight: 600;

    border-radius: 5px;

    font-weight: 600;
    color: var(--text-muted);
    text-transform: uppercase;

  }

  .question-text {
    font-size: 1.02rem;
    font-weight: 600;
    color: var(--text-main);
    margin-bottom: 12px;
  }

  .learn-answer-box {
    display: inline-block;
    background-color: var(--green-bg);
    border: 1px solid #bbf7d0;
    color: var(--green-text);
    font-weight: 700;
    font-size: 0.94rem;
    padding: 6px 12px;
    border-radius: 6px;
    margin-bottom: 12px;
  }

  }

    background-color: var(--bg-panel);
    border: 1px solid var(--border-strong);

    align-items: center;
    justify-content: center;
    font-size: 0.78rem;
    font-weight: 700;
    color: var(--text-sub);

    color: var(--red-text);

    border-color: var(--red-border);
    color: #ffffff;

    align-items: center;
    justify-content: space-between;

    margin-bottom: 10px;

  .result-pill {

    font-weight: 700;

  .result-pill.wrong {

  .correct-label {

    color: var(--text-main);

  .correct-label span {

  .hidden {

  @keyframes slideDown {

    to { opacity: 1; transform: translateY(0); }
  }

  @media (max-width: 640px) {
    .header-wrap { flex-direction: column; align-items: flex-start; }
    .options-list { grid-template-columns: 1fr; }
    input[type="text"] { width: 100%; }
  }
</style>

alue addition in passive and active electronic components (PCBs, camera modules, lithium cells)."}, {"id": 8, "slide_q": 489, "cat": "Infrastructure, Ports & Energy", "q": "Under the ₹14,500 crore Viability Gap Funding (VGF) scheme, what capacity of Hydro Pumped Storage Plants (PSPs) is targeted to be developed?", "opts": ["92 GW", "30 GW", "45 GW", "60 GW"], "ans": 3, "p1": "Repeated From Previous Sources: Veranda Part 4 Q.522 — 60 GW Hydro Pumped Storage capacity under ₹14,500 crore VGF scheme.", "p2": "Exam Fact: Hydro pumped storage acts as a giant water battery to balance intermittent solar and wind power."}, {"id": 9, "slide_q": 501, "cat": "Infrastructure, Ports & Energy", "q": "What is NTPC Limited's long-term total installed power generation capacity target by the year 2037?", "opts": ["300 GW", "149 GW", "200 GW", "250 GW"], "ans": 3, "p1": "Repeated From Previous Sources: Veranda Part 4 Q.484 — NTPC's 250 GW long-term installed capacity target by 2037.", "p2": "Exam Fact: Includes major expansion in solar, wind, pumped hydro, and nuclear energy."}, {"id": 10, "slide_q": 514, "cat": "Infrastructure, Ports & Energy", "q": "Under the ₹14,500 crore Viability Gap Funding (VGF) scheme, how much energy storage capacity is targeted to come specifically from Battery Energy Storage Systems (BESS)?", "opts": ["30 GW", "15 GW", "45 GW", "60 GW"], "ans": 0, "p1": "Repeated From Previous Sources: Veranda Part 4 Q.489 — 30 GW BESS storage capacity under ₹14,500 crore VGF scheme.", "p2": "Exam Fact: VGF provides up to 30%–40% capital cost grant to make grid-scale battery storage commercially viable."}, {"id": 11, "slide_q": 520, "cat": "Infrastructure, Ports & Energy", "q": "In which Indian state is Vizhinjam International Seaport (India's first deep-water container transshipment port) located?", "opts": ["Karnataka", "Tamil Nadu", "Kerala", "Andhra Pradesh"], "ans": 2, "p1": "Repeated From Previous Sources: Veranda Part 1 (New) Q.34 & Veranda Part 2 (New) Q.2 — Vizhinja aditional percussion instrument of Jharkhand receiving GI tag.", "p2": "Exam Fact: Mandar is central to tribal folk music and Karma/Sarhul dances in Jharkhand."}, {"id": 15, "slide_q": 552, "cat": "Awards & Honours", "q": "The 'Kochon Prize' for combating tuberculosis (received by Indian non-profit REACH) is presented by a foundation from which country?", "opts": ["Switzerland", "Japan", "South Korea", "Sweden"], "ans": 2, "p1": "Repeated From Previous Sources: Veranda Part 4 Q.598 — Kochon Prize from South Korea received by Indian non-profit REACH.", "p2": "Exam Fact: REACH (Resource Group for Education and Advocacy for Community Health) is headquartered in Chennai, Tamil Nadu."}, {"id": 16, "slide_q": 554, "cat": "Environment, Parks & GI Tags", "q": "Which two agricultural spice products from Unjha, Gujarat received Geographical Indication (GI) tags?", "opts": ["Unjha Cumin (Jeera) and Unjha Fennel (Saunf)", "Unjha Fenugreek and Coriander", "Unjha Turmeric and Ginger", "Unjha Mustard and Sesame"], "ans": 0, "p1": "Repeated From Previous Sources: Priya Ma'am 6M GA (New) Q.55 — Unjha Cumin (Jeera) and Unjha Fennel (Saunf) of Gujarat receiving GI tags.", "p2": "Exam Fact: Unjha is Asia's largest regulated spice market yard."}, {"id": 17, "slide_q": 555, "cat": "Awards & Honours", "q": "Renowned theoretical physicist Ashoke Sen became the first Indian to receive the Oskar Klein Medal. Which academic chair does he hold at ICTS Bengaluru?", "opts": ["C. V. Raman Chair", "ICTS-Infosys Madhava Chair", "Homi Bhabha Chair", "S. N. Bose Chair"], "ans": 1, "p1": "Repeated From Previous Sources: Veranda Part 4 Q.581 — Physicist Ashoke Sen winning the Oskar Klein Medal.", "p2": "Exam Fact: The Oskar Klein Medal is awarded annually by Stockholm University and the Royal Swedish Academy of Sciences."}, {"id": 18, "slide_q": 558, "cat": "Awards & Honours", "q": "Who from Prasar Bharati won the ABU Broadcast Engineering Excellence Award 2026?", "opts": ["N. Nandakumar Singh", "Gaurav Dwivedi", "Navneet Kumar Sehgal", "Mayank Agrawal"], "ans": 0, "p1": "Repeated From Previous Sources: Priya Ma'am 6M GA (New) Q.218 & Veranda Part 2 (New) Q.218 — N. Nandakumar Singh winning ABU Broadcast Engineering Excellence Award 2026.", "p2": "Exam Fact: Prasar Bharati (India's public broadcaster comprising Doordarshan and Akashvani) was established on 23 November 1997."}, {"id": 19, "slide_q": 581, "cat": "Awards & Honours", "q": "Theoretical physicist Ashoke Sen became the first Indian physicist to win which prestigious Swedish physics medal?", "opts": ["Ramanujan Medal", "Boltzmann Medal", "Dirac Medal", "Oskar Klein Medal"], "ans": 3, "p1": "Repeated From Previous Sources: Veranda Part 4 Q.555 — Ashoke Sen first Indian physicist to win the Oskar Klein Medal.", "p2": "Exam Fact: Prof. Ashoke Sen is also a recipient of the Fundamental Physics Prize and Padma Bhushan."}, {"id": 20, "slide_q": 587, "cat": "Awards & Honours", "q": "Prof. Mahesh Kakde (IISc Bengaluru), winner of the 2026 SASTRA / ICTP Ramanujan Prize, is which numbered Indian recipient of the award?", "opts": ["3rd", "5th", "4th", "6th"], "ans": 1, "p1": "Repeated From Previous Sources: Priya Ma'am 6M GA (New) Q.108 — Prof. Mahesh Kakde (IISc Bengaluru) winning the 2026 Ramanujan Prize.", "p2": "Exam Fact: Carries a cash prize of USD 10,000 for young mathematicians from developing countries."}, {"id": 21, "slide_q": 594, "cat": "Environment, Parks & GI Tags", "q": "From which Indian state did 'Ambaji Mohanthal Prasad' receive a Geographical Indication (GI) tag?", "opts": ["Gujarat", "Rajasthan", "Maharashtra", "Madhya Pradesh"], "ans": 0, "p1": "Repeated From Previous Sources: Priya Ma'am 6M GA (New) Q.100 — Ambaji Mohanthal Prasad of Gujarat receiving GI tag.", "p2": "Exam Fact: Traditional besan-ghee sweet offered at the Ambaji Shakti Peeth."}, {"id": 22, "slide_q": 598, "cat": "Awards & Honours", "q": "Which Indian non-profit organization working on tuberculosis elimination received the 2026 Kochon Prize?", "opts": ["REACH (Resource Group for Education and Advocacy for Community Health)", "PRATHAM Education Foundation", "Akshaya Patra Foundation", "Goonj"], "ans": 0, "p1": "Repeated From Previous Sources: Veranda Part 4 Q.552 — Indian non-profit REACH winning the 2026 Kochon Prize.", "p2": "Exam Fact: India's National TB Elimination Programme (NTEP) aims to eliminate tuberculosis."}];

let userAnswers = {};

function setup() {
  const select = document.getElementById('catSelect');
  const uniqueCats = [...new Set(QUESTIONS.map(q => q.cat))];
  uniqueCats.forEach(cat => {
    const count = QUESTIONS.filter(q => q.cat === cat).length;
    const option = document.createElement('option');
    option.value = cat;
    option.textContent = `${cat} (${count})`;
    select.appendChild(option);
  });
  refreshStats();
  render();
}

function setMode(newMode) {
  mode = newMode;
  document.getElementById('btn-learn').classList.toggle('active', mode === 'learn');
  document.getElementById('btn-practice').classList.toggle('active', mode === 'practice');
  document.getElementById('blurBtn').classList.toggle('hidden', mode !== 'learn');
  render();
}

function toggleBlur() {
  hideAnswers = !hideAnswers;
  document.getElementById('blurBtn').textContent = hideAnswers
    ? '👁️ Show All Answers'
    : '👁️ Hide Answers (Self-Test)';
  render();
}

function getFilteredList() {
  const cat = document.getElementById('catSelect').value;
  const term = document.getElementById('searchBox').value.trim().toLowerCase();

  return QUESTIONS.filter(item => {
    if (cat !== 'ALL' && item.cat !== cat) return false;
    if (!term) return true;
    return (
      item.q.toLowerCase().includes(term) ||
      item.opts.some(o => o.toLowerCase().includes(term)) ||
      item.p1.toLowerCase().includes(term) ||
      item.p2.toLowerCase().includes(term) ||
      String(item.slide_q).includes(term)
    );
  });
}

function render() {
  const list = getFilteredList();
  document.getElementById('showingCount').textContent = `Showing ${list.length} question${list.length === 1 ? '' : 's'}`;
  const container = document.getElementById('cardsContainer');

  if (list.length === 0) {
    container.innerHTML = `<div class="no-results">No questions match your filter. Clear search or switch category.</div>`;
    return;
  }

  container.innerHTML = list
    .map(item => (mode === 'learn' ? buildLearnCard(item) : buildPracticeCard(item)))
    .join('');
}

function buildLearnCard(item) {
  const answerText = item.opts[item.ans];
  const blurClass = hideAnswers ? 'blurred' : '';
  return `
    <div class="card">
      <div class="card-top">
        <div class="badge-group">
          <span class="badge-num">Q.${item.id}</span>
          <span class="badge-seq">Slide #${item.slide_q}</span>
        </div>
        <span class="badge-cat">${item.cat}</span>
      </div>
      <div class="question-text">${item.q}</div>
      <div class="learn-answer-box ${blurClass}" onclick="this.classList.remove('blurred')" title="Click to reveal answer">
        ✓ Answer: ${answerText}
      </div>
      <div class="exam-points">
        <div class="exam-points-heading">📌 2 Exam-Related Extra Points</div>
        <ul>
          <li>${item.p1}</li>
          <li>${item.p2}</li>
        </ul>
      </div>
    </div>
  `;
}

function buildPracticeCard(item) {
  const record = userAnswers[item.id];
  const isAnswered = record !== undefined;
  const letters = ['A', 'B', 'C', 'D'];

  const optsMarkup = item.opts
    .map((opt, idx) => {
      let cls = '';
      if (isAnswered) {
        if (idx === item.ans) cls = 'correct';
        else if (idx === record.picked && !record.correct) cls = 'wrong';
      }
      return `
        <button class="option-btn ${cls}" ${isAnswered ? 'disabled' : ''} onclick="selectOption(${item.id}, ${idx})">
          <span class="opt-circle">${letters[idx]}</span>
          <span>${opt}</span>
        </button>
      `;
    })
    .join('');

  const bannerMarkup = isAnswered
    ? record.correct
      ? `<span class="result-pill right">✓ Correct!</span>`
      : `<span class="result-pill wrong">✕ Wrong Answer</span>`
    : '';

  return `
    <div class="card" id="card-${item.id}">
      <div class="card-top">
        <div class="badge-group">
          <span class="badge-num">Q.${item.id}</span>
          <span class="badge-seq">Slide #${item.slide_q}</span>
        </div>
        <span class="badge-cat">${item.cat}</span>
      </div>
      <div class="question-text">${item.q}</div>
      <div class="options-list">
        ${optsMarkup}
      </div>
      <div class="answer-panel ${isAnswered ? 'visible' : ''}" id="panel-${item.id}">
        <div class="result-banner">
          ${bannerMarkup}
          <div class="correct-label">Correct Answer: <span>${letters[item.ans]}. ${item.opts[item.ans]}</span></div>
        </div>
        <div class="exam-points">
          <div class="exam-points-heading">📌 2 Exam-Related Extra Points</div>
          <ul>
            <li>${item.p1}</li>
            <li>${item.p2}</li>
          </ul>
        </div>
      </div>
    </div>
  `;
}

function selectOption(qId, pickedIdx) {
  if (userAnswers[qId] !== undefined) return;
  const item = QUESTIONS.find(q => q.id === qId);
  if (!item) return;

  userAnswers[qId] = {
    picked: pickedIdx,
    correct: pickedIdx === item.ans
  };

  refreshStats();
  const cardEl = document.getElementById(`card-${qId}`);
  if (cardEl) {
    cardEl.outerHTML = buildPracticeCard(item);
  }
}

function refreshStats() {
  const keys = Object.keys(userAnswers);
  const attempted = keys.length;
  const correct = keys.filter(k => userAnswers[k].correct).length;
  const wrong = attempted - correct;

  document.getElementById('cnt-attempted').textContent = attempted;
  document.getElementById('cnt-correct').textContent = correct;
  document.getElementById('cnt-wrong').textContent = wrong;
}

function resetAll() {
  userAnswers = {};
  refreshStats();
  render();
}

setup();
</script>
</body>
</html>
